function setAspectFlag(asp, on) {
  const f = aspectFlags();
  if (on) f[asp.id] = 1; else delete f[asp.id];
  localSet(`aspects:${state.editId}`, JSON.stringify(f));
}

/* ================================================================ conversions (verified) */

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("could not read the image"));
    img.src = src;
  });
}

/* Re-encode an image to the asset's exact format and pixel size, then decode
   the result again to prove it. */
async function imageForAsset(file, assetPath) {
  const mime = IMAGE_MIME[ext(assetPath)];
  if (!mime) {
    if (!/svg/.test(file.type) && !/\.svg$/i.test(file.name)) throw new Error("use an SVG file for this one");
    return file;
  }
  if (!file.type.startsWith("image/") && !/\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(file.name)) throw new Error(`${file.name} is not an image`);
  const url = URL.createObjectURL(file);
  let stock, img;
  try {
    [stock, img] = await Promise.all([loadImage(`/api/asset?${q({ path: assetPath })}`), loadImage(url)]);
  } finally { URL.revokeObjectURL(url); }
  const w = stock.naturalWidth, h = stock.naturalHeight;
  if (!w || !h) throw new Error("could not read the system image size");
  if (file.type === mime && img.naturalWidth === w && img.naturalHeight === h) return file;

  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d", { colorSpace: "srgb" });  /* sRGB: same look in SDR and HDR */
  ctx.imageSmoothingQuality = "high";
  if (mime === "image/jpeg") { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h); }
  let dw = w, dh = h;
  if (state.fit !== "stretch") {
    const s = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);
    dw = img.naturalWidth * s; dh = img.naturalHeight * s;
  }
  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  const blob = await new Promise(r => canvas.toBlob(r, mime, 0.92));
  if (!blob || blob.type !== mime) throw new Error(`this browser cannot produce ${ext(assetPath).toUpperCase()} images`);
  const check = URL.createObjectURL(blob);
  try {
    const out = await loadImage(check);
    if (out.naturalWidth !== w || out.naturalHeight !== h) throw new Error("converted image did not verify");
  } finally { URL.revokeObjectURL(check); }
  return blob;
}

function parseWav(buf) {
  const dv = new DataView(buf);
  const tag = o => String.fromCharCode(...new Uint8Array(buf, o, 4));
  if (buf.byteLength < 12 || tag(0) !== "RIFF" || tag(8) !== "WAVE") return null;
  const info = {};
  for (let o = 12; o + 8 <= buf.byteLength; ) {
    const id = tag(o), size = dv.getUint32(o + 4, true);
    if (id === "fmt ") {
      info.format = dv.getUint16(o + 8, true); info.channels = dv.getUint16(o + 10, true);
      info.rate = dv.getUint32(o + 12, true); info.bits = dv.getUint16(o + 22, true);
    } else if (id === "data") {
      info.dataOffset = o + 8; info.dataSize = size;
      break;
    }
    o += 8 + size + (size & 1);
  }
  return info.format && info.dataOffset ? info : null;
}

/* Decode any audio the browser supports to `channels` channels at `rate`. */
async function decodeAudio(file, rate, channels) {
  const data = await file.arrayBuffer();
  let decoded;
  try {
    decoded = await new OfflineAudioContext(1, 1, rate).decodeAudioData(data.slice(0));
  } catch (e) { throw new Error(`${file.name} is not audio this browser can read`); }
  return renderAudio(decoded, rate, channels);
}

/* Render an AudioBuffer (any rate and layout) with `channels` channels at `rate`. */
async function renderAudio(buffer, rate, channels) {
  const frames = Math.max(1, Math.ceil(buffer.duration * rate));
  const ctx = new OfflineAudioContext(channels, frames, rate);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  src.start();
  const out = await ctx.startRendering();
  return [...Array(channels)].map((_, c) => out.getChannelData(c));
}

async function resample(chans, from, to) {
  if (from === to) return chans;
  const ctx = new OfflineAudioContext(chans.length, 1, from);
  const buf = ctx.createBuffer(chans.length, chans[0].length, from);
  chans.forEach((c, i) => buf.copyToChannel(c, i));
  return renderAudio(buf, to, chans.length);
}

/* 16-bit PCM WAV from channel data, parsed again to prove its shape. */
function pcmWav(chans, rate) {
  const channels = chans.length, frames = chans[0].length;
  const bytes = 44 + frames * channels * 2;
  const buf = new ArrayBuffer(bytes);
  const dv = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); dv.setUint32(4, bytes - 8, true); str(8, "WAVE");
  str(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, channels, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * channels * 2, true); dv.setUint16(32, channels * 2, true);
  dv.setUint16(34, 16, true); str(36, "data"); dv.setUint32(40, frames * channels * 2, true);
  let o = 44;
  for (let i = 0; i < frames; i++) {
    for (let c = 0; c < channels; c++) {
      const v = Math.max(-1, Math.min(1, chans[c][i]));
      dv.setInt16(o, v < 0 ? v * 32768 : v * 32767, true);
      o += 2;
    }
  }
  const check = parseWav(buf);
  if (!check || check.rate !== rate || check.channels !== channels || check.bits !== 16 ||
      check.dataSize !== frames * channels * 2) throw new Error("converted audio did not verify");
  return new Blob([buf], { type: "audio/wav" });
}

/* Channel data of a 16-bit PCM WAV. */
function wavChannels(buf) {
  const info = parseWav(buf);
  if (!info || info.format !== 1 || info.bits !== 16) throw new Error("the theme's music is not a 16-bit PCM WAV");
  const n = Math.floor(info.dataSize / (2 * info.channels));
  const dv = new DataView(buf, info.dataOffset, n * 2 * info.channels);
  const chans = [...Array(info.channels)].map(() => new Float32Array(n));
  for (let i = 0, o = 0; i < n; i++) for (let c = 0; c < info.channels; c++, o += 2) chans[c][i] = dv.getInt16(o, true) / 32768;
  return { chans, rate: info.rate };
}

/* Any audio as a 16-bit PCM WAV of the given shape. */
async function audioToWav(file, rate, channels) {
  return pcmWav(await decodeAudio(file, rate, channels), rate);
}

/* ---- ATRAC9: the console's own sounds and home music (atrac9.js) ---- */

const at9Stock = new Map();   /* system .at9 path -> { bytes, file, rms } */

async function stockAt9(path) {
  if (!at9Stock.has(path)) {
    const res = await fetch(`/api/asset?${q({ path })}`);
    if (!res.ok) throw new Error("could not read the system sound");
    const bytes = new Uint8Array(await res.arrayBuffer());
    const file = ATRAC9.parseFile(bytes);
    at9Stock.set(path, { bytes, file, rms: ATRAC9.downmixRms(file) });
  }
  return at9Stock.get(path);
}

/* The longest audio a replacement may hold: the console accepts up to twice
   the system file's length, and looping music also repeats its opening
   seconds after the end (see encode in atrac9.js). */
function at9MaxSamples(stock) {
  const f = stock.file, cfg = f.config, delay = f.fact ? f.fact[2] : cfg.frameSamples;
  const tail = f.loop ? ATRAC9.LOOP_TAIL * cfg.rate : 0;
  return 2 * f.superframes * cfg.superframeSamples - Math.max(delay, cfg.frameSamples) - cfg.superframeSamples - tail;
}

function trimWithFade(chans, max, rate) {
  if (chans[0].length <= max) return chans;
  const fade = Math.min(max, 3 * rate);
  return chans.map(c => {
    const out = c.slice(0, max);
    for (let i = 0; i < fade; i++) out[max - fade + i] *= 1 - (i + 1) / fade;
    return out;
  });
}

/* Scale to the system sound's loudness (RMS of its stereo downmix), offset
   by gainDb, with a soft limit just below full scale. */
function matchLoudness(chans, target, gainDb) {
  let sum = 0, n = 0;
  for (const c of chans) for (let i = 0; i < c.length; i++) { sum += c[i] * c[i]; n++; }
  const rms = Math.sqrt(sum / Math.max(n, 1));
  if (!(rms > 1e-6)) return chans;
  const g = (target > 0 ? target : 0.1) / rms * 10 ** (gainDb / 20), knee = 0.89;
  return chans.map(c => c.map(v => {
    v *= g;
    const a = Math.abs(v);
    return a <= knee ? v : Math.sign(v) * (knee + (1 - knee) * Math.tanh((a - knee) / (1 - knee)));
  }));
}

/* Run the encoder in a Web Worker (atrac9.js doubles as one); on the page
   itself, with pauses to repaint, if a worker cannot start. */
function encodeAt9(stockBytes, left, right, onProgress, intro) {
  return new Promise((resolve, reject) => {
    const onPage = async () => {
      let last = performance.now();
      try {
        resolve(await ATRAC9.encode(stockBytes, left, right, async f => {
          if (onProgress) onProgress(f);
          if (performance.now() - last > 50) { await nextTask(); last = performance.now(); }
        }, intro));
      } catch (e) { reject(e); }
    };
    let worker;
    try { worker = new Worker("atrac9.js"); } catch (e) { onPage(); return; }
    let started = false;
    worker.onmessage = e => {
      const m = e.data;
      started = true;
      if (m.progress !== undefined) { if (onProgress) onProgress(m.progress); return; }
      worker.terminate();
      if (m.error) reject(new Error(m.error)); else resolve(m.result);
    };
    worker.onerror = e => {
      e.preventDefault();
      worker.terminate();
      if (started) reject(new Error("the encoder stopped unexpectedly")); else onPage();
    };
    worker.postMessage({ stock: stockBytes, left, right, intro });
  });
}

/* Encode audio as a replacement for the system ATRAC9 sound at `path`: same
   format, matched loudness, decoded again and compared before it is returned.
   `intro` (seconds) plays once before the part that loops. */
async function at9For(path, chans, rate, gainDb, onProgress, intro = 0) {
  const stock = await stockAt9(path);
  const cfg = stock.file.config;
  let st = await resample(chans.length === 1 ? [chans[0], chans[0]] : chans.slice(0, 2), rate, cfg.rate);
  const max = at9MaxSamples(stock), trimmed = st[0].length > max;
  st = matchLoudness(trimWithFade(st, max, cfg.rate), stock.rms, gainDb);
  const introSamples = Math.min(Math.round(intro * cfg.rate), Math.max(0, st[0].length - cfg.rate));
  const res = await encodeAt9(stock.bytes, st[0], st[1], onProgress, introSamples);
  return { blob: new Blob([res.bytes], { type: "audio/x-at9" }), seconds: res.samples / cfg.rate, trimmed };
}

async function soundForAsset(file, assetPath) {
  if (ext(assetPath) === "at9") {
    if (/\.at9$/i.test(file.name)) return file;  /* made elsewhere: the console checks the exact format */
    const stock = await stockAt9(assetPath);
    const chans = await decodeAudio(file, stock.file.config.rate, 2);
    return (await at9For(assetPath, chans, stock.file.config.rate, 0, attachProgress)).blob;
  }
  const stock = parseWav(await (await fetch(`/api/asset?${q({ path: assetPath })}`)).arrayBuffer());
  if (!stock) throw new Error("could not read the system sound");
  if (stock.format !== 1 || stock.bits !== 16) {
    if (!/\.wav$/i.test(file.name)) throw new Error(`attach a WAV in the same format (${stock.rate} Hz, ${stock.bits}-bit)`);
    return file;  /* the console checks the exact format */
  }
  return audioToWav(file, stock.rate, stock.channels);
}

/* ---- textures: DDS for ShellUI (.dds / .dds.zst) ---- */

const BC7_WEIGHTS = [0, 4, 9, 13, 17, 21, 26, 30, 34, 38, 43, 47, 51, 55, 60, 64];

/* One opaque 4x4 block as BC7 mode 6 (7-bit endpoints + p-bit, 4-bit indices).
   Endpoints come from the block's principal colour axis; every pixel then
   takes the exact nearest of the 16 palette colours. */
function bc7Block(px, out, o) {
  let mr = 0, mg = 0, mb = 0;
  for (let i = 0; i < 64; i += 4) { mr += px[i]; mg += px[i + 1]; mb += px[i + 2]; }
  mr /= 16; mg /= 16; mb /= 16;
  let rr = 0, rg = 0, rb = 0, gg = 0, gb = 0, bb = 0;
  for (let i = 0; i < 64; i += 4) {
    const r = px[i] - mr, g = px[i + 1] - mg, b = px[i + 2] - mb;
    rr += r * r; rg += r * g; rb += r * b; gg += g * g; gb += g * b; bb += b * b;
  }
  let ax = 0.58, ay = 0.58, az = 0.58;
  for (let k = 0; k < 8; k++) {
    const nx = rr * ax + rg * ay + rb * az, ny = rg * ax + gg * ay + gb * az, nz = rb * ax + gb * ay + bb * az;
    const m = Math.max(Math.abs(nx), Math.abs(ny), Math.abs(nz));
    if (m < 1e-9) break;
    ax = nx / m; ay = ny / m; az = nz / m;
  }
  const len2 = ax * ax + ay * ay + az * az;
  let tmin = 0, tmax = 0;
  if (len2 > 1e-12) {
    tmin = Infinity; tmax = -Infinity;
    for (let i = 0; i < 64; i += 4) {
      const t = ((px[i] - mr) * ax + (px[i + 1] - mg) * ay + (px[i + 2] - mb) * az) / len2;
      if (t < tmin) tmin = t;
      if (t > tmax) tmax = t;
    }
  }
  /* p-bit 1 on both endpoints keeps alpha at exactly 255 (A0 = A1 = 127). */
  const q = v => Math.max(0, Math.min(127, Math.round((v - 1) / 2)));
  let e0 = [q(mr + tmin * ax), q(mg + tmin * ay), q(mb + tmin * az)];
  let e1 = [q(mr + tmax * ax), q(mg + tmax * ay), q(mb + tmax * az)];
  const pal = new Int32Array(48);
  const fill = () => {
    for (let i = 0; i < 16; i++) {
      const w = BC7_WEIGHTS[i];
      for (let c = 0; c < 3; c++) pal[i * 3 + c] = ((64 - w) * ((e0[c] << 1) | 1) + w * ((e1[c] << 1) | 1) + 32) >> 6;
    }
  };
  fill();
  const idx = new Uint8Array(16);
  for (let p = 0; p < 16; p++) {
    const r = px[p * 4], g = px[p * 4 + 1], b = px[p * 4 + 2];
    let best = 0, bestErr = Infinity;
    for (let i = 0; i < 16; i++) {
      const dr = r - pal[i * 3], dg = g - pal[i * 3 + 1], db = b - pal[i * 3 + 2];
      const e = dr * dr + dg * dg + db * db;
      if (e < bestErr) { bestErr = e; best = i; }
    }
    idx[p] = best;
  }
  if (idx[0] >= 8) {  /* the anchor index must fit in 3 bits */
    [e0, e1] = [e1, e0];
    for (let p = 0; p < 16; p++) idx[p] = 15 - idx[p];
  }
  let bit = 0;
  out.fill(0, o, o + 16);
  const put = (v, n) => { for (let i = 0; i < n; i++, bit++) if ((v >> i) & 1) out[o + (bit >> 3)] |= 1 << (bit & 7); };
  put(64, 7);
  for (let c = 0; c < 3; c++) { put(e0[c], 7); put(e1[c], 7); }
  put(127, 7); put(127, 7);
  put(1, 1); put(1, 1);
  put(idx[0], 3);
  for (let p = 1; p < 16; p++) put(idx[p], 4);
}

/* Mode-6 decoder, used only to check the encoder's own output. */
function bc7DecodeMode6(src, o, px) {
  let bit = 0;
  const get = n => { let v = 0; for (let i = 0; i < n; i++, bit++) v |= ((src[o + (bit >> 3)] >> (bit & 7)) & 1) << i; return v; };
  if (get(7) !== 64) return false;
  const e = [[0, 0, 0, 0], [0, 0, 0, 0]];
  for (let c = 0; c < 4; c++) { e[0][c] = get(7); e[1][c] = get(7); }
  const p0 = get(1), p1 = get(1);
  for (let c = 0; c < 4; c++) { e[0][c] = (e[0][c] << 1) | p0; e[1][c] = (e[1][c] << 1) | p1; }
  for (let p = 0; p < 16; p++) {
    const w = BC7_WEIGHTS[get(p === 0 ? 3 : 4)];
    for (let c = 0; c < 4; c++) px[p * 4 + c] = ((64 - w) * e[0][c] + w * e[1][c] + 32) >> 6;
  }
  return true;
}

function b64bytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

/* Wrap data in a zstd frame of stored (raw) blocks: valid for any decoder. */
function zstdStored(data) {
  const BLOCK = 128 * 1024, blocks = Math.max(1, Math.ceil(data.length / BLOCK));
  const out = new Uint8Array(9 + blocks * 3 + data.length);
  out.set([0x28, 0xb5, 0x2f, 0xfd, 0xa0]);  /* magic; single segment, 4-byte content size */
  new DataView(out.buffer).setUint32(5, data.length, true);
  let o = 9;
  for (let b = 0; b < blocks; b++) {
    const start = b * BLOCK, size = Math.min(BLOCK, data.length - start), last = b === blocks - 1 ? 1 : 0;
    const h = (size << 3) | last;
    out[o] = h & 255; out[o + 1] = (h >> 8) & 255; out[o + 2] = (h >> 16) & 255;
    out.set(data.subarray(start, start + size), o + 3);
    o += 3 + size;
  }
  return out;
}

const textureCache = new Map();

/* Encode an image into exactly the stock texture's format, size and mips,
   reusing its DDS header verbatim, then check the result. */
async function textureForAsset(file, assetPath, progress) {
  const info = await api("GET", "/api/asset/texture", { path: assetPath });
  const key = `${info.header}|${info.dataLength}|${state.fit}|${file.name}|${file.size}|${file.lastModified}`;
  if (textureCache.has(key)) return textureCache.get(key);
  const bc7 = info.dxgi === 98 || info.dxgi === 99;
  const rgba = info.dxgi === 28 || info.dxgi === 29, bgra = info.dxgi === 87 || info.dxgi === 91;
  if (!bc7 && !rgba && !bgra) throw new Error(`${info.format} textures are not supported yet`);
  if (info.array !== 1) throw new Error("texture arrays are not supported");
  if (!file.type.startsWith("image/") && !/\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name)) throw new Error(`${file.name} is not an image`);

  const url = URL.createObjectURL(file);
  let img;
  try { img = await loadImage(url); } finally { URL.revokeObjectURL(url); }
  const header = b64bytes(info.header);
  const data = new Uint8Array(info.dataLength);
  let o = 0, sampleErr = 0, sampled = 0;
  const totalBlocks = Array.from({ length: info.mips }, (_, m) =>
    Math.ceil(Math.max(1, info.width >> m) / 4) * Math.ceil(Math.max(1, info.height >> m) / 4)).reduce((a, b) => a + b, 0);
  let done = 0, lastYield = performance.now();

  for (let m = 0; m < info.mips; m++) {
    const w = Math.max(1, info.width >> m), h = Math.max(1, info.height >> m);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d", { colorSpace: "srgb", willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
    let dw = w, dh = h;
    if (state.fit !== "stretch") {
      const sc = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);
      dw = img.naturalWidth * sc; dh = img.naturalHeight * sc;
    }
    ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    const pix = ctx.getImageData(0, 0, w, h).data;
    if (!bc7) {
      for (let i = 0; i < w * h; i++) {
        const s = i * 4;
        if (rgba) { data[o++] = pix[s]; data[o++] = pix[s + 1]; data[o++] = pix[s + 2]; data[o++] = 255; }
        else { data[o++] = pix[s + 2]; data[o++] = pix[s + 1]; data[o++] = pix[s]; data[o++] = 255; }
      }
      continue;
    }
    const block = new Uint8ClampedArray(64), check = new Uint8Array(64);
    const bw = Math.ceil(w / 4), bh = Math.ceil(h / 4);
    for (let by = 0; by < bh; by++) {
      for (let bx = 0; bx < bw; bx++) {
        for (let y = 0; y < 4; y++) {
          for (let x = 0; x < 4; x++) {
            const sx = Math.min(w - 1, bx * 4 + x), sy = Math.min(h - 1, by * 4 + y), s = (sy * w + sx) * 4, d = (y * 4 + x) * 4;
            block[d] = pix[s]; block[d + 1] = pix[s + 1]; block[d + 2] = pix[s + 2]; block[d + 3] = 255;
          }
        }
        bc7Block(block, data, o);
        if ((bx * 7 + by * 13) % 97 === 0) {  /* re-decode a sample of blocks */
          if (!bc7DecodeMode6(data, o, check)) throw new Error("texture encoder self-check failed");
          for (let i = 0; i < 64; i++) { if ((i & 3) !== 3) { const e = check[i] - block[i]; sampleErr += e * e; sampled++; } else if (check[i] !== 255) throw new Error("texture encoder self-check failed"); }
        }
        o += 16;
      }
      done += bw;
      if (performance.now() - lastYield > 50) {
        if (progress) progress(done / totalBlocks);
        await nextTask();
        lastYield = performance.now();
      }
    }
  }
  if (o !== data.length) throw new Error("texture size did not verify");
  if (sampled) {
    const psnr = 10 * Math.log10(255 * 255 / Math.max(1e-9, sampleErr / sampled));
    if (psnr < 24) throw new Error(`texture quality check failed (${psnr.toFixed(1)} dB)`);
  }
  const dds = new Uint8Array(header.length + data.length);
  dds.set(header); dds.set(data, header.length);
  const out = new Blob([info.zstd ? zstdStored(dds) : dds]);
  textureCache.set(key, out);
  return out;
}

async function fileForAsset(file, asset) {
  if (asset.kind === "texture") return textureForAsset(file, asset.path, attachProgress);
  if (isImage(asset)) return imageForAsset(file, asset.path);
  if (asset.kind === "audio") return soundForAsset(file, asset.path);
  return file;  /* fonts, JSON, video: the console validates against the stock file */
}

let attachProgress = null;

/* Put one file onto a set of system assets (for example all size variants). */
async function attachTo(assets, file, label) {
  const big = assets.length > 2 || assets.some(a => a.kind === "texture" || ext(a.path) === "at9");
  const p = big ? progressToast(`Adding ${label}…`) : null;
  let ok = 0;
  const errors = [];
  for (let i = 0; i < assets.length; i++) {
    const a = assets[i];
    attachProgress = p ? f => p.set(`Encoding ${baseName(a.path)}… ${Math.round(f * 100)}%`, (i + f) / assets.length) : null;
    try {
      const blob = await fileForAsset(file, a);
      await uploadVerified("/api/theme/file", { id: state.editId, path: a.path }, blob);
      state.files.add(a.path);
      ok++;
    } catch (e) { errors.push(`${baseName(a.path)}: ${e.message}`); }
    if (p) p.set(`Adding ${label}… ${i + 1}/${assets.length}`, (i + 1) / assets.length);
  }
  stamp = Date.now();
  const msg = errors.length
    ? `${label}: ${ok} of ${assets.length} added and verified. ${errors.slice(0, 2).join("; ")}`
    : `${label} added and verified${assets.length > 1 ? ` at ${plural(ok, "size")}` : ""}. Apply the theme to use it.`;
  const kind = errors.length ? (ok ? "" : "err") : "ok";
  if (p) p.done(msg, kind); else toast(msg, kind, errors.length ? 9000 : 4500);
  await refreshStatus();
  return ok;
}

async function removeMusic() {
  await api("DELETE", "/api/theme/music", { id: state.editId }).catch(() => {});
  await resetAssets([{ path: HOME_MUSIC }]);
}

async function resetAssets(assets) {
  const hadBackground = backgroundFile([...state.files]);
  for (const a of assets.filter(x => state.files.has(x.path))) {
    try { await api("DELETE", "/api/theme/file", { id: state.editId, path: a.path }); state.files.delete(a.path); }
    catch (e) { toast(e.message, "err"); }
  }
  stamp = Date.now();
  /* No background left: neither is the picture made from it. */
  if (hadBackground && !backgroundFile([...state.files])) await removePreview(state.editId, "background");
  else await refreshStatus();
}

/* ================================================================ preview pictures

   Each theme can have a picture for its library card: one made from its
   background when the background is added (kind "background"), and one the
   user chooses (kind "picture"), which is shown instead. */

const PREVIEW_W = 1280, PREVIEW_H = 720;

const PREVIEW_FILES = [["background", "preview.jpg"], ["picture", "picture.jpg"]];   /* in a theme .zip */
const coverUrl = t => `/api/theme/preview?${q({ id: t.id })}&v=${t.coverTime}-${stamp}`;

/* A 16:9 JPEG of an image, video frame or canvas, fitted as `fit`. */
async function previewJpeg(src, w, h, fit) {
  const c = document.createElement("canvas");
  c.width = PREVIEW_W; c.height = PREVIEW_H;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
  let dw = c.width, dh = c.height;
  if (fit !== "stretch") {
    const sc = (fit === "contain" ? Math.min : Math.max)(c.width / w, c.height / h);
    dw = w * sc; dh = h * sc;
  }
  ctx.drawImage(src, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
  const blob = await new Promise(resolve => c.toBlob(resolve, "image/jpeg", 0.85));
  if (!blob) throw new Error("this browser could not make the picture");
  await loadImage(URL.createObjectURL(blob)).then(img => URL.revokeObjectURL(img.src));  /* check it reads back */
  return blob;
}

/* A frame from a little way into a video (backgrounds often fade in). */
function videoFrame(url) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    const timer = setTimeout(() => reject(new Error("could not read the video")), 10000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 0) / 3); };
    v.onseeked = () => { clearTimeout(timer); resolve(v); };
    v.onerror = () => { clearTimeout(timer); reject(new Error("could not read the video")); };
    v.src = url;
  });
}

async function previewSource(url, isVideo) {
  if (isVideo) { const v = await videoFrame(url); return [v, v.videoWidth, v.videoHeight]; }
  const img = await loadImage(url);
  return [img, img.naturalWidth, img.naturalHeight];
}

async function savePreview(id, kind, blob) {
  await uploadVerified("/api/theme/preview", { id, kind }, blob);
  stamp = Date.now();
  await refreshStatus();
  if (state.route === "edit" && state.editId === id && $("#cover-panel")) $("#cover-panel").innerHTML = coverPanel(themeById(id));
}

async function removePreview(id, kind) {
  await api("DELETE", "/api/theme/preview", { id, kind }).catch(() => {});
  stamp = Date.now();
  await refreshStatus();
  if (state.route === "edit" && state.editId === id && $("#cover-panel")) $("#cover-panel").innerHTML = coverPanel(themeById(id));
}

/* After a background is added: the same picture, fitted as the background was. */
async function previewFromFile(id, file, isVideo) {
  const url = URL.createObjectURL(file);
  try {
    const [src, w, h] = await previewSource(url, isVideo);
    await savePreview(id, "background", await previewJpeg(src, w, h, state.fit));
  } catch (e) {
    console.warn("preview picture:", e);
  } finally { URL.revokeObjectURL(url); }
}

/* ---- reading a theme's own background back (themes made before previews) */

/* The content of a zstd frame made of raw and RLE blocks, which is how this
   builder stores textures. Compressed blocks are not read. */
function unzstdStored(b) {
  if (b[0] !== 0x28 || b[1] !== 0xb5 || b[2] !== 0x2f || b[3] !== 0xfd) throw new Error("not zstd");
  const fhd = b[4], single = (fhd >> 5) & 1, fcs = [single ? 1 : 0, 2, 4, 8][fhd >> 6];
  let o = 5 + (single ? 0 : 1) + [0, 1, 2, 4][fhd & 3] + fcs;
  const parts = [];
  for (;;) {
    if (o + 3 > b.length) throw new Error("truncated zstd");
    const h = b[o] | (b[o + 1] << 8) | (b[o + 2] << 16), type = (h >> 1) & 3, size = h >>> 3;
    o += 3;
    if (type === 0) { parts.push(b.subarray(o, o + size)); o += size; }
    else if (type === 1) { parts.push(new Uint8Array(size).fill(b[o])); o += 1; }
    else throw new Error("compressed zstd");
    if (h & 1) break;
  }
  const out = new Uint8Array(parts.reduce((n, x) => n + x.length, 0));
  let w = 0;
  for (const x of parts) { out.set(x, w); w += x.length; }
  return out;
}

/* The top level of a DDS texture as a canvas: BC7 (as this builder encodes
   it), RGBA8 or BGRA8. */
async function ddsCanvas(bytes) {
  const d = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (d.getUint32(0, true) !== 0x20534444) throw new Error("not a DDS texture");
  const h = d.getUint32(12, true), w = d.getUint32(16, true);
  const fourcc = d.getUint32(84, true), dx10 = fourcc === 0x30315844;
  let dxgi = dx10 ? d.getUint32(128, true) : 0;
  if (!dx10 && d.getUint32(88, true) === 32) dxgi = d.getUint32(92, true) === 0xff ? 28 : d.getUint32(92, true) === 0xff0000 ? 87 : 0;
  const data = bytes.subarray(dx10 ? 148 : 128);
  if (!w || !h || w > 8192 || h > 8192) throw new Error("unexpected texture size");
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(w, h), px = img.data;
  if (dxgi === 98 || dxgi === 99) {
    const bw = Math.ceil(w / 4), bh = Math.ceil(h / 4), block = new Uint8Array(64);
    if (data.length < bw * bh * 16) throw new Error("texture is truncated");
    let last = performance.now();
    for (let by = 0; by < bh; by++) {
      for (let bx = 0; bx < bw; bx++) {
        if (!bc7DecodeMode6(data, (by * bw + bx) * 16, block)) throw new Error("texture uses BC7 modes this preview can't read");
        for (let y = 0; y < 4 && by * 4 + y < h; y++) {
          for (let x = 0; x < 4 && bx * 4 + x < w; x++) {
            const s = (y * 4 + x) * 4, t = ((by * 4 + y) * w + bx * 4 + x) * 4;
            px[t] = block[s]; px[t + 1] = block[s + 1]; px[t + 2] = block[s + 2]; px[t + 3] = 255;
          }
        }
      }
      if (performance.now() - last > 50) { await nextTask(); last = performance.now(); }
    }
  } else if (dxgi === 28 || dxgi === 29 || dxgi === 87 || dxgi === 91) {
    if (data.length < w * h * 4) throw new Error("texture is truncated");
    const bgra = dxgi === 87 || dxgi === 91;
    for (let i = 0; i < w * h * 4; i += 4) {
      px[i] = data[i + (bgra ? 2 : 0)]; px[i + 1] = data[i + 1]; px[i + 2] = data[i + (bgra ? 0 : 2)]; px[i + 3] = 255;
    }
  } else throw new Error("texture format not readable here");
  ctx.putImageData(img, 0, 0);
  return c;
}

/* The theme's home background, preferring the default home screen one. */
function backgroundFile(paths) {
  const bgs = paths.filter(p => BG_RE.test(p));
  const rank = p => areaOf(p) === "Home: default background" ? 0 : areaOf(p).startsWith("Home:") ? 1 : 2;
  return bgs.sort((a, b) => rank(a) - rank(b))[0] || null;
}

async function previewFromTheme(id) {
  const { files } = await api("GET", "/api/theme/files", { id });
  const path = backgroundFile(files.map(f => f.path));
  if (!path) return false;
  const url = `/api/theme/file?${q({ id, path })}`;
  let src, w, h;
  if (/\.dds(\.zst)?$/i.test(path)) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("could not read the background");
    let bytes = new Uint8Array(await res.arrayBuffer());
    if (/\.zst$/i.test(path)) bytes = unzstdStored(bytes);
    src = await ddsCanvas(bytes); w = src.width; h = src.height;
  } else {
    [src, w, h] = await previewSource(url, /\.(mp4|webm|m4v)$/i.test(path));
  }
  await savePreview(id, "background", await previewJpeg(src, w, h, "stretch"));
  return true;
}

/* Themes made before preview pictures: make one from the background, once
   per visit. Quietly does nothing when it can't. */
const previewTried = new Set();
let previewFilling = false;
async function fillMissingPreviews() {
  if (previewFilling) return;
  previewFilling = true;
  try {
    for (const t of state.status.themes) {
      if (t.cover || !t.files || previewTried.has(t.id)) continue;
      previewTried.add(t.id);
      try {
        const el = await previewFromTheme(t.id) && document.querySelector(`[data-cover="${CSS.escape(t.id)}"]`);
        if (el && themeById(t.id)) el.outerHTML = cardPreview(themeById(t.id));
      } catch (e) { console.warn(`preview picture for ${t.id}:`, e); }
    }
  } finally { previewFilling = false; }
}

function coverPanel(t) {
  const text = t.cover === "picture"
    ? "Your picture, shown on this theme's card in the library. Remove it to show the background instead."
    : t.cover === "background"
      ? "Made from the background and shown on this theme's card in the library. You can choose another picture, such as a photo of your home screen with the theme applied."
      : "Shown on this theme's card in the library, so you can tell your themes apart. It's made from the background when you add one, or choose any picture.";
  return `
    <div class="cover">${t.cover ? `<img alt="Preview of ${esc(t.name)}" src="${coverUrl(t)}">` : "No picture yet"}</div>
    <div class="text"><h2>Preview picture</h2><div class="sub">${esc(text)}</div>
      <div class="acts"><button class="btn sm" data-act="choose-cover">Choose picture</button>
        ${t.cover === "picture" ? `<button class="btn sm ghost danger" data-act="remove-cover">Remove picture</button>` : ""}</div></div>`;
}

async function chooseCover() {
  const id = state.editId;
  const file = await pickFile("image/*");
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const [img, w, h] = await previewSource(url, false);
    await savePreview(id, "picture", await previewJpeg(img, w, h, "cover"));
    toast("Preview picture set.", "ok");
  } catch (e) {
    toast(e.message, "err");
  } finally { URL.revokeObjectURL(url); }
}

/* ================================================================ editor (theme builder) */

async function renderEditor() {
  const themes = state.status.themes;
  if (!themes.length) {
    view.innerHTML = `<div class="empty"><h2>Nothing to edit yet</h2>
      <p class="muted" style="margin:0">Create a theme first, then choose what it changes.</p>
      <button class="btn primary" data-act="new-from-editor">New theme</button></div>`;
    return;
  }
  if (!themeById(state.editId)) state.editId = themes[0].id;
  const t = themeById(state.editId);
  view.innerHTML = `<p class="muted">Loading…</p>`;
  await Promise.all([loadAssets(), loadThemeFiles(t.id)]);
  const on = state.status.applied === t.id;
  const fwAny = t.fw === "any";

  view.innerHTML = `
    <div class="head">
      <h1>Edit</h1>
      <select id="theme-select" aria-label="Theme" style="width:auto">${themes.map(x =>
        `<option value="${esc(x.id)}" ${x.id === t.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
      <span class="spacer"></span>
      <button class="btn ghost" data-act="export" data-id="${esc(t.id)}" id="edit-export" ${t.files || t.music ? "" : "disabled"}>Export</button>
      <button class="btn primary" data-act="apply" data-id="${esc(t.id)}" id="edit-apply" ${t.compatible && (t.files || t.music) ? "" : "disabled"}>${on ? "Re-apply to console" : "Apply to console"}</button>
    </div>
    ${on ? resultBanner() : ""}
    ${isLocal() && /PlayStation/i.test(navigator.userAgent)
      ? `<div class="banner">Attaching files is easiest from a computer or phone: open <b>http://${esc(state.status.ip)}:8095</b>.</div>` : ""}
    <div class="panel builder-head">
      <label class="field">Name<input type="text" id="theme-name" maxlength="60" value="${esc(t.name)}"></label>
      <label class="field">Firmware
        <select id="theme-fw">
          <option value="${esc(state.status.fw)}" ${!fwAny ? "selected" : ""}>This console (${esc(state.status.fw)})</option>
          <option value="any" ${fwAny ? "selected" : ""}>Any firmware</option>
        </select></label>
      <label class="field">How images are fitted
        <select id="fit">${[["cover", "Fill (crop edges)"], ["contain", "Fit (keep all)"], ["stretch", "Stretch"]]
          .map(([v, l]) => `<option value="${v}" ${state.fit === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    </div>
    <section class="panel cover-panel" id="cover-panel">${coverPanel(t)}</section>
    ${state.assetsError ? `<div class="banner err">${esc(state.assetsError)}. Restart the plugin once with the stock theme to list the system assets.</div>` : ""}
    <div class="aspects">${ASPECTS.map(a => `<section class="aspect" id="aspect-${a.id}"></section>`).join("")}</div>
    <div class="savebar" id="savebar" role="region" aria-label="Unsaved changes" ${t.unsaved ? "" : "hidden"}>
      <div class="text"><b>Unsaved changes</b><span>Save to keep them, or discard them to go back to the last save.</span></div>
      <button class="btn ghost" data-act="discard" data-id="${esc(t.id)}" id="discard-btn">Discard</button>
      <button class="btn primary" data-act="save" data-id="${esc(t.id)}">Save</button>
    </div>
    <p class="note" style="margin-top:18px">Only media can be themed. ${state.protectedCount ? `${plural(state.protectedCount, "system file")} (code and libraries) are protected and never changed. ` : ""}Every file is checked against the system file it replaces, on upload and again when the theme is applied.</p>`;
  ASPECTS.forEach(renderAspect);
}

function renderAspect(asp) {
  const el = $(`#aspect-${asp.id}`);
  if (!el) return;
  const on = aspectOn(asp);
  const replaced = aspectReplaced(asp);
  let summary;
  if (asp.mode === "music") {
    const t = themeById(state.editId);
    summary = state.files.has(HOME_MUSIC) ? `${t.music ? fmtTime(t.music) + " · " : ""}${gainLabel(t.gain || 0)}`
      : t.music ? "Not converted to home music yet" : "No music yet";
  } else {
    const total = aspectAssets(asp).length;
    summary = total ? `${replaced} of ${plural(total, "file")} replaced` : "None on this firmware";
  }
  const confirming = state.confirming === asp.id;
  el.innerHTML = `
    <div class="aspect-head">
      <button class="switch" role="switch" aria-checked="${on}" aria-label="${esc(asp.title)}" data-act="toggle" data-aspect="${asp.id}"></button>
      <div class="text"><h2>${esc(asp.title)}</h2><div class="sub">${esc(on ? summary : asp.sub)}</div></div>
      ${confirming ? `<div class="confirm">Remove ${asp.mode === "music" ? "the music" : plural(replaced, "replaced file")}?
        <button class="btn sm danger armed" data-act="confirm-off" data-aspect="${asp.id}">Remove</button>
        <button class="btn sm ghost" data-act="cancel-off" data-aspect="${asp.id}">Keep</button></div>` : ""}
    </div>
    <div class="aspect-body" ${on ? "" : "hidden"}>${on ? aspectBody(asp) : ""}</div>`;
  if (asp.mode === "music" && state.trim) setupTrim();
}

function dropZone(asp, title, detail) {
  return `<div class="drop-zone" data-drop="${asp.id}">
      <div class="text"><div class="title">${esc(title)}</div><div class="note">${esc(detail)}</div></div>
      <button class="btn" data-act="attach-aspect" data-aspect="${asp.id}">Choose file</button>
    </div>`;
}

function thumbFor(a) {
  const rep = state.files.has(a.path);
  if (!isImage(a)) return `<div class="thumb${rep ? " replaced" : ""}"><span>${esc(a.kind === "texture" ? "DDS" : ext(a.path) || "file")}</span></div>`;
  const src = rep ? `/api/theme/file?${q({ id: state.editId, path: a.path })}&v=${stamp}` : `/api/asset?${q({ path: a.path })}`;
  return `<div class="thumb${rep ? " replaced" : ""}"><img loading="lazy" alt="" src="${esc(src)}"></div>`;
}

function aspectBody(asp) {
  if (asp.mode === "music") return musicBody();
  if (!state.assets) return `<p class="note">The system asset list is not available yet.</p>`;
  const all = aspectAssets(asp);
  if (!all.length) return `<p class="note">This firmware has no ${esc(asp.title.toLowerCase())} that can be themed. Anything else replaceable is under Other images.</p>`;

  if (asp.mode === "single") {
    const off = bgOff();
    const areas = new Map();
    for (const a of all) {
      const k = areaOf(a.path);
      if (!areas.has(k)) areas.set(k, []);
      areas.get(k).push(a);
    }
    const chosen = all.filter(a => !off.has(areaOf(a.path)));
    const replaced = all.filter(a => state.files.has(a.path)).length;
    return `${dropZone(asp, "Drop an image or video here",
        chosen.length ? `Goes to ${plural(chosen.length, "file")} in the areas switched on below, each at its own size.` : "Switch on at least one area below.")}
      <p class="note">Choose where your background is used:</p>
      <div class="rows">${[...areas.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([name, list]) => {
        const on = !off.has(name), rep = list.filter(a => state.files.has(a.path)).length;
        return `<div class="row-item${rep ? " replaced" : ""}">
          <div class="info" style="display:flex;gap:14px;align-items:center;min-width:0">
            <button class="switch" role="switch" aria-checked="${on}" aria-label="${esc(name)}" data-act="toggle-area" data-area="${esc(name)}"></button>
            <div style="min-width:0"><div class="file">${esc(name)}${rep ? ` <span class="tag on">Replaced</span>` : ""}</div>
              <div class="dir">${plural(list.length, "file")}</div></div>
          </div>
          <div class="strip">${list.slice(0, 4).map(thumbFor).join("")}</div>
        </div>`;
      }).join("")}</div>
      ${replaced ? `<div><button class="btn sm ghost danger" data-act="reset-aspect" data-aspect="${asp.id}">Reset background</button></div>` : ""}`;
  }

  const groupsAll = groupAssets(all);
  const filter = (state.filters[asp.id] || "").toLowerCase();
  const groups = filter ? groupsAll.filter(g => g.key.toLowerCase().includes(filter)) : groupsAll;
  const page = state.pages[asp.id] || 48;
  const shown = groups.slice(0, page);
  const search = groupsAll.length > 12
    ? `<div class="toolbar"><input type="search" data-filter-aspect="${asp.id}" placeholder="Search ${esc(asp.title.toLowerCase())}" value="${esc(state.filters[asp.id] || "")}" aria-label="Search ${esc(asp.title)}"></div>` : "";
  const more = groups.length > page ? `<div><button class="btn sm" data-act="more" data-aspect="${asp.id}">Show more (${groups.length - page})</button></div>` : "";
  if (!groups.length) return `${search}<p class="note">Nothing matches.</p>`;

  if (asp.mode === "tiles") {
    return `${search}<p class="note">Click an item to attach a file, or drop one on it.</p>
      <div class="tiles">${shown.map(g => {
        const rep = g.assets.filter(a => state.files.has(a.path)).length;
        return `<button class="tile${rep ? " replaced" : ""}" data-group="${esc(g.key)}" data-aspect="${asp.id}" title="${esc(g.key)}">
          ${rep ? `<span class="tag on">Replaced</span>` : ""}
          ${thumbFor(g.assets.find(a => state.files.has(a.path)) || g.assets[0])}
          <div class="file">${esc(g.name)}</div>
          <div class="meta">${g.assets.length > 1 ? plural(g.assets.length, "size") : fmtSize(g.assets[0].size)}</div>
        </button>`;
      }).join("")}</div>${more}
      ${all.some(a => state.files.has(a.path)) ? `<div><button class="btn sm ghost danger" data-act="reset-aspect" data-aspect="${asp.id}">Reset all ${esc(asp.title.toLowerCase())}</button></div>` : ""}`;
  }

  return `${search}<div class="rows">${shown.map(g => {
      const rep = g.assets.filter(a => state.files.has(a.path)).length;
      const a0 = g.assets[0];
      const play = asp.id === "sounds" && ext(a0.path) === "wav"
        ? `<audio controls preload="none" src="${esc(rep ? `/api/theme/file?${q({ id: state.editId, path: a0.path })}&v=${stamp}` : `/api/asset?${q({ path: a0.path })}`)}"></audio>` : "";
      return `<div class="row-item${rep ? " replaced" : ""}" data-drop-group="${esc(g.key)}" data-aspect="${asp.id}">
        <div class="info"><div class="file">${esc(g.name)}${rep ? ` <span class="tag on">Replaced</span>` : ""}</div>
          <div class="dir">${esc(g.dir)}${g.assets.length > 1 ? ` · ${plural(g.assets.length, "variant")}` : ""}</div></div>
        <div class="acts">${play}
          <button class="btn sm" data-act="attach-group" data-group="${esc(g.key)}" data-aspect="${asp.id}">${rep ? "Replace" : "Attach"}</button>
          ${rep ? `<button class="btn sm ghost danger" data-act="reset-group" data-group="${esc(g.key)}" data-aspect="${asp.id}">Reset</button>` : ""}
        </div></div>`;
    }).join("")}</div>${more}`;
}

const gainLabel = g => (g ? `${g > 0 ? "+" : "−"}${Math.abs(g)} dB` : "same loudness as the console's music");

function musicBody() {
  const t = themeById(state.editId);
  if (state.assets && !state.assets.some(a => a.path === HOME_MUSIC)) {
    return `<p class="note">This firmware has no home music file (bgm_home.at9) to replace.</p>`;
  }
  if (state.trim && state.trim.id === t.id) return trimBody();
  const converted = state.files.has(HOME_MUSIC);
  if (!t.music && !converted) {
    return dropZone(aspectById("music"), "Drop a music file here",
      "MP3, M4A, OGG, WAV, FLAC and more. Choose the part that loops; it is encoded on this device to the console's home music format (ATRAC9) at the same loudness, then decoded again and checked before upload.");
  }
  const status = !converted ? "Added with an earlier version. Convert it to make it the home music."
    : "Checking the home music file…";
  if (converted) checkHomeMusic(t.id);
  return `<div class="row-item replaced">
      <div class="info"><div class="file">Home music${t.music ? ` · ${esc(partLabel(t))}` : ""}</div>
        <div class="dir" id="home-music-status">${esc(status)}</div>
        ${t.music ? `<audio controls preload="none" src="/api/theme/music?${q({ id: t.id })}&v=${stamp}"></audio>` : ""}</div>
      <div class="acts">
        ${t.music && !converted ? `<button class="btn sm primary" data-act="convert-music">Convert</button>` : ""}
        <button class="btn sm primary" data-act="convert-music" id="home-music-fix" hidden>Encode again</button>
        ${t.music ? `<button class="btn sm" data-act="choose-part">Choose part</button>` : ""}
        <button class="btn sm" data-act="attach-aspect" data-aspect="music">Replace</button>
        <button class="btn sm ghost danger" data-act="remove-music">Remove</button>
      </div></div>
    ${t.music ? `<label class="field">Loudness <span id="gain-label">${esc(gainLabel(t.gain || 0))}</span>
      <input type="range" min="-12" max="12" step="1" value="${t.gain || 0}" id="music-gain"></label>` : ""}
    ${converted ? `<p class="note">${esc(MUSIC_PLACE_NOTE)}</p>` : ""}`;
}

/* ---- Home music: the music part, the loop part and their order ---- */

const LOOP_CHOICES = [
  ["crossfade", 1000, "Crossfade, 1 s"], ["crossfade", 2000, "Crossfade, 2 s"], ["crossfade", 4000, "Crossfade, 4 s"],
  ["fade", 1000, "Fade out and in"], ["cut", 0, "Straight cut"],
];
const ORDERS = [
  ["music", "Repeat the music part"],
  ["loop-first", "Loop part first, then the music part repeats"],
  ["alternate", "Loop part and music part take turns"],
  ["music-first", "Music part once, then the loop part repeats"],
];
const MIN_PART = 3;          /* seconds */
/* Seen on 13.42: the home screen's player keeps its place in time. It carries
   on after a game, and when the music changes under it (a theme is applied)
   it carries on in the new music from the same point. */
const MUSIC_PLACE_NOTE = "The home screen keeps its place in the music: after a game it carries on where it stopped. When you apply a theme, the new music carries on from about where the old music had got to, so the first time it can start part-way through instead of at the beginning.";
const SNAP = 0.25;           /* seconds: a loop edge this close to the music's edge joins it */

/* A theme's music settings, in seconds: the music part (end 0 = to the end
   of the song), the loop part (null = none), their order and the joints. */
function themePart(t) {
  const loop = t.musicLoopStart >= 0 && t.musicLoopEnd >= 0;
  return {
    start: (t.musicStart || 0) / 1000, end: (t.musicEnd || 0) / 1000,
    playFrom: t.musicPlayFrom >= 0 ? t.musicPlayFrom / 1000 : null,
    loopStart: loop ? t.musicLoopStart / 1000 : null, loopEnd: loop ? t.musicLoopEnd / 1000 : null,
    order: loop ? t.musicOrder || "music" : "music",
    loop: t.musicLoop || "crossfade", blend: (t.musicBlend == null ? 2000 : t.musicBlend) / 1000,
  };
}

function fmtClock(sec) {
  const s = Math.max(0, sec), m = Math.floor(s / 60);
  return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0")}`;
}

function parseClock(text) {
  const m = /^\s*(?:(\d+):)?(\d+(?:\.\d*)?)\s*$/.exec(text);
  return m ? (+(m[1] || 0)) * 60 + +m[2] : NaN;
}

/* The order things play in: segments [from, to] of the song (seconds), and
   where the repeating starts (in segment `seg`, at song time `at`). The home
   screen starts at the beginning of the first segment. */
function playPlan(p) {
  const M = [p.start, p.end], L = [p.loopStart, p.loopEnd];
  const later = p.playFrom !== null && p.playFrom !== undefined && p.playFrom > p.start + 0.05 && p.playFrom < (p.end || Infinity);
  switch (p.order) {
    case "loop-first": return { segs: [L, M], seg: 1, at: M[0] };
    case "alternate": return { segs: [L, M], seg: 0, at: L[0] };
    case "music-first":
      if (Math.abs(L[1] - M[1]) < 1e-6 && L[0] >= M[0] && L[0] < M[1]) return { segs: [M], seg: 0, at: L[0] };
      return { segs: [M, L], seg: 1, at: L[0] };
    default: return later ? { segs: [[p.playFrom, p.end], M], seg: 1, at: M[0] } : { segs: [M], seg: 0, at: M[0] };
  }
}

// "0:10.0 to 0:40.0" for a segment; `songEnd` resolves an end of 0.
const span = ([a, b], songEnd) => `${fmtClock(a)} to ${fmtClock(b || songEnd)}`;

// From the beginning of the home music, in plain words.
function describePlan(p, songEnd) {
  const plan = playPlan(p), M = [p.start, p.end], L = [p.loopStart, p.loopEnd];
  switch (p.order) {
    case "loop-first": return `Plays ${span(L, songEnd)} once, then repeats ${span(M, songEnd)}.`;
    case "alternate": return `Plays ${span(L, songEnd)}, then ${span(M, songEnd)}, over and over.`;
    case "music-first": return `Plays ${span(M, songEnd)} once, then repeats ${span(L, songEnd)}.`;
    default: return plan.segs.length > 1
      ? `Plays ${span(plan.segs[0], songEnd)} once, then repeats ${span(M, songEnd)}.`
      : `Repeats ${span(M, songEnd)}.`;
  }
}

function partLabel(t) {
  const part = themePart(t);
  if (part.order === "music" && !part.start && !part.end && part.playFrom === null) return fmtTime(t.music);
  return describePlan({ ...part, end: part.end || t.music, loopEnd: part.loopEnd || t.music }, t.music).replace(/\.$/, "");
}

/* What the home screen plays, cut from the theme's music in the chosen
   order. `intro` is where the repeating starts in the result. Every joint (a
   part into the next, and the jump back) is blended so it makes no click: a
   crossfade leads the sound before the joint into the sound just before
   where it continues (at the very start of the song, a fade instead); a fade
   dips the sound on both sides; a cut leaves it as it is. */
function buildHomeMusic(chans, rate, part) {
  const n = chans[0].length, at = v => Math.max(0, Math.min(n, Math.round(v * rate)));
  const p = { ...part };
  if (p.order !== "music" && (p.loopStart === null || p.loopStart === undefined)) p.order = "music";
  const plan = playPlan(p);
  const segs = plan.segs.map(([a, b]) => {
    const from = Math.min(at(a), n - 1);
    return [from, b > 0 ? Math.max(from + 1, at(b)) : n];
  });
  const shortest = Math.min(...segs.map(([a, b]) => b - a));
  const c = p.loop === "cut" ? 0 : Math.min(Math.round(p.blend * rate), Math.floor(shortest / 3));
  let target = Math.max(segs[plan.seg][0], Math.min(at(plan.at), segs[plan.seg][1] - 1));
  // A crossfade needs the sound before the loop start: at the very start of
  // the song, the repeating starts that much later instead.
  if (p.loop === "crossfade" && c > 0 && target < c && target + c < segs[plan.seg][1]) target += c;
  const offsets = [];
  let total = 0;
  for (const [a, b] of segs) { offsets.push(total); total += b - a; }
  const intro = offsets[plan.seg] + (target - segs[plan.seg][0]);
  // Joints: [position in the result, song position the sound continues from,
  // position in the result where that continuation sits].
  const joints = segs.slice(1).map(([a], i) => [offsets[i + 1], a, offsets[i + 1]]);
  joints.push([total, target, intro]);
  const out = chans.slice(0, 2).map(x => {
    const y = new Float32Array(total);
    segs.forEach(([a, b], i) => y.set(x.subarray(a, b), offsets[i]));
    for (const [end, from, landing] of joints) {
      if (p.loop === "crossfade" && c > 0 && from >= c) {
        for (let i = 0; i < c; i++) {
          const ang = (i + 0.5) / c * Math.PI / 2;
          y[end - c + i] = y[end - c + i] * Math.cos(ang) + x[from - c + i] * Math.sin(ang);
        }
      } else if (p.loop !== "cut" && c > 0) {
        for (let i = 0; i < c; i++) {
          const g = (i + 0.5) / c;
          y[end - 1 - i] *= g;
          y[landing + i] *= g;
        }
      }
    }
    return y;
  });
  // Where a sample of the result came from in the song (for the playhead).
  const source = i => {
    let k = segs.length - 1;
    while (k > 0 && i < offsets[k]) k--;
    return segs[k][0] + (i - offsets[k]);
  };
  return { chans: out, intro, source, joint: segs.length > 1 ? offsets[1] : -1 };
}

/* Open the part editor. `chans` is the music at `rate`; `fresh` means it has
   not been saved to the theme yet. */
async function openTrim(id, chans, rate, part, fresh) {
  const stock = await stockAt9(HOME_MUSIC);
  const duration = chans[0].length / rate;
  const max = at9MaxSamples(stock) / stock.file.config.rate;      /* the whole result, which can be longer than the song */
  const peaks = new Float32Array(2048);
  const per = chans[0].length / (peaks.length / 2);
  for (let b = 0; b < peaks.length / 2; b++) {
    let lo = 0, hi = 0;
    for (let i = Math.floor(b * per), stop = Math.min(chans[0].length, Math.floor((b + 1) * per)); i < stop; i++) {
      const v = (chans[0][i] + chans[1][i]) / 2;
      if (v < lo) lo = v; else if (v > hi) hi = v;
    }
    peaks[2 * b] = lo;
    peaks[2 * b + 1] = hi;
  }
  const end = part.end > part.start ? Math.min(part.end, duration) : duration;
  const hasLoop = part.loopStart !== null && part.loopStart !== undefined;
  state.trim = {
    id, chans, rate, duration, max, peaks, fresh, start: part.start, end, order: hasLoop ? part.order : "music",
    playFrom: part.playFrom !== null && part.playFrom !== undefined ? part.playFrom : part.start,
    loopStart: hasLoop ? part.loopStart : 0, loopEnd: hasLoop ? (part.loopEnd > 0 ? Math.min(part.loopEnd, duration) : duration) : 0,
    loop: part.loop, blend: part.blend,
  };
  if (!hasLoop) defaultLoop(state.trim);
  clampTrim("end");
  setAspectFlag(aspectById("music"), true);
  renderAspect(aspectById("music"));
}

// A starting loop part for an order: the second half of the music part for
// "music part once", otherwise up to 30 seconds from its middle.
function defaultLoop(t) {
  const len = t.end - t.start;
  if (t.order === "music-first") {
    t.loopStart = t.start + len / 2;
    t.loopEnd = t.end;
  } else {
    t.loopStart = t.start + len * 0.4;
    t.loopEnd = Math.min(t.end, t.loopStart + Math.max(MIN_PART, Math.min(30, len * 0.3)));
  }
}

function trimBody() {
  const t = state.trim, loopOn = t.order !== "music";
  const choice = LOOP_CHOICES.findIndex(([l, ms]) => l === t.loop && (l === "cut" || ms === Math.round(t.blend * 1000)));
  const handle = (id, label, v, loop) => `<button class="handle${loop ? " loop" : ""}" id="${id}" role="slider" aria-label="${label}"
      aria-valuemin="0" aria-valuemax="${t.duration.toFixed(1)}" aria-valuenow="${v.toFixed(1)}" aria-valuetext="${fmtClock(v)}" ${loop && !loopOn ? "hidden" : ""}></button>`;
  const field = (id, label, v) => `<label class="field">${label}<input type="text" id="${id}" value="${fmtClock(v)}" inputmode="decimal" autocomplete="off"></label>`;
  return `<div class="trim">
      <p class="note">Choose the music part, and if you like a loop part and the order they play in. Drag the handles, move a selected handle with the arrow keys, or type the times.</p>
      <div class="wave" id="wave"><canvas id="wave-canvas"></canvas>
        ${handle("trim-start", "Music part start", t.start)}${handle("trim-end", "Music part end", t.end)}
        ${handle("trim-lstart", "Loop part start", t.loopStart, true)}${handle("trim-lend", "Loop part end", t.loopEnd, true)}
        <button class="handle from" id="trim-from" role="slider" aria-label="Begins at" aria-valuemin="0"
          aria-valuemax="${t.duration.toFixed(1)}" aria-valuenow="${t.playFrom.toFixed(1)}" aria-valuetext="${fmtClock(t.playFrom)}" ${loopOn ? "hidden" : ""}></button>
        <div class="start-flag" id="trim-flag" ${loopOn ? "" : "hidden"}></div>
        <div class="playhead" id="trim-playhead" hidden></div></div>
      <div class="legend"><span class="key start"></span>Begins here<span class="key music"></span>Music part${loopOn ? `<span class="key loop"></span>Loop part` : ""}</div>
      <div class="trim-fields">${field("trim-start-time", "Music part starts", t.start)}${field("trim-end-time", "Music part ends", t.end)}
        ${loopOn ? "" : field("trim-from-time", "Begins at", t.playFrom)}</div>
      <div class="trim-fields">
        <label class="field">Play order
          <select id="trim-order">${ORDERS.map(([v, label]) => `<option value="${v}" ${v === t.order ? "selected" : ""}>${label}</option>`).join("")}</select></label>
      </div>
      ${loopOn ? `<div class="trim-fields">${field("trim-lstart-time", "Loop part starts", t.loopStart)}${field("trim-lend-time", "Loop part ends", t.loopEnd)}</div>` : ""}
      <div class="trim-fields">
        <label class="field">How the joints sound
          <select id="trim-loop">${LOOP_CHOICES.map(([, , label], i) => `<option value="${i}" ${i === (choice < 0 ? 1 : choice) ? "selected" : ""}>${label}</option>`).join("")}</select></label>
      </div>
      <p class="note" id="trim-summary"></p>
      <p class="note">${esc(MUSIC_PLACE_NOTE)}</p>
      <div class="trim-actions">
        <button class="btn sm" data-act="trim-play" id="trim-play">Play</button>
        <button class="btn sm" data-act="trim-seam">Hear where it loops</button>
        <button class="btn sm" data-act="trim-joint" id="trim-joint" ${playPlan(trimPart(t)).segs.length > 1 ? "" : "hidden"}>Hear the change of part</button>
        <span class="spacer"></span>
        <button class="btn sm ghost" data-act="trim-cancel">Cancel</button>
        <button class="btn sm primary" data-act="trim-save">Use this</button>
      </div>
    </div>`;
}

const trimPart = t => ({
  start: t.start, end: t.end, loop: t.loop, blend: t.blend, order: t.order,
  playFrom: t.order === "music" && t.playFrom > t.start + 0.05 ? t.playFrom : null,
  loopStart: t.order === "music" ? null : t.loopStart, loopEnd: t.order === "music" ? null : t.loopEnd,
});

// Length of what the home music file holds, in seconds.
function trimLength(t) {
  return playPlan(trimPart(t)).segs.reduce((n, [a, b]) => n + (b - a), 0);
}

// Keep both parts valid: each at least MIN_PART long, within the song, and
// together within the console's length limit. `moved` names the edge that
// changed (start, end, lstart, lend).
function clampTrim(moved) {
  const t = state.trim, d = t.duration, min = Math.min(MIN_PART, d);
  const range = (a, b, movedA) => {
    t[a] = Math.max(0, Math.min(t[a], d - min));
    t[b] = Math.max(min, Math.min(t[b], d));
    if (t[b] - t[a] < min) { if (movedA) t[a] = t[b] - min; else t[b] = t[a] + min; }
  };
  const musicFirst = t.order === "music-first";
  range("start", "end", moved === "start");
  const keepFrom = () => {
    if (moved === "from" && t.playFrom - t.start < SNAP) t.playFrom = t.start;
    t.playFrom = Math.max(t.start, Math.min(t.playFrom, t.end - 1));
  };
  keepFrom();
  if (t.order !== "music") {
    if (musicFirst && (moved === "lend" || moved === "end") && Math.abs(t.loopEnd - t.end) < SNAP + (moved === "end" ? 0.5 : 0)) t.loopEnd = t.end;
    if (musicFirst && moved === "lstart" && Math.abs(t.loopStart - t.start) < SNAP) t.loopStart = t.start;
    range("loopStart", "loopEnd", moved === "lstart");
  }
  for (let pass = 0; pass < 4; pass++) {
    const over = trimLength(t) - t.max;
    if (over <= 1e-6) break;
    const shrinkLoop = (moved === "lstart" || moved === "lend") && t.order !== "music" && playPlan(trimPart(t)).segs.length > 1;
    if (shrinkLoop && moved === "lstart") t.loopStart += over;
    else if (shrinkLoop) t.loopEnd -= over;
    else if (moved === "start") t.start += over;
    else if (moved !== "from") t.end -= over;
    if (moved === "from") t.playFrom += over;
    range("start", "end", moved === "start");
    keepFrom();
    if (t.order !== "music") range("loopStart", "loopEnd", moved === "lstart");
    moved = pass ? (moved === "end" ? "lend" : "end") : moved;
  }
}

function drawTrim() {
  const t = state.trim, canvas = $("#wave-canvas");
  if (!t || !canvas) return;
  const w = canvas.clientWidth, h = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const loopOn = t.order !== "music";
  const X = v => v / t.duration * w, cols = t.peaks.length / 2;
  const x0 = X(t.start), x1 = X(t.end), l0 = loopOn ? X(t.loopStart) : -1, l1 = loopOn ? X(t.loopEnd) : -1;
  let peak = 1e-6;
  for (const v of t.peaks) peak = Math.max(peak, Math.abs(v));
  ctx.fillStyle = "rgba(255, 255, 255, .07)";
  ctx.fillRect(x0, 0, x1 - x0, h);
  if (loopOn) {
    ctx.fillStyle = "rgba(31, 124, 240, .22)";
    ctx.fillRect(l0, 0, l1 - l0, h);
  }
  const wave = h - 14;
  for (let x = 0; x < w; x++) {
    let lo = 0, hi = 0;
    for (let b = Math.floor(x / w * cols); b < Math.max(Math.floor((x + 1) / w * cols), Math.floor(x / w * cols) + 1); b++) {
      lo = Math.min(lo, t.peaks[2 * b]);
      hi = Math.max(hi, t.peaks[2 * b + 1]);
    }
    const y0 = wave / 2 - hi / peak * wave * 0.45, y1 = wave / 2 - lo / peak * wave * 0.45;
    ctx.fillStyle = (x >= x0 && x <= x1) || (x >= l0 && x <= l1) ? "rgba(255, 255, 255, .92)" : "rgba(255, 255, 255, .2)";
    ctx.fillRect(x, y0, 1, Math.max(1, y1 - y0));
  }
  ctx.fillStyle = "rgba(255, 255, 255, .55)";
  ctx.fillRect(x0, h - 12, x1 - x0, 3);
  if (loopOn) {
    ctx.fillStyle = "#1f7cf0";
    ctx.fillRect(l0, h - 6, l1 - l0, 4);
  }
  const first = playPlan(trimPart(t)).segs[0][0];
  ctx.fillStyle = "#3fcf8e";
  ctx.fillRect(X(first) - 1, 0, 2, h);
  $("#trim-flag").style.left = `${canvas.offsetLeft + X(first)}px`;
  for (const [id, v] of [["#trim-start", t.start], ["#trim-end", t.end], ["#trim-lstart", t.loopStart], ["#trim-lend", t.loopEnd], ["#trim-from", t.playFrom]]) {
    const el = $(id);
    el.style.left = `${canvas.offsetLeft + X(v)}px`;
    el.setAttribute("aria-valuenow", v.toFixed(1));
    el.setAttribute("aria-valuetext", fmtClock(v));
  }
  for (const [id, v] of [["#trim-start-time", t.start], ["#trim-end-time", t.end], ["#trim-lstart-time", t.loopStart], ["#trim-lend-time", t.loopEnd], ["#trim-from-time", t.playFrom]]) {
    const field = $(id);
    if (field && document.activeElement !== field) field.value = fmtClock(v);
  }
  const total = trimLength(t);
  const limit = total > t.max * 0.8 || t.duration > t.max ? ` In all ${fmtClock(total)}; the console allows up to ${fmtClock(t.max)}.` : "";
  $("#trim-summary").textContent = describePlan(trimPart(t), t.duration) + limit;
  const joint = $("#trim-joint");
  if (joint) joint.hidden = playPlan(trimPart(t)).segs.length < 2;
}

const HANDLES = { start: "#trim-start", end: "#trim-end", lstart: "#trim-lstart", lend: "#trim-lend", from: "#trim-from" };
const EDGE_KEY = { start: "start", end: "end", lstart: "loopStart", lend: "loopEnd", from: "playFrom" };

function trimFromPointer(e, which) {
  const t = state.trim, r = $("#wave-canvas").getBoundingClientRect();
  t[EDGE_KEY[which]] = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * t.duration;
  clampTrim(which);
  drawTrim();
}

// Wire up the editor after it is rendered.
function setupTrim() {
  const wave = $("#wave");
  if (!wave || wave.dataset.ready) return;
  wave.dataset.ready = "1";
  let dragging = null;
  wave.addEventListener("pointerdown", e => {
    const t = state.trim, r = $("#wave-canvas").getBoundingClientRect(), v = (e.clientX - r.left) / r.width * t.duration;
    dragging = Object.keys(HANDLES).find(k => e.target.id === HANDLES[k].slice(1));
    if (!dragging) {
      // Nearest edge. The lower band of the waveform belongs to the loop part,
      // and with "repeat the music part" the upper band to the start point.
      const y = (e.clientY - r.top) / r.height;
      const lane = t.order !== "music" && y > 0.6 ? ["lstart", "lend"] : t.order === "music" && y < 0.3 ? ["from"] : ["start", "end"];
      dragging = lane.reduce((a, b) => (Math.abs(v - t[EDGE_KEY[a]]) <= Math.abs(v - t[EDGE_KEY[b]]) ? a : b));
    }
    $(HANDLES[dragging]).classList.add("active");
    wave.setPointerCapture(e.pointerId);
    trimFromPointer(e, dragging);
    e.preventDefault();
  });
  wave.addEventListener("pointermove", e => { if (dragging) trimFromPointer(e, dragging); });
  const stop = () => {
    if (!dragging) return;
    $(HANDLES[dragging]).classList.remove("active");
    $(HANDLES[dragging]).focus();
    dragging = null;
  };
  wave.addEventListener("pointerup", stop);
  wave.addEventListener("pointercancel", stop);
  requestAnimationFrame(drawTrim);
}

/* ---- preview (the processed music, looping as the console loops it) ---- */

let preview = null;

function stopPreview() {
  if (!preview) return;
  cancelAnimationFrame(preview.frame);
  clearTimeout(preview.timer);
  try { preview.src.stop(); } catch (e) { /* already stopped */ }
  preview.ctx.close();
  preview = null;
  const head = $("#trim-playhead"), play = $("#trim-play");
  if (head) head.hidden = true;
  if (play) play.textContent = "Play";
}

/* `around`: "loop" plays the seconds around the jump back, "joint" those
   around the change of part; otherwise from the beginning. */
function playPreview(around) {
  stopPreview();
  const t = state.trim;
  const built = buildHomeMusic(t.chans, t.rate, trimPart(t));
  const [L, R] = built.chans;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return toast("This browser cannot play audio previews.", "err");
  const ctx = new Ctx(), buf = ctx.createBuffer(2, L.length, t.rate);
  buf.copyToChannel(L, 0);
  buf.copyToChannel(R, 1);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  src.loopStart = built.intro / t.rate;
  src.loopEnd = buf.duration;
  src.connect(ctx.destination);
  const offset = around === "loop" ? Math.max(0, buf.duration - 4)
    : around === "joint" && built.joint > 0 ? Math.max(0, built.joint / t.rate - 4) : 0;
  src.start(0, offset);
  preview = { ctx, src, offset, began: ctx.currentTime, frame: 0, timer: 0 };
  if (around) preview.timer = setTimeout(stopPreview, 8000);
  const play = $("#trim-play");
  if (play && !around) play.textContent = "Stop";
  const head = $("#trim-playhead"), intro = built.intro / t.rate, len = buf.duration;
  const tick = () => {
    if (!preview || !head) return;
    let pos = preview.offset + preview.ctx.currentTime - preview.began;
    if (pos >= len) pos = intro + (pos - intro) % (len - intro);
    const canvas = $("#wave-canvas");
    head.hidden = false;
    if (canvas) head.style.left = `${canvas.offsetLeft + built.source(Math.floor(pos * t.rate)) / t.rate / t.duration * canvas.clientWidth}px`;
    preview.frame = requestAnimationFrame(tick);
  };
  tick();
}

async function saveTrim() {
  const t = state.trim;
  stopPreview();
  const part = trimPart(t);
  const toEnd = v => (v >= t.duration - 0.05 ? 0 : Math.round(v * 1000));
  const p = progressToast("Saving the music…");
  try {
    if (t.fresh) await uploadVerified("/api/theme/music", { id: t.id }, pcmWav(t.chans, t.rate));
    await api("POST", "/api/theme/settings", {
      id: t.id, start: Math.round(part.start * 1000), end: toEnd(part.end),
      play_from: part.playFrom === null ? -1 : Math.round(part.playFrom * 1000),
      loop_start: part.loopStart === null ? -1 : Math.round(part.loopStart * 1000),
      loop_end: part.loopEnd === null ? -1 : toEnd(part.loopEnd),
      order: part.order, loop: part.loop, blend: Math.round(part.blend * 1000),
    });
    await refreshStatus();
    const r = await convertHomeMusic(t.id, buildHomeMusic(t.chans, t.rate, part), t.rate, themeById(t.id).gain || 0, p);
    state.trim = null;
    stamp = Date.now();
    await refreshStatus();
    p.done(`Home music set and verified (${fmtClock(r.seconds)}). Apply the theme to hear it.`, "ok");
  } catch (e) {
    await refreshStatus();
    p.done(e.message, "err");
  }
  renderAspect(aspectById("music"));
}

function findGroup(asp, key) { return groupAssets(aspectAssets(asp)).find(g => g.key === key); }

async function attachToAspect(asp, file) {
  if (asp.mode === "music") return attachMusic(file);
  const isVideo = file.type.startsWith("video/") || /\.(mp4|webm|m4v)$/i.test(file.name);
  const off = bgOff();
  const targets = aspectAssets(asp).filter(a => (isVideo ? a.kind === "video" : a.kind !== "video") && !off.has(areaOf(a.path)));
  if (!targets.length) return toast(`No ${isVideo ? "video" : "image"} backgrounds in the areas switched on.`, "err");
  const ok = await attachTo(targets, file, asp.title);
  renderAspect(asp);
  if (asp.id === "background" && ok) await previewFromFile(state.editId, file, isVideo);
}

async function attachToGroup(asp, key, file) {
  const g = findGroup(asp, key);
  if (!g) return;
  await attachTo(g.assets, file, g.name);
  renderAspect(asp);
}

/* Ask the console whether the theme's home music file still passes its
   checks. Files from versions 1.10-1.12 do not: they fill unused space with
   zeros, which the console's decoder plays as ticks or silence. */
async function checkHomeMusic(id) {
  let r;
  try { r = await api("GET", "/api/theme/check", { id, path: HOME_MUSIC }); } catch (e) { return; }
  const el = $("#home-music-status"), fix = $("#home-music-fix"), t = themeById(id);
  if (!el || state.editId !== id) return;
  if (r.ok) {
    el.textContent = t && t.music ? "Encoded and verified" : "Home music file from an imported theme";
  } else {
    const m = /^the console cannot play this sound: it (.*?)\. Encode it again/.exec(r.error);
    el.textContent = `The console cannot play this file: ${m ? `it ${m[1]}` : r.error}. ${t && t.music ? "Encode it again." : "Replace it."}`;
    if (fix && t && t.music) fix.hidden = false;
  }
}

/* Encode music (built by buildHomeMusic) into the theme's home music and
   upload it. */
async function convertHomeMusic(id, built, rate, gain, p) {
  const r = await at9For(HOME_MUSIC, built.chans, rate, gain, f => p.set(`Encoding home music… ${Math.round(f * 100)}%`, 0.2 + f * 0.7),
                         built.intro / rate);
  p.set("Uploading home music…", 0.92);
  await uploadVerified("/api/theme/file", { id, path: HOME_MUSIC }, r.blob);
  if (id === state.editId) state.files.add(HOME_MUSIC);
  return r;
}

/* A new song opens the part editor; nothing is saved until "Use this part".
   The theme keeps the whole song (48 kHz WAV, up to about 11 minutes) so the
   part and loudness can be changed later. */
async function attachMusic(file) {
  const id = state.editId;
  const p = progressToast("Reading music…");
  try {
    let chans = await decodeAudio(file, MUSIC_RATE, 2);
    const keep = Math.floor(MUSIC_SOURCE_MAX_BYTES / 4);
    const long = chans[0].length > keep;
    if (long) chans = trimWithFade(chans, keep, MUSIC_RATE);
    await openTrim(id, chans, MUSIC_RATE, { start: 0, end: 0, loop: "crossfade", blend: 2 }, true);
    p.done(long ? `Only the first ${fmtTime(keep / MUSIC_RATE)} of the song can be kept. Choose the part to use.`
      : "Choose the part of the song to use.", "");
    const handle = $("#trim-start");
    if (handle) handle.focus();
  } catch (e) { p.done(e.message, "err"); }
}

async function openThemePart(id) {
  const p = progressToast("Reading the theme's music…");
  try {
    const res = await fetch(`/api/theme/music?${q({ id })}`);
    if (!res.ok) throw new Error("this theme has no music");
    const { chans, rate } = wavChannels(await res.arrayBuffer());
    await openTrim(id, chans.length === 1 ? [chans[0], chans[0]] : chans, rate, themePart(themeById(id)), false);
    p.done("Choose the part of the song to use.", "");
  } catch (e) { p.done(e.message, "err"); }
}

/* Encode the theme's stored music again (new loudness, or music from before
   version 1.10, which the plugin played itself). */
async function reencodeMusic(id, gain) {
  const p = progressToast("Reading the theme's music…");
  try {
    const res = await fetch(`/api/theme/music?${q({ id })}`);
    if (!res.ok) throw new Error("this theme has no music to convert");
    const { chans, rate } = wavChannels(await res.arrayBuffer());
    const stereo = chans.length === 1 ? [chans[0], chans[0]] : chans;
    const r = await convertHomeMusic(id, buildHomeMusic(stereo, rate, themePart(themeById(id))), rate, gain, p);
    stamp = Date.now();
    await refreshStatus();
    p.done(`Home music encoded and verified (${fmtTime(r.seconds)}). Apply the theme to hear it.`, "ok");
  } catch (e) { p.done(e.message, "err"); }
}
