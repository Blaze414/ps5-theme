/* ================================================================ mix and match */

/* A new theme made of parts of others: each part, or each element of a part, taken from one of your themes or
   left as the console's own. The parts are the editor's sections, with what the interface file holds (its
   pictures, sounds, colours and corner shapes) split into parts of their own. The themes taken from stay as they
   are. The plugin copies the files (/api/themes/mix); the interface file is made here, from each theme's changes
   to it, entry by entry. */
const MIX_PARTS = [
  { id: "background", label: "Background", aspects: ["background"], by: "area" },
  { id: "icons", label: "Other icons", aspects: ["icons"], by: "group" },
  { id: "music", label: "Home music", music: true },
  { id: "sounds", label: "Sounds", aspects: ["sounds"], by: "group" },
  { id: "uisounds", label: "Interface sounds", rco: "sound", sections: ["sounds"] },
  { id: "fonts", label: "Fonts", aspects: ["fonts"], by: "font" },
  { id: "appearance", label: "Appearance themes' artwork", aspects: ["appearance"], by: "piece" },
  { id: "colours", label: "Colours", rco: "color", sections: ["appearance"] },
  { id: "interface", label: "Interface icons", rco: "picture", sections: ["interface"] },
  { id: "shapes", label: "Corner shapes", rco: "shape", sections: ["interface"] },
  { id: "tiles", label: "Home screen tiles", aspects: ["tiles"], by: "tile" },
  { id: "titles", label: "Games and apps", aspects: ["titles"], by: "title" },
  { id: "other", label: "Animations, video, textures and other images", aspects: ["animations", "video", "textures", "images"], by: "group" },
];
/* Where a file goes when more than one section would list it: the more particular first. */
const MIX_ORDER = ["background", "appearance", "tiles", "titles", "sounds", "fonts", "icons", "animations", "video", "textures", "images"];
const MIX_ASPECT_PART = Object.fromEntries(MIX_PARTS.flatMap(p => (p.aspects || []).map(a => [a, p.id])));
const mixPartById = id => MIX_PARTS.find(p => p.id === id);

let mixAssetIndex = null;
function mixAsset(path) {
  if (!mixAssetIndex || mixAssetIndex.list !== state.assets) {
    mixAssetIndex = { list: state.assets, map: new Map((state.assets || []).map(a => [a.path, a])) };
  }
  return mixAssetIndex.map.get(path);
}

/* The part a theme's file belongs to: "music" for the home music, "rco" for an interface file, or null for a file
   this console doesn't have (it is left out). */
function mixPartOf(path) {
  if (path === HOME_MUSIC) return "music";
  const a = mixAsset(path);
  if (!a) return null;
  if (a.kind === "rco") return "rco";
  for (const id of MIX_ORDER) {
    const asp = aspectById(id);
    if (asp && asp.filter && asp.filter(a)) return MIX_ASPECT_PART[id];
  }
  return null;
}

/* The element of its part a file belongs to, [key, name]: a background area, an Appearance piece, a font, a tile,
   a game, or the file with its size variants. */
function mixElementOf(part, path) {
  switch (part.by) {
    case "area": return [areaOf(path), areaOf(path)];
    case "piece": return [path, appearanceName(path)];
    case "font": return [path, fontName(path)];
    case "tile": { const t = tileTitle(path); return [t, (state.tileNames && state.tileNames.get(t)) || t]; }
    case "title": { const t = titlesOf(path)[0] || path; return [t, (state.titleNames && state.titleNames.get(t)) || t]; }
    default: { const k = groupKey(path); return [k, baseName(k)]; }
  }
}

/* What one of your themes has, by part. */
async function mixThemeInfo(t) {
  const r = await api("GET", "/api/theme/files", { id: t.id });
  const info = { id: t.id, name: t.name, parts: {}, rco: [], home: false, slots: [], left: 0 };
  for (const f of r.files) {
    const part = mixPartOf(f.path);
    if (part === "rco") info.rco.push(f.path);
    else if (part === "music") info.home = true;
    else if (part) (info.parts[part] = info.parts[part] || []).push(f.path);
    else info.left++;
  }
  if (t.music) info.slots = [...new Set(t.musicSequence && t.musicSequence.length ? t.musicSequence : [1])];
  return info;
}

/* Which themes a part can be taken from: those that have something of it (any interface file, for its parts: what
   is in it shows once the file is read). */
function mixHas(info, part) {
  if (part.music) return info.home || info.slots.length > 0;
  if (part.rco) return info.rco.length > 0;
  return (info.parts[part.id] || []).length > 0;
}

/* A part's elements across your themes: key, name, and the files (or the interface file's entries) each theme has. */
function mixElements(part) {
  const out = new Map();
  const add = (key, label, tid, item) => {
    if (!out.has(key)) out.set(key, { key, label, themes: new Map() });
    const e = out.get(key);
    if (!e.themes.has(tid)) e.themes.set(tid, []);
    e.themes.get(tid).push(item);
  };
  if (part.rco) {
    for (const [tid, byPath] of state.mix.rco) {
      for (const [path, changes] of byPath) {
        const r = state.rco && state.rco.get(path);
        if (!r) continue;
        const files = new Map(r.files.map(f => [`${f.el}\t${f.attr}`, f]));
        const sounds = part.rco === "sound" ? new Map(uiSounds(r).map(s => [s.id, s.label])) : null;
        for (const k of changes.keys()) {
          const f = files.get(k);
          if (!f || rcoEntryKind(f) !== part.rco) continue;
          const label = part.rco === "sound" ? sounds.get(f.id) || f.id : part.rco === "color" ? PALETTE_NAMES[f.id] || f.id
            : part.rco === "shape" ? "Corner shapes" : f.id;
          add(`${path}|${part.rco === "picture" ? f.el : k}`, label, tid, k);
        }
      }
    }
  } else if (!part.music) {
    for (const info of state.mix.themes.values()) {
      for (const path of info.parts[part.id] || []) {
        const [key, label] = mixElementOf(part, path);
        add(key, label, info.id, path);
      }
    }
  }
  return [...out.values()].sort((a, b) => a.label.localeCompare(b.label) || a.key.localeCompare(b.key));
}

/* Where an element comes from: chosen for it, or its part's choice ("" for the console's own). */
function mixSource(part, key) {
  const own = state.mix.elems[part.id] || {};
  return key in own ? own[key] : state.mix.picks[part.id] || "";
}

/* A theme's changes to an interface file, against the console's own (read once while the form is open). */
async function mixRcoChanges(tid, path) {
  const byPath = state.mix.rco.get(tid) || new Map();
  state.mix.rco.set(tid, byPath);
  if (byPath.has(path)) return byPath.get(path);
  const stock = await rcoStock(path), out = new Map();
  const res = await fetch(`/api/theme/file?${q({ id: tid, path })}`);
  if (stock && res.ok) {
    const t = rcoParse(await readBytes(res, f => loadProgress(`mix:${tid}:${path}`, f)));
    const theirs = new Map(t.files.map(f => [`${f.el}\t${f.attr}`, f]));
    for (const f of stock.files) {
      const k = `${f.el}\t${f.attr}`, o = theirs.get(k);
      if (!o) continue;
      const a = rcoData(stock, f), b = rcoData(t, o);
      if (a.length !== b.length || a.some((v, i) => v !== b[i])) out.set(k, b);
    }
  }
  byPath.set(path, out);
  return out;
}

/* Read the interface files of the themes that have one, for choosing their contents element by element. */
async function mixLoadRco() {
  if (state.mix.rcoLoading) return;
  state.mix.rcoLoading = true;
  renderLibrary();
  try {
    const all = [...state.mix.themes.values()].flatMap(info => info.rco.map(path => [info.id, path]));
    for (let i = 0; i < all.length; i++) {
      loadProgress("mix:rco", i / all.length);
      await mixRcoChanges(all[i][0], all[i][1]);
    }
    loadProgress("mix:rco", 1);
  } catch (e) { toast(`The interface files could not be read: ${e.message}`, "err"); }
  state.mix.rcoLoading = false;
  state.mix.rcoReady = true;
  renderLibrary();
}

async function openMix() {
  state.creating = false;
  state.mix = { loading: true, themes: new Map(), name: "", picks: {}, elems: {}, open: {}, rco: new Map() };
  state.mixFocused = false;
  renderLibrary();
  try {
    await loadAssets();
    if (!state.assets) throw new Error(state.assetsError || "the console's files could not be listed");
    const list = state.status.themes.filter(x => x.compatible);
    for (let i = 0; i < list.length; i++) {
      loadProgress("mix", i / list.length);
      state.mix.themes.set(list[i].id, await mixThemeInfo(list[i]));
    }
    loadProgress("mix", 1);
  } catch (e) {
    state.mix = null;
    toast(`Mix and match: ${e.message}`, "err");
    return renderLibrary();
  }
  state.mix.loading = false;
  renderLibrary();
}

function mixForm() {
  const m = state.mix;
  const title = `<div class="form-title"><h2 id="mix-title">Mix and match</h2><span class="note">A new theme made of parts of yours. They stay as they are.</span></div>`;
  if (m.loading) return `<div class="panel mix" aria-labelledby="mix-title">${title}${loadingMarker("mix", "Reading your themes…")}</div>`;
  const themes = [...m.themes.values()].sort((a, b) => a.name.localeCompare(b.name));
  if (themes.length < 2) {
    return `<div class="panel mix" aria-labelledby="mix-title">${title}<p class="note">Mix and match takes each part from one of your themes for this console's firmware: make or import at least two first.</p>
      <div class="row"><button class="btn ghost" type="button" data-act="cancel-mix">Close</button></div></div>`;
  }
  const opt = (v, label, sel) => `<option value="${esc(v)}"${v === sel ? " selected" : ""}>${esc(label)}</option>`;
  /* An interface file's parts, once the files are read: only the themes that change that kind, with how much. */
  const rcoCounts = new Map(MIX_PARTS.filter(p => p.rco && m.rcoReady).map(p => {
    const n = new Map();
    for (const e of mixElements(p)) for (const tid of e.themes.keys()) n.set(tid, (n.get(tid) || 0) + 1);
    return [p.id, n];
  }));
  const count = (info, part) => part.music ? "" : part.rco ? (rcoCounts.has(part.id) ? ` · ${plural(rcoCounts.get(part.id).get(info.id) || 0, "item")}` : "")
    : ` · ${plural(new Set((info.parts[part.id] || []).map(p => mixElementOf(part, p)[0])).size, "item")}`;
  const rows = MIX_PARTS.map(part => {
    const have = themes.filter(i => mixHas(i, part) && (!rcoCounts.has(part.id) || rcoCounts.get(part.id).has(i.id)));
    if (!have.length) return "";
    const pick = m.picks[part.id] || "";
    const open = !!m.open[part.id], elems = open ? mixElements(part) : [];
    const canSplit = !part.music;
    let detail = "";
    if (open && part.rco && !m.rcoReady) {
      detail = m.rcoLoading ? loadingMarker("mix:rco", "Reading the themes' interface files…", "Each is read once while this stays open.")
        : `<p class="note">The interface files are read to list what each theme changes in them.</p>`;
    } else if (open) {
      detail = elems.length ? `<div class="mix-elems">${elems.map(e => {
        const own = m.elems[part.id] || {}, cur = e.key in own ? own[e.key] : "*";
        return `<label class="field small"><span>${esc(e.label)}</span><select data-mix-elem="${esc(part.id)}" data-key="${esc(e.key)}">
          ${opt("*", `As the part (${pick ? (m.themes.get(pick) || {}).name || pick : "console's own"})`, cur)}${opt("", "Console's own", cur)}
          ${themes.filter(i => e.themes.has(i.id)).map(i => opt(i.id, i.name, cur)).join("")}</select></label>`;
      }).join("")}</div>` : `<p class="note">None of your themes changes any of it.</p>`;
    }
    if (rcoCounts.has(part.id) && m.picks[part.id] && !rcoCounts.get(part.id).has(m.picks[part.id])) m.picks[part.id] = "";   /* it changes none of it */
    if (part.rco && rcoCounts.has(part.id) && !have.length) return "";
    return `<div class="mix-part">
      <label class="field"><span>${esc(part.label)}</span><select data-mix-part="${esc(part.id)}">
        ${opt("", "Console's own", pick)}${have.map(i => opt(i.id, `${i.name}${count(i, part)}`, pick)).join("")}</select></label>
      ${canSplit ? `<button class="btn ghost sm" type="button" data-act="mix-elements" data-part="${esc(part.id)}">${open ? "One choice for all" : "Element by element"}</button>` : ""}
      ${detail}</div>`;
  }).join("");
  const chosen = MIX_PARTS.some(p => m.picks[p.id] || Object.values(m.elems[p.id] || {}).some(Boolean));
  return `<form class="panel mix" id="mix" aria-labelledby="mix-title">
    ${title}
    <div class="mix-top">
      <label class="field">Name of the new theme<input type="text" id="mix-name" maxlength="60" required placeholder="My mix" value="${esc(m.name)}"></label>
      <label class="field">Start from<select id="mix-all">${opt("", "Choose a theme…", "")}${themes.map(i => opt(i.id, i.name, "")).join("")}</select></label>
    </div>
    <p class="note">Choose where each part comes from. A part left at <b>Console's own</b> isn't changed.${m.rcoReady || ![...m.themes.values()].some(i => i.rco.length) ? "" : " Interface sounds, colours, icons and corner shapes list only what each theme changes once Element by element has read their interface files."} ${help("A new theme is made from copies of the parts you choose; the themes they come from stay as they are. Element by element takes a part's pieces from different themes: each background area, each Appearance piece, each tile, game, sound or colour palette on its own. Only themes for this console's firmware are offered.")}</p>
    <div class="mix-parts">${rows}</div>
    <div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn ghost" type="button" data-act="cancel-mix">Cancel</button>
      <button class="btn primary" type="submit"${chosen ? "" : " disabled"}>Create</button>
      ${chosen ? "" : `<span class="note">Choose at least one part from a theme.</span>`}</div>
  </form>`;
}

/* Make the new theme: the files copied by the plugin, the interface files made here, the editor's choices, saved. */
async function createMix() {
  const m = state.mix, name = uniqueName(($("#mix-name").value || "").trim() || "My mix"), id = uniqueId(name);
  const p = progressToast(`Making ${name}…`);
  try {
    const lines = [], used = new Set(), sourcesOf = new Map();
    const originals = async tid => {
      if (!sourcesOf.has(tid)) {
        const r = await api("GET", "/api/theme/sources", { id: tid }).catch(() => ({ have: [] }));
        sourcesOf.set(tid, new Set(r.have || []));
      }
      return sourcesOf.get(tid);
    };
    const sections = new Set();
    for (const part of MIX_PARTS) {
      if (part.music) {
        const tid = m.picks.music, info = tid && m.themes.get(tid);
        if (!info) continue;
        lines.push(`settings\t${tid}`);
        if (info.home) lines.push(`file\t${tid}\t${HOME_MUSIC}`);
        for (const slot of info.slots) lines.push(`music\t${tid}\t${slot}`);
        used.add(tid);
        sections.add("music");
        continue;
      }
      if (part.rco) continue;
      for (const e of mixElements(part)) {
        const tid = mixSource(part, e.key), paths = tid && e.themes.get(tid);
        if (!paths) continue;
        const have = await originals(tid);
        for (const path of paths) {
          lines.push(`file\t${tid}\t${path}`);
          if (have.has(path)) lines.push(`source\t${tid}\t${path}`);
          const a = mixAsset(path);
          for (const asp of part.aspects) if (aspectById(asp).filter(a)) sections.add(asp);
        }
        used.add(tid);
      }
    }
    if (m.picks.background) lines.push(`preview\t${m.picks.background}`);

    /* The interface files: each entry from the theme its part or element is taken from. */
    const rcoParts = MIX_PARTS.filter(part => part.rco && (m.picks[part.id] || Object.values(m.elems[part.id] || {}).some(Boolean)));
    const rcoFiles = new Map();
    if (rcoParts.length) {
      const involved = new Set();
      for (const part of rcoParts) {
        if (m.picks[part.id]) involved.add(m.picks[part.id]);
        for (const v of Object.values(m.elems[part.id] || {})) if (v) involved.add(v);
      }
      const paths = new Set([...involved].flatMap(tid => m.themes.get(tid).rco));
      let i = 0;
      for (const path of paths) {
        p.set(`Reading ${baseName(path)}…`, 0.1 + 0.4 * i++ / paths.size);
        const changes = new Map();
        for (const tid of involved) if (m.themes.get(tid).rco.includes(path)) changes.set(tid, await mixRcoChanges(tid, path));
        const kinds = new Map(rcoParts.map(part => [part.rco, part]));
        const merged = rcoMixEntries(await rcoStock(path), changes, (kind, key) => kinds.has(kind) ? mixSource(kinds.get(kind), key) : "", path);
        if (merged.size) {
          rcoFiles.set(path, merged);
          for (const part of rcoParts) {
            const own = [...merged.keys()].some(k => rcoEntryKind((state.rco.get(path).files).find(f => `${f.el}\t${f.attr}` === k)) === part.rco);
            if (own) for (const s of part.sections) sections.add(s);
          }
        }
      }
    }

    p.set(`Copying the parts…`, 0.55);
    await api("POST", "/api/themes/mix", { id, name }, lines.join("\n") + "\n");
    let i = 0;
    for (const [path, merged] of rcoFiles) {
      p.set(`Sending ${baseName(path)} to the console…`, 0.6 + 0.3 * i++ / rcoFiles.size);
      await uploadVerified("/api/theme/file", { id, path }, new Blob([rcoRebuild(await rcoStock(path), merged)]));
    }
    /* The editor's choices: the sections in use, and the background's, the Appearance pieces' and the songs' own. */
    const c = { sections: Object.fromEntries([...sections].map(s => [s, 1])) };
    const choicesOf = async tid => cleanChoices(await api("GET", "/api/theme/choices", { id: tid }).catch(() => ({})));
    if (m.picks.background) {
      const b = await choicesOf(m.picks.background);
      if (b.fit) c.fit = b.fit;
      if (b.bgOff) c.bgOff = b.bgOff;
    }
    if (m.picks.music) { const s = await choicesOf(m.picks.music); if (s.songs) c.songs = s.songs; }
    const appearance = mixPartById("appearance");
    for (const e of mixElements(appearance)) {
      const tid = mixSource(appearance, e.key), paths = tid && e.themes.get(tid);
      if (!paths) continue;
      const pieces = (await choicesOf(tid)).pieces || {};
      for (const path of paths) if (pieces[path]) (c.pieces = c.pieces || {})[path] = pieces[path];
    }
    await putChoices(id, c, true);
    if (rcoFiles.size) await api("POST", "/api/theme/save", { id });
    await refreshStatus();
    const from = [...used, ...rcoParts.flatMap(part => [m.picks[part.id], ...Object.values(m.elems[part.id] || {})])].filter(Boolean);
    p.done(`${name} made from ${plural(new Set(from).size, "theme")}. Open it to check, then apply it.`, "ok");
    state.mix = null;
    location.hash = `#/edit/${encodeURIComponent(id)}`;
  } catch (e) {
    p.done(`Mix and match: ${e.message}`, "err");
  }
}

/* mix:begin */
/* What an entry of an interface file is, as Mix and match sorts them: "picture", "sound", "color", "shape", or ""
   for anything a theme can't change. */
function rcoEntryKind(f) {
  if (!f) return "";
  if (f.elem === "texture" && (f.type === "texture/png" || f.type === "texture/svg")) return "picture";
  if (f.elem === "sounddata" && f.type === "sound/vag" && !/_vibration$/.test(f.id)) return "sound";
  if (f.elem === "file" && f.type === "color") return "color";
  if (f.elem === "file" && f.type === "shape") return "shape";
  return "";
}

/* A mixed interface file's entries: each one changed by any of the themes in `changes` (theme id -> its changed
   entries in this file, "element\tattribute" -> bytes), taken from the theme `sourceOf(kind, key)` names for it
   ("" for the console's own). A picture is chosen whole, with its size variants (key "<path>|<element>"); any other
   entry by itself ("<path>|<element>\t<attribute>"). */
function rcoMixEntries(r, changes, sourceOf, path) {
  const files = new Map(r.files.map(f => [`${f.el}\t${f.attr}`, f]));
  const keys = new Set();
  for (const m of changes.values()) for (const k of m.keys()) keys.add(k);
  const out = new Map();
  for (const k of keys) {
    const f = files.get(k), kind = rcoEntryKind(f);
    if (!kind) continue;
    const src = sourceOf(kind, `${path}|${kind === "picture" ? f.el : k}`), m = src && changes.get(src);
    if (m && m.has(k)) out.set(k, m.get(k));
  }
  return out;
}
/* mix:end */

/* ================================================================ assets & grouping */

async function loadAssets() {
  if (state.assets) return;
  try {
    const r = await api("GET", "/api/assets", { limit: 5000 });
    state.assets = r.assets;
    state.concepts = r.concepts || {};
    state.protectedCount = r.protected || 0;
    state.assetsError = "";
  } catch (e) {
    state.assets = null;
    state.assetsError = e.message;
  }
}

async function loadThemeFiles(id) {
  try {
    const r = await api("GET", "/api/theme/files", { id });
    state.files = new Set(r.files.map(f => f.path));
  } catch (e) { state.files = new Set(); }
  /* Which files have the picture they were made from kept in the theme. */
  await loadOriginals(id);
}

/* Which files have their original kept, whether the theme keeps them, and the space they take. */
async function loadOriginals(id = state.editId) {
  state.sources = new Set();
  state.keepOriginals = true;
  state.originalsBytes = 0;
  try {
    const r = await api("GET", "/api/theme/sources", { id });
    state.sources = new Set(r.have);
    state.keepOriginals = r.keep !== false;
    state.originalsBytes = r.bytes || 0;
  } catch (e) { /* older plugin: none */ }
  const box = $("#originals-field");
  if (box && state.editId === id) box.innerHTML = originalsField();
}

/* The switch for keeping originals, with what is kept. */
function originalsField() {
  const n = state.sources.size;
  const kept = n ? `${plural(n, "original")} kept, ${fmtSize(state.originalsBytes)}. <button class="btn sm ghost" data-act="remove-originals" type="button">Remove them</button>` : "";
  return `<label class="note">
      <input type="checkbox" id="keep-originals"${state.keepOriginals ? " checked" : ""}> Keep original pictures${help("With the original picture kept, the fit or placement of what you attached can be changed later without attaching it again. It takes space on the console: about the size of the picture, for each file it went to (it is sent once). Never applied to the console.")}</label>
    <span class="note">${state.keepOriginals ? "" : "New pictures are not kept: options apply when you attach one. "}${kept}</span>`;
}

/* The picture a see-through texture was made from is kept in the theme, so changing its placement makes the
   texture again from it, without the picture being attached again. */
async function keepSource(path, file, sameAs = null) {
  if (!state.keepOriginals) return;
  if (sameAs) {
    /* the same picture as one just kept for another size: the console links it instead of storing it twice */
    try { await api("PUT", "/api/theme/source", { id: state.editId, path, same_as: sameAs }); state.sources.add(path); return; }
    catch (e) { /* an older plugin, or no link possible: it is sent */ }
  }
  try {
    await uploadVerified("/api/theme/source", { id: state.editId, path }, file);
    state.sources.add(path);
  } catch (e) { state.sources.delete(path); }
}
/* The pictures and textures made from the user's picture: its original is kept, not only the result. */
const keepsOriginal = a => a.kind === "texture" || isImage(a);

/* The kept original of a file, as a File; null when there is none. */
async function sourceFile(path, id = state.editId, onProgress = null) {
  const res = await fetch(`/api/theme/source?${q({ id, path })}`);
  if (!res.ok) { state.sources.delete(path); return null; }
  const bytes = await readBytes(res, onProgress);
  const type = sniffImage(bytes) || "image/png";
  return new File([bytes], `picture.${type.split("/")[1]}`, { type });
}
async function remakeFromSource(path, p = null) {
  const asset = (state.assets || []).find(a => a.path === path);
  if (!asset || !state.sources.has(path)) return false;
  const from = p ? p.frac : 0;
  const file = await sourceFile(path, state.editId, p ? f => p.set("Reading the picture kept in the theme…", from + 0.1 * Math.max(0, f)) : null);
  if (!file) return false;
  await attachTo([asset], file, appearanceName(path), null, true, p);
  return true;
}

/* "How images are fitted" changed: every picture and texture made from a kept original is made again with it. A
   change made while this runs is picked up by one more round. The Appearance pieces have their own placement. */
let refitting = false, refitAgain = false;
async function refitPictures() {
  if (refitting) { refitAgain = true; return; }
  refitting = true;
  const id = state.editId;
  try {
    do {
      refitAgain = false;
      const here = (state.assets || []).filter(a => keepsOriginal(a) && state.files.has(a.path) && !ALPHA_TEXTURE.test(a.path));
      const targets = here.filter(a => state.sources.has(a.path));
      const left = here.length - targets.length;
      const leftNote = left ? ` ${plural(left, "picture")} ${left === 1 ? "has" : "have"} no original kept and ${left === 1 ? "stays" : "stay"} as ${left === 1 ? "it is" : "they are"}.` : "";
      if (!targets.length) { if (left) toast(`The new fit applies to pictures attached from now on.${leftNote}`, "", 7000); break; }
      const p = progressToast(`Fitting ${plural(targets.length, "picture")} again…`);
      let ok = 0;
      const errors = [];
      for (let i = 0; i < targets.length && state.editId === id; i++) {
        const a = targets[i];
        const at = x => (i + x) / targets.length;
        attachProgress = f => p.set(`Fitting ${baseName(a.path)}… ${Math.round(f * 100)}%`, at(0.1 + 0.6 * f));
        try {
          p.set(`Reading the original of ${baseName(a.path)}…`, at(0));
          const file = await sourceFile(a.path, id, f => p.set(`Reading the original of ${baseName(a.path)}…`, at(0.1 * Math.max(0, f))));
          if (!file) throw new Error("its original is gone");
          p.set(`Fitting ${baseName(a.path)}…`, at(0.1));
          const made = await fileForAsset(file, a);
          p.set(`Sending ${baseName(a.path)} to the console…`, at(0.7), at(1));
          await uploadVerified("/api/theme/file", { id, path: a.path }, made);
          textureCache.clear();
          ok++;
        } catch (e) { errors.push(`${baseName(a.path)}: ${e.message}`); }
        p.set(`Fitting pictures again… ${i + 1}/${targets.length}`, (i + 1) / targets.length);
      }
      attachProgress = null;
      stamp = Date.now();
      /* the card's picture follows the background */
      const bg = backgroundFile(targets.map(a => a.path));
      if (bg && !errors.length && state.editId === id) {
        try { const f = await sourceFile(bg, id); if (f) await previewFromFile(id, f, false); } catch (e) { /* the old preview stays */ }
      }
      p.done(errors.length ? `${ok} of ${targets.length} made again. ${errors.slice(0, 2).join("; ")}${leftNote}`
        : `${plural(ok, "picture")} made again with the new fit, from their originals. Apply the theme to use ${ok === 1 ? "it" : "them"}.${leftNote}`,
        errors.length ? "err" : "ok");
      await refreshStatus();
      if (state.editId === id) ASPECTS.forEach(renderAspect);
    } while (refitAgain && state.editId === id);
  } finally { refitting = false; attachProgress = null; }
}

/* A piece attached before the original picture was kept: the picture inside its texture becomes the original, so
   its options work without attaching anything again. What the earlier placement cropped away is not in it. */
async function recoverSource(path, p = null) {
  const res = await fetch(`/api/theme/file?${q({ id: state.editId, path })}&v=${stamp}`);
  if (!res.ok) return false;
  let bytes = await readBytes(res, p ? f => p.set("Reading the picture inside the texture…", 0.1 * Math.max(0, f)) : null);
  if (bytes[0] === 0x28) bytes = unzstdStored(bytes);
  const canvas = await ddsCanvas(bytes, true);
  const blob = await new Promise(done => canvas.toBlob(done, "image/png"));
  if (!blob) return false;
  if (p) p.set("Keeping it as the original…", 0.1, 0.2);
  await keepSource(path, new File([blob], "picture.png", { type: "image/png" }));
  return state.sources.has(path);
}

/* Resolution variants of one asset share a key: size tokens such as @2x,
   _4k, _1080 or a /2160/ folder are ignored, so one file fills them all. */
const SIZE_TOKEN = /(@\d+(?:\.\d+)?x|[_-](?:\d{3,4}p?|[2-8]k|uhd|fhd|qhd|hd|sd|hidpi|retina|small|large|sm|lg|xl|xxl|x[1-4]|[1-4]x))(?=\.[a-z0-9]+$)/i;
const SIZE_DIR = /\/(?:\d{3,4}p?|[2-8]k|uhd|fhd|qhd|hd|sd|x[1-4]|[1-4]x|@\d+x)(?=\/|$)/gi;
function groupKey(path) { return dirName(path).replace(SIZE_DIR, "/*") + "/" + baseName(path).replace(SIZE_TOKEN, ""); }
function groupAssets(list) {
  const map = new Map();
  for (const a of list) {
    const k = groupKey(a.path);
    if (!map.has(k)) map.set(k, { key: k, name: baseName(k), dir: dirName(a.path), assets: [] });
    map.get(k).assets.push(a);
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name) || a.key.localeCompare(b.key));
}

const isImage = a => a.kind === "image" || a.kind === "svg";

/* The console's text fonts by what they draw, not by file name. */
/* The 30th anniversary Appearance themes' artwork (Settings > Appearance and Sound): the Control Center's panels and
   the home screen's artwork, one set per theme. They show only while that theme is selected on the console. */
const APPEARANCE_RE = /^\/system\/vsh_asset\/(control_center|homeui)_(ps\d?)(?:_(top|bottom))?\.dds$/;
const APPEARANCE_THEMES = { ps: "PlayStation", ps2: "PlayStation 2", ps3: "PlayStation 3", ps4: "PlayStation 4" };
function appearanceName(path) {
  const m = APPEARANCE_RE.exec(path);
  if (!m) return baseName(path);
  const part = m[1] === "homeui" ? "Home screen artwork" : m[3] === "top" ? "Control Center, top-right corner" : "Control Center, bottom panel";
  return `${APPEARANCE_THEMES[m[2]] || m[2]}: ${part}`;
}

const FONT_FAMILIES = [
  [/^SSTArabic/i, "Arabic text"], [/^SSTThai/i, "Thai text"], [/^SSTVietnamese/i, "Vietnamese text"],
  [/^SSTTypewriter/i, "Typewriter-style text"], [/^SSTArib/i, "Japanese captions"],
  [/^(SSTJpPro|SCE-RDC|SIE-RDC)/i, "Japanese text"], [/^(YoonGothic|SCEPS4Yoon)/i, "Korean text"],
  [/^DFHEI/i, "Chinese text"], [/^SST/i, "Interface text (Latin)"],
];
/* The fonts the home screen (ShellUI) has in use on firmware 13.42, found by listing the font files the process
   has mapped after its text was drawn: the Light and Bold weights of the Latin, Arabic, Thai, Vietnamese and
   Korean fonts, and the Japanese medium and bold. The Regular and Medium Latin fonts are used by web pages. */
const FONT_HOME = /^(SST|SSTArabic|SSTThai|SSTVietnamese)-(Light|Bold)\.otf$|^SIE-RDC-Pr5N-(M|B)-JPN\.otf$|^SCEPS4Yoongd-(Light|Bold)\.otf$/;
const FONT_LATIN = /^SST-[A-Za-z]+\.otf$/;
const fontRank = a => FONT_HOME.test(baseName(a.path)) ? (FONT_LATIN.test(baseName(a.path)) ? 0 : 1) : 2;
function fontName(path) {
  const f = baseName(path).replace(/\.[^.]+$/, "");
  const fam = FONT_FAMILIES.find(([re]) => re.test(f));
  if (!fam) return baseName(path);
  const weight = /Bold|-Bd$|-B-/i.test(f) ? "bold" : /Light/i.test(f) ? "light" : /Medium|-M-/i.test(f) ? "medium" : /Roman|Regular|-R-/i.test(f) ? "regular" : "";
  const extra = [weight, /Italic/i.test(f) ? "italic" : ""].filter(Boolean).join(" ");
  return extra ? `${fam[1]}, ${extra}` : fam[1];
}

/* A readable name for where an asset is used, from its package folder:
   ".../assets/packages/mini-profile/..." -> "Mini profile". */
const AREA_SKIP = new Set(["src", "assets", "packages", "modules", "node_modules", "lib", "dist", "images", "img", "screens", "components", "res", "resources"]);
function areaOf(path) {
  if (path.startsWith("/system/vsh_asset/")) return /^welcome-hub/i.test(baseName(path)) ? "Welcome tab backgrounds" : "Appearance themes";
  if (path.includes("/vsh_asset/")) {
    const f = baseName(path);
    if (/^bg_hub_default/i.test(f)) return "Home: default background";
    if (/^library_bg/i.test(f)) return "Home: Game Library";
    const t = /^bg_(NPXS\d+)/i.exec(f);
    if (t) return `Home: ${t[1]} tile`;
    if (/^bg_image_load_error/i.test(f)) return "Image load error placeholder";
    return "System (VSH)";
  }
  const m = /\/apps\/([^/]+)\/(?:assets\/)?(.*)$/.exec(path);
  if (!m) return "Other";
  const segs = m[2].split("/").slice(0, -1).filter(x => !AREA_SKIP.has(x) && !x.startsWith("@") && !x.startsWith("."));
  const raw = segs[0] || m[1];
  return raw.replace(/[-_]+/g, " ").replace(/^./, c => c.toUpperCase());
}
/* ================================================================ the editor's choices

   How pictures are fitted, each Appearance piece's placement, which
   background areas and sections are on, and the playlist's song names belong
   to the theme: the plugin keeps them in its choices.json (never applied to
   the console), so they are the same on every device and go with an export.
   What this browser kept for a theme before 1.62 moves there the first time
   the theme is opened here. */

const FITS = ["cover", "contain", "stretch"], PLACES = ["fill", "pad", "fit", "stretch"];

/* Only what the page understands, as the right types: choices.json can come from an imported zip. */
function cleanChoices(c) {
  const out = {};
  if (!c || typeof c !== "object" || Array.isArray(c)) return out;
  if (FITS.includes(c.fit)) out.fit = c.fit;
  if (c.sections && typeof c.sections === "object") {
    for (const a of ASPECTS) if (c.sections[a.id]) (out.sections = out.sections || {})[a.id] = 1;
  }

  try { const off = localGet(`bg-off:${id}`); if (off) c.bgOff = JSON.parse(off); } catch (e) { /* none */ }

   tables, an element tree whose type-8 attributes point into the file table

    const [base, size] = t[tab];

    let e = base + o;
    while (e < base + size && b[e]) e++;

  for (let at = 0, el = 0; at < treeSize; el++) {

    const nattr = u32(treeOff + at + 4);
    if (nattr > (treeSize - at - 28) / 16) throw new Error("damaged resource file");
    const elem = str(3, u32(treeOff + at));

  { key: "hints", shared: true, help: "The background of the button hints at the bottom right of the Welcome hub (Utilities, Edit Widgets).", label: "Button hints", hint: "behind Utilities and Edit Widgets", names: ["key-guide.overlay.fill.enabled"] },

/* A copy with some files replaced: `replace` maps "element\tattribute" to
   new bytes. Files keep their order, 16-byte aligned, and files the console
   shares between entries stay shared. */
function rcoRebuild(r, replace) {
  const own = f => `${f.el}\t${f.attr}`;
  const keyOf = f => replace.has(own(f)) ? own(f) : `${f.off}:${f.size}`;
  const where = new Map(), parts = [];

  for (const f of [...r.files].sort((x, y) => x.off - y.off || x.size - y.size)) {

    if (where.has(k)) continue;
    const data = replace.get(own(f)) || rcoData(r, f);
    pad();

    parts.push(data);

  for (const f of r.files) {
    const [o, size] = where.get(keyOf(f));
    dv.setUint32(f.slot, o, true);
    dv.setUint32(f.slot + 4, size, true);
  }
  dv.setUint32(12 + 8 * RCO_FILE_TABLE, len, true);
  let at = r.fileOff;
  for (const p of parts) { out.set(p, at); at += p.length; }

/* A number drawn as seven-segment digits in a box, as rectangles (no fonts

const SEGMENTS = ["abcdef", "bc", "abdeg", "abcdg", "bcfg", "acdfg", "acdefg", "abc", "abcdefg", "abcdfg"];
function numberRects(n, w, h) {
  let digits = String(n);
  if (digits.length > 1 && digits.length % 2) digits = "0" + digits;
  const rows = [];
  for (let i = 0; i < digits.length; i += 2) rows.push(digits.slice(i, i + 2));
  const m = Math.min(w, h) * 0.08, cols = Math.max(...rows.map(x => x.length));
  const cw = (w - 2 * m) / cols, ch = (h - 2 * m) / rows.length, out = [];
  rows.forEach((row, ri) => [...row].forEach((d, ci) => {
    const dw = cw * 0.72, dh = ch * 0.84, t = Math.max(Math.min(dw, dh) * 0.2, 1);
    const x = m + ci * cw + (cw - dw) / 2, y = m + ri * ch + (ch - dh) / 2;
    const seg = { a: [x, y, dw, t], d: [x, y + dh - t, dw, t], g: [x, y + (dh - t) / 2, dw, t],
                  f: [x, y, t, dh / 2], b: [x + dw - t, y, t, dh / 2], e: [x, y + dh / 2, t, dh / 2], c: [x + dw - t, y + dh / 2, t, dh / 2] };
    for (const s of SEGMENTS[+d]) out.push(seg[s]);

/* A numbered SVG made from the console's own: its beginning up to and

function numberSvg(n, stockText) {

  const [x0, y0, w, h] = svgBox(stockText.slice(stockText.lastIndexOf("<svg", end), end)), fx = v => +v.toFixed(2);
  const rects = numberRects(n, w, h).map(([x, y, rw, rh]) =>
    `<rect x="${fx(x0 + x)}" y="${fx(y0 + y)}" width="${fx(rw)}" height="${fx(rh)}" fill="#ffffff"/>`).join("");
  const close = stockText.lastIndexOf("</svg>");
  return stockText.slice(0, end) + `<rect x="${fx(x0)}" y="${fx(y0)}" width="${fx(w)}" height="${fx(h)}" fill="#ff00ff"/>` +

/* `chans` (-1..1, at the console's sound's sample rate) as a new sound in the console's layout: its header with
   the new length, its opening frames, the new frames, its closing frames. Each frame takes the predictor (0-4)
   and shift that come closest. Decoded again, the sound must give exactly the samples the encoder meant, and
   be laid out as the console's (vagLayoutProblem). */

  out.set(stock.subarray(stock.length - v.group), VAG_HEADER + size - v.group); /* closing frames */

  let signal = 0, noise = 0;
  for (let c = 0; c < v.channels; c++) {
    const want = new Int16Array(groups * VAG_SAMPLES);   /* the opening and closing frames play silence */
    let h1 = 0, h2 = 0;
    for (let fr = 0; fr < frames; fr++) {
      for (let i = 0; i < VAG_SAMPLES; i++) {
        const t = fr * VAG_SAMPLES + i;

      }

      out[o] = (bf << 4) | bs;                  /* predictors 0-4: the high bits in the next byte stay 0 */
      out[o + 1] = fr === frames - 1 ? 1 : 0;   /* each channel's last sound frame is flagged 1 */
      for (let i = 0; i < VAG_SAMPLES; i++) {
        const k = bestQ[i];
        out[o + 2 + (i >> 1)] |= (k & 15) << (i & 1 ? 4 : 0);
        const s = k * step + h1 * c0 + h2 * c1;
        const y = Math.max(-32768, Math.min(32767, Math.round(s)));

    for (let i = 0; i < got[c].length; i++) if (got[c][i] !== meant[c][i]) throw new Error("the converted sound did not verify");
  }

  if (signal / (n * v.channels) > 10 && snr < 6) throw new Error("the converted sound did not verify");
  return { bytes: out, samples: n, snr };

/* The loudness of the loud part of a sound: the RMS of its 10 ms windows within 30 dB of the loudest. */
function loudRms(chans, rate) {
  const n = Math.min(...chans.map(c => c.length)), w = Math.max(1, Math.round(rate * 0.01)), powers = [];
  for (let s = 0; s < n; s += w) {
    let sum = 0, m = 0;
    for (const c of chans) for (let i = s; i < Math.min(n, s + w); i++) { sum += c[i] * c[i]; m++; }
    powers.push(sum / Math.max(m, 1));

  const top = Math.max(0, ...powers), loud = powers.filter(p => p >= top / 1000);
  return top > 0 ? Math.sqrt(loud.reduce((a, b) => a + b, 0) / loud.length) : 0;

/* Where a sound gets loud: the start of its first 5 ms within 15 dB of its loudest 5 ms. Sony's own get there
   within 5-35 ms (moving, selecting, going back) and nearly all within 85 ms. */
function uiSoundHit(chans, rate) {
  const n = Math.min(...chans.map(c => c.length)), w = Math.max(1, Math.round(rate * 0.005)), p = [];
  for (let s = 0; s < n; s += w) {

    for (const c of chans) for (let i = s; i < Math.min(n, s + w); i++) { e += c[i] * c[i]; m++; }
    p.push(e / Math.max(m, 1));

  return top > 0 ? p.findIndex(v => v >= top / 10 ** 1.5) * w : 0;
}
const UI_SOUND_LEAD = 0.01;   /* seconds kept before a sound's hit, faded in */

/* Your audio for an interface sound: the silence before and after it trimmed, and anything quieter before its hit
   down to the last 10 ms (faded in), so it plays the moment you press as the console's do; no longer than `max`
   samples (cut with a short fade); as loud as the console's sound (`target`, by their loud parts), with a soft
   limit just below full scale. `lead`: the seconds of quieter sound cut before the hit. */
function uiSoundPrepare(chans, rate, target, max) {
  const n = Math.min(...chans.map(c => c.length)), quiet = 0.001;
  const heard = i => chans.some(c => Math.abs(c[i]) > quiet);
  let a = 0, z = n;
  while (a < n && !heard(a)) a++;
  while (z > a && !heard(z - 1)) z--;
  if (a >= z) throw new Error("the sound is silent");
  a = Math.max(0, a - Math.round(rate * 0.001));
  z = Math.min(n, z + Math.round(rate * 0.005));
  const hit = a + uiSoundHit(chans.map(c => c.subarray(a, z)), rate);
  const from = Math.max(a, hit - Math.round(rate * UI_SOUND_LEAD)), lead = from - a;
  a = from;
  const rise = lead > 0 ? hit - from : 0;   /* the part kept before the hit fades in, when quieter sound was cut */
  const cut = z - a > max, len = Math.min(z - a, max);

  const out = chans.map(c => {
    const o = c.slice(a, a + len);
    for (let i = 0; i < Math.min(rise, len); i++) o[i] *= i / rise;
    for (let i = 0; i < fade; i++) o[len - fade + i] *= 1 - (i + 1) / fade;

async function zlibDeflate(data) {
  if (typeof CompressionStream === "undefined") return zlibStored(data);
  const stream = new Blob([data]).stream().pipeThrough(new CompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* The console's own resource files, read once per page (they are large, up to 40 MB). Parts of the page waiting
   for the same file share one download, and its loading markers follow it. */
const rcoReading = new Map();
function rcoStock(path) {
  state.rco = state.rco || new Map();
  if (state.rco.has(path)) return Promise.resolve(state.rco.get(path));
  if (!rcoReading.has(path)) {
    const key = `stock:${path}`;
    rcoReading.set(path, (async () => {
      loadProgress(key, 0);
      let res;
      try { res = await fetch(`/api/asset?${q({ path })}`); } catch (e) { throw new Error("the console could not be reached"); }
      if (!res.ok) throw new Error(`cannot read ${baseName(path)} from the console`);
      const bytes = await readBytes(res, f => loadProgress(key, f));
      let parsed = null;
      try { parsed = rcoParse(bytes); } catch (e) { /* another kind of .rco: left out */ }
      state.rco.set(path, parsed);
      return parsed;
    })().catch(e => { loads.delete(key); throw e; }).finally(() => rcoReading.delete(path)));
  }
  return rcoReading.get(path);
}

/* The interface file that holds the colour palettes and the shape list (on 13.42), read before the others: the
   colours and the shapes show as soon as it is in, and the other files are read for them only if it has none. */
const RCO_MAIN = "Sce.PlayStation.PUI_UI3.rco";
function rcoPaths() {
  return aspectAssets(aspectById("interface")).map(a => a.path)
    .sort((a, b) => (baseName(b) === RCO_MAIN) - (baseName(a) === RCO_MAIN) || a.localeCompare(b));
}

/* Read every resource file once, then show the section with what each holds (files of another kind are left
   out). A file that could not be read says so on its row, with Try again; it is not taken for another kind. */
let rcoLoading = null;
const rcoFailed = new Map();   /* path -> why it could not be read */
function rcoEnsureLoaded() {
  const paths = rcoPaths();
  if (rcoLoading || paths.every(p => (state.rco && state.rco.has(p)) || rcoFailed.has(p))) return;
  rcoLoading = (async () => {
    for (const p of paths) {
      if (rcoFailed.has(p)) continue;
      await rcoStock(p).catch(e => rcoFailed.set(p, e.message));
    }
  })().finally(() => { rcoLoading = null; renderAspect(aspectById("interface")); });
}
function rcoRetry() {
  rcoFailed.clear();
  renderAspect(aspectById("interface"));
  if (aspectOn(aspectById("appearance"))) renderAspect(aspectById("appearance"));
}

/* Every picture in every resource file, numbered from 1 in a fixed order
   (files by name, pictures in file order): the key to the numbered test. */
async function rcoKey(onFile) {
  const paths = aspectAssets(aspectById("interface")).map(a => a.path).sort();
  const key = [];
  for (let i = 0; i < paths.length; i++) {
    if (onFile) onFile(i, paths.length, paths[i]);
    const r = await rcoStock(paths[i]);
    if (r) for (const pic of rcoPictures(r)) key.push({ n: key.length + 1, path: paths[i], r, pic });
  }
  return key;
}

/* Number the pictures of one resource file (`vectorOnly`: only its SVG
   icons). The numbers come from the key, so they are the same whichever
   file is numbered first. */
function numberPictures(path, vectorOnly) { return rcoQueued("Numbering the pictures", () => numberPicturesNow(path, vectorOnly), true); }
async function numberPicturesNow(path, vectorOnly) {
  const p = progressToast("Reading the console's interface files…");
  try {
    const key = (await rcoKey((i, n, x) => p.set(`Reading ${baseName(x)}…`, i / n * 0.3))).filter(k => k.path === path);
    if (!key.length) throw new Error("this file has no pictures");
    /* Numbering replaces the theme's pictures in the file, but keeps its shapes. */
    const sh = rcoShapes(key[0].r), shapes = sh && (await rcoChanges(path)).get(`${sh.f.el}\t${sh.f.attr}`);
    const replace = new Map(shapes ? [[`${sh.f.el}\t${sh.f.attr}`, shapes]] : []);
    let done = 0, skipped = 0;
    for (const k of key) {
      if (vectorOnly && k.pic.kind !== "svg") continue;
      let ok = false;
      for (const f of k.pic.files) {
        let bytes = null;
        if (f.kind === "png") bytes = await numberPicture(k.n, rcoData(k.r, f), zlibDeflate);
        else if (f.kind === "svg") {
          const text = numberSvg(k.n, new TextDecoder().decode(rcoData(k.r, f)));
          bytes = text === null ? null : new TextEncoder().encode(text);
        }
        if (bytes) { replace.set(`${f.el}\t${f.attr}`, bytes); ok = true; }
      }
      if (ok) done++; else skipped++;
      if ((done + skipped) % 50 === 0) p.set(`Numbering pictures… ${done + skipped} of ${key.length}`, 0.3 + 0.4 * (done + skipped) / key.length);
    }
    p.set(`Sending ${baseName(path)} to the console…`, 0.75);
    await uploadVerified("/api/theme/file", { id: state.editId, path }, new Blob([rcoRebuild(key[0].r, replace)]));
    state.files.add(path);
    stamp = Date.now();
    p.done(`${plural(done, "picture")} numbered in ${baseName(path)} and verified${skipped ? ` (${skipped} left as they are, in a format this page can't write)` : ""}. ` +
      "Apply the theme, then put the console in rest mode and wake it.", "ok");
  } catch (e) {
    p.done(`Numbering failed: ${e.message}`, "err");
  }
  await refreshStatus();
  renderAspect(aspectById("interface"));
}

/* Your image as RGBA pixels at w x h (fitted as chosen above the sections),
   transparent where it doesn't reach. */
async function imageRgba(file, w, h) {
  const url = URL.createObjectURL(file);
  let img;
  try { img = await loadImage(url); } finally { URL.revokeObjectURL(url); }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d", { colorSpace: "srgb", willReadFrequently: true });
  g.imageSmoothingQuality = "high";
  let dw = w, dh = h;
  if (state.fit !== "stretch") {
    const sc = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);
    dw = img.naturalWidth * sc; dh = img.naturalHeight * sc;
  }
  g.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  return new Uint8Array(g.getImageData(0, 0, w, h).data.buffer);
}

/* Your image for one console picture, in exactly its format: a PNG written
   like the console's (pngFormat), or the console's SVG with your image in
   it as a PNG at twice the SVG's size (at most 512 pixels). */
async function pictureFromImage(file, stock, kind) {
  if (kind === "png") {
    const f = pngFormat(stock);
    if (!f || !f.writable) throw new Error("this picture's format can't be written");
    return encodePng(await imageRgba(file, f.w, f.h), f, zlibDeflate);
  }
  const text = new TextDecoder().decode(stock), end = svgRootEnd(text);
  if (!end) throw new Error("this picture can't be replaced");
  const [, , vw, vh] = svgBox(text.slice(text.lastIndexOf("<svg", end), end));
  const scale = Math.min(512 / Math.max(vw, vh), 2 * Math.max(1, 128 / Math.max(vw, vh)));
  const w = Math.max(1, Math.round(vw * scale)), h = Math.max(1, Math.round(vh * scale));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(await imageRgba(file, w, h)), w, h), 0, 0);
  return new TextEncoder().encode(svgWithImage(text, c.toDataURL("image/png")));
}

/* The theme's changes to a resource file: entry ("element\tattribute") ->
   bytes, for every embedded picture that differs from the console's. */
/* The theme's copy of each resource file, parsed: one per file (a resource file is up to 40 MB; keeping one per
   change would fill the browser's memory, the console's own browser first). */
const rcoThemeCache = new Map();
function rcoThemeCacheSet(key, value) {
  const file = key.slice(0, key.lastIndexOf("|") + 1);
  for (const k of [...rcoThemeCache.keys()]) if (k.slice(0, k.lastIndexOf("|") + 1) === file) rcoThemeCache.delete(k);
  rcoThemeCache.set(key, value);
}
/* Whether the theme's copy of a file is at hand (rcoChanges then needs no download). */
const rcoThemeReady = path => !state.files.has(path) || rcoThemeCache.has(`${state.editId}|${path}|${stamp}`);
const rcoThemeReading = new Map();
async function rcoChanges(path) {
  const r = await rcoStock(path), out = new Map();
  if (!r || !state.files.has(path)) return out;
  const cacheKey = `${state.editId}|${path}|${stamp}`;
  let t;
  if (rcoThemeCache.has(cacheKey)) t = rcoThemeCache.get(cacheKey);
  else {
    if (!rcoThemeReading.has(cacheKey)) {
      const key = `theme:${path}`, url = `/api/theme/file?${q({ id: state.editId, path })}&v=${stamp}`;
      rcoThemeReading.set(cacheKey, (async () => {
        loadProgress(key, 0);
        let res;
        try { res = await fetch(url); } catch (e) { throw new Error("the console could not be reached"); }
        const parsed = res.ok ? rcoParse(await readBytes(res, f => loadProgress(key, f))) : null;
        rcoThemeCacheSet(cacheKey, parsed);
        return parsed;
      })().finally(() => rcoThemeReading.delete(cacheKey)));

    t = await rcoThemeReading.get(cacheKey);

async function rcoSave(path, changes) {
  let made = null;
  if (!changes.size) await resetAssets([{ path }]);
  else {
    made = rcoRebuild(await rcoStock(path), changes);
    await uploadVerified("/api/theme/file", { id: state.editId, path }, new Blob([made]));
    state.files.add(path);
  }
  stamp = Date.now();
  /* the file just sent is the theme's now: the next change starts from it without fetching it again */
  if (made) rcoThemeCacheSet(`${state.editId}|${path}|${stamp}`, rcoParse(made));
  await refreshStatus();
}

   change started meanwhile would otherwise start from the old file and undo the other when it is sent). */
let rcoWork = Promise.resolve(), rcoWaiting = 0;
function rcoQueued(label, fn, ownProgress = false) {
  const waiting = rcoWaiting++ > 0;
  const p = waiting || !ownProgress ? progressToast(waiting ? `${label}: waiting for the change before it…` : `${label}…`) : null;
  const run = rcoWork.then(async () => {
    if (p && ownProgress) { p.done("", ""); }
    else if (p) p.set(`${label}…`, 0.3);
    try { return await fn(); } finally { rcoWaiting--; if (p && !ownProgress) p.done("", ""); }
  });
  rcoWork = run.catch(() => {});
  return run;
}

function replacePicture(path, el, file) { return rcoQueued("Adding your picture", () => replacePictureNow(path, el, file), true); }
async function replacePictureNow(path, el, file) {
  const r = await rcoStock(path), pic = rcoPictures(r).find(p => p.el === el);
  if (!pic) return;

  try {
    const changes = await rcoChanges(path);
    for (const f of pic.files) {

  } catch (e) {

  agent_wake_up: "A voice command listening", agent_utterance_received: "A voice command heard", agent_no_results: "A voice command not understood",
  purchase_universal_checkout: "A purchase", open_discover_tour: "Opening the tour", psvr2_setup_section_finish: "A PS VR2 setup step done",
  psvr2_room_scale_finish: "The PS VR2 play area done", set_pad_orientation_1: "Controller orientation (1)",
  set_pad_orientation_2: "Controller orientation (2)", undefined: "A sound without its own",
};
/* The interface's sounds by where you hear them. The first three groups are open from the start (they hold the sounds
   people change most: moving, selecting, going back, L1/R1 — snd_change_space, heard on 13.42 — the Control Center,
   the Options button and screenshots); the others fold away, and one holding a replaced sound opens. A sound in no
   group goes to Other. */
const UI_SOUND_GROUPS = [
  { id: "move", title: "Moving around", open: true, ids: ["focus_move", "enter", "cancel", "cannot_move_focus", "open_home"] },
  { id: "tabs", title: "Tabs and panels", open: true, ids: ["change_space", "change_panel", "change_panel2"] },
  { id: "menus", title: "Control Center, options and screenshots", open: true,
    ids: ["open_control_center", "close_control_center", "open_option_menu", "close_option_menu", "take_screenshot"] },
  { id: "dialogs", title: "Dialogs and errors", ids: ["open_dialog", "open_error_dialog", "yes_in_dialog", "no_in_dialog", "neutral_in_dialog", "error"] },
  { id: "controls", title: "Switches, boxes and sliders", ids: ["switch_on", "switch_off", "checkbox_on", "checkbox_off", "slider_level_meter"] },
  { id: "toasts", title: "Notifications and trophies",
    ids: ["informative_toasts_something_to_read", "interactive_toasts_something_to_do", "error_toasts_something_is_broken", "trophy_toast", "platinum_trophy_toast"] },
  { id: "keyboard", title: "Keyboard and voice",
    ids: ["open_osk", "text_input", "focus_move_in_keyboard", "backspace", "error_in_text_box", "voice_recognition_for_osk_starts",
      "voice_recognition_for_osk_ends", "voice_recognition_for_osk_error", "agent_wake_up", "agent_utterance_received", "agent_no_results"] },
  { id: "account", title: "Parties, sign-in and purchases", ids: ["join_party", "leave_party", "log_out", "pass_code", "face_recognition", "purchase_universal_checkout"] },
  { id: "setup", title: "Set-up, controller and PS VR2", ids: ["open_discover_tour", "psvr2_setup_section_finish", "psvr2_room_scale_finish", "set_pad_orientation_1", "set_pad_orientation_2"] },
];
const uiSoundGroup = s => /^stick_sensitivity_/.test(s.key) ? "setup" : (UI_SOUND_GROUPS.find(g => g.ids.includes(s.key)) || { id: "other" }).id;
const UI_SOUND_SETS = { "": "Default", 1: "PlayStation", 2: "PlayStation 2", 3: "PlayStation 3", 4: "PlayStation 4" };

/* The interface's sounds (default ones, then each Appearance theme's: snd_2_focus_move is the PlayStation 2
   theme's), in the order above. The controller's vibration patterns (ids ending in _vibration) are left out:
   they stay the console's. */
function uiSounds(r) {
  const order = Object.keys(UI_SOUND_NAMES), out = [];
  for (const f of r.files) {
    if (f.elem !== "sounddata" || f.type !== "sound/vag" || /_vibration$/.test(f.id)) continue;
    const m = /^snd_(?:([1-4])_)?(.+)$/.exec(f.id);
    if (!m) continue;
    const set = m[1] || "", key = m[2], stick = /^stick_sensitivity_(\d+)$/.exec(key);
    const name = stick ? `Stick sensitivity (${+stick[1]})` : UI_SOUND_NAMES[key] || key.replace(/_/g, " ");
    const rank = order.includes(key) ? order.indexOf(key) : order.length + (stick ? +stick[1] : 100);
    out.push({ f, id: f.id, set, key, name, rank, label: set ? `${name} (${UI_SOUND_SETS[set]} theme)` : name });
  }
  return out.sort((a, b) => (a.set || "0").localeCompare(b.set || "0") || a.rank - b.rank || a.id.localeCompare(b.id));
}

/* The resource file that holds the sounds (Sce.PlayStation.PUI_UI3.rco on 13.42, read first) and its parse. */
async function uiSoundFile(onWait) {
  for (const path of rcoPaths()) {
    if (rcoFailed.has(path)) throw new Error(rcoFailed.get(path));
    if (onWait && !(state.rco && state.rco.has(path))) onWait(path);
    const r = await rcoStock(path);
    if (r && uiSounds(r).length) return { path, r };
  }
  return null;
}

const UI_SOUND_LATE = 0.05;   /* a theme's sound that gets loud later than this is offered Start at the hit */
let uiSoundsLast = null;   /* the list as last shown, and for which theme: shown again at once when the section is redrawn */
function uiSoundsBox() {
  if (uiSoundsLast && uiSoundsLast.id === state.editId) return uiSoundsLast.html;
  const first = rcoPaths()[0];
  return first ? loadingMarker(`stock:${first}`, "Reading the interface sounds…", colorsWaitNote(first)) : "";
}
async function uiSoundsShow() {
  const box = $("#ui-sounds");
  if (!box) return;
  const id = state.editId, shown = uiSoundsLast && uiSoundsLast.id === id;
  const wait = (key, label, path) => {
    if (!box.isConnected || shown) return;
    box.innerHTML = loadingMarker(key, label, colorsWaitNote(path));
    paintLoads(box);
  };
  let html = "", replaced = 0;
  try {
    const found = await uiSoundFile(path => wait(`stock:${path}`, "Reading the interface sounds…", path));
    if (found) {
      const { path, r } = found;
      if (!rcoThemeReady(path)) wait(`theme:${path}`, "Reading this theme's sounds…", path);
      const changes = await rcoChanges(path), list = uiSounds(r);
      const mineOf = s => changes.has(`${s.f.el}\t${s.f.attr}`);
      const length = s => { try { const d = rcoData(r, s.f); return `${(vagMaxSamples(d) / vagInfo(d).rate).toFixed(2)} s`; } catch (e) { return ""; } };
      /* When the theme's sound gets loud, if later than UI_SOUND_LATE (heard as a delay after pressing) */
      const late = s => {
        try { const d = vagDecode(changes.get(`${s.f.el}\t${s.f.attr}`)), t = uiSoundHit(d.chans, d.rate) / d.rate; return t > UI_SOUND_LATE ? t : 0; }
        catch (e) { return 0; }
      };
      const row = s => {
        const mine = mineOf(s), at = `data-path="${esc(path)}" data-id="${esc(s.id)}"`, wait = mine ? late(s) : 0;
        return `<div class="row-item${mine ? " replaced" : ""}">
          <div class="info"><div class="file">${esc(s.name)}${mine ? ` <span class="tag on">Replaced</span>` : ""}</div>
            <div class="dir">${esc(s.id)} · ${length(s)}${wait ? ` · yours gets loud ${wait.toFixed(2)} s after you press` : ""}</div></div>
          <div class="acts"><button class="btn sm ghost" data-act="uisnd-play" ${at}>Play</button>
            ${mine ? `<button class="btn sm ghost" data-act="uisnd-play" ${at} data-mine="1">Play yours</button>` : ""}
            ${wait ? `<button class="btn sm" data-act="uisnd-hit" ${at} title="Cut the quieter sound before its hit (keeping the last 10 ms, faded in), so it plays the moment you press">Start at the hit</button>` : ""}
            <button class="btn sm" data-act="uisnd-pick" ${at}>${mine ? "Replace" : "Attach"}</button>
            ${mine ? `<button class="btn sm ghost danger" data-act="uisnd-reset" ${at}>Reset</button>` : ""}</div></div>`;
      };
      const defaults = list.filter(s => !s.set);
      const sets = Object.keys(UI_SOUND_SETS).filter(k => k && list.some(s => s.set === k));
      /* A group as a fold: its name, how many sounds and how many replaced; open as it was left, or when it is one
         of the first three or holds a replaced sound. */
      const opened = state.uiSoundOpen || (state.uiSoundOpen = {});
      const fold = (key, title, items, first) => {
        if (!items.length) return "";
        const mine = items.filter(mineOf).length;
        const open = key in opened ? opened[key] : first || mine > 0;
        return `<details class="fold" data-sound-group="${esc(key)}"${open ? " open" : ""}>
          <summary><span class="fold-title">${esc(title)}</span><span class="fold-count">${plural(items.length, "sound")}${mine ? ` · ${mine} replaced` : ""}</span></summary>
          <div class="rows">${items.map(row).join("")}</div></details>`;
      };
      const groups = [...UI_SOUND_GROUPS, { id: "other", title: "Other" }]
        .map(g => fold(g.id, g.title, defaults.filter(x => uiSoundGroup(x) === g.id), !!g.open)).join("");
      replaced = list.filter(mineOf).length;
      html = `<h3 class="sub-head">Interface sounds</h3>
        <p class="note">The sounds of moving between items, selecting, going back and the rest${replaced ? ` (${replaced} replaced)` : ""}. Apply, then use rest mode.${help(`Any audio file, converted on this device to the console's own sound format, as loud as the sound it replaces and no longer: a longer one is cut with a short fade (moving between items is 0.41 s on 13.42). It starts at its hit, as the console's do: silence and quieter sound before it are cut (the last 10 ms kept, faded in), so it plays the moment you press. The PlayStation to PlayStation 4 sounds are the Appearance themes' own (Settings > Appearance and Sound). The controller's vibration patterns stay the console's. The sounds are kept in the interface's resource file (${baseName(path)}), so Interface icons shows that file as changed too.`)}</p>
        <div class="folds">${groups}
        ${sets.map(k => fold(`set${k}`, `${UI_SOUND_SETS[k]} look (Appearance themes)`, list.filter(s => s.set === k), false)).join("")}</div>`;
    }
  } catch (e) {
    html = `<p class="note">The interface sounds could not be read: ${esc(e.message)} <button class="btn sm" data-act="uisnd-retry">Try again</button></p>`;
  }
  if (state.editId !== id) return;
  const before = uiSoundsLast && uiSoundsLast.id === id ? uiSoundsLast.replaced : 0;
  uiSoundsLast = { id, html, replaced };
  if (replaced !== before) return renderAspect(aspectById("sounds"));   /* the section's count too; shown from uiSoundsLast */
  if (box.isConnected) box.innerHTML = html;
}

/* Play the console's sound, or this theme's (`mine`), decoded on this device. */
let uiSoundAudio = null;
async function playUiSound(path, id, mine) {
  const r = await rcoStock(path), s = r && uiSounds(r).find(x => x.id === id);
  if (!s) return;
  try {
    const bytes = mine ? (await rcoChanges(path)).get(`${s.f.el}\t${s.f.attr}`) : rcoData(r, s.f);
    if (!bytes) return;
    const d = vagDecode(bytes);
    if (uiSoundAudio) { uiSoundAudio.pause(); URL.revokeObjectURL(uiSoundAudio.src); }
    uiSoundAudio = new Audio(URL.createObjectURL(pcmWav(d.chans, d.rate)));
    await uiSoundAudio.play();
  } catch (e) { toast(`${s.label}: ${e.message}`, "err"); }
}

function replaceUiSound(path, id, file) { return rcoQueued("Adding your sound", () => replaceUiSoundNow(path, id, file), true); }
async function replaceUiSoundNow(path, id, file) {
  const r = await rcoStock(path), s = r && uiSounds(r).find(x => x.id === id);
  if (!s) return;
  const p = progressToast(`Converting your sound for ${s.label.toLowerCase()}…`);
  try {
    const stock = rcoData(r, s.f), info = vagInfo(stock);
    const chans = await decodeAudio(file, info.rate, info.channels);
    const prep = uiSoundPrepare(chans, info.rate, vagDecode(stock).chans, vagMaxSamples(stock));
    const made = vagEncode(stock, prep.chans);
    const changes = await rcoChanges(path);
    changes.set(`${s.f.el}\t${s.f.attr}`, made.bytes);
    p.set(`Sending ${baseName(path)} to the console…`, 0.6);
    await rcoSave(path, changes);
    const notes = [prep.lead >= 0.02 ? `starting at its hit: ${prep.lead.toFixed(2)} s of quieter sound before it cut` : "",
                   prep.cut ? `cut to ${prep.seconds.toFixed(2)} s, the console's length` : ""].filter(Boolean);
    p.done(`${s.label}: replaced and verified${notes.length ? ` (${notes.join("; ")})` : ""}. Apply the theme, then put the console in rest mode and wake it.`, "ok");
  } catch (e) {
    p.done(`${s.label}: ${e.message}`, "err");
  }
  renderAspect(aspectById("sounds"));
}

/* A theme's sound made earlier, started at its hit: decoded, trimmed as a new one is, written again. */
function startUiSoundAtHit(path, id) { return rcoQueued("Starting the sound at its hit", () => startUiSoundAtHitNow(path, id), true); }
async function startUiSoundAtHitNow(path, id) {
  const r = await rcoStock(path), s = r && uiSounds(r).find(x => x.id === id);
  if (!s) return;
  const p = progressToast(`Starting ${s.label.toLowerCase()} at its hit…`);
  try {
    const stock = rcoData(r, s.f), changes = await rcoChanges(path), key = `${s.f.el}\t${s.f.attr}`, mine = changes.get(key);
    if (!mine) throw new Error("the theme has the console's own sound here");
    const d = vagDecode(mine), prep = uiSoundPrepare(d.chans, d.rate, vagDecode(stock).chans, vagMaxSamples(stock));
    changes.set(key, vagEncode(stock, prep.chans).bytes);
    p.set(`Sending ${baseName(path)} to the console…`, 0.6);
    await rcoSave(path, changes);
    p.done(`${s.label}: now starts at its hit (${prep.lead.toFixed(2)} s of quieter sound before it cut). Apply the theme, then put the console in rest mode and wake it.`, "ok");
  } catch (e) {
    p.done(`${s.label}: ${e.message}`, "err");
  }
  renderAspect(aspectById("sounds"));
}

function resetUiSound(path, id) { return rcoQueued("Putting the console's sound back", () => resetUiSoundNow(path, id)); }
async function resetUiSoundNow(path, id) {
  const r = await rcoStock(path), s = r && uiSounds(r).find(x => x.id === id);
  if (!s) return;
  const changes = await rcoChanges(path);
  changes.delete(`${s.f.el}\t${s.f.attr}`);
  try { await rcoSave(path, changes); toast(`${s.label} is back to the console's own.`, "ok"); }
  catch (e) { toast(e.message, "err"); }
  renderAspect(aspectById("sounds"));
}

/* ---------------------------------------------------------------- home screen tiles */

/* The console's own tiles: title ID -> their icon files, with names from
   each app's param.json (read once). */
function tileGroups() {
  const groups = new Map();
  for (const a of aspectAssets(aspectById("tiles"))) {
    const t = tileTitle(a.path);
    if (!groups.has(t)) groups.set(t, { title: t, icons: [] });
    groups.get(t).icons.push(a);
  }
  const bgs = new Map((state.assets || []).filter(a => /\/vsh_asset\/bg_NPXS\d+\.dds(\.zst)?$/.test(a.path))
    .map(a => [/bg_(NPXS\d+)/.exec(a.path)[1], a]));
  return [...groups.values()].sort((a, b) => a.title.localeCompare(b.title))
    .map((g, i) => ({ ...g, n: i + 1, bg: bgs.get(g.title) || null }));
}

let tileNamesLoading = null;
function tileNamesEnsure() {
  state.tileNames = state.tileNames || new Map();
  const missing = tileGroups().filter(g => !state.tileNames.has(g.title));
  if (!missing.length || tileNamesLoading) return;
  tileNamesLoading = (async () => {
    for (const g of missing) {
      let name = "";
      for (const a of g.icons) {
        try {
          const res = await fetch(`/api/asset?${q({ path: a.path.replace(/icon0\.png$/, "param.json") })}`);
          if (!res.ok) continue;
          const pj = await res.json(), loc = pj.localizedParameters || {};
          const own = loc[loc.defaultLanguage] || loc["en-US"] || Object.values(loc).find(v => v && v.titleName) || {};
          name = own.titleName || "";
          if (name) break;
        } catch (e) { /* no param.json beside this copy */ }
      }
      state.tileNames.set(g.title, name);
    }
  })().finally(() => { tileNamesLoading = null; renderAspect(aspectById("tiles")); renderAspect(aspectById("background")); });
}

/* A tile's icon from your image (or its number, for the test), each copy in
   exactly the format of the console's. */
async function tileIconFiles(g, make) {
  for (const a of g.icons) {
    const res = await fetch(`/api/asset?${q({ path: a.path })}`);
    if (!res.ok) throw new Error(`cannot read ${a.path} from the console`);
    await uploadVerified("/api/theme/file", { id: state.editId, path: a.path }, new Blob([await make(new Uint8Array(await res.arrayBuffer()))]));
    state.files.add(a.path);
  }
}

async function tileIcon(title, file) {
  const g = tileGroups().find(x => x.title === title), name = (state.tileNames && state.tileNames.get(title)) || title;
  const p = progressToast(`Adding the ${name} icon…`);
  try {
    await tileIconFiles(g, async stock => {
      const f = pngFormat(stock);
      if (!f || !f.writable) throw new Error("this icon's format can't be written");
      return encodePng(await imageRgba(file, f.w, f.h), f, zlibDeflate);
    });
    p.done(`${name} icon replaced and verified${g.icons.length > 1 ? ` (${plural(g.icons.length, "copy", "copies")})` : ""}. Apply the theme to use it.`, "ok");
  } catch (e) { p.done(`${name}: ${e.message}`, "err"); }
  stamp = Date.now();
  await refreshStatus();
  renderAspect(aspectById("tiles"));
}

async function numberTileIcons() {
  const groups = tileGroups(), p = progressToast("Numbering the tile icons…");
  try {
    for (const [i, g] of groups.entries()) {
      p.set(`Numbering tile ${g.n} of ${groups.length}…`, i / groups.length, (i + 1) / groups.length);
      await tileIconFiles(g, async stock => {
        const out = await numberPicture(g.n, stock, zlibDeflate);
        if (!out) throw new Error(`tile ${g.n}'s icon format can't be written`);
        return out;
      });
    }
    p.done(`${plural(groups.length, "tile icon")} numbered and verified. Apply the theme, then look at the home screen.`, "ok");
  } catch (e) { p.done(`Numbering failed: ${e.message}`, "err"); }
  stamp = Date.now();
  await refreshStatus();
  renderAspect(aspectById("tiles"));
}

function tilesBody(asp) {
  const groups = tileGroups();
  if (!groups.length) return `<p class="note">This firmware has no tile icons that can be themed.</p>`;
  setTimeout(tileNamesEnsure);
  const rows = groups.map(g => {
    const rep = g.icons.some(a => state.files.has(a.path)), bgRep = g.bg && state.files.has(g.bg.path);
    const name = state.tileNames && state.tileNames.has(g.title) ? state.tileNames.get(g.title) || "(no name)" : "Reading…";
    return `<div class="row-item${rep || bgRep ? " replaced" : ""}">
      <div class="info"><div class="file">${g.n} · ${esc(name)}${help("One of the console's own tiles. Change icon: its icon on the home row and in the Game Library. Change background: the picture behind the home screen while it is selected. The home row shows a new icon after rest mode.")}${rep ? ` <span class="tag on">Icon changed</span>` : ""}${bgRep ? ` <span class="tag on">Background changed</span>` : ""}</div>
        <div class="dir">${esc(g.title)}${g.icons.length > 1 ? ` · ${plural(g.icons.length, "copy", "copies")} of its icon` : ""}${g.bg ? " · has its own background" : ""}</div></div>
      <div class="strip">${thumbFor(g.icons.find(a => state.files.has(a.path)) || g.icons[0])}</div>
      <div class="acts">
        <button class="btn sm" data-act="tile-icon" data-title="${esc(g.title)}">Change icon</button>
        ${g.bg ? `<button class="btn sm" data-act="tile-bg" data-title="${esc(g.title)}">Change background</button>` : ""}
        ${rep || bgRep ? `<button class="btn sm ghost danger" data-act="tile-reset" data-title="${esc(g.title)}">Reset</button>` : ""}
      </div></div>`;
  }).join("");
  return `<div class="toolbar"><button class="btn" data-act="tiles-number">Number tile icons</button>
      <span class="note">A test: each icon becomes the number in front of its name below, so you can see which tile is which.</span></div>
    <div class="rows">${rows}</div>`;
}

/* ---------------------------------------------------------------- games and apps */

/* A title's picture by name: icon0.png and icon0.dds are the same icon, and
   so are the numbered copies PlayStation Network's pictures come in
   (icon0_11.png, logo_00.png ... logo_30.png, pic0_08.jpg). */
function pictureStem(path) { return baseName(path).replace(/\.(png|dds|jpe?g|webp)$/i, "").replace(/_\d+$/, "").toLowerCase(); }

/* Installed titles and their pictures, the icon first. A picture can be in
   several files: a PNG and a texture, in the title's /user/appmeta folder
   and in the sce_sys folder of its installation, and the PlayStation Network
   copies (titlesOf). Which one the home screen shows depends on the title
   (most PS5 games' records point at sce_sys, some at the network's), so
   each picture (`sets`) is changed in all its files at once. */
function titleGroups() {
  const groups = new Map();
  for (const a of aspectAssets(aspectById("titles"))) {
    for (const t of titlesOf(a.path)) {
      if (!groups.has(t)) groups.set(t, { title: t, pictures: [] });
      groups.get(t).pictures.push(a);
    }
  }
  /* Installed ones only: PlayStation Network's pictures are also kept for
     games that aren't (or are no longer) installed. */
  for (const [t, g] of groups) {
    if (!g.pictures.some(a => /^\/user\/app(?:meta)?\//.test(a.path))) groups.delete(t);
  }
  const rank = { icon0: 0, pic0: 1, logo: 2 };
  const iconFirst = stem => stem in rank ? rank[stem] : 3, pngFirst = a => ext(a.path) === "png" ? 0 : 1;
  for (const g of groups.values()) {
    g.pictures.sort((a, b) => iconFirst(pictureStem(a.path)) - iconFirst(pictureStem(b.path)) ||
      pictureStem(a.path).localeCompare(pictureStem(b.path)) || pngFirst(a) - pngFirst(b) || a.path.localeCompare(b.path));
    const sets = new Map();
    for (const a of g.pictures) {
      if (!sets.has(pictureStem(a.path))) sets.set(pictureStem(a.path), []);
      sets.get(pictureStem(a.path)).push(a);
    }
    g.sets = [...sets].map(([stem, files]) => ({ stem, files }));
  }
  const name = g => (state.titleNames && state.titleNames.get(g.title)) || g.title;
  return [...groups.values()].sort((a, b) => name(a).localeCompare(name(b)));
}

let titleNamesLoading = null;
function titleNamesEnsure() {
  state.titleNames = state.titleNames || new Map();
  const missing = titleGroups().filter(g => !state.titleNames.has(g.title));
  if (!missing.length || titleNamesLoading) return;
  titleNamesLoading = (async () => {
    for (const g of missing) {
      let name = "";
      const dir = `/user/appmeta/${g.title}`;
      try {
        const res = await fetch(`/api/asset?${q({ path: `${dir}/param.json` })}`);
        if (res.ok) {
          const pj = await res.json(), loc = pj.localizedParameters || {};
          name = ((loc[loc.defaultLanguage] || loc["en-US"] || Object.values(loc).find(v => v && v.titleName) || {}).titleName) || "";
        }
      } catch (e) { /* not JSON */ }
      if (!name) {
        try {
          const res = await fetch(`/api/asset?${q({ path: `${dir}/param.sfo` })}`);
          if (res.ok) name = sfoTitle(new Uint8Array(await res.arrayBuffer()));
        } catch (e) { /* no param.sfo either */ }
      }
      state.titleNames.set(g.title, name);
    }
  })().finally(() => { titleNamesLoading = null; renderAspect(aspectById("titles")); });
}

/* One of a title's pictures from your image, in every file that holds it:
   a PNG in exactly the format of the console's, a texture (and anything
   else) through the usual conversion into the console's exact format. */
async function titlePicture(title, stem, file, quiet = false) {
  const g = titleGroups().find(x => x.title === title), set = g && g.sets.find(x => x.stem === stem);
  if (!set) return;
  const label = `${(state.titleNames && state.titleNames.get(title)) || title} ${pictureName(stem)[0]}`;

    if (!drag || !bge) return;

  c.addEventListener("pointerup", end);

    else if (e.key === "+" || e.key === "=") { bgeZoom(bge.zoom * 1.1); e.preventDefault(); }

function bgeClose() {

/* The picture always covers the square. */
function bgeClamp() {
  const w = bge.iw * bge.s, h = bge.ih * bge.s;
  bge.ox = Math.min(0, Math.max(bge.F - w, bge.ox));
  bge.oy = Math.min(0, Math.max(bge.F - h, bge.oy));
}
/* Zoom to `z` (1 = just fills the square), keeping the point (px, py) of the square where it is. */
function bgeZoom(z, px = bge.F / 2, py = bge.F / 2) {
  z = Math.max(1, Math.min(4, z));
  const s = bge.fill * z, k = s / bge.s;
  bge.ox = px - (px - bge.ox) * k; bge.oy = py - (py - bge.oy) * k;
  bge.zoom = z; bge.s = s;
  bgeClamp();
  const r = $("#bge-zoom"), l = $("#bge-zoom-label");
  if (r) r.value = String(Math.round(z * 100));
  if (l) l.textContent = `${Math.round(z * 100)}%`;

}
/* The square as it is now, at `side` pixels. */
function bgeSquare(side) {
  const c = document.createElement("canvas");
  c.width = c.height = side;
  const x = c.getContext("2d"), k = side / bge.F;

  x.drawImage(bge.img, bge.ox * k, bge.oy * k, bge.iw * bge.s * k, bge.ih * bge.s * k);
  return c;
}

    x.save(); x.translate(M, M); x.beginPath(); x.rect(0, 0, F, F); x.clip();

}
