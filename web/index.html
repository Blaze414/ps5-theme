/* ================================================================ zip import / export */

async function readZip(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Not a zip file");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const entries = [];
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("Damaged zip file");
    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
    const crc = dv.getUint32(p + 16, true), size = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    if (name.endsWith("/")) continue;
    if (flags & 1) throw new Error("Encrypted zip files are not supported");
    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    const data = buf.subarray(start, start + size);
    entries.push({
      path: name,
      blob: async () => {
        let blob;
        if (method === 0) blob = new Blob([data]);
        else if (method === 8) {
          if (typeof DecompressionStream === "undefined") throw new Error("This browser cannot unzip; use a current Chrome, Edge, Firefox or Safari");
          blob = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
        } else throw new Error(`${name}: unsupported compression`);
        if (crc32(new Uint8Array(await blob.arrayBuffer())) !== crc) throw new Error(`${name} is damaged (checksum mismatch)`);
        return blob;
      },
    });
  }
  return entries;
}

function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.path), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(12, 33, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true);
    parts.push(lh, name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(14, 33, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(ch, name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((n, x) => n + x.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}

async function exportTheme(id) {
  const t = themeById(id);
  const p = progressToast(`Exporting ${t.name}…`);
  try {
    const { files } = await api("GET", "/api/theme/files", { id });
    const out = [{ path: "theme.ini", data: new TextEncoder().encode(`name=${t.name}\nfw=${t.fw}\nmusic_gain=${t.gain || 0}\n` +
      `music_start=${t.musicStart || 0}\nmusic_end=${t.musicEnd || 0}\n` +
      `music_loop_start=${t.musicLoopStart == null ? -1 : t.musicLoopStart}\nmusic_loop_end=${t.musicLoopEnd == null ? -1 : t.musicLoopEnd}\n` +
      `music_order=${t.musicOrder || "music"}\nmusic_play_from=${t.musicPlayFrom == null ? -1 : t.musicPlayFrom}\n` +
      `music_loop=${t.musicLoop || "crossfade"}\nmusic_blend=${t.musicBlend == null ? 2000 : t.musicBlend}\n`) }];
    const total = files.length + (t.music ? 1 : 0);
    for (let i = 0; i < files.length; i++) {
      const res = await fetch(`/api/theme/file?${q({ id, path: files[i].path })}`);
      if (!res.ok) throw new Error(`Could not read ${files[i].path}`);
      out.push({ path: "files" + files[i].path, data: new Uint8Array(await res.arrayBuffer()) });
      p.set(`Exporting ${t.name}…`, (i + 1) / total);
    }
    if (t.music) {
      const res = await fetch(`/api/theme/music?${q({ id })}`);
      if (!res.ok) throw new Error("Could not read the music");
      out.push({ path: "music.wav", data: new Uint8Array(await res.arrayBuffer()) });
    }
    for (const [kind, name] of PREVIEW_FILES) {
      const res = await fetch(`/api/theme/preview?${q({ id, kind })}`);
      if (res.ok) out.push({ path: name, data: new Uint8Array(await res.arrayBuffer()) });
    }
    const zip = makeZip(out);
    const back = await readZip(new File([zip], "check.zip"));   /* verify before handing it over */
    if (back.length !== out.length) throw new Error("export did not verify");
    for (const e of back) await e.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(zip);
    a.download = `${id}.zip`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    const mb = (zip.size / 1048576).toFixed(zip.size < 10485760 ? 1 : 0);
    p.done(`Saved ${id}.zip: ${describeFiles(files.map(f => f.path)) || "no theme files"}` +
      `${t.music ? ", the song" : ""}, ${mb} MB, verified.`, "ok");
  } catch (e) { p.done(e.message, "err"); }
}

/* "15 backgrounds, the home music and 2 other files", for export and import. */
function describeFiles(paths) {
  const bg = paths.filter(x => BG_RE.test(x)).length, music = paths.includes(HOME_MUSIC);
  const other = paths.length - bg - (music ? 1 : 0);
  const parts = [bg ? plural(bg, "background") : "", music ? "the home music" : "", other ? plural(other, "other file") : ""].filter(Boolean);
  return parts.length > 1 ? `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}` : parts[0] || "";
}

function parseIni(text) {
  const out = {};
  text.split(/\r?\n/).forEach(l => { const i = l.indexOf("="); if (i > 0) out[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  return out;
}

async function importEntries(entries, fallbackName) {
  const ini = entries.filter(e => /(^|\/)theme\.ini$/.test(e.path)).sort((a, b) => a.path.length - b.path.length)[0];
  const meta = ini ? parseIni(await (await ini.blob()).text()) : {};
  const prefix = ini ? ini.path.slice(0, -"theme.ini".length) : "";
  const music = entries.find(e => e.path === prefix + "music.wav");
  const pictures = PREVIEW_FILES.map(([kind, name]) => [kind, entries.find(e => e.path === prefix + name)]).filter(([, e]) => e);
  /* Everything under the theme's files/ folder (the console decides what it
     accepts); without a theme.ini, anything under a themable folder. */
  const files = [];
  const root = prefix + "files/";
  for (const e of entries) {
    if (ini && e.path.startsWith(root)) { files.push({ asset: "/" + e.path.slice(root.length), blob: e.blob }); continue; }
    if (ini) continue;
    const idx = Math.min(...ASSET_ROOTS.map(r => { const i = e.path.indexOf(r); return i < 0 ? Infinity : i; }));
    if (idx !== Infinity && (idx === 0 || e.path[idx - 1] === "/")) files.push({ asset: "/" + e.path.slice(idx), blob: e.blob });
  }
  if (!files.length && !music) throw new Error("No theme files found. Expected theme.ini with files/system_ex/rnps/… or music.wav.");

  const name = uniqueName(meta.name || fallbackName.replace(/\.zip$/i, ""));
  const id = await createTheme(name, meta.fw || state.status.fw);
  const gain = Math.max(-12, Math.min(12, parseInt(meta.music_gain, 10) || 0));
  const settings = { id, gain };
  for (const [key, param] of [["music_start", "start"], ["music_end", "end"], ["music_loop_start", "loop_start"],
                              ["music_loop_end", "loop_end"], ["music_order", "order"], ["music_play_from", "play_from"],
                              ["music_loop", "loop"], ["music_blend", "blend"]]) {
    if (meta[key] !== undefined && meta[key] !== "") settings[param] = meta[key];
  }
  await api("POST", "/api/theme/settings", settings).catch(() => {});
  await refreshStatus();
  const p = progressToast(`Importing ${name}…`);
  let ok = 0, skipped = 0;
  const added = [], why = [];
  const convert = music && !files.some(f => f.asset === HOME_MUSIC);   /* exported before 1.10 */
  const total = files.length + (music ? 1 : 0) + (convert ? 1 : 0);
  for (let i = 0; i < files.length; i++) {
    try { await uploadVerified("/api/theme/file", { id, path: files[i].asset }, await files[i].blob()); ok++; added.push(files[i].asset); }
    catch (e) { skipped++; why.push(`${baseName(files[i].asset)}: ${e.message}`); }
    p.set(`Importing ${name}… ${i + 1}/${total}`, (i + 1) / total);
  }
  if (music) {
    try {
      const blob = await music.blob();
      await uploadVerified("/api/theme/music", { id }, blob);
      ok++;
      if (convert) {
        const { chans, rate } = wavChannels(await blob.arrayBuffer());
        const stereo = chans.length === 1 ? [chans[0], chans[0]] : chans;
        await convertHomeMusic(id, buildHomeMusic(stereo, rate, themePart(themeById(id) || {})), rate, gain, p);
        ok++;
        added.push(HOME_MUSIC);
      }
    } catch (e) { skipped++; why.push(`music: ${e.message}`); }
  }
  for (const [kind, e] of pictures) {
    try { await uploadVerified("/api/theme/preview", { id, kind }, await e.blob()); } catch (err) { /* optional */ }
  }
  await api("POST", "/api/theme/save", { id }).catch(() => {});   /* an imported theme starts saved */
  await refreshStatus();
  const got = describeFiles(added) || "no theme files";
  p.done(skipped
    ? `Imported ${name}: ${got}, verified. ${skipped} skipped (not on this firmware or not valid here): ${why.slice(0, 2).join("; ")}`
    : `Imported ${name}: ${got}, all verified.`, skipped ? "" : "ok");
  if (state.route === "library") render();
}

function readDirEntry(entry) {
  return new Promise(resolve => {
    const reader = entry.createReader(), all = [];
    const next = () => reader.readEntries(batch => { if (!batch.length) return resolve(all); all.push(...batch); next(); }, () => resolve(all));
    next();
  });
}
async function walk(entry, out) {
  if (entry.isFile) out.push({ path: entry.fullPath.replace(/^\//, ""), blob: () => new Promise((res, rej) => entry.file(res, rej)) });
  else if (entry.isDirectory) for (const child of await readDirEntry(entry)) await walk(child, out);
}
async function importDrop(dt) {
  const roots = Array.from(dt.items || []).filter(i => i.kind === "file")
    .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  try {
    if (roots.some(r => r.isDirectory)) {
      for (const root of roots.filter(r => r.isDirectory)) {
        const entries = [];
        await walk(root, entries);
        await importEntries(entries, root.name);
      }
      return;
    }
    for (const file of Array.from(dt.files)) await importFile(file);
  } catch (e) { toast(e.message, "err", 9000); }
}
async function importFile(file) {
  if (!/\.zip$/i.test(file.name)) throw new Error(`${file.name} is not a .zip theme`);
  await importEntries(await readZip(file), file.name);
}

/* ================================================================ events */

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act], .tile");
  if (!el || el.disabled) return;

  if (el.classList.contains("tile")) {
    const asp = aspectById(el.dataset.aspect);
    const file = await pickFile(asp.accept);
    if (file) attachToGroup(asp, el.dataset.group, file);
    return;
  }
  const id = el.dataset.id;
  const asp = el.dataset.aspect && aspectById(el.dataset.aspect);
  switch (el.dataset.act) {
    case "apply": return applyTheme(id);
    case "export": return exportTheme(id);
    case "duplicate": return duplicateTheme(id);
    case "save": return saveTheme(id);
    case "discard": return discardTheme(id, el);
    case "delete": return armDelete(el, id);
    case "new": state.creating = true; return renderLibrary();
    case "new-from-editor": state.creating = true; location.hash = "#/library"; return;
    case "cancel-new": state.creating = false; return renderLibrary();
    case "import": {
      const file = await pickFile(".zip,application/zip");
      if (file) importFile(file).catch(err => toast(err.message, "err", 9000));
      return;
    }
    case "toggle": {
      if (aspectOn(asp)) {
        if (aspectReplaced(asp)) { state.confirming = asp.id; renderAspect(asp); return; }
        setAspectFlag(asp, false);
      } else {
        setAspectFlag(asp, true);
      }
      renderAspect(asp);
      $(`#aspect-${asp.id} .switch`).focus();
      return;
    }
    case "confirm-off":
      state.confirming = "";
      if (asp.mode === "music") await removeMusic();
      else await resetAssets(aspectAssets(asp));
      await refreshStatus();
      setAspectFlag(asp, false);
      toast(`${asp.title} is back to stock in this theme.`, "ok");
      return renderAspect(asp);
    case "cancel-off": state.confirming = ""; return renderAspect(asp);
    case "attach-aspect": {
      const file = await pickFile(asp.mode === "music" ? "audio/*" : asp.accept);
      if (file) attachToAspect(asp, file);
      return;
    }
    case "attach-group": {
      const file = await pickFile(asp.accept);
      if (file) attachToGroup(asp, el.dataset.group, file);
      return;
    }
    case "reset-group": {
      const g = findGroup(asp, el.dataset.group);
      if (g) { await resetAssets(g.assets); renderAspect(asp); }
      return;
    }
    case "reset-aspect": await resetAssets(aspectAssets(asp)); return renderAspect(asp);
    case "remove-music":
      await removeMusic();
      toast("Home music is back to stock in this theme.", "ok");
      return renderAspect(aspectById("music"));
    case "convert-music":
      await reencodeMusic(state.editId, themeById(state.editId).gain || 0);
      return renderAspect(aspectById("music"));
    case "choose-part": return openThemePart(state.editId);
    case "choose-cover": return chooseCover();
    case "remove-cover": return removePreview(state.editId, "picture");
    case "trim-play": return preview && !preview.timer ? stopPreview() : playPreview("");
    case "trim-seam": return playPreview("loop");
    case "trim-joint": return playPreview("joint");
    case "trim-cancel":
      stopPreview();
      state.trim = null;
      return renderAspect(aspectById("music"));
    case "trim-save": return saveTrim();
    case "more": state.pages[asp.id] = (state.pages[asp.id] || 48) + 96; return renderAspect(asp);
    case "toggle-area": {
      const off = bgOff();
      if (off.has(el.dataset.area)) off.delete(el.dataset.area); else off.add(el.dataset.area);
      setBgOff(off);
      renderAspect(aspectById("background"));
      const again = document.querySelector(`[data-act="toggle-area"][data-area="${CSS.escape(el.dataset.area)}"]`);
      if (again) again.focus();
      return;
    }
    case "refresh-log": return loadLog();
    case "view-crash":
      try { $("#log").textContent = await api("GET", "/api/crash", { name: el.dataset.name }); }
      catch (err) { toast(err.message, "err"); }
      return;
  }
});

document.addEventListener("submit", async e => {
  if (e.target.id !== "create") return;
  e.preventDefault();
  const name = $("#new-name").value.trim();
  if (!name) return;
  try {
    const id = await createTheme(name, $("#new-fw").value);
    state.creating = false;
    location.hash = `#/edit/${encodeURIComponent(id)}`;
  } catch (err) { toast(err.message, "err"); }
});

let filterTimer = 0;
document.addEventListener("input", e => {
  const aspId = e.target.dataset && e.target.dataset.filterAspect;
  if (aspId) {
    state.filters[aspId] = e.target.value;
    state.pages[aspId] = 48;
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => {
      renderAspect(aspectById(aspId));
      const input = $(`[data-filter-aspect="${aspId}"]`);
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }, 250);
  }
  if (e.target.id === "music-gain") $("#gain-label").textContent = gainLabel(+e.target.value);
  const timeField = { "trim-start-time": "start", "trim-end-time": "end", "trim-lstart-time": "lstart", "trim-lend-time": "lend",
                      "trim-from-time": "from" }[e.target.id];
  if (timeField && state.trim) {
    const v = parseClock(e.target.value);
    if (!isNaN(v)) { state.trim[EDGE_KEY[timeField]] = v; clampTrim(timeField); drawTrim(); }
  }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "theme-select") { location.hash = `#/edit/${encodeURIComponent(t.value)}`; return; }
  if (t.id === "fit") { state.fit = t.value; localSet("fit", state.fit); return; }
  try {
    if (t.id === "theme-name" && t.value.trim()) {
      await api("POST", "/api/theme/settings", { id: state.editId, name: t.value.trim() });
      await refreshStatus();
      $("#theme-select").querySelector(`option[value="${CSS.escape(state.editId)}"]`).textContent = t.value.trim();
      toast("Name saved.", "ok");
    }
    if (t.id === "theme-fw") {
      await api("POST", "/api/theme/settings", { id: state.editId, fw: t.value });
      await refreshStatus();
      toast("Firmware saved.", "ok");
    }
    if (t.id === "trim-loop" && state.trim) {
      const [loop, ms] = LOOP_CHOICES[+t.value];
      Object.assign(state.trim, { loop, blend: ms / 1000 });
      if (preview) stopPreview();
      return;
    }
    if (t.id === "trim-order" && state.trim) {
      const tr = state.trim, was = tr.order;
      stopPreview();
      tr.order = t.value;
      if (was === "music" || (t.value === "music-first") !== (was === "music-first")) defaultLoop(tr);
      clampTrim("lend");
      renderAspect(aspectById("music"));
      $("#trim-order").focus();
      return;
    }
    if (/^trim-(l?(start|end)|from)-time$/.test(t.id) && state.trim) { drawTrim(); return; }
    if (t.id === "music-gain") {
      const id = state.editId;
      await api("POST", "/api/theme/settings", { id, gain: t.value });
      await refreshStatus();
      await reencodeMusic(id, +t.value);
      renderAspect(aspectById("music"));
    }
  } catch (err) { toast(err.message, "err"); }
});

/* Drag and drop: onto a drop zone, tile or row attaches a file; elsewhere in
   the Library it imports a theme. */
const drop = $("#drop");
let dragDepth = 0;
const hasFiles = e => Array.from(e.dataTransfer?.types || []).includes("Files");
const dropTarget = e => e.target.closest && e.target.closest("[data-drop], .tile, [data-drop-group]");
window.addEventListener("dragenter", e => {
  if (!hasFiles(e)) return;
  dragDepth++;
  if (state.route === "library") drop.classList.add("on");
});
window.addEventListener("dragleave", e => {
  if (!hasFiles(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) drop.classList.remove("on");
});
window.addEventListener("dragover", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  document.querySelectorAll(".drag").forEach(el => el.classList.remove("drag"));
  const target = dropTarget(e);
  if (target) target.classList.add("drag");
  e.dataTransfer.dropEffect = state.route === "edit" && !target ? "none" : "copy";
});
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  drop.classList.remove("on");
  document.querySelectorAll(".drag").forEach(el => el.classList.remove("drag"));
  const target = dropTarget(e);
  const file = e.dataTransfer.files[0];
  if (target && file) {
    const asp = aspectById(target.dataset.drop || target.dataset.aspect);
    if (target.dataset.drop) attachToAspect(asp, file);
    else attachToGroup(asp, target.dataset.group || target.dataset.dropGroup, file);
  } else if (state.route === "library") {
    importDrop(e.dataTransfer);
  }
});

window.addEventListener("hashchange", () => {
  const left = state.route === "edit" ? themeById(state.editId) : null;
  state.confirming = "";
  stopPreview();
  state.trim = null;
  render();
  view.focus({ preventScroll: true });
  if (left && left.unsaved && !(state.route === "edit" && state.editId === left.id)) {
    toast(`${left.name} has unsaved changes. Open it again to save or discard them.`, "", 7000);
  }
});

/* Handles of the part editor: arrow keys move by 0.1 s (Shift: 1 s), Page keys
   by 10 s, Home/End to the limits. A PS5 controller's D-pad sends arrows. */
document.addEventListener("keydown", e => {
  const which = Object.keys(HANDLES).find(k => HANDLES[k].slice(1) === e.target.id);
  if (!state.trim || !which) return;
  const t = state.trim, key = EDGE_KEY[which];
  const step = { ArrowLeft: -0.1, ArrowDown: -0.1, ArrowRight: 0.1, ArrowUp: 0.1, PageDown: -10, PageUp: 10 }[e.key];
  if (step !== undefined) t[key] += step * (e.shiftKey && Math.abs(step) < 1 ? 10 : 1);
  else if (e.key === "Home") t[key] = 0;
  else if (e.key === "End") t[key] = t.duration;
  else return;
  e.preventDefault();
  clampTrim(which);
  drawTrim();
});
window.addEventListener("resize", () => { if (state.trim) drawTrim(); });

(async () => {
  if (!location.hash) history.replaceState(null, "", "#/library");
  await refreshStatus();
  render();
  let tick = 0;
  setInterval(async () => {
    tick++;
    if (document.hidden || state.route !== "library" || state.creating) return;
    if (!state.status.applying && tick % 4) return;   /* every second while a theme is being applied */
    const before = JSON.stringify(state.status);
    if (await refreshStatus() && JSON.stringify(state.status) !== before) renderLibrary();
  }, 1000);
})();
</script>
</body>
</html>
