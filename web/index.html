/* Number the pictures of one resource file (`vectorOnly`: only its SVG
   icons). The numbers come from the key, so they are the same whichever
   file is numbered first. */
function numberPictures(path, vectorOnly) { return rcoQueued("Numbering the pictures", () => numberPicturesNow(path, vectorOnly), true); }
async function numberPicturesNow(path, vectorOnly) {
  const p = progressToast("Reading the console's interface files…");
  try {
    const key = (await rcoKey((i, n, x) => p.set(`Reading ${baseName(x)}…`, i / n * 0.3))).filter(k => k.path === path);
    if (!key.length) throw new Error("this file has no pictures");
    /* Numbering replaces the theme's pictures in the file, but keeps its shapes. */
    const sh = rcoShapes(key[0].r), shapes = sh && (await rcoChanges(path)).get(`${sh.f.el}\t${sh.f.attr}`);
    const replace = new Map(shapes ? [[`${sh.f.el}\t${sh.f.attr}`, shapes]] : []);
    let done = 0, skipped = 0;
    for (const k of key) {
      if (vectorOnly && k.pic.kind !== "svg") continue;
      let ok = false;
      for (const f of k.pic.files) {
        let bytes = null;
        if (f.kind === "png") bytes = await numberPicture(k.n, rcoData(k.r, f), zlibDeflate);
        else if (f.kind === "svg") {
          const text = numberSvg(k.n, new TextDecoder().decode(rcoData(k.r, f)));
          bytes = text === null ? null : new TextEncoder().encode(text);
        }
        if (bytes) { replace.set(`${f.el}\t${f.attr}`, bytes); ok = true; }
      }
      if (ok) done++; else skipped++;
      if ((done + skipped) % 50 === 0) p.set(`Numbering pictures… ${done + skipped} of ${key.length}`, 0.3 + 0.4 * (done + skipped) / key.length);
    }
    p.set(`Sending ${baseName(path)} to the console…`, 0.75);
    await uploadVerified("/api/theme/file", { id: state.editId, path }, new Blob([rcoRebuild(key[0].r, replace)]));
    state.files.add(path);
    stamp = Date.now();
    p.done(`${plural(done, "picture")} numbered in ${baseName(path)} and verified${skipped ? ` (${skipped} left as they are, in a format this page can't write)` : ""}. ` +
      "Apply the theme, then put the console in rest mode and wake it.", "ok");
  } catch (e) {
    p.done(`Numbering failed: ${e.message}`, "err");
  }
  await refreshStatus();
  renderAspect(aspectById("interface"));
}

/* ---------------------------------------------------------------- your own pictures */

/* Your image as RGBA pixels at w x h (fitted as chosen above the sections),
   transparent where it doesn't reach. */
async function imageRgba(file, w, h) {
  const url = URL.createObjectURL(file);
  let img;
  try { img = await loadImage(url); } finally { URL.revokeObjectURL(url); }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d", { colorSpace: "srgb", willReadFrequently: true });
  g.imageSmoothingQuality = "high";
  let dw = w, dh = h;
  if (state.fit !== "stretch") {
    const sc = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);
    dw = img.naturalWidth * sc; dh = img.naturalHeight * sc;
  }
  g.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  return new Uint8Array(g.getImageData(0, 0, w, h).data.buffer);
}

/* Your image for one console picture, in exactly its format: a PNG written
   like the console's (pngFormat), or the console's SVG with your image in
   it as a PNG at twice the SVG's size (at most 512 pixels). */
async function pictureFromImage(file, stock, kind) {
  if (kind === "png") {
    const f = pngFormat(stock);
    if (!f || !f.writable) throw new Error("this picture's format can't be written");
    return encodePng(await imageRgba(file, f.w, f.h), f, zlibDeflate);
  }
  const text = new TextDecoder().decode(stock), end = svgRootEnd(text);
  if (!end) throw new Error("this picture can't be replaced");
  const [, , vw, vh] = svgBox(text.slice(text.lastIndexOf("<svg", end), end));
  const scale = Math.min(512 / Math.max(vw, vh), 2 * Math.max(1, 128 / Math.max(vw, vh)));
  const w = Math.max(1, Math.round(vw * scale)), h = Math.max(1, Math.round(vh * scale));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(await imageRgba(file, w, h)), w, h), 0, 0);
  return new TextEncoder().encode(svgWithImage(text, c.toDataURL("image/png")));
}

/* The theme's changes to a resource file: entry ("element\tattribute") ->
   bytes, for every embedded picture that differs from the console's. */
/* The theme's copy of each resource file, parsed: one per file (a resource file is up to 40 MB; keeping one per
   change would fill the browser's memory, the console's own browser first). */
const rcoThemeCache = new Map();
function rcoThemeCacheSet(key, value) {
  const file = key.slice(0, key.lastIndexOf("|") + 1);
  for (const k of [...rcoThemeCache.keys()]) if (k.slice(0, k.lastIndexOf("|") + 1) === file) rcoThemeCache.delete(k);
  rcoThemeCache.set(key, value);
}
async function rcoChanges(path) {
  const r = await rcoStock(path), out = new Map();
  if (!r || !state.files.has(path)) return out;
  const cacheKey = `${state.editId}|${path}|${stamp}`;
  if (!rcoThemeCache.has(cacheKey)) {
    const res = await fetch(`/api/theme/file?${q({ id: state.editId, path })}&v=${stamp}`);
    rcoThemeCacheSet(cacheKey, res.ok ? rcoParse(new Uint8Array(await res.arrayBuffer())) : null);
  }
  const t = rcoThemeCache.get(cacheKey);
  if (!t) return out;
  const theirs = new Map(t.files.map(f => [`${f.el}\t${f.attr}`, f]));
  for (const f of r.files) {
    const k = `${f.el}\t${f.attr}`, o = theirs.get(k);
    if (!o) continue;
    const a = rcoData(r, f), b = rcoData(t, o);
    if (a.length !== b.length || a.some((v, i) => v !== b[i])) out.set(k, b);
  }
  return out;
}

async function rcoSave(path, changes) {
  let made = null;
  if (!changes.size) await resetAssets([{ path }]);
  else {
    made = rcoRebuild(await rcoStock(path), changes);
    await uploadVerified("/api/theme/file", { id: state.editId, path }, new Blob([made]));
    state.files.add(path);
  }
  stamp = Date.now();
  /* the file just sent is the theme's now: the next change starts from it without fetching it again */
  if (made) rcoThemeCacheSet(`${state.editId}|${path}|${stamp}`, rcoParse(made));
  await refreshStatus();
}

/* Changes to a resource file, one at a time: each reads the theme's file as the change before it left it (a
   change started meanwhile would otherwise start from the old file and undo the other when it is sent). */
let rcoWork = Promise.resolve(), rcoWaiting = 0;
function rcoQueued(label, fn, ownProgress = false) {
  const waiting = rcoWaiting++ > 0;
  const p = waiting || !ownProgress ? progressToast(waiting ? `${label}: waiting for the change before it…` : `${label}…`) : null;
  const run = rcoWork.then(async () => {
    if (p && ownProgress) { p.done("", ""); }
    else if (p) p.set(`${label}…`, 0.3);
    try { return await fn(); } finally { rcoWaiting--; if (p && !ownProgress) p.done("", ""); }
  });
  rcoWork = run.catch(() => {});
  return run;
}

function replacePicture(path, el, file) { return rcoQueued("Adding your picture", () => replacePictureNow(path, el, file), true); }
async function replacePictureNow(path, el, file) {
  const r = await rcoStock(path), pic = rcoPictures(r).find(p => p.el === el);
  if (!pic) return;
  const p = progressToast(`Adding your picture as ${pic.id}…`);
  try {
    const changes = await rcoChanges(path);
    for (const f of pic.files) {
      if (!f.kind) throw new Error("this picture can't be replaced");
      changes.set(`${f.el}\t${f.attr}`, await pictureFromImage(file, rcoData(r, f), f.kind));
    }
    p.set(`Sending ${baseName(path)} to the console…`, 0.6);
    await rcoSave(path, changes);
    p.done(`${pic.id} replaced and verified${pic.kind === "svg" ? " (a vector icon: your picture is drawn inside the console's own SVG)" : ""}. Apply the theme, then put the console in rest mode and wake it.`, "ok");
  } catch (e) {
    p.done(`${pic.id}: ${e.message}`, "err");
  }
  renderAspect(aspectById("interface"));
}

function resetPicture(path, el) { return rcoQueued("Putting the console's picture back", () => resetPictureNow(path, el)); }
async function resetPictureNow(path, el) {
  const r = await rcoStock(path), pic = rcoPictures(r).find(p => p.el === el);
  const changes = await rcoChanges(path);
  for (const f of pic.files) changes.delete(`${f.el}\t${f.attr}`);
  try { await rcoSave(path, changes); toast(`${pic.id} is back to the console's own.`, "ok"); }
  catch (e) { toast(e.message, "err"); }
  renderAspect(aspectById("interface"));
}

/* ---------------------------------------------------------------- home screen tiles */

/* The console's own tiles: title ID -> their icon files, with names from
   each app's param.json (read once). */
function tileGroups() {
  const groups = new Map();
  for (const a of aspectAssets(aspectById("tiles"))) {
    const t = tileTitle(a.path);
    if (!groups.has(t)) groups.set(t, { title: t, icons: [] });
    groups.get(t).icons.push(a);
  }
  const bgs = new Map((state.assets || []).filter(a => /\/vsh_asset\/bg_NPXS\d+\.dds(\.zst)?$/.test(a.path))
    .map(a => [/bg_(NPXS\d+)/.exec(a.path)[1], a]));
  return [...groups.values()].sort((a, b) => a.title.localeCompare(b.title))
    .map((g, i) => ({ ...g, n: i + 1, bg: bgs.get(g.title) || null }));
}

let tileNamesLoading = null;
function tileNamesEnsure() {
  state.tileNames = state.tileNames || new Map();
  const missing = tileGroups().filter(g => !state.tileNames.has(g.title));
  if (!missing.length || tileNamesLoading) return;
  tileNamesLoading = (async () => {
    for (const g of missing) {
      let name = "";
      for (const a of g.icons) {
        try {
          const res = await fetch(`/api/asset?${q({ path: a.path.replace(/icon0\.png$/, "param.json") })}`);
          if (!res.ok) continue;
          const pj = await res.json(), loc = pj.localizedParameters || {};
          const own = loc[loc.defaultLanguage] || loc["en-US"] || Object.values(loc).find(v => v && v.titleName) || {};
          name = own.titleName || "";
          if (name) break;
        } catch (e) { /* no param.json beside this copy */ }
      }
      state.tileNames.set(g.title, name);
    }
  })().finally(() => { tileNamesLoading = null; renderAspect(aspectById("tiles")); });
}

/* A tile's icon from your image (or its number, for the test), each copy in
   exactly the format of the console's. */
async function tileIconFiles(g, make) {
  for (const a of g.icons) {
    const res = await fetch(`/api/asset?${q({ path: a.path })}`);
    if (!res.ok) throw new Error(`cannot read ${a.path} from the console`);
    await uploadVerified("/api/theme/file", { id: state.editId, path: a.path }, new Blob([await make(new Uint8Array(await res.arrayBuffer()))]));
    state.files.add(a.path);
  }
}

async function tileIcon(title, file) {
  const g = tileGroups().find(x => x.title === title), name = (state.tileNames && state.tileNames.get(title)) || title;
  const p = progressToast(`Adding the ${name} icon…`);
  try {
    await tileIconFiles(g, async stock => {
      const f = pngFormat(stock);
      if (!f || !f.writable) throw new Error("this icon's format can't be written");
      return encodePng(await imageRgba(file, f.w, f.h), f, zlibDeflate);
    });
    p.done(`${name} icon replaced and verified${g.icons.length > 1 ? ` (${plural(g.icons.length, "copy", "copies")})` : ""}. Apply the theme to use it.`, "ok");
  } catch (e) { p.done(`${name}: ${e.message}`, "err"); }
  stamp = Date.now();
  await refreshStatus();
  renderAspect(aspectById("tiles"));
}

async function numberTileIcons() {
  const groups = tileGroups(), p = progressToast("Numbering the tile icons…");
  try {
    for (const g of groups) {
      p.set(`Numbering tile ${g.n} of ${groups.length}…`, g.n / groups.length);
      await tileIconFiles(g, async stock => {
        const out = await numberPicture(g.n, stock, zlibDeflate);
        if (!out) throw new Error(`tile ${g.n}'s icon format can't be written`);
        return out;
      });
    }
    p.done(`${plural(groups.length, "tile icon")} numbered and verified. Apply the theme, then look at the home screen.`, "ok");
  } catch (e) { p.done(`Numbering failed: ${e.message}`, "err"); }
  stamp = Date.now();
  await refreshStatus();
  renderAspect(aspectById("tiles"));
}

function tilesBody(asp) {
  const groups = tileGroups();
  if (!groups.length) return `<p class="note">This firmware has no tile icons that can be themed.</p>`;
  setTimeout(tileNamesEnsure);
  const rows = groups.map(g => {
    const rep = g.icons.some(a => state.files.has(a.path)), bgRep = g.bg && state.files.has(g.bg.path);
    const name = state.tileNames && state.tileNames.has(g.title) ? state.tileNames.get(g.title) || "(no name)" : "Reading…";
    return `<div class="row-item${rep || bgRep ? " replaced" : ""}">
      <div class="info"><div class="file">${g.n} · ${esc(name)}${help("One of the console's own tiles. Change icon: its icon on the home row and in the Game Library. Change background: the picture behind the home screen while it is selected. The home row shows a new icon after rest mode.")}${rep ? ` <span class="tag on">Icon changed</span>` : ""}${bgRep ? ` <span class="tag on">Background changed</span>` : ""}</div>
        <div class="dir">${esc(g.title)}${g.icons.length > 1 ? ` · ${plural(g.icons.length, "copy", "copies")} of its icon` : ""}${g.bg ? " · has its own background" : ""}</div></div>
      <div class="strip">${thumbFor(g.icons.find(a => state.files.has(a.path)) || g.icons[0])}</div>
      <div class="acts">
        <button class="btn sm" data-act="tile-icon" data-title="${esc(g.title)}">Change icon</button>
        ${g.bg ? `<button class="btn sm" data-act="tile-bg" data-title="${esc(g.title)}">Change background</button>` : ""}
        ${rep || bgRep ? `<button class="btn sm ghost danger" data-act="tile-reset" data-title="${esc(g.title)}">Reset</button>` : ""}
      </div></div>`;
  }).join("");
  return `<p class="note">The console's own tiles on the home screen and in the Game Library. Each icon is written in
      exactly the format of the console's; a tile's background is the picture shown while it is selected.</p>
    <div class="toolbar"><button class="btn" data-act="tiles-number">Number tile icons</button>
      <span class="note">A test: each icon becomes the number in front of its name below, so you can see which tile is which.</span></div>
    <div class="rows">${rows}</div>`;
}

/* ---------------------------------------------------------------- games and apps */

/* A title's picture by name: icon0.png and icon0.dds are the same icon, and
   so are the numbered copies PlayStation Network's pictures come in
   (icon0_11.png, logo_00.png ... logo_30.png, pic0_08.jpg). */
function pictureStem(path) { return baseName(path).replace(/\.(png|dds|jpe?g|webp)$/i, "").replace(/_\d+$/, "").toLowerCase(); }

/* Installed titles and their pictures, the icon first. A picture can be in
   several files: a PNG and a texture, in the title's /user/appmeta folder
   and in the sce_sys folder of its installation, and the PlayStation Network
   copies (titlesOf). Which one the home screen shows depends on the title
   (most PS5 games' records point at sce_sys, some at the network's), so
   each picture (`sets`) is changed in all its files at once. */
function titleGroups() {
  const groups = new Map();
  for (const a of aspectAssets(aspectById("titles"))) {
    for (const t of titlesOf(a.path)) {
      if (!groups.has(t)) groups.set(t, { title: t, pictures: [] });
      groups.get(t).pictures.push(a);
    }
  }
  /* Installed ones only: PlayStation Network's pictures are also kept for
     games that aren't (or are no longer) installed. */
  for (const [t, g] of groups) {
    if (!g.pictures.some(a => /^\/user\/app(?:meta)?\//.test(a.path))) groups.delete(t);
  }
  const rank = { icon0: 0, pic0: 1, logo: 2 };
  const iconFirst = stem => stem in rank ? rank[stem] : 3, pngFirst = a => ext(a.path) === "png" ? 0 : 1;
  for (const g of groups.values()) {
    g.pictures.sort((a, b) => iconFirst(pictureStem(a.path)) - iconFirst(pictureStem(b.path)) ||
      pictureStem(a.path).localeCompare(pictureStem(b.path)) || pngFirst(a) - pngFirst(b) || a.path.localeCompare(b.path));
    const sets = new Map();
    for (const a of g.pictures) {
      if (!sets.has(pictureStem(a.path))) sets.set(pictureStem(a.path), []);
      sets.get(pictureStem(a.path)).push(a);
    }
    g.sets = [...sets].map(([stem, files]) => ({ stem, files }));
  }
  const name = g => (state.titleNames && state.titleNames.get(g.title)) || g.title;
  return [...groups.values()].sort((a, b) => name(a).localeCompare(name(b)));
}

let titleNamesLoading = null;
function titleNamesEnsure() {
  state.titleNames = state.titleNames || new Map();
  const missing = titleGroups().filter(g => !state.titleNames.has(g.title));
  if (!missing.length || titleNamesLoading) return;
  titleNamesLoading = (async () => {
    for (const g of missing) {
      let name = "";
      const dir = `/user/appmeta/${g.title}`;
      try {
        const res = await fetch(`/api/asset?${q({ path: `${dir}/param.json` })}`);
        if (res.ok) {
          const pj = await res.json(), loc = pj.localizedParameters || {};
          name = ((loc[loc.defaultLanguage] || loc["en-US"] || Object.values(loc).find(v => v && v.titleName) || {}).titleName) || "";
        }
      } catch (e) { /* not JSON */ }
      if (!name) {
        try {
          const res = await fetch(`/api/asset?${q({ path: `${dir}/param.sfo` })}`);
          if (res.ok) name = sfoTitle(new Uint8Array(await res.arrayBuffer()));
        } catch (e) { /* no param.sfo either */ }
      }
      state.titleNames.set(g.title, name);
    }
  })().finally(() => { titleNamesLoading = null; renderAspect(aspectById("titles")); });
}

/* One of a title's pictures from your image, in every file that holds it:
   a PNG in exactly the format of the console's, a texture (and anything
   else) through the usual conversion into the console's exact format. */
async function titlePicture(title, stem, file) {
  const g = titleGroups().find(x => x.title === title), set = g && g.sets.find(x => x.stem === stem);
  if (!set) return;
  const label = `${(state.titleNames && state.titleNames.get(title)) || title} ${pictureName(stem)[0]}`;
  const rest = [];
  let failed = false, written = 0;
  for (const a of set.files) {
    if (ext(a.path) !== "png") { rest.push(a); continue; }
    try {
      const res = await fetch(`/api/asset?${q({ path: a.path })}`);
      if (!res.ok) throw new Error("cannot read the console's picture");
      const f = pngFormat(new Uint8Array(await res.arrayBuffer()));
      if (!f || !f.writable) { rest.push(a); continue; }
      await uploadVerified("/api/theme/file", { id: state.editId, path: a.path }, new Blob([await encodePng(await imageRgba(file, f.w, f.h), f, zlibDeflate)]));
      state.files.add(a.path);
      written++;
    } catch (e) {
      failed = true;
      toast(`${label} (${baseName(a.path)}): ${e.message}`, "err", 9000);
    }
  }
  if (rest.length) await attachTo(rest, file, label, written);
  else if (!failed) toast(`${label} replaced${written > 1 ? ` in ${plural(written, "file")}` : ""} and verified. Apply the theme to use it.`, "ok");
  stamp = Date.now();
  await refreshStatus();
  renderAspect(aspectById("titles"));
}

/* What a title's picture is, in plain words: [button label, where it shows]. */
const PICTURE_NAMES = {
  icon0: ["icon", "The icon: the game's tile on the home screen and in the Game Library."],
  pic0: ["background", "The background: shown behind the home screen while the game is selected."],
  logo: ["logo", "The logo: the game's name as artwork."],
};
function pictureName(stem) {
  return PICTURE_NAMES[stem] || [`other artwork (${stem})`, `Other artwork the console keeps for the game (${stem}).`];
}

function titlesBody(asp) {
  const groups = titleGroups();
  if (!groups.length) return `<p class="note">No installed games or apps with pictures were found.</p>`;
  setTimeout(titleNamesEnsure);
  const filter = (state.filters[asp.id] || "").toLowerCase();
  const name = g => state.titleNames && state.titleNames.has(g.title) ? state.titleNames.get(g.title) || g.title : "Reading…";
  const shown = filter ? groups.filter(g => `${name(g)} ${g.title}`.toLowerCase().includes(filter)) : groups;
  const page = state.pages[asp.id] || 48;
  const rows = shown.slice(0, page).map(g => {
    const rep = g.pictures.some(a => state.files.has(a.path));
    /* Titles whose PlayStation Network pictures (a concept's) are this one's too. */
    const shared = [...new Set(g.pictures.flatMap(a => titlesOf(a.path)))].filter(t => t !== g.title)
      .map(t => (state.titleNames && state.titleNames.get(t)) || t);
    return `<div class="row-item${rep ? " replaced" : ""}">
      <div class="info"><div class="file">${esc(name(g))}${help("An installed game or app. Its icon shows on the home row and in the Game Library, its background behind the home screen while it is selected, and its logo where it has one. The Game Library shows a change at once, the home row after rest mode. Hold the pointer over a button for where its picture appears.")}${rep ? ` <span class="tag on">Changed</span>` : ""}</div>
        <div class="dir">${esc(g.title)} · ${plural(g.sets.length, "picture")}${shared.length ? ` · shares pictures with ${esc(shared.join(", "))}` : ""}</div></div>
      <div class="strip">${thumbFor(g.pictures.find(a => isImage(a) && state.files.has(a.path)) || g.pictures.find(isImage) || g.pictures[0])}</div>
      <div class="acts">${g.sets.map(x => `<button class="btn sm" data-act="title-pic" data-title="${esc(g.title)}" data-stem="${esc(x.stem)}" title="${esc(`${pictureName(x.stem)[1]} Files: ${x.files.map(a => a.path.replace(/^\/user\//, "")).join(", ")}`)}">Change ${esc(pictureName(x.stem)[0])}</button>`).join("")}
        ${rep ? `<button class="btn sm ghost danger" data-act="title-reset" data-title="${esc(g.title)}">Reset</button>` : ""}
      </div></div>`;
  }).join("");
  return `<p class="note">The Game Library shows new pictures at once; the home row after rest mode.${help("Icon: the game's tile on the home row and in the Game Library. Background: shown behind the home screen while the game is selected. Logo: the game's name as artwork. Some games also have other artwork. Each picture is written into every file that holds it, in exactly the console's format.")}</p>
    <p class="note">Before installing an update for a game whose pictures you changed, choose <b>Restore stock</b>, then apply the theme again.${help("While a theme changes a title's pictures, the console can't update them.")}</p>
    ${groups.length > 12 ? `<div class="toolbar"><input type="search" data-filter-aspect="${asp.id}" placeholder="Search games and apps" value="${esc(state.filters[asp.id] || "")}" aria-label="Search games and apps"></div>` : ""}
    <div class="rows">${rows || `<p class="note">Nothing matches.</p>`}</div>
    ${shown.length > page ? `<div><button class="btn sm" data-act="more" data-aspect="${asp.id}">Show more (${shown.length - page})</button></div>` : ""}`;
}

function rcoBody(asp) {
  const all = aspectAssets(asp);
  if (!all.length) return `<p class="note">This firmware has no interface files that can be themed.</p>`;
  setTimeout(rcoEnsureLoaded);
  setTimeout(rcoShapesShow);
  const rows = all.slice().sort((a, b) => a.path.localeCompare(b.path)).map(a => {

function saveColorEdit(path, palette) { return rcoQueued("Saving the colours", () => saveColorEditNow(path, palette)); }
async function saveColorEditNow(path, palette) {
  try {
    const r = await rcoStock(path), pals = rcoColors(r), i = pals.findIndex(p => p.id === palette), changes = await rcoChanges(path);
    if (i < 0) throw new Error("no such palette");
    const picks = {};
    for (const input of document.querySelectorAll("[data-color-edit]")) {
      const m = /^#([0-9a-f]{6})$/i.exec(input.value.trim());
      if (!m) throw new Error("use a colour like #3366ff");
      picks[input.dataset.colorEdit] = parseInt(m[1], 16);
    }
    const p = pals[i], k = `${p.f.el}\t${p.f.attr}`, values = colorEditValues(pals, i, picks), text = colorsText(p.text, values);
    const widgets = (colorEditSets(pals, i).widgets || { names: [] }).names;
    const widgetsChanged = widgets.some(n => new Map(values).get(n) !== new Map(p.values).get(n));
    if (text === p.text) changes.delete(k); else changes.set(k, new TextEncoder().encode(text));
    await rcoSave(path, changes);
    state.colorEdit = null;
    toast(`${text === p.text ? "The console's own colours" : "Your colours"} saved and verified. Apply the theme, then put the console in rest mode and wake it.${widgetsChanged ? " For the widgets' colour, turn off Use System Appearance for Widgets in the Welcome hub's settings." : ""}`, "ok", 12000);
  } catch (e) { toast(e.message, "err"); }
  renderAspect(aspectById("appearance"));
  renderAspect(aspectById("interface"));
}

function saveColors(path, reset, palette, panel = false) { return rcoQueued("Saving the colours", () => saveColorsNow(path, reset, palette, panel)); }
async function saveColorsNow(path, reset, palette, panel = false) {

function saveShapes(path, reset) { return rcoQueued("Saving the shapes", () => saveShapesNow(path, reset)); }
async function saveShapesNow(path, reset) {
  try {
    const r = await rcoStock(path), sh = rcoShapes(r), k = `${sh.f.el}\t${sh.f.attr}`, changes = await rcoChanges(path);
    if (reset) changes.delete(k);
    else {
      const values = sh.values.map(([name, stock]) => {
        const input = document.querySelector(`[data-shape="${CSS.escape(name)}"]`);
        const v = input && input.value.trim() !== "" ? Number(input.value) : stock;
        if (!Number.isFinite(v) || v < 0 || v > shapeMax(name)) {
          throw new Error(`${SHAPE_NAMES[name] || name}: use a number from 0 to ${shapeMax(name)}`);
        }
        return [name, v];
      });
      const text = shapesText(sh.text, values);
      if (text === sh.text) changes.delete(k); else changes.set(k, new TextEncoder().encode(text));
    }
    await rcoSave(path, changes);
    toast(reset ? "The console's own shapes are back." : "Shapes saved and verified. Apply the theme, then put the console in rest mode and wake it.", "ok");
  } catch (e) { toast(e.message, "err"); }
  renderAspect(aspectById("interface"));
}

let rcoLookupTimer = 0;
async function rcoLookup() {
  const text = (state.rcoLookup || "").trim().toLowerCase();
  if (!$("#rco-lookup-result")) return;
  let html;
  try {
    const key = await rcoKey(), changed = new Map();
    for (const path of new Set(key.map(k => k.path))) changed.set(path, await rcoChanges(path));
    const isChanged = k => k.pic.files.some(f => changed.get(k.path).has(`${f.el}\t${f.attr}`));
    let hits, more = 0;
    if (!text) {
      const all = key.filter(isChanged);
      hits = all.slice(0, 24); more = all.length - hits.length;
      if (!hits.length) { $("#rco-lookup-result").innerHTML = ""; return; }
    } else {
      hits = /^\d+$/.test(text) ? key.filter(k => k.n === +text) : key.filter(k => k.pic.id.toLowerCase().includes(text)).slice(0, 24);
    }
    html = hits.length ? `${text ? "" : `<p class="note">Pictures this theme changes:</p>`}<div class="rows">${hits.map(k => {
      const f = k.pic.files[0], mine = changed.get(k.path).get(`${f.el}\t${f.attr}`), rep = isChanged(k);
      const url = URL.createObjectURL(new Blob([mine || rcoData(k.r, f)], { type: f.kind === "svg" ? "image/svg+xml" : "image/png" }));
      const what = k.pic.kind === "svg" ? "vector icon" : k.pic.kind === "png" ? (() => { const fm = pngFormat(rcoData(k.r, f)); return fm ? `${fm.w}×${fm.h} picture` : "picture"; })() : "picture";
      return `<div class="row-item${rep ? " replaced" : ""}"><div class="info"><div class="file">${k.n} · ${esc(k.pic.id)}${rep ? ` <span class="tag on">Changed</span>` : ""}</div>
          <div class="dir">${what} · ${esc(baseName(k.path))}</div></div>
        <div class="strip"><div class="thumb"><img alt="" src="${url}"></div></div>
        <div class="acts">${k.pic.kind ? `<button class="btn sm" data-act="rco-pick" data-path="${esc(k.path)}" data-el="${k.pic.el}">${rep ? "Replace" : "Use my picture"}</button>` : ""}
          ${rep ? `<button class="btn sm ghost danger" data-act="rco-unpick" data-path="${esc(k.path)}" data-el="${k.pic.el}">Reset</button>` : ""}</div></div>`;
    }).join("")}</div>${more ? `<p class="note">and ${more} more.</p>` : ""}` : `<p class="note">No picture ${/^\d+$/.test(text) ? "has that number" : "matches"}.</p>`;
  } catch (e) { html = `<p class="note">${esc(e.message)}</p>`; }
  /* The section may have been redrawn, or the text changed, while reading. */
  const out = $("#rco-lookup-result");
  if (out && (state.rcoLookup || "").trim().toLowerCase() === text) out.innerHTML = html;
}

function aspectAssets(asp) { return asp.filter ? (state.assets || []).filter(asp.filter) : []; }

function aspectFlags() {

/* ================================================================ conversions (verified) */

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("could not read the image"));
    img.src = src;
  });
}

/* What a picture file really holds, from its first bytes: the console keeps
   the pictures it downloads from PlayStation Network as WebP or JPEG under

  return new Promise((resolve, reject) => {

const textureCache = new Map();

/* Encode an image into exactly the stock texture's format, size and mips,

/* The console's textures with see-through parts carry colour in their clear pixels too (so the edges blend

/* pad:begin */

/* Textures with see-through parts keep their transparency: the Appearance themes' panels and bars. */
const ALPHA_TEXTURE = /\/system\/vsh_asset\/(control_center_|homeui_)[^/]*$/;

async function textureForAsset(file, assetPath, progress) {
  const info = await api("GET", "/api/asset/texture", { path: assetPath });
  const alpha = ALPHA_TEXTURE.test(assetPath) && (info.dxgi === 98 || info.dxgi === 99);
  const place = alpha ? placementParams(placementFor(assetPath).mode, placementFor(assetPath).pad) : { fit: state.fit, pad: 0 };
  const keep = alpha && keepClearFor(assetPath);
  const key = `${info.header}|${info.dataLength}|${place.fit}|${alpha}|${place.pad}|${keep}|${file.name}|${file.size}|${file.lastModified}`;
  if (textureCache.has(key)) return textureCache.get(key);
  const bc7 = info.dxgi === 98 || info.dxgi === 99, bc1 = info.dxgi === 71 || info.dxgi === 72 || info.format === "DXT1";
  const rgba = info.dxgi === 28 || info.dxgi === 29, bgra = info.dxgi === 87 || info.dxgi === 91;
  if (!bc7 && !bc1 && !rgba && !bgra) throw new Error(`${info.format} textures are not supported yet`);
  const blockBytes = bc1 ? 8 : 16, encode = bc1 ? bc1Block : alpha ? bc7BlockAlpha : bc7Block, decode = bc1 ? bc1Decode : bc7DecodeMode6;
  if (info.array !== 1) throw new Error("texture arrays are not supported");

    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d", { colorSpace: "srgb", willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    if (!alpha) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h); }   /* with transparency, what the picture leaves bare stays clear */
    if (alpha) {

        const sc = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);

    if (alpha) bleedClear(pix, w, h);

      for (let i = 0; i < w * h; i++) {
        const s = i * 4;
        if (rgba) { data[o++] = pix[s]; data[o++] = pix[s + 1]; data[o++] = pix[s + 2]; data[o++] = 255; }
        else { data[o++] = pix[s + 2]; data[o++] = pix[s + 1]; data[o++] = pix[s]; data[o++] = 255; }

async function fileForAsset(file, asset) {
  if (asset.kind === "texture") return textureForAsset(file, asset.path, attachProgress);
  if (isImage(asset)) return imageForAsset(file, asset.path);
  if (asset.kind === "audio") return soundForAsset(file, asset.path);
  return file;  /* fonts, JSON, video: the console validates against the stock file */
}

let attachProgress = null;

/* Put one file onto a set of system assets (for example all size variants).
   `copies`: the same picture already written to that many other files, for
   a message that counts files instead of sizes. */
async function attachTo(assets, file, label, copies = null, remake = false) {
  const big = assets.length > 2 || assets.some(a => a.kind === "texture" || ext(a.path) === "at9");
  const p = big ? progressToast(`Adding ${label}…`) : null;
  let ok = 0, keptFirst = null;
  const errors = [];
  for (let i = 0; i < assets.length; i++) {
    const a = assets[i];
    attachProgress = p ? f => p.set(`Encoding ${baseName(a.path)}… ${Math.round(f * 100)}%`, (i + f) / assets.length) : null;
    try {
      const blob = await fileForAsset(file, a);
      if (p) p.set(`Sending ${baseName(a.path)} to the console…`, i / assets.length);
      await uploadVerified("/api/theme/file", { id: state.editId, path: a.path }, blob);
      state.files.add(a.path);
      if (!remake && state.keepOriginals && keepsOriginal(a) && blob !== file) {   /* so an option changed later needs no new upload */
        await keepSource(a.path, file, keptFirst);
        if (!keptFirst && state.sources.has(a.path)) keptFirst = a.path;
      }
      ok++;
    } catch (e) { errors.push(`${baseName(a.path)}: ${e.message}`); }
    if (p) p.set(`Adding ${label}… ${i + 1}/${assets.length}`, (i + 1) / assets.length);
  }
  stamp = Date.now();
  if (!remake && state.keepOriginals) await loadOriginals();
  /* The interface reads the Appearance artwork as it starts: it shows after rest mode. */
  const use = assets.some(a => APPEARANCE_RE.test(a.path))
    ? "Apply the theme, then put the console in rest mode and wake it to see the change." : "Apply the theme to use it.";
  const msg = errors.length
    ? `${label}: ${ok} of ${assets.length} added and verified. ${errors.slice(0, 2).join("; ")}`
    : copies !== null ? `${label} replaced in ${plural(ok + copies, "file")} and verified. ${use}`
    : `${label} added and verified${assets.length > 1 ? ` at ${plural(ok, "size")}` : ""}. ${use}`;
  const kind = errors.length ? (ok ? "" : "err") : "ok";
  if (p) p.done(msg, kind); else toast(msg, kind, errors.length ? 9000 : 4500);
  await refreshStatus();
  return ok;
}

/* After the Appearance artwork goes back to the console's own in the theme. */
function restReminder() {
  toast("Back to the console's own artwork in this theme. Apply the theme, then put the console in rest mode and wake it to see the change.", "ok", 7000);
}

async function removeMusic() {
  await api("DELETE", "/api/theme/music", { id: state.editId }).catch(() => {});
  await resetAssets([{ path: HOME_MUSIC }]);
}

async function resetAssets(assets) {
  const hadBackground = backgroundFile([...state.files]);
  for (const a of assets.filter(x => state.files.has(x.path))) {
    try { await api("DELETE", "/api/theme/file", { id: state.editId, path: a.path }); state.files.delete(a.path); state.sources.delete(a.path); }
    catch (e) { toast(e.message, "err"); }
  }
  await loadOriginals();
  stamp = Date.now();
  /* No background left: neither is the picture made from it. */
  if (hadBackground && !backgroundFile([...state.files])) await removePreview(state.editId, "background");
  else await refreshStatus();
}

/* ================================================================ preview pictures

   Each theme can have a picture for its library card: one made from its
   background when the background is added (kind "background"), and one the
   user chooses (kind "picture"), which is shown instead. */

const PREVIEW_W = 1280, PREVIEW_H = 720;

const PREVIEW_FILES = [["background", "preview.jpg"], ["picture", "picture.jpg"]];   /* in a theme .zip */
const coverUrl = t => `/api/theme/preview?${q({ id: t.id })}&v=${t.coverTime}-${stamp}`;

/* A 16:9 JPEG of an image, video frame or canvas, fitted as `fit`. */
async function previewJpeg(src, w, h, fit) {
  const c = document.createElement("canvas");
  c.width = PREVIEW_W; c.height = PREVIEW_H;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
  let dw = c.width, dh = c.height;
  if (fit !== "stretch") {
    const sc = (fit === "contain" ? Math.min : Math.max)(c.width / w, c.height / h);
    dw = w * sc; dh = h * sc;
  }
  ctx.drawImage(src, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
  const blob = await new Promise(resolve => c.toBlob(resolve, "image/jpeg", 0.85));
  if (!blob) throw new Error("this browser could not make the picture");
  await loadImage(URL.createObjectURL(blob)).then(img => URL.revokeObjectURL(img.src));  /* check it reads back */
  return blob;
}

/* A frame from a little way into a video (backgrounds often fade in). */
function videoFrame(url) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    const timer = setTimeout(() => reject(new Error("could not read the video")), 10000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 0) / 3); };
    v.onseeked = () => { clearTimeout(timer); resolve(v); };
    v.onerror = () => { clearTimeout(timer); reject(new Error("could not read the video")); };
    v.src = url;
  });
}

async function previewSource(url, isVideo) {
  if (isVideo) { const v = await videoFrame(url); return [v, v.videoWidth, v.videoHeight]; }
  const img = await loadImage(url);
  return [img, img.naturalWidth, img.naturalHeight];
}

async function savePreview(id, kind, blob) {
  await uploadVerified("/api/theme/preview", { id, kind }, blob);
  stamp = Date.now();
  await refreshStatus();
  if (state.route === "edit" && state.editId === id && $("#cover-panel")) $("#cover-panel").innerHTML = coverPanel(themeById(id));
}

async function removePreview(id, kind) {
  await api("DELETE", "/api/theme/preview", { id, kind }).catch(() => {});
  stamp = Date.now();
  await refreshStatus();
  if (state.route === "edit" && state.editId === id && $("#cover-panel")) $("#cover-panel").innerHTML = coverPanel(themeById(id));
}

/* After a background is added: the same picture, fitted as the background was. */
async function previewFromFile(id, file, isVideo) {
  const url = URL.createObjectURL(file);
  try {
    const [src, w, h] = await previewSource(url, isVideo);
    await savePreview(id, "background", await previewJpeg(src, w, h, state.fit));
  } catch (e) {
    console.warn("preview picture:", e);
  } finally { URL.revokeObjectURL(url); }
}

/* ---- reading a theme's own background back (themes made before previews) */

/* The content of a zstd frame made of raw and RLE blocks, which is how this
   builder stores textures. Compressed blocks are not read. */
function unzstdStored(b) {
  if (b[0] !== 0x28 || b[1] !== 0xb5 || b[2] !== 0x2f || b[3] !== 0xfd) throw new Error("not zstd");
  const fhd = b[4], single = (fhd >> 5) & 1, fcs = [single ? 1 : 0, 2, 4, 8][fhd >> 6];
  let o = 5 + (single ? 0 : 1) + [0, 1, 2, 4][fhd & 3] + fcs;
  const parts = [];
  for (;;) {
    if (o + 3 > b.length) throw new Error("truncated zstd");
    const h = b[o] | (b[o + 1] << 8) | (b[o + 2] << 16), type = (h >> 1) & 3, size = h >>> 3;
    o += 3;
    if (type === 0) { parts.push(b.subarray(o, o + size)); o += size; }
    else if (type === 1) { parts.push(new Uint8Array(size).fill(b[o])); o += 1; }
    else throw new Error("compressed zstd");
    if (h & 1) break;
  }
  const out = new Uint8Array(parts.reduce((n, x) => n + x.length, 0));
  let w = 0;
  for (const x of parts) { out.set(x, w); w += x.length; }
  return out;
}

/* The top level of a DDS texture as a canvas: BC7 (as this builder encodes
   it), RGBA8 or BGRA8. `keepAlpha`: BC7 with its see-through parts, for a picture taken back out of a texture. */
async function ddsCanvas(bytes, keepAlpha = false) {
  const d = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (d.getUint32(0, true) !== 0x20534444) throw new Error("not a DDS texture");
  const h = d.getUint32(12, true), w = d.getUint32(16, true);
  const fourcc = d.getUint32(84, true), dx10 = fourcc === 0x30315844;
  let dxgi = dx10 ? d.getUint32(128, true) : 0;
  if (!dx10 && d.getUint32(88, true) === 32) dxgi = d.getUint32(92, true) === 0xff ? 28 : d.getUint32(92, true) === 0xff0000 ? 87 : 0;
  const data = bytes.subarray(dx10 ? 148 : 128);
  if (!w || !h || w > 8192 || h > 8192) throw new Error("unexpected texture size");
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(w, h), px = img.data;
  if (dxgi === 98 || dxgi === 99) {
    const bw = Math.ceil(w / 4), bh = Math.ceil(h / 4), block = new Uint8Array(64);
    if (data.length < bw * bh * 16) throw new Error("texture is truncated");
    let last = performance.now();
    for (let by = 0; by < bh; by++) {
      for (let bx = 0; bx < bw; bx++) {
        if (!bc7DecodeMode6(data, (by * bw + bx) * 16, block)) throw new Error("texture uses BC7 modes this preview can't read");
        for (let y = 0; y < 4 && by * 4 + y < h; y++) {
          for (let x = 0; x < 4 && bx * 4 + x < w; x++) {
            const s = (y * 4 + x) * 4, t = ((by * 4 + y) * w + bx * 4 + x) * 4;
            px[t] = block[s]; px[t + 1] = block[s + 1]; px[t + 2] = block[s + 2]; px[t + 3] = keepAlpha ? block[s + 3] : 255;
          }
        }
      }
      if (performance.now() - last > 50) { await nextTask(); last = performance.now(); }
    }
  } else if (dxgi === 28 || dxgi === 29 || dxgi === 87 || dxgi === 91) {
    if (data.length < w * h * 4) throw new Error("texture is truncated");
    const bgra = dxgi === 87 || dxgi === 91;
    for (let i = 0; i < w * h * 4; i += 4) {
      px[i] = data[i + (bgra ? 2 : 0)]; px[i + 1] = data[i + 1]; px[i + 2] = data[i + (bgra ? 0 : 2)]; px[i + 3] = 255;
    }
  } else throw new Error("texture format not readable here");
  ctx.putImageData(img, 0, 0);
  return c;
}

/* The theme's home background, preferring the default home screen one. */
function backgroundFile(paths) {
  const bgs = paths.filter(p => BG_RE.test(p));
  const rank = p => areaOf(p) === "Home: default background" ? 0 : areaOf(p).startsWith("Home:") ? 1 : 2;
  return bgs.sort((a, b) => rank(a) - rank(b))[0] || null;
}

async function previewFromTheme(id) {
  const { files } = await api("GET", "/api/theme/files", { id });
  const path = backgroundFile(files.map(f => f.path));
  if (!path) return false;
  const url = `/api/theme/file?${q({ id, path })}`;
  let src, w, h;
  if (/\.dds(\.zst)?$/i.test(path)) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("could not read the background");
    let bytes = new Uint8Array(await res.arrayBuffer());
    if (/\.zst$/i.test(path)) bytes = unzstdStored(bytes);
    src = await ddsCanvas(bytes); w = src.width; h = src.height;
  } else {
    [src, w, h] = await previewSource(url, /\.(mp4|webm|m4v)$/i.test(path));
  }
  await savePreview(id, "background", await previewJpeg(src, w, h, "stretch"));
  return true;
}

/* Themes made before preview pictures: make one from the background, once
   per visit. Quietly does nothing when it can't. */
const previewTried = new Set();
let previewFilling = false;
async function fillMissingPreviews() {
  if (previewFilling) return;
  previewFilling = true;
  try {
    for (const t of state.status.themes) {
      if (t.cover || !t.files || previewTried.has(t.id)) continue;
      previewTried.add(t.id);
      try {
        const el = await previewFromTheme(t.id) && document.querySelector(`[data-cover="${CSS.escape(t.id)}"]`);
        if (el && themeById(t.id)) el.outerHTML = cardPreview(themeById(t.id));
      } catch (e) { console.warn(`preview picture for ${t.id}:`, e); }
    }
  } finally { previewFilling = false; }
}

function coverPanel(t) {
  const text = t.cover === "picture"
    ? "Your picture, shown on this theme's card in the library. Remove it to show the background instead."
    : t.cover === "background"
      ? "Made from the background and shown on this theme's card in the library. You can choose another picture, such as a photo of your home screen with the theme applied."
      : "Shown on this theme's card in the library, so you can tell your themes apart. It's made from the background when you add one, or choose any picture.";
  return `
    <div class="cover">${t.cover ? `<img alt="Preview of ${esc(t.name)}" src="${coverUrl(t)}">` : "No picture yet"}</div>
    <div class="text"><h2>Preview picture</h2><div class="sub">${esc(text)}</div>
      <div class="acts"><button class="btn sm" data-act="choose-cover">Choose picture</button>
        ${t.cover === "picture" ? `<button class="btn sm ghost danger" data-act="remove-cover">Remove picture</button>` : ""}</div></div>`;
}

async function chooseCover() {
  const id = state.editId;
  const file = await pickFile("image/*");
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const [img, w, h] = await previewSource(url, false);
    await savePreview(id, "picture", await previewJpeg(img, w, h, "cover"));
    toast("Preview picture set.", "ok");
  } catch (e) {
    toast(e.message, "err");
  } finally { URL.revokeObjectURL(url); }
}

/* ================================================================ editor (theme builder) */

async function renderEditor() {
  const themes = state.status.themes;
  if (!themes.length) {
    view.innerHTML = `<div class="empty"><h2>Nothing to edit yet</h2>
      <p class="muted" style="margin:0">Create a theme first, then choose what it changes.</p>
      <button class="btn primary" data-act="new-from-editor">New theme</button></div>`;
    return;
  }
  if (!themeById(state.editId)) state.editId = themes[0].id;
  const t = themeById(state.editId);
  view.innerHTML = `<p class="muted">Loading…</p>`;
  await Promise.all([loadAssets(), loadThemeFiles(t.id)]);
  const on = state.status.applied === t.id;
  const fwAny = t.fw === "any";

  view.innerHTML = `
    <div class="head">
      <h1>Edit</h1>
      <select id="theme-select" aria-label="Theme" style="width:auto">${themes.map(x =>
        `<option value="${esc(x.id)}" ${x.id === t.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
      <span class="spacer"></span>
      <button class="btn ghost" data-act="export" data-id="${esc(t.id)}" id="edit-export" ${t.files || t.music ? "" : "disabled"}>Export</button>
      <button class="btn primary" data-act="apply" data-id="${esc(t.id)}" id="edit-apply" ${t.compatible && (t.files || t.music) ? "" : "disabled"}>${on ? "Re-apply to console" : "Apply to console"}</button>
    </div>
    ${on ? resultBanner() : ""}
    ${isLocal() && /PlayStation/i.test(navigator.userAgent)
      ? `<div class="banner">Attaching files is easiest from a computer or phone: open <b>http://${esc(state.status.ip)}:8095</b>.</div>` : ""}
    <div class="panel builder-head">
      <label class="field"><span>Name${help("The theme's name, shown in the library and in the console's notifications.")}</span><input type="text" id="theme-name" maxlength="60" value="${esc(t.name)}"></label>
      <label class="field"><span>Firmware${help("The firmware the theme is for. It is applied only on a console with that firmware, unless you choose Any firmware; then each file is still checked against the console's own, and one that no longer matches is skipped.")}</span>
        <select id="theme-fw">
          <option value="${esc(state.status.fw)}" ${!fwAny ? "selected" : ""}>This console (${esc(state.status.fw)})</option>
          <option value="any" ${fwAny ? "selected" : ""}>Any firmware</option>
        </select></label>
      <label class="field"><span>How images are fitted${help("How a picture that isn't the shape of the file it replaces is fitted: Fill crops its edges, Fit keeps all of it with bars, Stretch squeezes it. Changing it makes the pictures and textures in this theme again from their kept originals. The Appearance pieces have their own placement.")}</span>
        <select id="fit">${[["cover", "Fill (crop edges)"], ["contain", "Fit (keep all)"], ["stretch", "Stretch"]]
          .map(([v, l]) => `<option value="${v}" ${state.fit === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="field" id="originals-field">${originalsField()}</div>
    </div>
    <section class="panel cover-panel" id="cover-panel">${coverPanel(t)}</section>
    ${state.assetsError ? `<div class="banner err">${esc(state.assetsError)}. Restart the plugin once with the stock theme to list the system assets.</div>` : ""}
    <div class="aspects">${ASPECTS.map(a => `<section class="aspect" id="aspect-${a.id}"></section>`).join("")}</div>
    <div class="savebar" id="savebar" role="region" aria-label="Unsaved changes" ${t.unsaved ? "" : "hidden"}>
      <div class="text"><b>Unsaved changes</b><span>Save to keep them, or discard them to go back to the last save.</span></div>
      <button class="btn ghost" data-act="discard" data-id="${esc(t.id)}" id="discard-btn">Discard</button>
      <button class="btn primary" data-act="save" data-id="${esc(t.id)}">Save</button>
    </div>
    <p class="note" style="margin-top:18px">Only media can be themed. ${state.protectedCount ? `${plural(state.protectedCount, "system file")} (code and libraries) are protected and never changed. ` : ""}Every file is checked against the system file it replaces, on upload and again when the theme is applied.</p>`;
  ASPECTS.forEach(renderAspect);
}

function renderAspect(asp) {
  const el = $(`#aspect-${asp.id}`);
  if (!el) return;
  const on = aspectOn(asp);
  const replaced = aspectReplaced(asp);
  let summary;
  if (asp.mode === "music") {
    const t = themeById(state.editId);
    summary = state.files.has(HOME_MUSIC) ? `${t.music ? fmtTime(t.music) + " · " : ""}${gainLabel(t.gain || 0)}`
      : t.music ? "Not converted to home music yet" : "No music yet";
  } else {
    const total = aspectAssets(asp).length;
    summary = total ? `${replaced} of ${plural(total, "file")} replaced` : "None on this firmware";
  }
  const confirming = state.confirming === asp.id;
  el.innerHTML = `
    <div class="aspect-head">
      <button class="switch" role="switch" aria-checked="${on}" aria-label="${esc(asp.title)}" data-act="toggle" data-aspect="${asp.id}"></button>
      <div class="text"><h2>${esc(asp.title)}${help(asp.sub)}</h2><div class="sub">${esc(on ? summary : asp.sub)}</div></div>
      ${confirming ? `<div class="confirm">Remove ${asp.mode === "music" ? "the music" : plural(replaced, "replaced file")}?
        <button class="btn sm danger armed" data-act="confirm-off" data-aspect="${asp.id}">Remove</button>
        <button class="btn sm ghost" data-act="cancel-off" data-aspect="${asp.id}">Keep</button></div>` : ""}
    </div>
    <div class="aspect-body" ${on ? "" : "hidden"}>${on ? aspectBody(asp) : ""}</div>`;
  if (asp.mode === "music" && state.trim) setupTrim();
}

/* What a piece in a list is and what replacing it changes, for its help mark. */
function assetHelp(asp, a) {
  const m = APPEARANCE_RE.exec(a.path);
  if (m) {
    const theme = `the ${APPEARANCE_THEMES[m[2]] || m[2]} Appearance theme`;
    const what = m[1] === "homeui" ? "The artwork that hangs from the top of the home screen"
      : m[3] === "top" ? "The corner piece behind the clock and the search and settings icons"
      : "The panel behind the Control Center's row of icons (the menu the PS button opens)";
    return `${what}, for ${theme}. It shows only while that theme is selected in Settings > Appearance and Sound, after rest mode.`;
  }
  if (asp.id === "fonts") {
    return `${fontName(a.path)} (${baseName(a.path)}). ${FONT_HOME.test(baseName(a.path)) ? "The home screen and Settings draw their text in it." : "Web pages use it; the home screen doesn't."} Replace it with a TTF or OTF font: it goes only into the home screen, never into games, and shows after rest mode.`;
  }
  const kinds = {
    audio: "A system sound or music clip. Your audio is converted to its format (WAV or ATRAC9) and loudness.",
    texture: "A texture the interface draws. Your picture is encoded to its exact format and size.",
    image: "A picture the interface shows. Your image is fitted to its size and written in its exact format.",
    svg: "A vector picture the interface shows. Your image is drawn inside the console's own SVG.",
    video: "A video clip. Use a clip in the same container (MP4 or WebM).",
    json: "An animation or data file. It must keep the same structure and canvas size.",
  };
  return `${kinds[a.kind] || "A file the interface uses. It is checked against the console's own before it is accepted."} (${baseName(a.path)})`;
}

function dropZone(asp, title, detail) {
  return `<div class="drop-zone" data-drop="${asp.id}">
      <div class="text"><div class="title">${esc(title)}</div><div class="note">${esc(detail)}</div></div>
      <button class="btn" data-act="attach-aspect" data-aspect="${asp.id}">Choose file</button>
    </div>`;
}

function thumbFor(a) {
  const rep = state.files.has(a.path);
  if (!isImage(a)) return `<div class="thumb${rep ? " replaced" : ""}"><span>${esc(a.kind === "texture" ? "DDS" : ext(a.path) || "file")}</span></div>`;
  const src = rep ? `/api/theme/file?${q({ id: state.editId, path: a.path })}&v=${stamp}` : `/api/asset?${q({ path: a.path })}`;
  return `<div class="thumb${rep ? " replaced" : ""}"><img loading="lazy" alt="" src="${esc(src)}"></div>`;
}

function aspectBody(asp) {
  if (asp.mode === "music") return musicBody();
  if (!state.assets) return `<p class="note">The system asset list is not available yet.</p>`;
  if (asp.mode === "rco") { setTimeout(rcoLookup); return rcoBody(asp); }
  if (asp.mode === "systiles") return tilesBody(asp);
  if (asp.mode === "titles") return titlesBody(asp);
  const all = aspectAssets(asp);
  if (!all.length) return `<p class="note">This firmware has no ${esc(asp.title.toLowerCase())} that can be themed. Anything else replaceable is under Other images.</p>`;

  if (asp.mode === "single") {
    const off = bgOff();
    const areas = new Map();
    for (const a of all) {
      const k = areaOf(a.path);
      if (!areas.has(k)) areas.set(k, []);
      areas.get(k).push(a);
    }
    const chosen = all.filter(a => !off.has(areaOf(a.path)));
    const replaced = all.filter(a => state.files.has(a.path)).length;
    return `${dropZone(asp, "Drop an image or video here",
        chosen.length ? `Goes to ${plural(chosen.length, "file")} in the areas switched on below, each at its own size.` : "Switch on at least one area below.")}
      <p class="note">Choose where your background is used:${help("Each area is a place the home screen shows a background: the default background, the Game Library, a tile's background while that tile is selected, and others. Your picture goes to the areas switched on, made at each one's own size.")}</p>
      <div class="rows">${[...areas.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([name, list]) => {
        const on = !off.has(name), rep = list.filter(a => state.files.has(a.path)).length;
        return `<div class="row-item${rep ? " replaced" : ""}">
          <div class="info" style="display:flex;gap:14px;align-items:center;min-width:0">
            <button class="switch" role="switch" aria-checked="${on}" aria-label="${esc(name)}" data-act="toggle-area" data-area="${esc(name)}"></button>
            <div style="min-width:0"><div class="file">${esc(name)}${rep ? ` <span class="tag on">Replaced</span>` : ""}</div>
              <div class="dir">${plural(list.length, "file")}</div></div>
          </div>
          <div class="strip">${list.slice(0, 4).map(thumbFor).join("")}</div>
        </div>`;
      }).join("")}</div>
      ${replaced ? `<div><button class="btn sm ghost danger" data-act="reset-aspect" data-aspect="${asp.id}">Reset background</button></div>` : ""}`;
  }

  const groupsAll = groupAssets(all);
  const filter = (state.filters[asp.id] || "").toLowerCase();
  const groups = filter ? groupsAll.filter(g => g.key.toLowerCase().includes(filter)) : groupsAll;
  const page = state.pages[asp.id] || 48;
  const shown = groups.slice(0, page);
  const search = groupsAll.length > 12
    ? `<div class="toolbar"><input type="search" data-filter-aspect="${asp.id}" placeholder="Search ${esc(asp.title.toLowerCase())}" value="${esc(state.filters[asp.id] || "")}" aria-label="Search ${esc(asp.title)}"></div>` : "";
  const more = groups.length > page ? `<div><button class="btn sm" data-act="more" data-aspect="${asp.id}">Show more (${groups.length - page})</button></div>` : "";
  if (!groups.length) return `${search}<p class="note">Nothing matches.</p>`;

  if (asp.mode === "tiles") {
    return `${search}<p class="note">Click an item to attach a file, or drop one on it.</p>
      <div class="tiles">${shown.map(g => {
        const rep = g.assets.filter(a => state.files.has(a.path)).length;
        return `<button class="tile${rep ? " replaced" : ""}" data-group="${esc(g.key)}" data-aspect="${asp.id}" title="${esc(g.key)}">
          ${rep ? `<span class="tag on">Replaced</span>` : ""}
          ${thumbFor(g.assets.find(a => state.files.has(a.path)) || g.assets[0])}
          <div class="file">${esc(g.name)}</div>
          <div class="meta">${g.assets.length > 1 ? plural(g.assets.length, "size") : fmtSize(g.assets[0].size)}</div>
        </button>`;
      }).join("")}</div>${more}
      ${all.some(a => state.files.has(a.path)) ? `<div><button class="btn sm ghost danger" data-act="reset-aspect" data-aspect="${asp.id}">Reset all ${esc(asp.title.toLowerCase())}</button></div>` : ""}`;
  }

  const appearanceNote = asp.id === "appearance" ? `<p class="note">Shown only while that theme is selected in <b>Settings &gt; Appearance and Sound</b>, after rest mode. A PNG keeps its see-through parts.${help("Each picture is encoded to the texture's exact format and size (the panels are about 2560 pixels wide) and keeps its transparency. A change to Placement, padding or the clock band takes effect at once: the texture is made again from the original the theme keeps. If one doesn't, change the option and attach the picture again.")}</p>` : "";
  const fontNote = asp.id === "fonts" ? `<p class="note">A .ttf or .otf font, for the home screen only (never games). The home screen draws in the weights marked <b>Home screen</b>; it shows after rest mode.${help("The font needs the full Latin alphabet, digits and punctuation; fonts in other formats, damaged ones and ones without those characters are refused. On firmware 13.42 the home screen and Settings use the light and bold weights; the regular and medium Latin fonts are used by web pages only. If the home screen keeps restarting with a font, the plugin takes the theme down by itself.")}</p>
    <div class="toolbar"><button class="btn" data-act="fonts-latin" data-aspect="fonts">Use one font for all Latin interface text</button></div>` : "";
  const list = asp.id === "fonts"

        <div class="acts">${play}${isAppearance ? (() => {

            <select data-place="${esc(a0.path)}" aria-label="Placement">

""}`;
        })() : ""}
          <button class="btn sm" data-act="attach-group" data-group="${esc(g.key)}" data-aspect="${asp.id}">${rep ? "Replace" : "Attach"}</button>

const gainLabel = g => (g ? `${g > 0 ? "+" : "−"}${Math.abs(g)} dB` : "same loudness as the console's music");

function musicBody() {

      <div class="acts">

        <button class="btn sm primary" data-act="convert-music" id="home-music-fix" hidden>Encode again</button>
