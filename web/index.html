/* A font of this theme, loaded so the page can draw with it (the list's "Aa", the Fonts part's samples): its record
   { family, ready, failed }, loading it the first time. With no path, the font the home screen uses most. */
const fontFaces = new Map();
function fontRec(path = null) {
  const a = path ? { path } : aspectAssets(aspectById("fonts")).filter(x => state.files.has(x.path))
    .sort((x, y) => fontRank(x) - fontRank(y))[0];
  if (!a || typeof FontFace !== "function") return null;
  const key = `${state.editId}|${a.path}|${stamp}`;
  if (fontFaces.has(key)) return fontFaces.get(key);
  const rec = { family: `theme-font-${fontFaces.size + 1}`, ready: false, failed: false };
  fontFaces.set(key, rec);
  const redraw = () => { syncNav("fonts"); if ($("#aspect-fonts")) renderAspect(aspectById("fonts")); };
  new FontFace(rec.family, `url("/api/theme/file?${q({ id: state.editId, path: a.path })}&v=${stamp}")`).load()
    .then(face => { document.fonts.add(face); rec.ready = true; redraw(); })
    .catch(() => { rec.failed = true; redraw(); });   /* this browser can't draw it; the console may still */
  return rec;
}
function themeFontFamily(path = null) {
  const rec = fontRec(path);
  return rec && rec.ready ? rec.family : "";
}

/* What a piece in a list is and what replacing it changes, for its help mark. */
function assetHelp(asp, a) {
  const m = APPEARANCE_RE.exec(a.path);
  if (m) {
    const theme = `the ${APPEARANCE_THEMES[m[2]] || m[2]} Appearance theme`;
    const what = m[1] === "homeui" ? "The artwork that hangs from the top of the home screen"
      : m[3] === "top" ? "The corner piece behind the clock and the search and settings icons"
      : "The panel behind the Control Center's row of icons (the menu the PS button opens)";
    return `${what}, for ${theme}. It shows only while that theme is selected in Settings > Appearance and Sound, after rest mode.`;
  }
  if (asp.id === "fonts") {
    return `${fontName(a.path)} (${baseName(a.path)}). ${FONT_HOME.test(baseName(a.path)) ? "The home screen and Settings draw their text in it." : "Web pages use it; the home screen doesn't."} Replace it with a TTF or OTF font: it goes only into the home screen, never into games, and shows after rest mode.`;
  }
  const kinds = {
    audio: "One of the console's sounds. Your audio is converted to its format and loudness.",
    texture: "A picture the interface draws. Yours is made in its exact format and size.",
    image: "A picture the interface shows. Your image is fitted to its size and written in its exact format.",
    svg: "A vector picture the interface shows. Your image is drawn inside the console's own SVG.",
    video: "A video clip. Use a clip in the same container (MP4 or WebM).",
    json: "An animation or data file. It must keep the same structure and canvas size.",
  };
  return `${kinds[a.kind] || "A file the interface uses. It is checked against the console's own before it is accepted."} (${baseName(a.path)})`;
}

function dropZone(asp, title, detail) {
  return `<div class="drop-zone" data-drop="${asp.id}">
      <div class="text"><div class="title">${esc(title)}</div><div class="note">${esc(detail)}</div></div>
      <button class="btn" data-act="attach-aspect" data-aspect="${asp.id}">Choose file</button>
    </div>`;
}

/* A piece's picture: the theme's, the one you attached (kept with the theme) where the browser can't show the console's
   format, or the console's own. A piece with no picture to show has a drawing of its kind. */
const KIND_GLYPH = { texture: "images", audio: "sounds", font: "fonts", video: "video", json: "animations", rco: "interface" };
function thumbFor(a) {
  const rep = state.files.has(a.path);
  const cls = `thumb${rep ? " replaced" : ""}`;
  if (!isImage(a)) {
    if (rep && state.sources.has(a.path)) {
      return `<div class="${cls}"><img loading="lazy" alt="" src="${esc(`/api/theme/source?${q({ id: state.editId, path: a.path })}&v=${stamp}`)}"></div>`;
    }
    const what = a.kind === "texture" ? (rep ? "Your picture (not kept with the theme)" : "The console's picture") : ext(a.path).toUpperCase() || "File";
    return `<div class="${cls} glyph" title="${esc(what)}">${partIcon(KIND_GLYPH[a.kind] || "images")}</div>`;
  }
  const src = rep ? `/api/theme/file?${q({ id: state.editId, path: a.path })}&v=${stamp}` : `/api/asset?${q({ path: a.path })}`;
  return `<div class="${cls}"><img loading="lazy" alt="" src="${esc(src)}" onerror="this.remove()"></div>`;
}

/* A background area's name as people know it: a tile's area by the tile's name once it is read. */
function areaLabel(name) {
  const m = /^Home: (NPXS\d+) tile$/.exec(name);
  if (m) {
    const t = state.tileNames && state.tileNames.get(m[1]);
    return t ? `Home: ${t} tile` : `Home: a system tile (${m[1]})`;
  }
  if (name === "Image load error placeholder") return "Shown when a picture can't load";
  if (name === "System (VSH)") return "Other system backgrounds";
  return name;
}

/* A sound file by when it plays, where that's known (docs/home-music.md); otherwise its file name. */
const SOUND_FILES = {
  "sfx_warmboot.at9": "Waking from rest mode", "sfx_coldboot.at9": "Switching on (plays before the plugin starts)",
  "sfx_initialboot.at9": "First start, during set-up", "sfx_transition.at9": "A soft swell (when it plays isn't known yet)",
};
const soundName = path => SOUND_FILES[baseName(path)] || baseName(path);

/* A part's rows in groups people look for them by: fonts by where they are used, Appearance pieces by look. Each
   group folds; it opens when it is the first one or holds something replaced, and stays as it was left. A search
   shows its matches in one list. */
const FONT_LANGS = /^(Arabic|Thai|Vietnamese|Japanese|Korean|Chinese)/;
const ROW_GROUPS = {
  fonts: {
    of: g => { const b = baseName(g.assets[0].path), n = fontName(g.assets[0].path);
      return FONT_HOME.test(b) && FONT_LATIN.test(b) ? "home" : FONT_LANGS.test(n) ? "langs" : FONT_LATIN.test(b) || /^Interface text/.test(n) ? "latin" : "other"; },
    groups: [["home", "Home screen and Settings (Latin)"], ["latin", "Other Latin weights, for web pages"], ["langs", "Other languages"], ["other", "Other fonts"]],
  },
  appearance: {
    of: g => (APPEARANCE_RE.exec(g.assets[0].path) || [])[2] || "other",
    groups: [["ps", "PlayStation look"], ["ps2", "PlayStation 2 look"], ["ps3", "PlayStation 3 look"], ["ps4", "PlayStation 4 look"], ["other", "Other"]],
  },
};
function rowsGrouped(asp, list, filter, render) {
  const spec = ROW_GROUPS[asp.id];
  const flat = () => `<div class="rows">${list.map(render).join("")}</div>`;
  if (!spec || filter) return flat();
  const parts = spec.groups.map(([key, title]) => ({ key, title, items: list.filter(g => spec.of(g) === key) })).filter(x => x.items.length);
  if (parts.length < 2) return flat();
  const opened = state.foldOpen || (state.foldOpen = {});
  return `<div class="folds">${parts.map((x, i) => {
    const rep = x.items.filter(g => g.assets.some(a => state.files.has(a.path))).length;
    const key = `${asp.id}:${x.key}`;
    const open = key in opened ? opened[key] : i === 0 || rep > 0 || (asp.id === "appearance" && x.key === apView.look);
    return `<details class="fold" data-fold="${esc(key)}"${open ? " open" : ""}>
      <summary><span class="fold-title">${esc(x.title)}</span><span class="fold-count">${plural(x.items.length, asp.id === "fonts" ? "font" : "piece")}${rep ? ` · ${rep} replaced` : ""}</span></summary>
      <div class="rows">${x.items.map(render).join("")}</div></details>`;
  }).join("")}</div>`;
}

/* A line of the console's own words in a font the theme gives it. */
function fontSample(path) {
  const rec = fontRec(path);
  if (!rec || rec.failed) return `<div class="note">This browser can't draw this font, so there is no sample.</div>`;
  return rec.ready ? `<div class="font-sample" style="font-family:'${rec.family}'">Game Library  ·  Settings  ·  12:45</div>`
    : `<div class="note">Loading a sample…</div>`;
}

function aspectBody(asp) {
  if (asp.mode === "music") return musicBody();
  if (!state.assets) return `<p class="note">The system asset list is not available yet.</p>`;
  if (asp.mode === "rco") { setTimeout(rcoLookup); return rcoBody(asp); }
  if (asp.mode === "systiles") return tilesBody(asp);
  if (asp.mode === "titles") return titlesBody(asp);
  /* Sounds: the interface's own sounds follow the sound files */
  const uiBox = asp.id === "sounds" ? `<div id="ui-sounds">${uiSoundsBox()}</div>` : "";
  if (uiBox) setTimeout(uiSoundsShow);
  const all = aspectAssets(asp);
  if (!all.length) return `<p class="note">This firmware has no ${esc(asp.title.toLowerCase())} that can be themed. Anything else replaceable is under Other images.</p>${uiBox}`;

  if (asp.mode === "single") {
    tileNamesEnsure();
    const off = bgOff();
    const areas = new Map();
    for (const a of all) {
      const k = areaOf(a.path);
      if (!areas.has(k)) areas.set(k, []);
      areas.get(k).push(a);
    }
    const chosen = all.filter(a => !off.has(areaOf(a.path)));
    return `${dropZone(asp, "Drop an image or video here",
        chosen.length ? `Goes to ${plural(chosen.length, "file")} in the areas switched on below, each at its own size.` : "Switch on at least one area below.")}
      <p class="note">Choose where your background is used:${help("Each area is a place the home screen shows a background: the default background, the Game Library, a tile's background while that tile is selected, and others. Your picture goes to the areas switched on, made at each one's own size.")}</p>
      <div class="rows">${[...areas.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([name, list]) => {
        const on = !off.has(name), rep = list.filter(a => state.files.has(a.path)).length;
        return `<div class="row-item${rep ? " replaced" : ""}">
          <div class="info" style="display:flex;gap:14px;align-items:center;min-width:0">
            <button class="switch" role="switch" aria-checked="${on}" aria-label="${esc(areaLabel(name))}" data-act="toggle-area" data-area="${esc(name)}"></button>
            <div style="min-width:0"><div class="file">${esc(areaLabel(name))}${rep ? ` <span class="tag on">Replaced</span>` : ""}</div>
              <div class="dir">${plural(list.length, "file")}</div></div>
          </div>
          <div class="strip">${list.slice(0, 4).map(thumbFor).join("")}</div>
        </div>`;
      }).join("")}</div>
`;
  }

  const groupsAll = groupAssets(all);
  const filter = (state.filters[asp.id] || "").toLowerCase();
  const groups = filter ? groupsAll.filter(g => g.key.toLowerCase().includes(filter)) : groupsAll;
  const page = state.pages[asp.id] || 48;
  const shown = groups.slice(0, page);
  const search = groupsAll.length > 12
    ? `<div class="toolbar"><input type="search" data-filter-aspect="${asp.id}" placeholder="Search ${esc(asp.title.toLowerCase())}" value="${esc(state.filters[asp.id] || "")}" aria-label="Search ${esc(asp.title)}"></div>` : "";
  const more = groups.length > page ? `<div><button class="btn sm" data-act="more" data-aspect="${asp.id}">Show more (${groups.length - page})</button></div>` : "";
  if (!groups.length) return `${search}<p class="note">Nothing matches.</p>`;

  if (asp.mode === "tiles") {
    return `${search}<p class="note">Select one to replace it, or drop a picture on it.</p>
      <div class="tiles">${shown.map(g => {
        const rep = g.assets.filter(a => state.files.has(a.path)).length;
        return `<button class="tile${rep ? " replaced" : ""}" data-group="${esc(g.key)}" data-aspect="${asp.id}" title="${esc(g.key)}">
          ${rep ? `<span class="tag on">Replaced</span>` : ""}
          ${thumbFor(g.assets.find(a => state.files.has(a.path)) || g.assets[0])}
          <div class="file">${esc(g.name)}</div>
          <div class="meta">${g.assets.length > 1 ? plural(g.assets.length, "size") : fmtSize(g.assets[0].size)}</div>
        </button>`;
      }).join("")}</div>${more}
`;
  }

    <div class="toolbar"><button class="btn" data-act="fonts-latin" data-aspect="fonts">Use one font for all Latin interface text</button></div>` : "";
  const list = asp.id === "fonts"

  /* Sounds: the interface's sounds (moving, selecting, going back) first, as people mean them; the sound files after */

      return `<div class="row-item${rep ? " replaced" : ""}" data-drop-group="${esc(g.key)}" data-aspect="${asp.id}">
        <div class="info"><div class="file">${esc(isFont ? fontName(a0.path) : isAppearance ? appearanceName(a0.path) : isSound ? soundName(a0.path) : g.name)}${help(assetHelp(asp, a0))}${isFont && FONT_HOME.test(baseName(a0.path)) ? ` <span class="tag">Home screen</span>` : ""}${rep ? ` <span class="tag on">Replaced</span>` : ""}</div>
          <div class="dir">${isFont || isAppearance || isSound ? `${esc(baseName(a0.path))} · ${fmtSize(a0.size)}` : esc(g.dir)}${g.assets.length > 1 ? ` · ${plural(g.assets.length, "variant")}` : ""}</div>${isFont && rep ? fontSample(a0.path) : ""}${
          isAppearance && textureAnchor(a0.path).band ? `<label class="note check"><input type="checkbox" data-keep="${esc(a0.path)}"${keepClearFor(a0.path) ? " checked" : ""}> Keep the clock and icons clear${help("The clock and the search and settings icons are drawn over the top of this piece: a white or solid picture there hides them. On, the top 26% is left empty and the picture goes below it.")}</label>` : ""}</div>
        <div class="acts">${play}${isAppearance ? (() => {

            <input type="number" min="0" max="40" step="1" value="${pl.pad}" data-pad="${esc(a0.path)}" style="width:64px" aria-label="Padding in percent"> %</label>` : "";

            <input type="number" min="0" max="40" step="1" value="${pl.pad}" data-pad="${esc(a0.path)}" style="width:64px" aria-label="Padding in percent"> %</label>` : ""}${

""}`;
        })() : ""}
          <button class="btn sm" data-act="attach-group" data-group="${esc(g.key)}" data-aspect="${asp.id}">${rep ? "Replace" : "Attach"}</button>

const gainLabel = g => (g ? `${g > 0 ? "+" : "−"}${Math.abs(g)} dB` : "same loudness as the console's music");

function musicBody() {
  const t = themeById(state.editId);
  if (state.assets && !state.assets.some(a => a.path === HOME_MUSIC)) {
    return `<p class="note">This firmware has no home music file (bgm_home.at9) to replace.</p>`;
  }
  if (state.trim && state.trim.id === t.id) return trimBody();
  if (isPlaylist(t)) return playlistBody(t);
  const converted = state.files.has(HOME_MUSIC);
  if (!t.music && !converted) {
    return dropZone(aspectById("music"), "Drop a music file here",
      "MP3, M4A, OGG, WAV, FLAC and more.");
  }
  const status = !converted ? "Added with an earlier version. Convert it to make it the home music."
    : "Checking the home music file…";
  if (converted) checkHomeMusic(t.id);
  return `<div class="row-item replaced">
      <div class="info"><div class="file">Home music${t.music ? ` · ${esc(partLabel(t))}` : ""}</div>
        <div class="dir" id="home-music-status">${esc(status)}</div>
        ${t.music ? `<audio controls preload="none" src="/api/theme/music?${q({ id: t.id })}&v=${stamp}"></audio>` : ""}</div>
      <div class="acts">
        ${t.music && !converted ? `<button class="btn sm primary" data-act="convert-music">Convert</button>` : ""}
        <button class="btn sm primary" data-act="convert-music" id="home-music-fix" hidden>Encode again</button>
        ${t.music ? `<button class="btn sm" data-act="choose-part">Choose part</button>
          <button class="btn sm" data-act="song-add">Add song</button>${help(`Make a playlist: the songs play one after another, each its own part, then start again (or the last one keeps repeating). Up to ${MUSIC_MAX_TRACKS} songs, within the console's limit of about twice its own music's length.`)}` : ""}
        <button class="btn sm" data-act="attach-aspect" data-aspect="music">Replace</button>
        <button class="btn sm ghost danger" data-act="remove-music">Remove</button>
      </div></div>
    ${t.music ? `<label class="field">Loudness <span id="gain-label">${esc(gainLabel(t.gain || 0))}</span>
      <input type="range" min="-12" max="12" step="1" value="${t.gain || 0}" id="music-gain"></label>` : ""}
    ${converted ? `<p class="note">${esc(MUSIC_HEAR_NOTE)} ${esc(MUSIC_PLACE_NOTE)}</p>` : ""}`;
}

/* ---- Home music: the music part, the loop part and their order ---- */

const LOOP_CHOICES = [
  ["crossfade", 1000, "Crossfade, 1 s"], ["crossfade", 2000, "Crossfade, 2 s"], ["crossfade", 4000, "Crossfade, 4 s"],
  ["fade", 1000, "Fade out and in"], ["cut", 0, "Straight cut"],
];
const ORDERS = [
  ["music", "Repeat the music part"],
  ["loop-first", "Loop part first, then the music part repeats"],
  ["alternate", "Loop part and music part take turns"],
  ["music-first", "Music part once, then the loop part repeats"],
];
const MIN_PART = 3;          /* seconds */
/* Seen on 13.42: the home screen's player keeps its place in time. It carries
   on after a game, and when the music changes under it (a theme is applied)
   it carries on in the new music from the same point. */
const MUSIC_HEAR_NOTE = "To hear the new home music after applying the theme, highlight a game or app that plays its own music, let it play, then go back to the home screen.";
const MUSIC_PLACE_NOTE = "The home screen keeps its place in the music: after a game it carries on where it stopped. When you apply a theme, the new music carries on from about where the old music had got to, so the first time it can start part-way through instead of at the beginning.";
const SNAP = 0.25;           /* seconds: a loop edge this close to the music's edge joins it */

/* A theme's music settings, in seconds: the music part (end 0 = to the end
   of the song), the loop part (null = none), their order and the joints. */
function themePart(t) {
  const loop = t.musicLoopStart >= 0 && t.musicLoopEnd >= 0;
  return {
    start: (t.musicStart || 0) / 1000, end: (t.musicEnd || 0) / 1000,
    playFrom: t.musicPlayFrom >= 0 ? t.musicPlayFrom / 1000 : null,
    loopStart: loop ? t.musicLoopStart / 1000 : null, loopEnd: loop ? t.musicLoopEnd / 1000 : null,
    order: loop ? t.musicOrder || "music" : "music",
    loop: t.musicLoop || "crossfade", blend: (t.musicBlend == null ? 2000 : t.musicBlend) / 1000,
  };
}

function fmtClock(sec) {
  const s = Math.max(0, sec), m = Math.floor(s / 60);
  return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0")}`;
}

function parseClock(text) {
  const m = /^\s*(?:(\d+):)?(\d+(?:\.\d*)?)\s*$/.exec(text);
  return m ? (+(m[1] || 0)) * 60 + +m[2] : NaN;
}

/* playlist:begin */
/* The order things play in: segments [from, to] of the song (seconds), and
   where the repeating starts (in segment `seg`, at song time `at`). The home
   screen starts at the beginning of the first segment. */
function playPlan(p) {
  const M = [p.start, p.end], L = [p.loopStart, p.loopEnd];
  const later = p.playFrom !== null && p.playFrom !== undefined && p.playFrom > p.start + 0.05 && p.playFrom < (p.end || Infinity);
  switch (p.order) {
    case "loop-first": return { segs: [L, M], seg: 1, at: M[0] };
    case "alternate": return { segs: [L, M], seg: 0, at: L[0] };
    case "music-first":
      if (Math.abs(L[1] - M[1]) < 1e-6 && L[0] >= M[0] && L[0] < M[1]) return { segs: [M], seg: 0, at: L[0] };
      return { segs: [M, L], seg: 1, at: L[0] };
    default: return later ? { segs: [[p.playFrom, p.end], M], seg: 1, at: M[0] } : { segs: [M], seg: 0, at: M[0] };
  }
}

// "0:10.0 to 0:40.0" for a segment; `songEnd` resolves an end of 0.
const span = ([a, b], songEnd) => `${fmtClock(a)} to ${fmtClock(b || songEnd)}`;

// From the beginning of the home music, in plain words.
function describePlan(p, songEnd) {
  const plan = playPlan(p), M = [p.start, p.end], L = [p.loopStart, p.loopEnd];
  switch (p.order) {
    case "loop-first": return `Plays ${span(L, songEnd)} once, then repeats ${span(M, songEnd)}.`;
    case "alternate": return `Plays ${span(L, songEnd)}, then ${span(M, songEnd)}, over and over.`;
    case "music-first": return `Plays ${span(M, songEnd)} once, then repeats ${span(L, songEnd)}.`;
    default: return plan.segs.length > 1
      ? `Plays ${span(plan.segs[0], songEnd)} once, then repeats ${span(M, songEnd)}.`
      : `Repeats ${span(M, songEnd)}.`;
  }
}

function partLabel(t) {
  const part = themePart(t);
  if (part.order === "music" && !part.start && !part.end && part.playFrom === null) return fmtTime(t.music);
  return describePlan({ ...part, end: part.end || t.music, loopEnd: part.loopEnd || t.music }, t.music).replace(/\.$/, "");
}

/* What the home screen plays, cut from the theme's music in the chosen
   order. `intro` is where the repeating starts in the result. Every joint (a
   part into the next, and the jump back) is blended so it makes no click: a
   crossfade leads the sound before the joint into the sound just before
   where it continues (at the very start of the song, a fade instead); a fade
   dips the sound on both sides; a cut leaves it as it is. */
function buildHomeMusic(chans, rate, part) {
  const n = chans[0].length, at = v => Math.max(0, Math.min(n, Math.round(v * rate)));
  const p = { ...part };
  if (p.order !== "music" && (p.loopStart === null || p.loopStart === undefined)) p.order = "music";
  const plan = playPlan(p);
  const segs = plan.segs.map(([a, b]) => {
    const from = Math.min(at(a), n - 1);
    return [from, b > 0 ? Math.max(from + 1, at(b)) : n];
  });
  const shortest = Math.min(...segs.map(([a, b]) => b - a));
  const c = p.loop === "cut" ? 0 : Math.min(Math.round(p.blend * rate), Math.floor(shortest / 3));
  let target = Math.max(segs[plan.seg][0], Math.min(at(plan.at), segs[plan.seg][1] - 1));
  // A crossfade needs the sound before the loop start: at the very start of
  // the song, the repeating starts that much later instead.
  if (p.loop === "crossfade" && c > 0 && target < c && target + c < segs[plan.seg][1]) target += c;
  const offsets = [];
  let total = 0;
  for (const [a, b] of segs) { offsets.push(total); total += b - a; }
  const intro = offsets[plan.seg] + (target - segs[plan.seg][0]);
  // Joints: [position in the result, song position the sound continues from,
  // position in the result where that continuation sits].
  const joints = segs.slice(1).map(([a], i) => [offsets[i + 1], a, offsets[i + 1]]);
  joints.push([total, target, intro]);
  const out = chans.slice(0, 2).map(x => {
    const y = new Float32Array(total);
    segs.forEach(([a, b], i) => y.set(x.subarray(a, b), offsets[i]));
    for (const [end, from, landing] of joints) {
      if (p.loop === "crossfade" && c > 0 && from >= c) {
        for (let i = 0; i < c; i++) {
          const ang = (i + 0.5) / c * Math.PI / 2;
          y[end - c + i] = y[end - c + i] * Math.cos(ang) + x[from - c + i] * Math.sin(ang);
        }
      } else if (p.loop !== "cut" && c > 0) {
        for (let i = 0; i < c; i++) {
          const g = (i + 0.5) / c;
          y[end - 1 - i] *= g;
          y[landing + i] *= g;
        }
      }
    }
    return y;
  });
  // Where a sample of the result came from in the song (for the playhead).
  const source = i => {
    let k = segs.length - 1;
    while (k > 0 && i < offsets[k]) k--;
    return segs[k][0] + (i - offsets[k]);
  };
  return { chans: out, intro, source, joint: segs.length > 1 ? offsets[1] : -1 };
}

/* What the home screen plays for a playlist: each song's part in turn, every
   song first brought to the same loudness (the encoder then matches the whole
   to the console's music), joined as `pl.join` says: an overlapping crossfade,
   a fade out and in, or a straight cut. At the end it starts again from the
   first song ("loop-all", joined the same way), or the last song repeats its
   loop part ("loop-last", like a single song's "music part once, then the
   loop part repeats"; with no loop part its whole part repeats). `tracks`:
   [{ chans, start, end, loopStart, loopEnd }] in seconds of each song's audio,
   in play order (end 0 = to the end); `pl`: { join, blend (seconds), endMode }.
   `intro` is where the repeating starts in the result, in samples. */
const PLAYLIST_LEVEL = 0.1;   /* RMS each song is brought to before they are joined */
function buildPlaylist(tracks, rate, pl) {
  const keepLast = pl.endMode === "loop-last";
  const parts = tracks.map((t, k) => {
    const n = t.chans[0].length, at = v => Math.max(0, Math.min(n, Math.round(v * rate)));
    let y, intro = -1;
    if (keepLast && k === tracks.length - 1) {
      const end = t.end > 0 ? t.end : n / rate;
      const loop = t.loopStart !== null && t.loopStart !== undefined && t.loopEnd > t.loopStart;
      const built = buildHomeMusic(t.chans, rate, {
        start: t.start, end, order: "music-first", loop: pl.join, blend: pl.blend,
        loopStart: loop ? t.loopStart : t.start, loopEnd: loop ? t.loopEnd : end,
      });
      y = built.chans;
      intro = built.intro;
    } else {
      const a = Math.min(at(t.start), n - 1), b = t.end > 0 ? Math.max(a + 1, at(t.end)) : n;
      y = t.chans.slice(0, 2).map(c => c.slice(a, b));
    }
    let sum = 0, count = 0;
    for (const c of y) for (let i = 0; i < c.length; i++) { sum += c[i] * c[i]; count++; }
    const rms = Math.sqrt(sum / Math.max(count, 1)), g = rms > 1e-6 ? PLAYLIST_LEVEL / rms : 1;
    if (g !== 1) for (const c of y) for (let i = 0; i < c.length; i++) c[i] *= g;
    return { y, intro, len: y[0].length };
  });
  const c = pl.join === "cut" ? 0
    : Math.max(0, Math.min(Math.round(pl.blend * rate), Math.floor(Math.min(...parts.map(p => p.len)) / 3)));
  // A crossfade overlaps the songs; never as far as where a repeating last song lands.
  const overlap = k => pl.join !== "crossfade" || k === 0 ? 0 : parts[k].intro >= 0 ? Math.min(c, parts[k].intro) : c;
  const starts = [];
  let total = 0;
  parts.forEach((p, k) => { total -= overlap(k); starts.push(total); total += p.len; });
  const out = [new Float32Array(total), new Float32Array(total)];
  parts.forEach((p, k) => {
    const o = starts[k], ov = overlap(k);
    for (let ch = 0; ch < 2; ch++) {
      const y = out[ch], s = p.y[ch];
      for (let i = 0; i < ov; i++) {
        const ang = (i + 0.5) / ov * Math.PI / 2;
        y[o + i] = y[o + i] * Math.cos(ang) + s[i] * Math.sin(ang);
      }
      y.set(ov ? s.subarray(ov) : s, o + ov);
    }
    if (k > 0 && pl.join === "fade" && c > 0) {
      const f = p.intro >= 0 ? Math.min(c, p.intro) : c;
      for (let ch = 0; ch < 2; ch++) {
        for (let i = 0; i < c; i++) out[ch][o - 1 - i] *= (i + 0.5) / c;
        for (let i = 0; i < f; i++) out[ch][o + i] *= (i + 0.5) / f;
      }
    }
  });
  let intro = 0;
  if (keepLast) intro = starts[parts.length - 1] + parts[parts.length - 1].intro;
  else if (pl.join === "crossfade" && c > 0) {
    // The end crossfades into the first song's opening; it plays on from just after it.
    for (let ch = 0; ch < 2; ch++) {
      const y = out[ch], head = y.slice(0, c);
      for (let i = 0; i < c; i++) {
        const ang = (i + 0.5) / c * Math.PI / 2;
        y[total - c + i] = y[total - c + i] * Math.cos(ang) + head[i] * Math.sin(ang);
      }
    }
    intro = c;
  } else if (pl.join === "fade" && c > 0) {
    for (let ch = 0; ch < 2; ch++) for (let i = 0; i < c; i++) {
      out[ch][total - 1 - i] *= (i + 0.5) / c;
      out[ch][i] *= (i + 0.5) / c;
    }
  }
  return { chans: out, intro, starts, total };
}
/* playlist:end */

/* Open the part editor. `chans` is the music at `rate`; `fresh` means it has
   not been saved to the theme yet. `track` makes it a playlist song's part:
   { slot, pos, adding, name }; its length is what the other songs leave. */
async function openTrim(id, chans, rate, part, fresh, track = null) {
  const stock = await stockAt9(HOME_MUSIC);
  const duration = chans[0].length / rate;
  let max = at9MaxSamples(stock) / stock.file.config.rate;        /* the whole result, which can be longer than the song */
  if (track) {
    const t = themeById(id), tracks = themeTracks(t), pl = themePlaylist(t), n = track.adding ? tracks.length + 1 : tracks.length;
    track.others = tracks.reduce((s, tr, k) => k === track.pos ? s : s + trackSeconds(tr, songDuration(t, tr.slot), pl, k === n - 1), 0);
    track.total = max;
    track.last = track.pos === n - 1;
    track.loopLast = track.last && pl.endMode === "loop-last";
    max -= track.others;
    if (max < MIN_PART) throw new Error(`The other songs already fill the console's ${fmtClock(track.total)}. Shorten one of them first.`);
  }
  const peaks = new Float32Array(2048);
  const per = chans[0].length / (peaks.length / 2);
  for (let b = 0; b < peaks.length / 2; b++) {
    let lo = 0, hi = 0;
    for (let i = Math.floor(b * per), stop = Math.min(chans[0].length, Math.floor((b + 1) * per)); i < stop; i++) {
      const v = (chans[0][i] + chans[1][i]) / 2;
      if (v < lo) lo = v; else if (v > hi) hi = v;
    }
    peaks[2 * b] = lo;
    peaks[2 * b + 1] = hi;
  }
  const end = part.end > part.start ? Math.min(part.end, duration) : duration;
  const hasLoop = part.loopStart !== null && part.loopStart !== undefined;
  state.trim = {
    id, chans, rate, duration, max, peaks, fresh, start: part.start, end, order: hasLoop ? part.order : "music",
    playFrom: part.playFrom !== null && part.playFrom !== undefined ? part.playFrom : part.start,
    loopStart: hasLoop ? part.loopStart : 0, loopEnd: hasLoop ? (part.loopEnd > 0 ? Math.min(part.loopEnd, duration) : duration) : 0,
    loop: part.loop, blend: part.blend, track,
  };
  if (track) {
    /* the last song, when the playlist ends by repeating it: its part once, then what repeats (at first, all of it) */
    state.trim.order = track.loopLast ? "music-first" : "music";
    state.trim.playFrom = state.trim.start;
    if (track.loopLast && !hasLoop) { state.trim.loopStart = state.trim.start; state.trim.loopEnd = end; }
  } else if (!hasLoop) defaultLoop(state.trim);
  clampTrim("end");
  if (!aspectReplaced(aspectById("music"))) setAspectFlag(aspectById("music"), true);
  renderAspect(aspectById("music"));
}

// A starting loop part for an order: the second half of the music part for
// "music part once", otherwise up to 30 seconds from its middle.
function defaultLoop(t) {
  const len = t.end - t.start;
  if (t.order === "music-first") {
    t.loopStart = t.start + len / 2;
    t.loopEnd = t.end;
  } else {
    t.loopStart = t.start + len * 0.4;
    t.loopEnd = Math.min(t.end, t.loopStart + Math.max(MIN_PART, Math.min(30, len * 0.3)));
  }
}

function trimBody() {
  const t = state.trim, loopOn = t.order !== "music", tr = t.track;
  const choice = LOOP_CHOICES.findIndex(([l, ms]) => l === t.loop && (l === "cut" || ms === Math.round(t.blend * 1000)));
  const handle = (id, label, v, loop) => `<button class="handle${loop ? " loop" : ""}" id="${id}" role="slider" aria-label="${label}"
      aria-valuemin="0" aria-valuemax="${t.duration.toFixed(1)}" aria-valuenow="${v.toFixed(1)}" aria-valuetext="${fmtClock(v)}" ${loop && !loopOn ? "hidden" : ""}></button>`;
  const field = (id, label, v) => `<label class="field">${label}<input type="text" id="${id}" value="${fmtClock(v)}" inputmode="decimal" autocomplete="off"></label>`;
  /* A playlist song has a part (and, when the playlist ends by repeating it, what repeats); the order and the joints are the playlist's. */
  const words = tr ? { part: "Part", starts: "Part starts", ends: "Part ends", loop: "Repeats", lstarts: "Repeats from", lends: "Repeats to" }
                   : { part: "Music part", starts: "Music part starts", ends: "Music part ends", loop: "Loop part", lstarts: "Loop part starts", lends: "Loop part ends" };
  const note = !tr ? "Choose the music part, and if you like a loop part and the order they play in."
    : tr.loopLast ? "Choose the part of this song that plays, and the part that then repeats until you leave the home screen."
    : "Choose the part of this song that plays in the playlist.";
  return `<div class="trim">
      ${tr ? `<h3 class="sub-head" style="margin-top:0">${esc(tr.name || trackLabel(t.id, tr.slot, tr.pos))}${tr.adding ? ` <span class="tag">New song</span>` : ""}</h3>` : ""}
      <p class="note">${note} Drag the handles, move a selected handle with the arrow keys, or type the times.</p>
      <div class="wave" id="wave"><canvas id="wave-canvas"></canvas>
        ${handle("trim-start", `${words.part} start`, t.start)}${handle("trim-end", `${words.part} end`, t.end)}
        ${handle("trim-lstart", words.lstarts, t.loopStart, true)}${handle("trim-lend", words.lends, t.loopEnd, true)}
        <button class="handle from" id="trim-from" role="slider" aria-label="Begins at" aria-valuemin="0"
          aria-valuemax="${t.duration.toFixed(1)}" aria-valuenow="${t.playFrom.toFixed(1)}" aria-valuetext="${fmtClock(t.playFrom)}" ${loopOn || tr ? "hidden" : ""}></button>
        <div class="start-flag" id="trim-flag" ${loopOn ? "" : "hidden"}></div>
        <div class="playhead" id="trim-playhead" hidden></div></div>
      <div class="legend"><span class="key start"></span>Begins here<span class="key music"></span>${words.part}${loopOn ? `<span class="key loop"></span>${words.loop}` : ""}</div>
      <div class="trim-fields">${field("trim-start-time", words.starts, t.start)}${field("trim-end-time", words.ends, t.end)}
        ${loopOn || tr ? "" : field("trim-from-time", "Begins at", t.playFrom)}</div>
      ${tr ? "" : `<div class="trim-fields">
        <label class="field">Play order
          <select id="trim-order">${ORDERS.map(([v, label]) => `<option value="${v}" ${v === t.order ? "selected" : ""}>${label}</option>`).join("")}</select></label>
      </div>`}
      ${loopOn ? `<div class="trim-fields">${field("trim-lstart-time", words.lstarts, t.loopStart)}${field("trim-lend-time", words.lends, t.loopEnd)}</div>` : ""}
      ${tr ? "" : `<div class="trim-fields">
        <label class="field">How the joints sound
          <select id="trim-loop">${LOOP_CHOICES.map(([, , label], i) => `<option value="${i}" ${i === (choice < 0 ? 1 : choice) ? "selected" : ""}>${label}</option>`).join("")}</select></label>
      </div>`}
      <p class="note" id="trim-summary"></p>
      ${tr ? "" : `<p class="note">${esc(MUSIC_PLACE_NOTE)}</p>`}
      <div class="trim-actions">
        <button class="btn sm" data-act="trim-play" id="trim-play">Play</button>
        ${!tr || tr.loopLast ? `<button class="btn sm" data-act="trim-seam">Hear where it loops</button>` : ""}
        <button class="btn sm" data-act="trim-joint" id="trim-joint" ${playPlan(trimPart(t)).segs.length > 1 ? "" : "hidden"}>Hear the change of part</button>
        <span class="spacer"></span>
        <button class="btn sm ghost" data-act="trim-cancel">Cancel</button>
        <button class="btn sm primary" data-act="trim-save">${tr && tr.adding ? "Add to the playlist" : "Use this"}</button>
      </div>
    </div>`;
}

const trimPart = t => ({
  start: t.start, end: t.end, loop: t.loop, blend: t.blend, order: t.order,
  playFrom: t.order === "music" && t.playFrom > t.start + 0.05 ? t.playFrom : null,
  loopStart: t.order === "music" ? null : t.loopStart, loopEnd: t.order === "music" ? null : t.loopEnd,
});

// Length of what the home music file holds, in seconds.
function trimLength(t) {
  return playPlan(trimPart(t)).segs.reduce((n, [a, b]) => n + (b - a), 0);
}

// Keep both parts valid: each at least MIN_PART long, within the song, and
// together within the console's length limit. `moved` names the edge that
// changed (start, end, lstart, lend).
function clampTrim(moved) {
  const t = state.trim, d = t.duration, min = Math.min(MIN_PART, d);
  const range = (a, b, movedA) => {
    t[a] = Math.max(0, Math.min(t[a], d - min));
    t[b] = Math.max(min, Math.min(t[b], d));
    if (t[b] - t[a] < min) { if (movedA) t[a] = t[b] - min; else t[b] = t[a] + min; }
  };
  const musicFirst = t.order === "music-first";
  range("start", "end", moved === "start");
  const keepFrom = () => {
    if (moved === "from" && t.playFrom - t.start < SNAP) t.playFrom = t.start;
    t.playFrom = Math.max(t.start, Math.min(t.playFrom, t.end - 1));
  };
  keepFrom();
  if (t.order !== "music") {
    if (musicFirst && (moved === "lend" || moved === "end") && Math.abs(t.loopEnd - t.end) < SNAP + (moved === "end" ? 0.5 : 0)) t.loopEnd = t.end;
    if (musicFirst && moved === "lstart" && Math.abs(t.loopStart - t.start) < SNAP) t.loopStart = t.start;
    range("loopStart", "loopEnd", moved === "lstart");
  }
  for (let pass = 0; pass < 4; pass++) {
    const over = trimLength(t) - t.max;
    if (over <= 1e-6) break;
    const shrinkLoop = (moved === "lstart" || moved === "lend") && t.order !== "music" && playPlan(trimPart(t)).segs.length > 1;
    if (shrinkLoop && moved === "lstart") t.loopStart += over;
    else if (shrinkLoop) t.loopEnd -= over;
    else if (moved === "start") t.start += over;
    else if (moved !== "from") t.end -= over;
    if (moved === "from") t.playFrom += over;
    range("start", "end", moved === "start");
    keepFrom();
    if (t.order !== "music") range("loopStart", "loopEnd", moved === "lstart");
    moved = pass ? (moved === "end" ? "lend" : "end") : moved;
  }
  if (t.track && t.order !== "music") {   /* a playlist's last song repeats within its own part */
    t.loopStart = Math.max(t.start, Math.min(t.loopStart, t.end - min));
    t.loopEnd = Math.max(t.loopStart + min, Math.min(t.loopEnd, t.end));
  }
}

function drawTrim() {
  const t = state.trim, canvas = $("#wave-canvas");
  if (!t || !canvas) return;
  const w = canvas.clientWidth, h = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const loopOn = t.order !== "music";
  const X = v => v / t.duration * w, cols = t.peaks.length / 2;
  const x0 = X(t.start), x1 = X(t.end), l0 = loopOn ? X(t.loopStart) : -1, l1 = loopOn ? X(t.loopEnd) : -1;
  let peak = 1e-6;
  for (const v of t.peaks) peak = Math.max(peak, Math.abs(v));
  ctx.fillStyle = "rgba(255, 255, 255, .07)";
  ctx.fillRect(x0, 0, x1 - x0, h);
  if (loopOn) {
    ctx.fillStyle = "rgba(31, 124, 240, .22)";
    ctx.fillRect(l0, 0, l1 - l0, h);
  }
  const wave = h - 14;
  for (let x = 0; x < w; x++) {
    let lo = 0, hi = 0;
    for (let b = Math.floor(x / w * cols); b < Math.max(Math.floor((x + 1) / w * cols), Math.floor(x / w * cols) + 1); b++) {
      lo = Math.min(lo, t.peaks[2 * b]);
      hi = Math.max(hi, t.peaks[2 * b + 1]);
    }
    const y0 = wave / 2 - hi / peak * wave * 0.45, y1 = wave / 2 - lo / peak * wave * 0.45;
    ctx.fillStyle = (x >= x0 && x <= x1) || (x >= l0 && x <= l1) ? "rgba(255, 255, 255, .92)" : "rgba(255, 255, 255, .2)";
    ctx.fillRect(x, y0, 1, Math.max(1, y1 - y0));
  }
  ctx.fillStyle = "rgba(255, 255, 255, .55)";
  ctx.fillRect(x0, h - 12, x1 - x0, 3);
  if (loopOn) {
    ctx.fillStyle = "#1f7cf0";
    ctx.fillRect(l0, h - 6, l1 - l0, 4);
  }
  const first = playPlan(trimPart(t)).segs[0][0];
  ctx.fillStyle = "#3fcf8e";
  ctx.fillRect(X(first) - 1, 0, 2, h);
  $("#trim-flag").style.left = `${canvas.offsetLeft + X(first)}px`;
  for (const [id, v] of [["#trim-start", t.start], ["#trim-end", t.end], ["#trim-lstart", t.loopStart], ["#trim-lend", t.loopEnd], ["#trim-from", t.playFrom]]) {
    const el = $(id);
    el.style.left = `${canvas.offsetLeft + X(v)}px`;
    el.setAttribute("aria-valuenow", v.toFixed(1));
    el.setAttribute("aria-valuetext", fmtClock(v));
  }
  for (const [id, v] of [["#trim-start-time", t.start], ["#trim-end-time", t.end], ["#trim-lstart-time", t.loopStart], ["#trim-lend-time", t.loopEnd], ["#trim-from-time", t.playFrom]]) {
    const field = $(id);
    if (field && document.activeElement !== field) field.value = fmtClock(v);
  }
  const total = trimLength(t);
  if (t.track) {
    const tr = t.track, then = tr.loopLast ? "" : tr.last ? " Then the playlist starts again." : " Then the next song plays.";
    const whole = tr.loopLast && Math.abs(t.loopStart - t.start) < 0.05 && Math.abs(t.loopEnd - t.end) < 0.05;
    const what = !tr.loopLast ? `Plays ${span([t.start, t.end], t.duration)}.`
      : whole ? `Plays ${span([t.start, t.end], t.duration)}, then keeps repeating it.` : describePlan(trimPart(t), t.duration);
    $("#trim-summary").textContent = `${what}${then}` +
      ` The playlist in all: ${fmtClock(tr.others + total)} of up to ${fmtClock(tr.total)}.`;
  } else {
    const limit = total > t.max * 0.8 || t.duration > t.max ? ` In all ${fmtClock(total)}; the console allows up to ${fmtClock(t.max)}.` : "";
    $("#trim-summary").textContent = describePlan(trimPart(t), t.duration) + limit;
  }
  const joint = $("#trim-joint");
  if (joint) joint.hidden = playPlan(trimPart(t)).segs.length < 2;
}

const HANDLES = { start: "#trim-start", end: "#trim-end", lstart: "#trim-lstart", lend: "#trim-lend", from: "#trim-from" };
const EDGE_KEY = { start: "start", end: "end", lstart: "loopStart", lend: "loopEnd", from: "playFrom" };

function trimFromPointer(e, which) {
  const t = state.trim, r = $("#wave-canvas").getBoundingClientRect();
  t[EDGE_KEY[which]] = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * t.duration;
  clampTrim(which);
  drawTrim();
}

// Wire up the editor after it is rendered.
function setupTrim() {
  const wave = $("#wave");
  if (!wave || wave.dataset.ready) return;
  wave.dataset.ready = "1";
  let dragging = null;
  wave.addEventListener("pointerdown", e => {
    const t = state.trim, r = $("#wave-canvas").getBoundingClientRect(), v = (e.clientX - r.left) / r.width * t.duration;
    dragging = Object.keys(HANDLES).find(k => e.target.id === HANDLES[k].slice(1));
    if (!dragging) {
      // Nearest edge. The lower band of the waveform belongs to the loop part,
      // and with "repeat the music part" the upper band to the start point.
      const y = (e.clientY - r.top) / r.height;
      const lane = t.order !== "music" && y > 0.6 ? ["lstart", "lend"] : t.order === "music" && !t.track && y < 0.3 ? ["from"] : ["start", "end"];
      dragging = lane.reduce((a, b) => (Math.abs(v - t[EDGE_KEY[a]]) <= Math.abs(v - t[EDGE_KEY[b]]) ? a : b));
    }
    $(HANDLES[dragging]).classList.add("active");
    wave.setPointerCapture(e.pointerId);
    trimFromPointer(e, dragging);
    e.preventDefault();
  });
  wave.addEventListener("pointermove", e => { if (dragging) trimFromPointer(e, dragging); });
  const stop = () => {
    if (!dragging) return;
    $(HANDLES[dragging]).classList.remove("active");
    $(HANDLES[dragging]).focus();
    dragging = null;
  };
  wave.addEventListener("pointerup", stop);
  wave.addEventListener("pointercancel", stop);
  requestAnimationFrame(drawTrim);
}

/* ---- preview (the processed music, looping as the console loops it) ---- */

let preview = null;

function stopPreview() {
  if (!preview) return;
  cancelAnimationFrame(preview.frame);
  clearTimeout(preview.timer);
  try { preview.src.stop(); } catch (e) { /* already stopped */ }
  preview.ctx.close();
  preview = null;
  const head = $("#trim-playhead"), play = $("#trim-play"), plPlay = $("#pl-play");
  if (head) head.hidden = true;
  if (play) play.textContent = "Play";
  if (plPlay) plPlay.textContent = "Play";
}

/* `around`: "loop" plays the seconds around the jump back, "joint" those
   around the change of part; otherwise from the beginning. */
function playPreview(around) {
  stopPreview();
  const t = state.trim;
  const built = buildHomeMusic(t.chans, t.rate, trimPart(t));
  const [L, R] = built.chans;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return toast("This browser cannot play audio previews.", "err");
  const ctx = new Ctx(), buf = ctx.createBuffer(2, L.length, t.rate);
  buf.copyToChannel(L, 0);
  buf.copyToChannel(R, 1);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  src.loopStart = built.intro / t.rate;
  src.loopEnd = buf.duration;
  src.connect(ctx.destination);
  const offset = around === "loop" ? Math.max(0, buf.duration - 4)
    : around === "joint" && built.joint > 0 ? Math.max(0, built.joint / t.rate - 4) : 0;
  src.start(0, offset);
  preview = { ctx, src, offset, began: ctx.currentTime, frame: 0, timer: 0 };
  if (around) preview.timer = setTimeout(stopPreview, 8000);
  const play = $("#trim-play");
  if (play && !around) play.textContent = "Stop";
  const head = $("#trim-playhead"), intro = built.intro / t.rate, len = buf.duration;
  const tick = () => {
    if (!preview || !head) return;
    let pos = preview.offset + preview.ctx.currentTime - preview.began;
    if (pos >= len) pos = intro + (pos - intro) % (len - intro);
    const canvas = $("#wave-canvas");
    head.hidden = false;
    if (canvas) head.style.left = `${canvas.offsetLeft + built.source(Math.floor(pos * t.rate)) / t.rate / t.duration * canvas.clientWidth}px`;
    preview.frame = requestAnimationFrame(tick);
  };
  tick();
}

async function saveTrim() {
  if (state.trim.track) return saveSongPart();
  const t = state.trim;
  stopPreview();
  const part = trimPart(t);
  const toEnd = v => (v >= t.duration - 0.05 ? 0 : Math.round(v * 1000));
  const p = progressToast("Saving the music…");
  try {
    if (t.fresh) {
      p.set("Sending the music to the console…", 0, 0.2);
      await uploadVerified("/api/theme/music", { id: t.id }, pcmWav(t.chans, t.rate));
      setSongNames(names => { if (t.name) names[1] = t.name; else delete names[1]; });
      songCacheDrop(t.id, 1);
    }
    await api("POST", "/api/theme/settings", {
      id: t.id, start: Math.round(part.start * 1000), end: toEnd(part.end),
      play_from: part.playFrom === null ? -1 : Math.round(part.playFrom * 1000),
      loop_start: part.loopStart === null ? -1 : Math.round(part.loopStart * 1000),
      loop_end: part.loopEnd === null ? -1 : toEnd(part.loopEnd),
      order: part.order, loop: part.loop, blend: Math.round(part.blend * 1000),
    });
    await refreshStatus();
    const r = await convertHomeMusic(t.id, buildHomeMusic(t.chans, t.rate, part), t.rate, themeById(t.id).gain || 0, p);
    state.trim = null;
    stamp = Date.now();
    await refreshStatus();
    p.done(`Home music set and verified (${fmtClock(r.seconds)}). Apply the theme to hear it.`, "ok");
  } catch (e) {
    await refreshStatus();
    p.done(e.message, "err");
  }
  renderAspect(aspectById("music"));
}

function findGroup(asp, key) { return groupAssets(aspectAssets(asp)).find(g => g.key === key); }

async function attachToAspect(asp, file) {
  if (asp.mode === "music") return attachMusic(file);
  const isVideo = file.type.startsWith("video/") || /\.(mp4|webm|m4v)$/i.test(file.name);
  const off = bgOff();
  const targets = aspectAssets(asp).filter(a => (isVideo ? a.kind === "video" : a.kind !== "video") && !off.has(areaOf(a.path)));
  if (!targets.length) return toast(`No ${isVideo ? "video" : "image"} backgrounds in the areas switched on.`, "err");
  const ok = await attachTo(targets, file, asp.title);
  renderAspect(asp);
  if (asp.id === "background" && ok) await previewFromFile(state.editId, file, isVideo);
}

async function attachToGroup(asp, key, file) {
  const g = findGroup(asp, key);
  if (!g) return;
  await attachTo(g.assets, file, pieceLabel(asp, g));
  renderAspect(asp);
}
/* A piece by the name its part shows, for messages. */
function pieceLabel(asp, g) {
  const path = g.assets[0].path;
  return asp.id === "appearance" ? appearanceName(path) : asp.id === "fonts" ? fontName(path) : asp.id === "sounds" ? soundName(path) : g.name;
}

/* Ask the console whether the theme's home music file still passes its
   checks. Files from versions 1.10-1.12 do not: they fill unused space with
   zeros, which the console's decoder plays as ticks or silence. */
async function checkHomeMusic(id) {
  let r;
  try { r = await api("GET", "/api/theme/check", { id, path: HOME_MUSIC }); } catch (e) { return; }
  const el = $("#home-music-status"), fix = $("#home-music-fix"), t = themeById(id);
  if (!el || state.editId !== id) return;
  if (r.ok) {
    el.textContent = t && t.music ? "Encoded and verified" : "Home music file from an imported theme";
  } else {
    const m = /^the console cannot play this sound: it (.*?)\. Encode it again/.exec(r.error);
    el.textContent = `The console cannot play this file: ${m ? `it ${m[1]}` : r.error}. ${t && t.music ? "Encode it again." : "Replace it."}`;
    if (fix && t && t.music) fix.hidden = false;
  }
}

/* Encode music (built by buildHomeMusic) into the theme's home music and
   upload it. */
async function convertHomeMusic(id, built, rate, gain, p) {
  const r = await at9For(HOME_MUSIC, built.chans, rate, gain, f => p.set(`Encoding home music… ${Math.round(f * 100)}%`, 0.2 + f * 0.7),
                         built.intro / rate);
  p.set("Sending the home music to the console…", 0.92);
  await uploadVerified("/api/theme/file", { id, path: HOME_MUSIC }, r.blob);
  if (id === state.editId) state.files.add(HOME_MUSIC);
  return r;
}

/* A new song opens the part editor; nothing is saved until "Use this part".
   The theme keeps the whole song (48 kHz WAV, up to about 11 minutes) so the
   part and loudness can be changed later. */
async function attachMusic(file) {
  const id = state.editId;
  const p = progressToast("Reading music…");
  try {
    let chans = await decodeAudio(file, MUSIC_RATE, 2);
    const keep = Math.floor(MUSIC_SOURCE_MAX_BYTES / 4);
    const long = chans[0].length > keep;
    if (long) chans = trimWithFade(chans, keep, MUSIC_RATE);
    await openTrim(id, chans, MUSIC_RATE, { start: 0, end: 0, loop: "crossfade", blend: 2 }, true);
    state.trim.name = songTitle(file);   /* shown if the song becomes the first of a playlist */
    p.done(long ? `Only the first ${fmtTime(keep / MUSIC_RATE)} of the song can be kept. Choose the part to use.`
      : "Choose the part of the song to use.", "");
    const handle = $("#trim-start");
    if (handle) handle.focus();
  } catch (e) { p.done(e.message, "err"); }
}

async function openThemePart(id) {
  const p = progressToast("Reading the theme's music…");
  try {
    const res = await fetch(`/api/theme/music?${q({ id })}`);
    if (!res.ok) throw new Error("this theme has no music");
    const { chans, rate } = wavChannels(await res.arrayBuffer());
    await openTrim(id, chans.length === 1 ? [chans[0], chans[0]] : chans, rate, themePart(themeById(id)), false);
    p.done("Choose the part of the song to use.", "");
  } catch (e) { p.done(e.message, "err"); }
}

/* Encode the theme's stored music again (new loudness, or music from before
   version 1.10, which the plugin played itself). */
async function reencodeMusic(id, gain) {
  const p = progressToast("Reading the theme's music…");
  try {
    const res = await fetch(`/api/theme/music?${q({ id })}`);
    if (!res.ok) throw new Error("this theme has no music to convert");
    const { chans, rate } = wavChannels(await res.arrayBuffer());
    const stereo = chans.length === 1 ? [chans[0], chans[0]] : chans;
    const r = await convertHomeMusic(id, buildHomeMusic(stereo, rate, themePart(themeById(id))), rate, gain, p);
    stamp = Date.now();
    await refreshStatus();
    p.done(`Home music encoded and verified (${fmtTime(r.seconds)}). Apply the theme to hear it.`, "ok");
  } catch (e) { p.done(e.message, "err"); }
}

/* ---- Home music: a playlist of songs ----

   A theme can keep up to MUSIC_MAX_TRACKS songs (slot 1 is music.wav, the
   others music2.wav …, as the plugin stores them). They play one after
   another, then start again, or the last one keeps repeating. The plugin
   keeps the songs, their order and parts; this page puts them together into
   the one home music file, as it does a single song. Slot 1 holds a song
   whenever the theme has music, so what looks for music.wav still finds it. */

const MUSIC_MAX_TRACKS = 8;
const SONG_PRE = 5;                  /* seconds kept before a song's part: crossfades reach back into it */
const toMs = v => Math.round(v * 1000);

/* The theme's songs in play order: [{ slot, start, end }] in seconds (end 0 = to the end of the song). */
function themeTracks(t) {
  if (!t) return [{ slot: 1, start: 0, end: 0 }];
  const seq = t.musicSequence && t.musicSequence.length ? t.musicSequence : [1];
  return seq.map((slot, i) => ({
    slot,
    start: ((t.musicStarts || [])[i] ?? (slot === 1 ? t.musicStart || 0 : 0)) / 1000,
    end: ((t.musicEnds || [])[i] ?? (slot === 1 ? t.musicEnd || 0 : 0)) / 1000,
  }));
}
const isPlaylist = t => !!t && themeTracks(t).length > 1;

/* How the songs join and how the playlist ends, with the last song's repeating part (seconds), if it has one. */
function themePlaylist(t) {
  const loop = t.musicLoopStart >= 0 && t.musicLoopEnd > t.musicLoopStart;
  return {
    join: t.musicBetween || t.musicLoop || "crossfade",
    blend: (t.musicBlend == null ? 2000 : t.musicBlend) / 1000,
    endMode: t.musicEndMode === "loop-last" ? "loop-last" : "loop-all",
    loopStart: loop ? t.musicLoopStart / 1000 : null, loopEnd: loop ? t.musicLoopEnd / 1000 : null,
  };
}

/* Songs read from the console, kept while the page stays open: "id|slot" ->
   { chans, rate, from, to, duration } (seconds), only the part the playlist
   plays and a little before it. */
const songCache = new Map();
function songCacheDrop(id, slot) {
  for (const k of [...songCache.keys()]) if (slot === undefined ? k.startsWith(`${id}|`) : k === `${id}|${slot}`) songCache.delete(k);
}
function songDuration(t, slot) {
  const c = songCache.get(`${t.id}|${slot}`);
  return c ? c.duration : slot === 1 ? t.music || 0 : 0;
}
function keepSong(id, slot, chans, rate, from, to) {
  const a = Math.max(0, Math.floor(from * rate)), b = Math.max(a + 1, Math.min(chans[0].length, Math.ceil(to * rate)));
  songCache.set(`${id}|${slot}`, { chans: chans.slice(0, 2).map(c => c.slice(a, b)), rate, from: a / rate, to: b / rate, duration: chans[0].length / rate });
}

/* How long a song plays in the playlist, in seconds (`dur`: the song's length, for an end of 0). */
function trackSeconds(tr, dur, pl, last) {
  const end = tr.end > 0 ? tr.end : dur;
  let len = Math.max(0, end - tr.start);
  if (last && pl.endMode === "loop-last" && pl.loopStart !== null && Math.abs(pl.loopEnd - end) > 1e-3) len += pl.loopEnd - pl.loopStart;
  return len;
}
function playlistSeconds(t) {
  const tracks = themeTracks(t), pl = themePlaylist(t);
  return tracks.reduce((n, tr, i) => n + trackSeconds(tr, songDuration(t, tr.slot), pl, i === tracks.length - 1), 0);
}

const songTitle = file => file.name.replace(/\.[^.]+$/, "").slice(0, 80);
/* A song's name (from the file it came from), or its place in the playlist. */
function trackLabel(id, slot, pos) { return (id === state.choicesId && songName(slot)) || `Song ${pos + 1}`; }

function freeSlot(t) {
  const used = new Set(themeTracks(t).map(x => x.slot));
  for (let s = 2; s <= MUSIC_MAX_TRACKS; s++) if (!used.has(s)) return s;
  return 0;
}

/* A song from the console, decoded whole. */
async function fetchSong(id, slot, onProgress) {
  const res = await fetch(`/api/theme/music?${q({ id, slot })}`);
  if (!res.ok) throw new Error("a song could not be read from the console");
  const bytes = await readBytes(res, onProgress);
  const { chans, rate } = wavChannels(bytes.byteOffset === 0 && bytes.buffer.byteLength === bytes.length ? bytes.buffer : bytes.slice().buffer);
  return { chans: chans.length === 1 ? [chans[0], chans[0]] : chans, rate };
}

/* The part of a song the playlist plays: kept from before, or read from the console. */
async function songPart(id, tr, onProgress) {
  const key = `${id}|${tr.slot}`, from = Math.max(0, tr.start - SONG_PRE);
  let c = songCache.get(key);
  if (!c || c.from > from + 1e-3 || c.to < (tr.end > 0 ? Math.min(tr.end, c.duration) : c.duration) - 1e-3) {
    const s = await fetchSong(id, tr.slot, onProgress);
    const dur = s.chans[0].length / s.rate;
    keepSong(id, tr.slot, s.chans, s.rate, from, tr.end > 0 ? Math.min(tr.end, dur) : dur);
    c = songCache.get(key);
  }
  return c;
}

/* The playlist put together (buildPlaylist), its songs read first; the progress fills up to `upTo`. */
async function playlistAudio(id, p, upTo) {
  const t = themeById(id), tracks = themeTracks(t), pl = themePlaylist(t), input = [];
  let rate = MUSIC_RATE;
  for (let i = 0; i < tracks.length; i++) {
    const tr = tracks[i], last = i === tracks.length - 1, label = `Reading song ${i + 1} of ${tracks.length}…`;
    if (p) p.set(label, i / tracks.length * upTo, (i + 1) / tracks.length * upTo);
    const c = await songPart(id, tr, f => { if (p && f >= 0) p.set(label, (i + f) / tracks.length * upTo, (i + 1) / tracks.length * upTo); });
    const end = tr.end > 0 ? Math.min(tr.end, c.duration) : c.duration;
    input.push({
      chans: c.chans, start: tr.start - c.from, end: end - c.from,
      loopStart: last && pl.loopStart !== null ? pl.loopStart - c.from : null,
      loopEnd: last && pl.loopEnd !== null ? pl.loopEnd - c.from : null,
    });
    rate = c.rate;
  }
  return { built: buildPlaylist(input, rate, pl), rate, count: tracks.length };
}

/* Draw a section again, keeping the focus on the same control (a list that moved under it keeps its place). */
function renderKeepingFocus(asp) {
  const f = document.activeElement, box = $(`#aspect-${asp.id}`);
  const inside = f && box && box.contains(f), act = inside && f.dataset.act, pos = inside && f.dataset.pos, fid = inside && f.id;
  renderAspect(asp);
  if (!inside) return;
  const again = fid ? document.getElementById(fid) : act ? $(`[data-act="${act}"]${pos !== undefined ? `[data-pos="${pos}"]` : ""}`, box) : null;
  if (again && !again.disabled) again.focus();
}

/* Put the playlist together into the theme's home music and send it, one at a
   time: a change made while it runs makes it again afterwards, as things are then. */
let rebuilding = null, rebuildAgain = false;
function rebuildPlaylist(id) {
  if (rebuilding) { rebuildAgain = true; return rebuilding; }
  rebuilding = (async () => {
    try {
      do { rebuildAgain = false; await rebuildPlaylistNow(id); } while (rebuildAgain && state.editId === id);
    } finally { rebuilding = null; }
  })();
  return rebuilding;
}
async function rebuildPlaylistNow(id) {
  const p = progressToast("Making the home music…");
  try {
    const a = await playlistAudio(id, p, 0.2);
    const r = await convertHomeMusic(id, a.built, a.rate, (themeById(id) || {}).gain || 0, p);
    stamp = Date.now();
    await refreshStatus();
    p.done(`Home music set and verified: ${plural(a.count, "song")}, ${fmtClock(r.seconds)}${r.trimmed ? ", cut to the console's limit" : ""}. Apply the theme to hear it.`, "ok");
  } catch (e) {
    await refreshStatus();
    p.done(e.message, "err");
  }
  if (state.route === "edit" && state.editId === id && !state.trim) renderKeepingFocus(aspectById("music"));
}

/* The theme's home music made again from its songs: the playlist, or the one song. */
function remakeHomeMusic(id) {
  const t = themeById(id);
  return isPlaylist(t) ? rebuildPlaylist(id) : reencodeMusic(id, (t && t.gain) || 0);
}

function playlistBody(t) {
  const id = t.id, tracks = themeTracks(t), pl = themePlaylist(t), total = playlistSeconds(t);
  if (!state.musicMax) {
    stockAt9(HOME_MUSIC).then(s => {
      state.musicMax = at9MaxSamples(s) / s.file.config.rate;
      if (state.route === "edit" && state.editId === id && !state.trim) renderKeepingFocus(aspectById("music"));
    }).catch(() => {});
  }
  const max = state.musicMax, converted = state.files.has(HOME_MUSIC);
  if (converted) checkHomeMusic(id);
  const choice = LOOP_CHOICES.findIndex(([l, ms]) => l === pl.join && (l === "cut" || ms === Math.round(pl.blend * 1000)));
  const rows = tracks.map((tr, i) => {
    const last = i === tracks.length - 1, dur = songDuration(t, tr.slot), end = tr.end > 0 ? tr.end : dur;
    const name = trackLabel(id, tr.slot, i), len = trackSeconds(tr, dur, pl, last);
    const part = end > tr.start ? `${fmtClock(tr.start)} to ${fmtClock(end)}` : `From ${fmtClock(tr.start)} to the end`;
    const repeat = !last || pl.endMode !== "loop-last" ? ""
      : pl.loopStart !== null && Math.abs(pl.loopEnd - end) > 1e-3 ? `, then repeats ${fmtClock(pl.loopStart)} to ${fmtClock(pl.loopEnd)}`
      : pl.loopStart !== null && pl.loopStart > tr.start + 0.05 ? `, then repeats from ${fmtClock(pl.loopStart)}` : ", then repeats";
    return `<div class="row-item replaced">
        <div class="info"><div class="file">${i + 1}. ${esc(name)}</div>
          <div class="dir">${esc(part + repeat)}${len ? ` · ${fmtTime(len)}` : ""}</div></div>
        <div class="acts">
          <button class="btn sm ghost" data-act="song-up" data-pos="${i}" aria-label="Play ${esc(name)} earlier" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="btn sm ghost" data-act="song-down" data-pos="${i}" aria-label="Play ${esc(name)} later" ${last ? "disabled" : ""}>↓</button>
          <button class="btn sm" data-act="song-part" data-pos="${i}">Choose part</button>
          <button class="btn sm" data-act="song-replace" data-pos="${i}">Replace</button>
          <button class="btn sm ghost danger" data-act="song-remove" data-pos="${i}">Remove</button>
        </div></div>`;
  }).join("");
  return `<div class="row-item replaced">
      <div class="info"><div class="file">Playlist · ${plural(tracks.length, "song")}${total ? ` · ${fmtTime(total)}` : ""}</div>
        <div class="dir" id="home-music-status">${converted ? "Checking the home music file…" : "Not made into the home music yet."}</div></div>
      <div class="acts">
        <button class="btn sm primary" data-act="convert-music" id="home-music-fix" ${converted ? "hidden" : ""}>${converted ? "Encode again" : "Make the home music"}</button>
        <button class="btn sm" data-act="pl-play" id="pl-play">Play</button>
        <button class="btn sm" data-act="pl-seam">Hear where it repeats</button>
        <button class="btn sm ghost danger" data-act="remove-music">Remove all</button>
      </div></div>
    <div class="rows pl-songs">${rows}</div>
    <div class="pl-foot">
      <button class="btn sm" data-act="song-add" ${tracks.length >= MUSIC_MAX_TRACKS ? "disabled" : ""}>Add song</button>
      <div class="pl-meter${max && total > max * 0.95 ? " full" : ""}">
        <div class="progress" role="progressbar" aria-label="Length of the playlist" aria-valuemin="0" aria-valuemax="${Math.round(max || 0)}" aria-valuenow="${Math.round(total)}"><i style="width:${max ? Math.min(100, total / max * 100).toFixed(1) : 0}%"></i></div>
        <span>${max ? `${fmtTime(total)} of up to ${fmtTime(max)}` : "Reading the console's limit…"}${help("The console plays home music up to about twice as long as its own. Each song's part counts, and what a last song repeats; a crossfade between songs makes the whole a little shorter.")}</span>
      </div></div>
    <div class="trim-fields">
      <label class="field">How the songs join
        <select id="pl-join">${LOOP_CHOICES.map(([, , label], i) => `<option value="${i}" ${i === (choice < 0 ? 1 : choice) ? "selected" : ""}>${label}</option>`).join("")}</select></label>
      <label class="field">At the end
        <select id="pl-end">
          <option value="loop-all" ${pl.endMode === "loop-all" ? "selected" : ""}>Start again from the first song</option>
          <option value="loop-last" ${pl.endMode === "loop-last" ? "selected" : ""}>Keep repeating the last song</option>
        </select></label>
    </div>
    <label class="field">Loudness <span id="gain-label">${esc(gainLabel(t.gain || 0))}</span>
      <input type="range" min="-12" max="12" step="1" value="${t.gain || 0}" id="music-gain"></label>
    <p class="note">Each song is brought to the same loudness first, so none is much louder than the others.${converted ? ` ${esc(MUSIC_HEAR_NOTE)} ${esc(MUSIC_PLACE_NOTE)}` : ""}</p>`;
}

/* Adding or replacing a song opens the part editor; nothing is saved until "Use this". */
async function addSong() {
  const id = state.editId, t = themeById(id), slot = freeSlot(t);
  if (!slot) return toast(`A playlist holds up to ${MUSIC_MAX_TRACKS} songs.`, "err");
  const file = await pickFile("audio/*");
  if (file) await openSongEditor(id, file, { slot, pos: themeTracks(t).length, adding: true });
}
async function replaceSong(pos) {
  const id = state.editId, tr = themeTracks(themeById(id))[pos];
  if (!tr) return;
  const file = await pickFile("audio/*");
  if (file) await openSongEditor(id, file, { slot: tr.slot, pos });
}
async function openSongEditor(id, file, track) {
  const p = progressToast("Reading music…");
  try {
    let chans = await decodeAudio(file, MUSIC_RATE, 2);
    const keep = Math.floor(MUSIC_SOURCE_MAX_BYTES / 4), long = chans[0].length > keep;
    if (long) chans = trimWithFade(chans, keep, MUSIC_RATE);
    const pl = themePlaylist(themeById(id));
    track.name = songTitle(file);
    await openTrim(id, chans, MUSIC_RATE, { start: 0, end: 0, loop: pl.join, blend: pl.blend }, true, track);
    p.done(long ? `Only the first ${fmtTime(keep / MUSIC_RATE)} of the song can be kept. Choose the part to use.`
      : "Choose the part of the song to use.", "");
    const handle = $("#trim-start");
    if (handle) handle.focus();
  } catch (e) { p.done(e.message, "err"); }
}
async function openSongPart(pos) {
  const id = state.editId, t = themeById(id), tracks = themeTracks(t), tr = tracks[pos];
  if (!tr) return;
  const pl = themePlaylist(t), repeats = pos === tracks.length - 1 && pl.endMode === "loop-last" && pl.loopStart !== null;
  const p = progressToast("Reading the song…");
  try {
    const s = await fetchSong(id, tr.slot, f => { if (f >= 0) p.set("Reading the song…", f); });
    await openTrim(id, s.chans, s.rate, {
      start: tr.start, end: tr.end, loop: pl.join, blend: pl.blend, order: "music",
      loopStart: repeats ? pl.loopStart : null, loopEnd: repeats ? pl.loopEnd : null,
    }, false, { slot: tr.slot, pos, name: songName(tr.slot) });
    p.done("Choose the part of the song to use.", "");
    const handle = $("#trim-start");
    if (handle) handle.focus();
  } catch (e) { p.done(e.message, "err"); }
}

async function saveSongPart() {
  const t = state.trim, tr = t.track, id = t.id;
  stopPreview();
  const p = progressToast(tr.adding ? "Adding the song…" : "Saving the song's part…");
  try {
    const seq = themeTracks(themeById(id)).map(x => x.slot);
    if (t.fresh) {
      p.set("Sending the song to the console…", 0, 0.9);
      await uploadVerified("/api/theme/music", { id, slot: tr.slot }, pcmWav(t.chans, t.rate));
      setSongNames(names => { if (tr.name) names[tr.slot] = tr.name; else delete names[tr.slot]; });
    }
    const params = tr.slot === 1 ? { start: toMs(t.start), end: toMs(t.end), play_from: -1 }
                                 : { [`start${tr.slot}`]: toMs(t.start), [`end${tr.slot}`]: toMs(t.end) };
    if (tr.adding) {
      /* a new last song: nothing of the old last one's repeat carries over; one song becomes the first of a playlist */
      const next = seq.concat(tr.slot);
      Object.assign(params, { sequence: next.join(","), tracks: next.length, loop_start: -1, loop_end: -1 });
      if (seq.length === 1) params.order = "music";
    }
    if (tr.loopLast) Object.assign(params, { loop_start: toMs(t.loopStart), loop_end: toMs(t.loopEnd) });
    await api("POST", "/api/theme/settings", { id, ...params });
    keepSong(id, tr.slot, t.chans, t.rate, Math.max(0, t.start - SONG_PRE), t.end);
    state.trim = null;
    await refreshStatus();
    p.done("", "");
  } catch (e) {
    await refreshStatus();
    p.done(e.message, "err");
    renderAspect(aspectById("music"));
    return;
  }
  renderAspect(aspectById("music"));
  await rebuildPlaylist(id);
}

async function removeSong(pos) {
  const id = state.editId, tracks = themeTracks(themeById(id)), gone = tracks[pos];
  if (!gone || tracks.length < 2) return;
  stopPreview();
  const p = progressToast("Removing the song…");
  try {
    const rest = tracks.filter((_, k) => k !== pos), params = {};
    if (gone.slot === 1) {
      /* music.wav stays the theme's song: the next song moves into it */
      const mover = rest[0];
      p.set("Moving a song…", 0.05, 0.9);
      const res = await fetch(`/api/theme/music?${q({ id, slot: mover.slot })}`);
      if (!res.ok) throw new Error("a song could not be read from the console");
      await uploadVerified("/api/theme/music", { id, slot: 1 }, new Blob([await res.arrayBuffer()]));
      await api("DELETE", "/api/theme/music", { id, slot: mover.slot });
      const moved = mover.slot;
      setSongNames(names => { if (names[moved]) names[1] = names[moved]; else delete names[1]; delete names[moved]; });
      const kept = songCache.get(`${id}|${mover.slot}`);
      songCacheDrop(id, 1);
      songCacheDrop(id, mover.slot);
      if (kept) songCache.set(`${id}|1`, kept);
      Object.assign(params, { start: toMs(mover.start), end: toMs(mover.end), play_from: -1 });
      mover.slot = 1;
    } else {
      await api("DELETE", "/api/theme/music", { id, slot: gone.slot });
      setSongNames(names => { delete names[gone.slot]; });
      songCacheDrop(id, gone.slot);
    }
    const seq = rest.map(x => x.slot);
    Object.assign(params, { sequence: seq.join(","), tracks: seq.length });
    if (pos === tracks.length - 1 || seq.length === 1) Object.assign(params, { loop_start: -1, loop_end: -1, order: "music" });
    await api("POST", "/api/theme/settings", { id, ...params });
    await refreshStatus();
    p.done("", "");
  } catch (e) {
    await refreshStatus();
    p.done(e.message, "err");
    renderAspect(aspectById("music"));
    return;
  }
  renderAspect(aspectById("music"));
  await remakeHomeMusic(id);
}

async function moveSong(pos, dir) {
  const id = state.editId, tracks = themeTracks(themeById(id)), to = pos + dir;
  if (to < 0 || to >= tracks.length) return;
  stopPreview();
  const seq = tracks.map(x => x.slot);
  [seq[pos], seq[to]] = [seq[to], seq[pos]];
  const params = { sequence: seq.join(","), tracks: seq.length };
  if (seq[seq.length - 1] !== tracks[tracks.length - 1].slot) Object.assign(params, { loop_start: -1, loop_end: -1 });
  try {
    await api("POST", "/api/theme/settings", { id, ...params });
    await refreshStatus();
  } catch (e) { return toast(e.message, "err"); }
  const box = $("#aspect-music");
  renderAspect(aspectById("music"));
  /* the focus follows the song */
  const same = $(`[data-act="${dir < 0 ? "song-up" : "song-down"}"][data-pos="${to}"]`, box);
  const other = $(`[data-act="${dir < 0 ? "song-down" : "song-up"}"][data-pos="${to}"]`, box);
  if (same && !same.disabled) same.focus(); else if (other) other.focus();
  await rebuildPlaylist(id);
}

async function setPlaylistJoin(i) {
  const id = state.editId, [join, blend] = LOOP_CHOICES[i] || LOOP_CHOICES[1];
  try {
    await api("POST", "/api/theme/settings", { id, between: join, loop: join, blend });
    await refreshStatus();
  } catch (e) { return toast(e.message, "err"); }
  await rebuildPlaylist(id);
}
async function setPlaylistEnd(mode) {
  const id = state.editId;
  try {
    await api("POST", "/api/theme/settings", { id, end_mode: mode });
    await refreshStatus();
  } catch (e) { return toast(e.message, "err"); }
  renderKeepingFocus(aspectById("music"));
  await rebuildPlaylist(id);
}

/* Play the playlist as the console will loop it (`around`: only the seconds around where it repeats). */
async function playPlaylist(around) {
  stopPreview();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return toast("This browser cannot play audio previews.", "err");
  const ctx = new Ctx();     /* made at the press, so the browser lets it play */
  const id = state.editId, p = progressToast("Putting the playlist together…");
  let a;
  try { a = await playlistAudio(id, p, 1); p.done("", ""); }
  catch (e) { ctx.close(); return p.done(e.message, "err"); }
  if (state.editId !== id || state.trim || !$("#pl-play") || preview) { ctx.close(); return; }
  if (ctx.state === "suspended") await ctx.resume().catch(() => {});
  const [L, R] = a.built.chans, buf = ctx.createBuffer(2, L.length, a.rate);
  buf.copyToChannel(L, 0);
  buf.copyToChannel(R, 1);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  src.loopStart = a.built.intro / a.rate;
  src.loopEnd = buf.duration;
  src.connect(ctx.destination);
  const offset = around ? Math.max(0, buf.duration - 5) : 0;
  src.start(0, offset);
  preview = { ctx, src, offset, began: ctx.currentTime, frame: 0, timer: around ? setTimeout(stopPreview, 10000) : 0 };
  const play = $("#pl-play");
  if (play && !around) play.textContent = "Stop";
}

function pickFile(accept) {
  return new Promise(resolve => {
    const picker = $("#picker");
    picker.value = "";
    picker.accept = accept || "";
    picker.onchange = () => resolve(picker.files[0] || null);
    picker.click();
  });
}

      }).join("")}</div></div>` : "";
