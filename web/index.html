}

/* ================================================================ zip import / export */

async function readZip(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Not a zip file");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const entries = [];
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("Damaged zip file");
    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
    const crc = dv.getUint32(p + 16, true), size = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    if (name.endsWith("/")) continue;
    if (flags & 1) throw new Error("Encrypted zip files are not supported");
    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    const data = buf.subarray(start, start + size);
    entries.push({
      path: name,
      blob: async () => {
        let blob;
        if (method === 0) blob = new Blob([data]);
        else if (method === 8) {
          if (typeof DecompressionStream === "undefined") throw new Error("This browser cannot unzip; use a current Chrome, Edge, Firefox or Safari");
          blob = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
        } else throw new Error(`${name}: unsupported compression`);
        if (crc32(new Uint8Array(await blob.arrayBuffer())) !== crc) throw new Error(`${name} is damaged (checksum mismatch)`);
        return blob;
      },
    });
  }
  return entries;
}

function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.path), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(12, 33, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true);
    parts.push(lh, name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(14, 33, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(ch, name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((n, x) => n + x.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}

async function exportTheme(id) {
  const t = themeById(id);
  const p = progressToast(`Exporting ${t.name}…`);
  try {
    const { files } = await api("GET", "/api/theme/files", { id });
    const out = [{ path: "theme.ini", data: new TextEncoder().encode(`name=${t.name}\nfw=${t.fw}\nmusic_gain=${t.gain || 0}\n` +
      `music_start=${t.musicStart || 0}\nmusic_end=${t.musicEnd || 0}\n` +
      `music_loop_start=${t.musicLoopStart == null ? -1 : t.musicLoopStart}\nmusic_loop_end=${t.musicLoopEnd == null ? -1 : t.musicLoopEnd}\n` +
      `music_order=${t.musicOrder || "music"}\nmusic_play_from=${t.musicPlayFrom == null ? -1 : t.musicPlayFrom}\n` +
      `music_loop=${t.musicLoop || "crossfade"}\nmusic_blend=${t.musicBlend == null ? 2000 : t.musicBlend}\n` + playlistIni(t)) }];
    /* a playlist's other songs, music2.wav … beside music.wav */
    const songs = t.music ? themeTracks(t).filter(x => x.slot !== 1) : [];
    const total = files.length + (t.music ? 1 : 0) + songs.length;
    for (let i = 0; i < files.length; i++) {
      const res = await fetch(`/api/theme/file?${q({ id, path: files[i].path })}`);
      if (!res.ok) throw new Error(`Could not read ${files[i].path}`);
      out.push({ path: "files" + files[i].path, data: new Uint8Array(await res.arrayBuffer()) });
      p.set(`Exporting ${t.name}…`, (i + 1) / total);
    }
    if (t.music) {
      const res = await fetch(`/api/theme/music?${q({ id })}`);
      if (!res.ok) throw new Error("Could not read the music");
      out.push({ path: "music.wav", data: new Uint8Array(await res.arrayBuffer()) });
    }
    for (let i = 0; i < songs.length; i++) {
      p.set(`Exporting ${t.name}: song ${i + 2} of ${songs.length + 1}…`, (files.length + 1 + i) / total, (files.length + 2 + i) / total);
      const res = await fetch(`/api/theme/music?${q({ id, slot: songs[i].slot })}`);
      if (!res.ok) throw new Error("Could not read a song of the playlist");
      out.push({ path: `music${songs[i].slot}.wav`, data: new Uint8Array(await res.arrayBuffer()) });
    }
    for (const [kind, name] of PREVIEW_FILES) {
      const res = await fetch(`/api/theme/preview?${q({ id, kind })}`);
      if (res.ok) out.push({ path: name, data: new Uint8Array(await res.arrayBuffer()) });
    }
    /* the editor's choices (placement, fit, song names …), when the theme has any */
    const choices = cleanChoices(await fetch(`/api/theme/choices?${q({ id })}`).then(r => r.ok ? r.json() : {}).catch(() => ({})));
    if (Object.keys(choices).length) out.push({ path: "choices.json", data: new TextEncoder().encode(JSON.stringify({ v: 1, ...choices })) });
    const zip = makeZip(out);
    const back = await readZip(new File([zip], "check.zip"));   /* verify before handing it over */
    if (back.length !== out.length) throw new Error("export did not verify");
    for (const e of back) await e.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(zip);
    a.download = `${id}.zip`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    const mb = (zip.size / 1048576).toFixed(zip.size < 10485760 ? 1 : 0);
    p.done(`Saved ${id}.zip: ${describeFiles(files.map(f => f.path)) || "no theme files"}` +
      `${songs.length ? `, ${plural(songs.length + 1, "song")}` : t.music ? ", the song" : ""}, ${mb} MB, verified.`, "ok");
  } catch (e) { p.done(e.message, "err"); }
}

/* theme.ini's playlist lines: the songs' order, each added song's part, how they join and how it ends. */
function playlistIni(t) {
  const tracks = themeTracks(t), pl = themePlaylist(t);
  return `music_tracks=${tracks.length}\nmusic_between=${pl.join}\nmusic_end_mode=${pl.endMode}\nmusic_sequence=${tracks.map(x => x.slot).join(",")}\n` +
    tracks.filter(x => x.slot !== 1).map(x => `music${x.slot}_start=${toMs(x.start)}\nmusic${x.slot}_end=${toMs(x.end)}\n`).join("");
}

/* "15 backgrounds, the home music and 2 other files", for export and import. */
function describeFiles(paths) {
  const bg = paths.filter(x => BG_RE.test(x)).length, music = paths.includes(HOME_MUSIC);
  const ui = paths.filter(x => /\.rco$/i.test(x)).length;
  const other = paths.length - bg - ui - (music ? 1 : 0);
  const parts = [bg ? plural(bg, "background") : "", music ? "the home music" : "", ui ? `interface pictures (${plural(ui, "file")})` : "",
                 other ? plural(other, "other file") : ""].filter(Boolean);
  return parts.length > 1 ? `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}` : parts[0] || "";
}

function parseIni(text) {
  const out = {};
  text.split(/\r?\n/).forEach(l => { const i = l.indexOf("="); if (i > 0) out[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  return out;
}

async function importEntries(entries, fallbackName) {
  const ini = entries.filter(e => /(^|\/)theme\.ini$/.test(e.path)).sort((a, b) => a.path.length - b.path.length)[0];
  const meta = ini ? parseIni(await (await ini.blob()).text()) : {};
  const prefix = ini ? ini.path.slice(0, -"theme.ini".length) : "";
  const music = entries.find(e => e.path === prefix + "music.wav");
  /* A playlist: its other songs (music2.wav …) and their order; only songs that are in the zip, and none without music.wav. */
  const songs = [];
  for (let s = 2; music && s <= MUSIC_MAX_TRACKS; s++) {
    const e = entries.find(x => x.path === prefix + `music${s}.wav`);
    if (e) songs.push({ slot: s, e });
  }
  const present = new Set(music ? [1, ...songs.map(x => x.slot)] : []);
  const seq = [...new Set(String(meta.music_sequence || "1").split(",").map(Number).filter(s => present.has(s)))];
  if (music && !seq.includes(1)) seq.unshift(1);
  const playlist = seq.length > 1;
  const pictures = PREVIEW_FILES.map(([kind, name]) => [kind, entries.find(e => e.path === prefix + name)]).filter(([, e]) => e);
  const choicesEntry = entries.find(e => e.path === prefix + "choices.json");
  /* Everything under the theme's files/ folder (the console decides what it
     accepts); without a theme.ini, anything under a themable folder. */
  const files = [];
  const root = prefix + "files/";
  for (const e of entries) {
    if (ini && e.path.startsWith(root)) { files.push({ asset: "/" + e.path.slice(root.length), blob: e.blob }); continue; }
    if (ini) continue;
    const idx = Math.min(...ASSET_ROOTS.map(r => { const i = e.path.indexOf(r); return i < 0 ? Infinity : i; }));
    if (idx !== Infinity && (idx === 0 || e.path[idx - 1] === "/")) files.push({ asset: "/" + e.path.slice(idx), blob: e.blob });
  }
  if (!files.length && !music) throw new Error("No theme files found. Expected theme.ini with files/system_ex/rnps/… or music.wav.");

  const name = uniqueName(meta.name || fallbackName.replace(/\.zip$/i, ""));
  const id = await createTheme(name, meta.fw || state.status.fw);
  const gain = Math.max(-12, Math.min(12, parseInt(meta.music_gain, 10) || 0));
  const settings = { id, gain };
  for (const [key, param] of [["music_start", "start"], ["music_end", "end"], ["music_loop_start", "loop_start"],
                              ["music_loop_end", "loop_end"], ["music_order", "order"], ["music_play_from", "play_from"],
                              ["music_loop", "loop"], ["music_blend", "blend"]]) {
    if (meta[key] !== undefined && meta[key] !== "") settings[param] = meta[key];
  }
  if (playlist) {
    Object.assign(settings, { sequence: seq.join(","), tracks: seq.length });
    if (meta.music_between) settings.between = meta.music_between;
    if (meta.music_end_mode) settings.end_mode = meta.music_end_mode;
    for (const s of seq) {
      if (s === 1) continue;
      for (const k of ["start", "end"]) if (meta[`music${s}_${k}`] !== undefined && meta[`music${s}_${k}`] !== "") settings[`${k}${s}`] = meta[`music${s}_${k}`];
    }
  }
  await api("POST", "/api/theme/settings", settings).catch(() => {});
  await refreshStatus();
  const p = progressToast(`Importing ${name}…`);
  let ok = 0, skipped = 0;
  const added = [], why = [];
  const convert = music && !files.some(f => f.asset === HOME_MUSIC);   /* exported before 1.10, or without its home music */
  const extra = songs.filter(x => playlist && seq.includes(x.slot));
  const total = files.length + (music ? 1 : 0) + extra.length + (convert ? 1 : 0);
  for (let i = 0; i < files.length; i++) {
    p.set(`Importing ${name}… ${i + 1}/${total}`, i / total, (i + 1) / total);
    try { await uploadVerified("/api/theme/file", { id, path: files[i].asset }, await files[i].blob()); ok++; added.push(files[i].asset); }
    catch (e) { skipped++; why.push(`${baseName(files[i].asset)}: ${e.message}`); }
    p.set(`Importing ${name}… ${i + 1}/${total}`, (i + 1) / total);
  }
  if (music) {
    try {
      const blob = await music.blob();
      p.set(`Importing ${name}: the music…`, files.length / total, (files.length + 1) / total);
      await uploadVerified("/api/theme/music", { id }, blob);
      ok++;
      if (convert && !playlist) {
        const { chans, rate } = wavChannels(await blob.arrayBuffer());
        const stereo = chans.length === 1 ? [chans[0], chans[0]] : chans;
        await convertHomeMusic(id, buildHomeMusic(stereo, rate, themePart(themeById(id) || {})), rate, gain, p);
        ok++;
        added.push(HOME_MUSIC);
      }
    } catch (e) { skipped++; why.push(`music: ${e.message}`); }
  }
  for (let i = 0; i < extra.length; i++) {
    const done = files.length + 1 + i;
    p.set(`Importing ${name}: song ${i + 2} of ${extra.length + 1}…`, done / total, (done + 1) / total);
    try { await uploadVerified("/api/theme/music", { id, slot: extra[i].slot }, await extra[i].e.blob()); ok++; }
    catch (e) { skipped++; why.push(`music${extra[i].slot}.wav: ${e.message}`); }
  }
  if (convert && playlist && music) {
    try {
      await refreshStatus();
      const a = await playlistAudio(id, null, 0);
      p.set(`Importing ${name}: making the home music…`, (total - 1) / total, 1);
      await convertHomeMusic(id, a.built, a.rate, gain, p);
      ok++;
      added.push(HOME_MUSIC);
    } catch (e) { skipped++; why.push(`home music: ${e.message}`); }
  }
  for (const [kind, e] of pictures) {
    try { await uploadVerified("/api/theme/preview", { id, kind }, await e.blob()); } catch (err) { /* optional */ }
  }
  if (choicesEntry) {
    /* only what the page understands goes in; a damaged file is left out */
    try {
      const c = cleanChoices(JSON.parse(await (await choicesEntry.blob()).text()));
      if (Object.keys(c).length) await putChoices(id, c);
    } catch (err) { /* optional */ }
  }
  await api("POST", "/api/theme/save", { id }).catch(() => {});   /* an imported theme starts saved */
  await refreshStatus();
  const got = describeFiles(added) || "no theme files";
  p.done(skipped
    ? `Imported ${name}: ${got}, verified. ${skipped} skipped (not on this firmware or not valid here): ${why.slice(0, 2).join("; ")}`
    : `Imported ${name}: ${got}, all verified.`, skipped ? "" : "ok");
  if (state.route === "library") render();
}

function readDirEntry(entry) {
  return new Promise(resolve => {
    const reader = entry.createReader(), all = [];
    const next = () => reader.readEntries(batch => { if (!batch.length) return resolve(all); all.push(...batch); next(); }, () => resolve(all));
    next();
  });
}
async function walk(entry, out) {
  if (entry.isFile) out.push({ path: entry.fullPath.replace(/^\//, ""), blob: () => new Promise((res, rej) => entry.file(res, rej)) });
  else if (entry.isDirectory) for (const child of await readDirEntry(entry)) await walk(child, out);
}
async function importDrop(dt) {
  const roots = Array.from(dt.items || []).filter(i => i.kind === "file")
    .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  try {
    if (roots.some(r => r.isDirectory)) {
      for (const root of roots.filter(r => r.isDirectory)) {
        const entries = [];
        await walk(root, entries);
        await importEntries(entries, root.name);
      }
      return;
    }
    for (const file of Array.from(dt.files)) await importFile(file);
  } catch (e) { toast(e.message, "err", 9000); }
}
async function importFile(file) {
  if (!/\.zip$/i.test(file.name)) throw new Error(`${file.name} is not a .zip theme`);
  await importEntries(await readZip(file), file.name);
}

    case "tiles-number": return numberTileIcons();
    case "istyle-shape": {   /* shown at once; kept on the console as it goes (setChoice says if it can't be) */
      const kept = setIconStyle(x => { x.shape = el.dataset.v; });
      renderAspect(aspectById("titles"));
      const b = document.querySelector(`[data-act="istyle-shape"][data-v="${el.dataset.v}"]`);
      if (b) b.focus();
      return kept;
    }
    case "istyle-behind": {
      if (el.dataset.v === "picture" && !await iconBackdropKept()) {   /* no picture yet: choose one and place it */
        const file = await pickFile("image/*");
        if (file) await openBgEditor(file);
        return;
      }
      const kept = setIconStyle(x => { x.behind = el.dataset.v; });
      renderAspect(aspectById("titles"));
      const b = document.querySelector(`[data-act="istyle-behind"][data-v="${el.dataset.v}"]`);
      if (b) b.focus();
      return kept;
    }
    case "istyle-picture": {
      const file = await pickFile("image/*");
      if (file) await openBgEditor(file);
      return;
    }
    case "istyle-adjust": return openBgEditor(`/api/theme/preview?${q({ id: state.editId, kind: "iconbg" })}&v=${stamp}`);
    case "bge-cancel": return bgeClose();
    case "bge-save": el.disabled = true; el.textContent = "Keeping…"; return bgeSave().catch(e => { el.disabled = false; el.textContent = "Use this picture"; toast(e.message, "err"); });
    case "bge-zoom": return bge && bgeZoom(bge.zoom * (+el.dataset.v > 0 ? 1.15 : 1 / 1.15));
    case "bge-reset": if (bge) { bge.zoom = 1; bge.s = bge.fill; bge.ox = (bge.F - bge.iw * bge.s) / 2; bge.oy = (bge.F - bge.ih * bge.s) / 2; bgeZoom(1); } return;
    case "bge-file": { const file = await pickFile("image/*"); if (file) await openBgEditor(file); return; }
    case "bge-fromtheme": return openBgEditor(`/api/theme/preview?${q({ id: state.editId, kind: "background" })}&v=${stamp}`);
    case "istyle-run": return styleIcons(false);
    case "istyle-remove": el.disabled = true; el.textContent = "Removing…"; return removeIconStyle();
    case "title-pic": {
      const file = await pickFile("image/*"), title = el.dataset.title, stem = el.dataset.stem;
      if (!file || !(await titlePicture(title, stem, file))) return;
      if (stem === "icon0") { await iconChangedByHand(title); renderAspect(aspectById("titles")); }
      return;
    }
    case "title-reset": {
      const g = titleGroups().find(x => x.title === el.dataset.title);
      if (g) { await resetAssets(g.pictures); await iconChangedByHand(g.title, true); renderAspect(aspectById("titles")); }
      return;
    }
    case "tile-icon": {
      const file = await pickFile("image/*,.svg");
      if (file) tileIcon(el.dataset.title, file);
      return;
    }
    case "tile-bg": {
      const g = tileGroups().find(x => x.title === el.dataset.title), file = g && await pickFile("image/*");
      if (file) { await attachTo([g.bg], file, `${(state.tileNames && state.tileNames.get(g.title)) || g.title} background`); renderAspect(aspectById("tiles")); }
      return;
    }
    case "tile-reset": {
      const g = tileGroups().find(x => x.title === el.dataset.title);
      if (g) { await resetAssets(g.icons.concat(g.bg ? [g.bg] : [])); renderAspect(aspectById("tiles")); }
      return;
    }
    case "choose-cover": return chooseCover();
    case "remove-cover": return removePreview(state.editId, "picture");
    case "trim-play": return preview && !preview.timer ? stopPreview() : playPreview("");
    case "trim-seam": return playPreview("loop");
    case "trim-joint": return playPreview("joint");
    case "trim-cancel":
      stopPreview();
      state.trim = null;
      return renderAspect(aspectById("music"));
    case "trim-save": return saveTrim();
    case "more": state.pages[asp.id] = (state.pages[asp.id] || 48) + 96; return renderAspect(asp);
    case "toggle-area": {
      const off = bgOff();
      if (off.has(el.dataset.area)) off.delete(el.dataset.area); else off.add(el.dataset.area);
      setBgOff(off);
      renderAspect(aspectById("background"));
      const again = document.querySelector(`[data-act="toggle-area"][data-area="${CSS.escape(el.dataset.area)}"]`);
      if (again) again.focus();
      return;
    }
    case "refresh-log": return loadLog();
    case "fit-pick": {
      if (state.fit === el.dataset.v) return;
      state.fit = el.dataset.v;
      setChoice(c => { c.fit = state.fit; });
      for (const b of document.querySelectorAll('[data-act="fit-pick"]')) b.setAttribute("aria-checked", String(b.dataset.v === state.fit));
      return refitPictures();
    }
    case "place-pick": {
      const path = el.dataset.path, mode = el.dataset.v;
      if (placementFor(path).mode === mode) return;
      apFollow(path);
      setChoice(c => { pieceChoice(c, path).place = mode; });
      return placementChanged(path, true);
    }
    case "ap-view": case "ap-look": {
      apView = { ...apView, [el.dataset.act === "ap-view" ? "view" : "look"]: el.dataset.v };
      const box = el.closest(".ap-preview");
      if (box) box.outerHTML = apPreviewBox();
      apPreviewShow();
      const again = document.querySelector(`.ap-preview [data-act="${el.dataset.act}"][data-v="${el.dataset.v}"]`);
      if (again) again.focus();
      return;
    }
    case "advanced": {
      state.showAdvanced = !advancedShown();
      $("#secnav").innerHTML = secNavHtml();
      if ($("#steps")) $("#steps").innerHTML = stepsHtml(state.section || "theme");
      const first = state.showAdvanced && $('#secnav [data-section="textures"]');
      if (first) first.focus(); else { const m = $('#secnav [data-act="advanced"]'); if (m) m.focus(); }
      return;
    }
    case "view-crash":
      try { $("#log").textContent = await api("GET", "/api/crash", { name: el.dataset.name }); }
      catch (err) { toast(err.message, "err"); }
      return;
  }
});

document.addEventListener("submit", async e => {
  if (e.target.id === "mix") { e.preventDefault(); return createMix(); }
  if (e.target.id !== "create") return;
  e.preventDefault();
  const name = $("#new-name").value.trim();
  if (!name) return;
  try {
    const id = await createTheme(name, $("#new-fw").value);
    state.creating = false;
    location.hash = `#/edit/${encodeURIComponent(id)}`;
  } catch (err) { toast(err.message, "err"); }
});

let filterTimer = 0;
/* A placement option changed for a piece: its texture is made again from the kept picture, if there is one. */
/* A piece's placement, padding or clock band changed: the piece is made again with it, at once, with its progress
   showing from the first moment. Changes are made one at a time; a piece changed again while it waits is made once,
   with the latest choice (each run reads the options as they are when it starts). */
let placeWork = Promise.resolve();
const placeWaiting = new Set();
function placementChanged(path, redraw) {
  if (redraw) renderAspect(aspectById("appearance"));   /* "Fill with padding" shows its padding box at once */
  if (!state.files.has(path) || placeWaiting.has(path)) return placeWork;
  placeWaiting.add(path);
  const id = state.editId;
  placeWork = placeWork.then(() => {
    placeWaiting.delete(path);
    return state.editId === id ? placementChangedNow(path) : null;
  }).catch(e => toast(e.message, "err"));
  return placeWork;
}
async function placementChangedNow(path) {
  const asp = aspectById("appearance");
  if (!state.files.has(path)) return;
  if (!state.sources.has(path) && !state.keepOriginals) {
    toast("This theme does not keep original pictures, so this applies the next time you attach a picture.", "", 7000);
    return;
  }
  const p = progressToast(`Making ${appearanceName(path)} again…`);
  let recovered = false;
  try {
    if (!state.sources.has(path)) {
      try { recovered = await recoverSource(path, p); }
      catch (e) { /* a texture this page did not make: it needs its picture attached */ }
    }
    if (!state.sources.has(path)) {
      p.done("This piece's picture can't be read back from the console. Attach the picture again to use the new option.", "err");
      return;
    }
    if (!(await remakeFromSource(path, p))) p.done("The picture kept in the theme is gone. Attach the picture again to use the new option.", "err");
    else if (recovered) toast("Made again from the picture in the texture. Attach the original once more if you want back what the earlier placement cropped away.", "", 9000);
  } catch (e) { p.done(e.message, "err"); }
  await refreshStatus();
  renderAspect(asp);
}

document.addEventListener("input", e => {
  if (e.target.id === "mix-name" && state.mix) { state.mix.name = e.target.value; return; }
  if (e.target.id === "istyle-scale") {   /* the shapes redraw at the new size as the slider moves; kept when let go */
    $("#istyle-scale-label").textContent = `${e.target.value}%`;
    state.choices.iconStyle = { ...iconStyle(), scale: +e.target.value };
    return iconStyleShow();
  }
  if (e.target.dataset && e.target.dataset.pad) {
    const v = Math.max(0, Math.min(40, Math.round(+e.target.value || 0)));
    pieceChoice(state.choices, e.target.dataset.pad).pad = v;
    return;     /* kept and made again when the box is left (its change event) */
  }
  const aspId = e.target.dataset && e.target.dataset.filterAspect;
  if (aspId) {
    state.filters[aspId] = e.target.value;
    state.pages[aspId] = 48;
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => {
      renderAspect(aspectById(aspId));
      const input = $(`[data-filter-aspect="${aspId}"]`);
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }, 250);
  }
  if (e.target.id === "music-gain") $("#gain-label").textContent = gainLabel(+e.target.value);
  if (e.target.id === "rco-lookup") {
    state.rcoLookup = e.target.value;
    clearTimeout(rcoLookupTimer);
    rcoLookupTimer = setTimeout(rcoLookup, 250);
  }
  const timeField = { "trim-start-time": "start", "trim-end-time": "end", "trim-lstart-time": "lstart", "trim-lend-time": "lend",
                      "trim-from-time": "from" }[e.target.id];
  if (timeField && state.trim) {
    const v = parseClock(e.target.value);
    if (!isNaN(v)) { state.trim[EDGE_KEY[timeField]] = v; clampTrim(timeField); drawTrim(); }
  }
});

document.addEventListener("change", async e => {
  const mixEl = e.target;
  if (state.mix && (mixEl.id === "mix-all" || (mixEl.dataset && (mixEl.dataset.mixPart || mixEl.dataset.mixElem)))) {
    const m = state.mix;
    if (mixEl.id === "mix-all") {
      for (const part of MIX_PARTS) m.picks[part.id] = mixEl.value && mixHas(m.themes.get(mixEl.value), part) ? mixEl.value : "";
      m.elems = {};
    } else if (mixEl.dataset.mixPart) m.picks[mixEl.dataset.mixPart] = mixEl.value;
    else {
      const own = m.elems[mixEl.dataset.mixElem] = m.elems[mixEl.dataset.mixElem] || {};
      if (mixEl.value === "*") delete own[mixEl.dataset.key]; else own[mixEl.dataset.key] = mixEl.value;
    }
    return renderLibrary();
  }
  if (e.target.dataset && e.target.dataset.keep) {
    const on = e.target.checked;
    setChoice(c => { pieceChoice(c, e.target.dataset.keep).keepClear = on; });
    return placementChanged(e.target.dataset.keep, false);
  }
  if (e.target.dataset && e.target.dataset.place) {
    apFollow(e.target.dataset.place);
    const mode = e.target.value;
    setChoice(c => { pieceChoice(c, e.target.dataset.place).place = mode; });
    return placementChanged(e.target.dataset.place, true);   /* "Fill with padding" shows its padding box */
  }
  if (e.target.dataset && e.target.dataset.pad) { setChoice(() => {}); return placementChanged(e.target.dataset.pad, false); }
  const t = e.target;
  if (t.id === "pv-look") { pvState.look = t.value; return previewRender(state.editId); }
  if (t.id === "istyle-scale") { const kept = setIconStyle(x => { x.scale = +t.value; }); iconStyleShow(); return kept; }
  if (t.id === "istyle-colour") { const kept = setIconStyle(x => { x.colour = t.value; }); iconStyleShow(); return kept; }
  if (t.id === "istyle-mine") { await setIconStyle(x => { x.mine = t.checked; }); return renderAspect(aspectById("titles")); }
  if (t.id === "istyle-auto") {
    await setIconStyle(x => { x.auto = t.checked; });
    await api("POST", "/api/theme/icon-style", { id: state.editId, auto: t.checked ? 1 : 0 }).catch(err => toast(err.message, "err"));
    return;
  }
  if (t.id === "pl-join") return setPlaylistJoin(+t.value);
  if (t.id === "pl-end") return setPlaylistEnd(t.value);
  if (t.id === "keep-originals") {
    try {
      await api("POST", "/api/theme/settings", { id: state.editId, keep_originals: t.checked ? 1 : 0 });
      state.keepOriginals = t.checked;
      await refreshStatus();
      toast(t.checked ? "Original pictures are kept from now on." : "Original pictures are not kept from now on. Those already kept stay until you remove them.", "ok");
    } catch (err) { t.checked = state.keepOriginals; toast(err.message, "err"); }
    await loadOriginals();
    ASPECTS.forEach(renderAspect);
    return;
  }
  if (t.id === "fit") { state.fit = t.value; setChoice(c => { c.fit = t.value; }); return refitPictures(); }
  try {
    if (t.id === "theme-name" && t.value.trim()) {
      await api("POST", "/api/theme/settings", { id: state.editId, name: t.value.trim() });
      await refreshStatus();
      const h = $("#edit-name");
      if (h) h.textContent = t.value.trim();
      document.title = `${t.value.trim()} · PS5 Themes`;
      toast("Name saved.", "ok");
    }
    if (t.id === "theme-fw") {
      await api("POST", "/api/theme/settings", { id: state.editId, fw: t.value });
      await refreshStatus();
      toast("Firmware saved.", "ok");
    }
    if (t.id === "trim-loop" && state.trim) {
      const [loop, ms] = LOOP_CHOICES[+t.value];
      Object.assign(state.trim, { loop, blend: ms / 1000 });
      if (preview) stopPreview();
      return;
    }
    if (t.id === "trim-order" && state.trim) {
      const tr = state.trim, was = tr.order;
      stopPreview();
      tr.order = t.value;
      if (was === "music" || (t.value === "music-first") !== (was === "music-first")) defaultLoop(tr);
      clampTrim("lend");
      renderAspect(aspectById("music"));
      $("#trim-order").focus();
      return;
    }
    if (/^trim-(l?(start|end)|from)-time$/.test(t.id) && state.trim) { drawTrim(); return; }
    if (t.id === "music-gain") {
      const id = state.editId;
      await api("POST", "/api/theme/settings", { id, gain: t.value });
      await refreshStatus();
      await remakeHomeMusic(id);
      renderAspect(aspectById("music"));
    }
  } catch (err) { toast(err.message, "err"); }
});

/* Drag and drop: onto a drop zone, tile or row attaches a file; elsewhere in
   the Library it imports a theme. */
const drop = $("#drop");
let dragDepth = 0;
const hasFiles = e => Array.from(e.dataTransfer?.types || []).includes("Files");
const dropTarget = e => e.target.closest && e.target.closest("[data-drop], .tile, [data-drop-group]");
window.addEventListener("dragenter", e => {
  if (!hasFiles(e)) return;
  dragDepth++;
  if (state.route === "library") drop.classList.add("on");
});
window.addEventListener("dragleave", e => {
  if (!hasFiles(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) drop.classList.remove("on");
});
window.addEventListener("dragover", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  document.querySelectorAll(".drag").forEach(el => el.classList.remove("drag"));
  const target = dropTarget(e);
  if (target) target.classList.add("drag");
  e.dataTransfer.dropEffect = state.route === "edit" && !target ? "none" : "copy";
});
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  drop.classList.remove("on");
  document.querySelectorAll(".drag").forEach(el => el.classList.remove("drag"));
  const target = dropTarget(e);
  const file = e.dataTransfer.files[0];
  if (target && file) {
    const asp = aspectById(target.dataset.drop || target.dataset.aspect);
    if (target.dataset.drop) attachToAspect(asp, file);
    else {
      const key = target.dataset.group || target.dataset.dropGroup;
      if (asp.id === "appearance") { const g = findGroup(asp, key); if (g) apFollow(g.assets[0].path); }
      attachToGroup(asp, key, file);
    }
  } else if (state.route === "library") {
    importDrop(e.dataTransfer);
  }
});

window.addEventListener("hashchange", () => {
  bgeClose();   /* a dialog of the page being left goes with it */
  if ($("#pv-overlay")) previewClose();
  const left = state.route === "edit" ? themeById(state.editId) : null;
  state.confirming = "";
  stopPreview();
  state.trim = null;
  /* Another part of the theme being edited: only the part beside the list changes */
  const was = state.route === "edit" && $("#editor") ? state.editId : null;
  parseRoute();
  if (was && state.route === "edit" && state.editId === was && themeById(was)) return showPane(true);
  render();
  view.focus({ preventScroll: true });
  if (left && left.unsaved && !(state.route === "edit" && state.editId === left.id)) {
    toast(`${left.name} has unsaved changes. Open it again to save or discard them.`, "", 7000);
  }
});

/* Closing or reloading the page while something is being made or sent would cut it off: the browser asks first. */
addEventListener("beforeunload", e => {
  if (!progressStack.some(p => p.el.isConnected)) return;
  e.preventDefault();
  e.returnValue = "";
});

/* Escape closes the library's New theme and Mix and match forms, as Circle backs out of a menu on the console. */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || state.route !== "library" || $("#pv-overlay") || !(state.creating || state.mix)) return;
  state.creating = false;
  state.mix = null;
  renderLibrary();
  const b = $('.head [data-act="new"]');
  if (b) b.focus();
});

/* Handles of the part editor: arrow keys move by 0.1 s (Shift: 1 s), Page keys
   by 10 s, Home/End to the limits. A PS5 controller's D-pad sends arrows. */
document.addEventListener("keydown", e => {
  const which = Object.keys(HANDLES).find(k => HANDLES[k].slice(1) === e.target.id);
  if (!state.trim || !which) return;
  const t = state.trim, key = EDGE_KEY[which];
  const step = { ArrowLeft: -0.1, ArrowDown: -0.1, ArrowRight: 0.1, ArrowUp: 0.1, PageDown: -10, PageUp: 10 }[e.key];
  if (step !== undefined) t[key] += step * (e.shiftKey && Math.abs(step) < 1 ? 10 : 1);
  else if (e.key === "Home") t[key] = 0;
  else if (e.key === "End") t[key] = t.duration;
  else return;
  e.preventDefault();
  clampTrim(which);
  drawTrim();
});
window.addEventListener("resize", () => { if (state.trim) drawTrim(); });

(async () => {
  if (!location.hash) history.replaceState(null, "", "#/library");
  await refreshStatus();
  render();
  let tick = 0;
  setInterval(async () => {
    tick++;
    if (document.hidden || state.route !== "library" || state.creating || state.mix) return;   /* a form open keeps its focus */
    if (!state.status.applying && tick % 4) return;   /* every second while a theme is being applied */
    const before = JSON.stringify(state.status);
    if (await refreshStatus() && JSON.stringify(state.status) !== before) renderLibrary();
  }, 1000);
})();
</script>
</body>
</html>
