/* ================================================================ conversions (verified) */

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("could not read the image"));
    img.src = src;
  });
}

/* What a picture file really holds, from its first bytes: the console keeps
   the pictures it downloads from PlayStation Network as WebP or JPEG under
   .png names. "" if none of these. */
function sniffImage(b) {
  if (b.length >= 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return "image/png";
  if (b.length >= 3 && b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return "image/jpeg";
  const tag = (o, t) => [...t].every((c, i) => b[o + i] === c.charCodeAt(0));
  if (b.length >= 16 && tag(0, "RIFF") && tag(8, "WEBP")) return "image/webp";
  return "";
}
const MIME_NAME = { "image/png": "PNG", "image/jpeg": "JPEG", "image/webp": "WebP" };

/* A WebP file's chunks after its RIFF header: [{ type, data }], or null. */
function webpChunks(b) {
  if (b.length < 20 || sniffImage(b) !== "image/webp") return null;
  const dv = new DataView(b.buffer, b.byteOffset, b.length), out = [];
  for (let o = 12; o + 8 <= b.length;) {
    const n = dv.getUint32(o + 4, true);
    if (o + 8 + n > b.length) return null;
    out.push({ type: String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]), data: b.subarray(o + 8, o + 8 + n) });
    o += 8 + n + (n & 1);
  }
  return out.length ? out : null;
}

function webpFile(chunks) {
  const size = chunks.reduce((a, c) => a + 8 + c.data.length + (c.data.length & 1), 4);
  const out = new Uint8Array(8 + size), dv = new DataView(out.buffer);
  out.set([0x52, 0x49, 0x46, 0x46]); dv.setUint32(4, size, true); out.set([0x57, 0x45, 0x42, 0x50], 8);
  let o = 12;
  for (const c of chunks) {
    for (let i = 0; i < 4; i++) out[o + i] = c.type.charCodeAt(i);
    dv.setUint32(o + 4, c.data.length, true);
    out.set(c.data, o + 8);
    o += 8 + c.data.length + (c.data.length & 1);
  }
  return out;
}

/* The browser's WebP laid out as the console's: a plain one (a single "VP8 "
   chunk) when the console's is plain, and otherwise without the colour
   profile browsers add, unless the console's has one too. */
function webpLike(out, stock) {
  const oc = webpChunks(out), sc = webpChunks(stock);
  if (!oc || !sc) return out;
  const vp8 = oc.find(c => c.type === "VP8 ");
  if (sc.length === 1 && sc[0].type === "VP8 " && vp8 && !oc.some(c => c.type === "ALPH")) return webpFile([vp8]);
  if (sc[0].type === "VP8X" && oc[0].type === "VP8X" && !sc.some(c => c.type === "ICCP")) {
    const x = oc[0].data.slice();
    x[0] &= ~0x20;   /* "has a colour profile" */
    return webpFile([{ type: "VP8X", data: x }, ...oc.slice(1).filter(c => c.type !== "ICCP")]);
  }
  return out;
}

/* Re-encode an image to the asset's exact format (the one its file really
   holds) and pixel size, then decode the result again to prove it. */
async function imageForAsset(file, assetPath) {
  if (!IMAGE_MIME[ext(assetPath)]) {
    if (!/svg/.test(file.type) && !/\.svg$/i.test(file.name)) throw new Error("use an SVG file for this one");
    return file;
  }
  if (!file.type.startsWith("image/") && !/\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(file.name)) throw new Error(`${file.name} is not an image`);
  const res = await fetch(`/api/asset?${q({ path: assetPath })}`);
  if (!res.ok) throw new Error("could not read the system image");
  const stockBytes = new Uint8Array(await res.arrayBuffer());
  const mime = sniffImage(stockBytes) || IMAGE_MIME[ext(assetPath)];
  /* A WebP without an alpha channel (a plain "VP8 " one) stays opaque. */
  const opaque = mime === "image/jpeg" || (mime === "image/webp" && stockBytes[12] === 0x56 && stockBytes[15] === 0x20);
  const url = URL.createObjectURL(file), stockUrl = URL.createObjectURL(new Blob([stockBytes], { type: mime }));
  let stock, img;
  try {
    [stock, img] = await Promise.all([loadImage(stockUrl), loadImage(url)]);
  } finally { URL.revokeObjectURL(url); URL.revokeObjectURL(stockUrl); }
  const w = stock.naturalWidth, h = stock.naturalHeight;
  if (!w || !h) throw new Error("could not read the system image size");
  if (file.type === mime && img.naturalWidth === w && img.naturalHeight === h) return file;

  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d", { colorSpace: "srgb" });  /* sRGB: same look in SDR and HDR */
  ctx.imageSmoothingQuality = "high";
  if (opaque) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h); }
  let dw = w, dh = h;
  if (state.fit !== "stretch") {
    const s = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);
    dw = img.naturalWidth * s; dh = img.naturalHeight * s;
  }
  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  let blob = await new Promise(r => canvas.toBlob(r, mime, 0.92));
  if (!blob || blob.type !== mime) throw new Error(`this browser cannot make ${MIME_NAME[mime] || mime} pictures; use Chrome, Edge or Firefox for this one`);
  if (mime === "image/webp") blob = new Blob([webpLike(new Uint8Array(await blob.arrayBuffer()), stockBytes)], { type: mime });
  const check = URL.createObjectURL(blob);
  try {
    const out = await loadImage(check);
    if (out.naturalWidth !== w || out.naturalHeight !== h) throw new Error("converted image did not verify");
  } finally { URL.revokeObjectURL(check); }
  return blob;
}

function parseWav(buf) {
  const dv = new DataView(buf);
  const tag = o => String.fromCharCode(...new Uint8Array(buf, o, 4));
  if (buf.byteLength < 12 || tag(0) !== "RIFF" || tag(8) !== "WAVE") return null;
  const info = {};
  for (let o = 12; o + 8 <= buf.byteLength; ) {
    const id = tag(o), size = dv.getUint32(o + 4, true);
    if (id === "fmt ") {
      info.format = dv.getUint16(o + 8, true); info.channels = dv.getUint16(o + 10, true);
      info.rate = dv.getUint32(o + 12, true); info.bits = dv.getUint16(o + 22, true);
    } else if (id === "data") {
      info.dataOffset = o + 8; info.dataSize = size;
      break;
    }
    o += 8 + size + (size & 1);
  }
  return info.format && info.dataOffset ? info : null;
}

/* Decode any audio the browser supports to `channels` channels at `rate`. */
async function decodeAudio(file, rate, channels) {
  const data = await file.arrayBuffer();
  let decoded;
  try {
    decoded = await new OfflineAudioContext(1, 1, rate).decodeAudioData(data.slice(0));
  } catch (e) { throw new Error(`${file.name} is not audio this browser can read`); }
  return renderAudio(decoded, rate, channels);
}

/* Render an AudioBuffer (any rate and layout) with `channels` channels at `rate`. */
async function renderAudio(buffer, rate, channels) {
  const frames = Math.max(1, Math.ceil(buffer.duration * rate));
  const ctx = new OfflineAudioContext(channels, frames, rate);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  src.start();
  const out = await ctx.startRendering();
  return [...Array(channels)].map((_, c) => out.getChannelData(c));
}

async function resample(chans, from, to) {
  if (from === to) return chans;
  const ctx = new OfflineAudioContext(chans.length, 1, from);
  const buf = ctx.createBuffer(chans.length, chans[0].length, from);
  chans.forEach((c, i) => buf.copyToChannel(c, i));
  return renderAudio(buf, to, chans.length);
}

/* 16-bit PCM WAV from channel data, parsed again to prove its shape. */
function pcmWav(chans, rate) {
  const channels = chans.length, frames = chans[0].length;
  const bytes = 44 + frames * channels * 2;
  const buf = new ArrayBuffer(bytes);
  const dv = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); dv.setUint32(4, bytes - 8, true); str(8, "WAVE");
  str(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, channels, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * channels * 2, true); dv.setUint16(32, channels * 2, true);
  dv.setUint16(34, 16, true); str(36, "data"); dv.setUint32(40, frames * channels * 2, true);
  let o = 44;
  for (let i = 0; i < frames; i++) {
    for (let c = 0; c < channels; c++) {
      const v = Math.max(-1, Math.min(1, chans[c][i]));
      dv.setInt16(o, v < 0 ? v * 32768 : v * 32767, true);
      o += 2;
    }

  const check = parseWav(buf);
  if (!check || check.rate !== rate || check.channels !== channels || check.bits !== 16 ||

}

/* Channel data of a 16-bit PCM WAV. */
function wavChannels(buf) {
  const info = parseWav(buf);
  if (!info || info.format !== 1 || info.bits !== 16) throw new Error("the theme's music is not a 16-bit PCM WAV");
  const n = Math.floor(info.dataSize / (2 * info.channels));
  const dv = new DataView(buf, info.dataOffset, n * 2 * info.channels);
  const chans = [...Array(info.channels)].map(() => new Float32Array(n));
  for (let i = 0, o = 0; i < n; i++) for (let c = 0; c < info.channels; c++, o += 2) chans[c][i] = dv.getInt16(o, true) / 32768;
  return { chans, rate: info.rate };
}

/* Any audio as a 16-bit PCM WAV of the given shape. */
async function audioToWav(file, rate, channels) {
  return pcmWav(await decodeAudio(file, rate, channels), rate);
}

/* ---- ATRAC9: the console's own sounds and home music (atrac9.js) ---- */

const at9Stock = new Map();   /* system .at9 path -> { bytes, file, rms } */

async function stockAt9(path) {
  if (!at9Stock.has(path)) {
    const res = await fetch(`/api/asset?${q({ path })}`);
    if (!res.ok) throw new Error("could not read the system sound");
    const bytes = new Uint8Array(await res.arrayBuffer());
    const file = ATRAC9.parseFile(bytes);
    at9Stock.set(path, { bytes, file, rms: ATRAC9.downmixRms(file) });
  }
  return at9Stock.get(path);
}

/* The longest audio a replacement may hold: the console accepts up to twice
   the system file's length, and looping music also repeats its opening
   seconds after the end (see encode in atrac9.js). */
function at9MaxSamples(stock) {
  const f = stock.file, cfg = f.config, delay = f.fact ? f.fact[2] : cfg.frameSamples;
  const tail = f.loop ? ATRAC9.LOOP_TAIL * cfg.rate : 0;
  return 2 * f.superframes * cfg.superframeSamples - Math.max(delay, cfg.frameSamples) - cfg.superframeSamples - tail;
}

function trimWithFade(chans, max, rate) {
  if (chans[0].length <= max) return chans;
  const fade = Math.min(max, 3 * rate);
  return chans.map(c => {
    const out = c.slice(0, max);
    for (let i = 0; i < fade; i++) out[max - fade + i] *= 1 - (i + 1) / fade;
    return out;
  });
}

/* Scale to the system sound's loudness (RMS of its stereo downmix), offset
   by gainDb, with a soft limit just below full scale. */
function matchLoudness(chans, target, gainDb) {
  let sum = 0, n = 0;
  for (const c of chans) for (let i = 0; i < c.length; i++) { sum += c[i] * c[i]; n++; }
  const rms = Math.sqrt(sum / Math.max(n, 1));
  if (!(rms > 1e-6)) return chans;
  const g = (target > 0 ? target : 0.1) / rms * 10 ** (gainDb / 20), knee = 0.89;
  return chans.map(c => c.map(v => {
    v *= g;
    const a = Math.abs(v);
    return a <= knee ? v : Math.sign(v) * (knee + (1 - knee) * Math.tanh((a - knee) / (1 - knee)));
  }));
}

/* Run the encoder in a Web Worker (atrac9.js doubles as one); on the page
   itself, with pauses to repaint, if a worker cannot start. */
function encodeAt9(stockBytes, left, right, onProgress, intro) {
  return new Promise((resolve, reject) => {
    const onPage = async () => {
      let last = performance.now();
      try {
        resolve(await ATRAC9.encode(stockBytes, left, right, async f => {
          if (onProgress) onProgress(f);
          if (performance.now() - last > 50) { await nextTask(); last = performance.now(); }
        }, intro));
      } catch (e) { reject(e); }
    };
    let worker;
    try { worker = new Worker("atrac9.js"); } catch (e) { onPage(); return; }
    let started = false;
    worker.onmessage = e => {
      const m = e.data;
      started = true;
      if (m.progress !== undefined) { if (onProgress) onProgress(m.progress); return; }
      worker.terminate();
      if (m.error) reject(new Error(m.error)); else resolve(m.result);
    };
    worker.onerror = e => {
      e.preventDefault();
      worker.terminate();
      if (started) reject(new Error("the encoder stopped unexpectedly")); else onPage();
    };
    worker.postMessage({ stock: stockBytes, left, right, intro });
  });
}

/* Encode audio as a replacement for the system ATRAC9 sound at `path`: same
   format, matched loudness, decoded again and compared before it is returned.
   `intro` (seconds) plays once before the part that loops. */
async function at9For(path, chans, rate, gainDb, onProgress, intro = 0) {
  const stock = await stockAt9(path);
  const cfg = stock.file.config;
  let st = await resample(chans.length === 1 ? [chans[0], chans[0]] : chans.slice(0, 2), rate, cfg.rate);
  const max = at9MaxSamples(stock), trimmed = st[0].length > max;
  st = matchLoudness(trimWithFade(st, max, cfg.rate), stock.rms, gainDb);
  const introSamples = Math.min(Math.round(intro * cfg.rate), Math.max(0, st[0].length - cfg.rate));
  const res = await encodeAt9(stock.bytes, st[0], st[1], onProgress, introSamples);
  return { blob: new Blob([res.bytes], { type: "audio/x-at9" }), seconds: res.samples / cfg.rate, trimmed };
}

async function soundForAsset(file, assetPath) {
  if (ext(assetPath) === "at9") {
    if (/\.at9$/i.test(file.name)) return file;  /* made elsewhere: the console checks the exact format */
    const stock = await stockAt9(assetPath);
    const chans = await decodeAudio(file, stock.file.config.rate, 2);
    return (await at9For(assetPath, chans, stock.file.config.rate, 0, attachProgress)).blob;
  }
  const stock = parseWav(await (await fetch(`/api/asset?${q({ path: assetPath })}`)).arrayBuffer());
  if (!stock) throw new Error("could not read the system sound");
  if (stock.format !== 1 || stock.bits !== 16) {
    if (!/\.wav$/i.test(file.name)) throw new Error(`attach a WAV in the same format (${stock.rate} Hz, ${stock.bits}-bit)`);
    return file;  /* the console checks the exact format */
  }
  return audioToWav(file, stock.rate, stock.channels);
}

/* Mode-6 decoder, used only to check the encoder's own output. */

const textureCache = new Map();

/* Encode an image into exactly the stock texture's format, size and mips,
   reusing its DDS header verbatim, then check the result. */
/* The console's textures with see-through parts carry colour in their clear pixels too (so the edges blend
   without dark fringes): the clear pixels take the colour of the nearest visible ones, up to 8 pixels away,
   and white beyond, as the console's own do. Alpha stays as it is. */
/* bleed:begin */
function bleedClear(pix, w, h) {
  const SEEN = 8;

  for (let i = 0; i < w * h; i++) { if (pix[i * 4 + 3] >= SEEN) known[i] = 1; else todo.push(i); }
  for (let pass = 0; pass < 8 && todo.length; pass++) {
    const fill = [], next = [];
    for (const i of todo) {
      const x = i % w, y = (i - x) / w;
      let r = 0, g = 0, b = 0, n = 0;
      for (const j of [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1]) {
        if (j >= 0 && known[j]) { r += pix[j * 4]; g += pix[j * 4 + 1]; b += pix[j * 4 + 2]; n++; }
      }
      if (n) fill.push([i, Math.round(r / n), Math.round(g / n), Math.round(b / n)]); else next.push(i);
    }
    for (const [i, r, g, b] of fill) { pix[i * 4] = r; pix[i * 4 + 1] = g; pix[i * 4 + 2] = b; known[i] = 1; }
    todo = next;
  }
  for (const i of todo) { pix[i * 4] = 255; pix[i * 4 + 1] = 255; pix[i * 4 + 2] = 255; }
}
/* bleed:end */

/* pad:begin */
/* Where a see-through texture meets the screen's edge: the Control Center's bottom panel at the bottom, its
   top-right piece at the top and right, the home screen's artwork at the top. A picture is placed
   against that edge (so a crop takes the part away from it), and can be pulled in from it by a padding, in
   percent of the texture's size, left clear. */

  if (/_bottom\.dds$/.test(path)) return { v: "bottom", h: "center", top: 0, right: 0, bottom: 1 };
  /* (the clock and the search and settings icons are drawn over the top 26% of this piece; on the PlayStation 2
     theme the glass bar behind the clock spans 7% to 22% of it, and its glow reaches 35%) */
  if (/_top\.dds$/.test(path)) return { v: "top", h: "right", top: 1, right: 1, bottom: 0, band: 0.26 };
  /* the home screen's artwork hangs from the top of the screen, across its width */
  if (/\/homeui_[^/]*\.dds$/.test(path)) return { v: "top", h: "center", top: 1, right: 0, bottom: 0 };
  return { v: "center", h: "center", top: 0, right: 0, bottom: 0 };
}
const PAD_DEFAULT = 6;
/* The choice made for a piece: "fill" (crop to the texture, against its edge), "pad" (the same, with the padding
   left clear at the screen's edge), "fit" (the whole picture) or "stretch". How each is drawn, and its padding. */
function placementParams(mode, pad) {
  if (mode === "pad") return { fit: "cover", pad: Math.max(0, Math.min(40, +pad || 0)) };
  if (mode === "fit") return { fit: "contain", pad: 0 };
  if (mode === "stretch") return { fit: "stretch", pad: 0 };
  return { fit: "cover", pad: 0 };
}
/* Where the picture goes in a w x h texture: its rectangle x, y, dw, dh, and the clear-margin rectangle to clip to. */
function textureDraw(path, pct, fit, w, h, iw, ih, keepClear) {
  const a = textureAnchor(path), p = Math.max(0, Math.min(40, +pct || 0)) / 100;
  let t = a.top ? Math.round(h * p) : 0;
  const b = a.bottom ? Math.round(h * p) : 0, r = a.right ? Math.round(w * p) : 0;
  if (keepClear && a.band) t = Math.max(t, Math.round(h * a.band));   /* the band the clock and icons are drawn over stays clear */
  const box = { x: 0, y: t, w: Math.max(1, w - r), h: Math.max(1, h - t - b) };
  let dw = box.w, dh = box.h;
  if (fit !== "stretch") {
    const sc = (fit === "cover" ? Math.max : Math.min)(box.w / iw, box.h / ih);
    dw = iw * sc; dh = ih * sc;
  }
  const x = box.x + (a.h === "right" ? box.w - dw : (box.w - dw) / 2);
  const y = box.y + (a.v === "bottom" ? box.h - dh : a.v === "top" ? 0 : (box.h - dh) / 2);
  return { x, y, dw, dh, box };
}
/* pad:end */
/* Whether a top-right piece keeps the band its clock and icons are drawn over clear: on unless switched off. */
const keepClearFor = path => ((state.choices.pieces || {})[path] || {}).keepClear !== false;

/* A piece's saved placement: the choice and its padding (kept with the theme). */
function placementFor(path) {
  const a = textureAnchor(path), hasEdge = !!(a.top || a.right || a.bottom);
  const { place: mode, pad } = (state.choices.pieces || {})[path] || {};
  return { mode: PLACES.includes(mode) && (hasEdge || mode !== "pad") ? mode : "fill",
    pad: pad === undefined ? PAD_DEFAULT : Math.max(0, Math.min(40, +pad || 0)), hasEdge };
}

/* Textures with see-through parts keep their transparency: the Appearance themes' panels and bars. */
const ALPHA_TEXTURE = /\/system\/vsh_asset\/(control_center_|homeui_)[^/]*$/;

async function textureForAsset(file, assetPath, progress) {
  const info = await api("GET", "/api/asset/texture", { path: assetPath });
  const alpha = ALPHA_TEXTURE.test(assetPath) && (info.dxgi === 98 || info.dxgi === 99);
  const place = alpha ? placementParams(placementFor(assetPath).mode, placementFor(assetPath).pad) : { fit: state.fit, pad: 0 };
  const keep = alpha && keepClearFor(assetPath);
  const key = `${info.header}|${info.dataLength}|${place.fit}|${alpha}|${place.pad}|${keep}|${file.name}|${file.size}|${file.lastModified}`;
  if (textureCache.has(key)) return textureCache.get(key);
  const bc7 = info.dxgi === 98 || info.dxgi === 99, bc1 = info.dxgi === 71 || info.dxgi === 72 || info.format === "DXT1";
  const rgba = info.dxgi === 28 || info.dxgi === 29, bgra = info.dxgi === 87 || info.dxgi === 91;
  if (!bc7 && !bc1 && !rgba && !bgra) throw new Error(`${info.format} textures are not supported yet`);
  const blockBytes = bc1 ? 8 : 16, encode = bc1 ? bc1Block : alpha ? bc7BlockAlpha : bc7Block, decode = bc1 ? bc1Decode : bc7DecodeMode6;
  if (info.array !== 1) throw new Error("texture arrays are not supported");
  if (!file.type.startsWith("image/") && !/\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name)) throw new Error(`${file.name} is not an image`);

  const url = URL.createObjectURL(file);
  let img;
  try { img = await loadImage(url); } finally { URL.revokeObjectURL(url); }
  const header = b64bytes(info.header);
  const data = new Uint8Array(info.dataLength);
  let o = 0, sampleErr = 0, sampled = 0, alphaErr = 0, alphaN = 0;
  const totalBlocks = Array.from({ length: info.mips }, (_, m) =>
    Math.ceil(Math.max(1, info.width >> m) / 4) * Math.ceil(Math.max(1, info.height >> m) / 4)).reduce((a, b) => a + b, 0);
  let done = 0, lastYield = performance.now();

  for (let m = 0; m < info.mips; m++) {
    const w = Math.max(1, info.width >> m), h = Math.max(1, info.height >> m);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d", { colorSpace: "srgb", willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    if (!alpha) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h); }   /* with transparency, what the picture leaves bare stays clear */
    if (alpha) {
      /* against the screen's edge, with the padding left clear */
      const d = textureDraw(assetPath, place.pad, place.fit, w, h, img.naturalWidth, img.naturalHeight, keep);
      ctx.save();
      ctx.beginPath(); ctx.rect(d.box.x, d.box.y, d.box.w, d.box.h); ctx.clip();
      ctx.drawImage(img, d.x, d.y, d.dw, d.dh);
      ctx.restore();
    } else {
      let dw = w, dh = h;
      if (state.fit !== "stretch") {
        const sc = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);
        dw = img.naturalWidth * sc; dh = img.naturalHeight * sc;
      }
      ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }
    const pix = ctx.getImageData(0, 0, w, h).data;
    if (alpha) bleedClear(pix, w, h);
    if (!bc7 && !bc1) {
      for (let i = 0; i < w * h; i++) {
        const s = i * 4;
        if (rgba) { data[o++] = pix[s]; data[o++] = pix[s + 1]; data[o++] = pix[s + 2]; data[o++] = 255; }
        else { data[o++] = pix[s + 2]; data[o++] = pix[s + 1]; data[o++] = pix[s]; data[o++] = 255; }
      }
      continue;
    }
    const block = new Uint8ClampedArray(64), check = new Uint8Array(64);
    const bw = Math.ceil(w / 4), bh = Math.ceil(h / 4);
    for (let by = 0; by < bh; by++) {
      for (let bx = 0; bx < bw; bx++) {
        for (let y = 0; y < 4; y++) {
          for (let x = 0; x < 4; x++) {
            const sx = Math.min(w - 1, bx * 4 + x), sy = Math.min(h - 1, by * 4 + y), s = (sy * w + sx) * 4, d = (y * 4 + x) * 4;
            block[d] = pix[s]; block[d + 1] = pix[s + 1]; block[d + 2] = pix[s + 2]; block[d + 3] = alpha ? pix[s + 3] : 255;
          }

        if ((bx * 7 + by * 13) % 97 === 0) {  /* re-decode a sample of blocks */
          if (!decode(data, o, check)) throw new Error("texture encoder self-check failed");
          for (let i = 0; i < 64; i++) {
            if ((i & 3) !== 3) {
              if (alpha && block[i | 3] < 16) continue;   /* the colour of a clear pixel doesn't show */
              const e = check[i] - block[i]; sampleErr += e * e; sampled++;

            else if (check[i] !== 255) throw new Error("texture encoder self-check failed");

        o += blockBytes;
      }
      done += bw;
      if (performance.now() - lastYield > 50) {
        if (progress) progress(done / totalBlocks);
        await nextTask();
        lastYield = performance.now();
      }
    }
  }
  if (o !== data.length) throw new Error("texture size did not verify");
  if (sampled) {
    const psnr = 10 * Math.log10(255 * 255 / Math.max(1e-9, sampleErr / sampled));
    if (psnr < 24) throw new Error("the texture came out too unlike your picture to use (too much fine detail for its size); try a smoother picture");
  }
  if (alphaN && Math.sqrt(alphaErr / alphaN) > 24) throw new Error("the see-through parts did not encode well");
  const dds = new Uint8Array(header.length + data.length);
  dds.set(header); dds.set(data, header.length);
  const out = new Blob([info.zstd ? zstdStored(dds, info.frame ? b64bytes(info.frame) : null) : dds]);
  textureCache.set(key, out);
  /* the last few only: a 4K texture is 16 MB */
  while (textureCache.size > 4) textureCache.delete(textureCache.keys().next().value);
  return out;
}

async function fileForAsset(file, asset) {
  if (asset.kind === "texture") return textureForAsset(file, asset.path, attachProgress);
  if (isImage(asset)) return imageForAsset(file, asset.path);
  if (asset.kind === "audio") return soundForAsset(file, asset.path);
  return file;  /* fonts, JSON, video: the console validates against the stock file */
}

let attachProgress = null;

/* Put one file onto a set of system assets (for example all size variants).
   `copies`: the same picture already written to that many other files, for
   a message that counts files instead of sizes. */
/* `quiet`: part of a larger task (styling every icon) that has its own progress and says the result itself: no
   progress of this one's and no message, only the count of files written. */
async function attachTo(assets, file, label, copies = null, remake = false, shown = null, quiet = false) {
  const big = assets.length > 2 || assets.some(a => a.kind === "texture" || ext(a.path) === "at9");
  const p = quiet ? null : shown || (big ? progressToast(`Adding ${label}…`) : null);
  const base = shown ? shown.frac : 0;   /* a task begun before (reading a kept picture) keeps its part of the bar */
  let ok = 0, keptFirst = null;
  const errors = [];
  for (let i = 0; i < assets.length; i++) {
    const a = assets[i], at = x => base + (1 - base) * (i + x) / assets.length;
    const step = `${label}${assets.length > 1 ? ` (${i + 1} of ${assets.length})` : ""}`;
    attachProgress = p ? f => p.set(`Making ${step}… ${Math.round(f * 100)}%`, at(0.7 * f)) : null;
    /* each step says what it is as it starts */
    if (p) p.set(`${a.kind === "texture" || a.kind === "audio" || isImage(a) ? "Making" : "Preparing"} ${step}…`, at(0));
    try {
      const blob = await fileForAsset(file, a);
      const keep = !remake && state.keepOriginals && keepsOriginal(a) && blob !== file;   /* so an option changed later needs no new upload */
      if (p) p.set(`Sending ${baseName(a.path)} to the console…`, at(0.7), at(keep ? 0.9 : 1));
      await uploadVerified("/api/theme/file", { id: state.editId, path: a.path }, blob);
      state.files.add(a.path);
      if (keep) {
        if (p) p.set(keptFirst ? `Keeping your original for ${baseName(a.path)}…` : "Keeping your original picture…", at(0.9), at(1));
        await keepSource(a.path, file, keptFirst);
        if (!keptFirst && state.sources.has(a.path)) keptFirst = a.path;
      }
      ok++;
    } catch (e) { errors.push(`${baseName(a.path)}: ${e.message}`); }
    if (p) p.set(`${remake ? "Making" : "Adding"} ${label}${remake ? " again" : ""}… ${i + 1}/${assets.length}`, at(1));
  }
  stamp = Date.now();
  if (!remake && state.keepOriginals) await loadOriginals();
  /* The interface reads the Appearance artwork as it starts: it shows after rest mode. */
  const use = assets.some(a => APPEARANCE_RE.test(a.path))
    ? "Apply the theme, then put the console in rest mode and wake it to see the change." : "Apply the theme to use it.";
  const msg = errors.length
    ? `${label}: ${ok} of ${assets.length} added and verified. ${errors.slice(0, 2).join("; ")}`
    : copies !== null ? `${label} replaced in ${plural(ok + copies, "file")} and verified. ${use}`
    : `${label} ${remake ? "made again" : "added"} and verified${assets.length > 1 ? ` at ${plural(ok, "size")}` : ""}. ${use}`;
  const kind = errors.length ? (ok ? "" : "err") : "ok";
  if (quiet) return ok;
  if (p) p.done(msg, kind); else toast(msg, kind, errors.length ? 9000 : 4500);
  await refreshStatus();
  return ok;
}

/* After the Appearance artwork goes back to the console's own in the theme. */
function restReminder() {
  toast("Back to the console's own artwork in this theme. Apply the theme, then put the console in rest mode and wake it to see the change.", "ok", 7000);
}

/* Every song of the theme goes (a playlist's too), and the home music is the console's again. */
async function removeMusic() {
  const id = state.editId, extra = themeTracks(themeById(id)).map(x => x.slot).filter(s => s !== 1);
  for (const slot of extra) await api("DELETE", "/api/theme/music", { id, slot }).catch(() => {});
  await api("DELETE", "/api/theme/music", { id }).catch(() => {});
  if (extra.length) await api("POST", "/api/theme/settings", { id, sequence: "1", tracks: 1, loop_start: -1, loop_end: -1, order: "music" }).catch(() => {});
  setSongNames(names => { for (const k of Object.keys(names)) delete names[k]; });
  songCacheDrop(id);
  await resetAssets([{ path: HOME_MUSIC }]);
}

async function resetAssets(assets) {
  const hadBackground = backgroundFile([...state.files]);
  for (const a of assets.filter(x => state.files.has(x.path))) {
    try { await api("DELETE", "/api/theme/file", { id: state.editId, path: a.path }); state.files.delete(a.path); state.sources.delete(a.path); }
    catch (e) { toast(e.message, "err"); }
  }
  await loadOriginals();
  stamp = Date.now();
  /* No background left: neither is the picture made from it. */
  if (hadBackground && !backgroundFile([...state.files])) await removePreview(state.editId, "background");
  else await refreshStatus();
}

/* ================================================================ preview pictures

   Each theme can have a picture for its library card: one made from its
   background when the background is added (kind "background"), and one the
   user chooses (kind "picture"), which is shown instead. */

const PREVIEW_W = 1280, PREVIEW_H = 720;

const PREVIEW_FILES = [["background", "preview.jpg"], ["picture", "picture.jpg"], ["iconbg", "icon-backdrop.jpg"]];   /* in a theme .zip */
const coverUrl = t => `/api/theme/preview?${q({ id: t.id })}&v=${t.coverTime}-${stamp}`;

/* A 16:9 JPEG of an image, video frame or canvas, fitted as `fit`. */
async function previewJpeg(src, w, h, fit) {
  const c = document.createElement("canvas");
  c.width = PREVIEW_W; c.height = PREVIEW_H;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
  let dw = c.width, dh = c.height;
  if (fit !== "stretch") {
    const sc = (fit === "contain" ? Math.min : Math.max)(c.width / w, c.height / h);
    dw = w * sc; dh = h * sc;
  }
  ctx.drawImage(src, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
  const blob = await new Promise(resolve => c.toBlob(resolve, "image/jpeg", 0.85));
  if (!blob) throw new Error("this browser could not make the picture");
  await loadImage(URL.createObjectURL(blob)).then(img => URL.revokeObjectURL(img.src));  /* check it reads back */
  return blob;
}

/* A frame from a little way into a video (backgrounds often fade in). */
function videoFrame(url) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    const timer = setTimeout(() => reject(new Error("could not read the video")), 10000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 0) / 3); };
    v.onseeked = () => { clearTimeout(timer); resolve(v); };
    v.onerror = () => { clearTimeout(timer); reject(new Error("could not read the video")); };
    v.src = url;
  });
}

async function previewSource(url, isVideo) {
  if (isVideo) { const v = await videoFrame(url); return [v, v.videoWidth, v.videoHeight]; }
  const img = await loadImage(url);
  return [img, img.naturalWidth, img.naturalHeight];
}

async function savePreview(id, kind, blob) {
  await uploadVerified("/api/theme/preview", { id, kind }, blob);
  stamp = Date.now();
  await refreshStatus();
  if (state.route === "edit" && state.editId === id && $("#cover-panel")) $("#cover-panel").innerHTML = coverPanel(themeById(id));
  if (state.route === "edit" && state.editId === id) { syncNav("theme"); syncNav("background"); }
}

async function removePreview(id, kind) {
  await api("DELETE", "/api/theme/preview", { id, kind }).catch(() => {});
  stamp = Date.now();
  await refreshStatus();
  if (state.route === "edit" && state.editId === id && $("#cover-panel")) $("#cover-panel").innerHTML = coverPanel(themeById(id));
  if (state.route === "edit" && state.editId === id) { syncNav("theme"); syncNav("background"); }
}

/* After a background is added: the same picture, fitted as the background was. */
async function previewFromFile(id, file, isVideo) {
  const url = URL.createObjectURL(file);
  try {
    const [src, w, h] = await previewSource(url, isVideo);
    await savePreview(id, "background", await previewJpeg(src, w, h, state.fit));
  } catch (e) {
    console.warn("preview picture:", e);
  } finally { URL.revokeObjectURL(url); }
}

/* ---- reading a theme's own background back (themes made before previews) */

/* The content of a zstd frame made of raw and RLE blocks, which is how this
   builder stores textures. Compressed blocks are not read. */
function unzstdStored(b) {
  if (b[0] !== 0x28 || b[1] !== 0xb5 || b[2] !== 0x2f || b[3] !== 0xfd) throw new Error("not zstd");
  const fhd = b[4], single = (fhd >> 5) & 1, fcs = [single ? 1 : 0, 2, 4, 8][fhd >> 6];
  let o = 5 + (single ? 0 : 1) + [0, 1, 2, 4][fhd & 3] + fcs;
  const parts = [];
  for (;;) {

    const h = b[o] | (b[o + 1] << 8) | (b[o + 2] << 16), type = (h >> 1) & 3, size = h >>> 3;
    o += 3;
    if (type === 0) { parts.push(b.subarray(o, o + size)); o += size; }
    else if (type === 1) { parts.push(new Uint8Array(size).fill(b[o])); o += 1; }
    else throw new Error("compressed zstd");
    if (h & 1) break;
  }
  const out = new Uint8Array(parts.reduce((n, x) => n + x.length, 0));
  let w = 0;
  for (const x of parts) { out.set(x, w); w += x.length; }
  return out;
}

/* The top level of a DDS texture as a canvas: BC7 (as this builder encodes
   it), RGBA8 or BGRA8. `keepAlpha`: BC7 with its see-through parts, for a picture taken back out of a texture. */
async function ddsCanvas(bytes, keepAlpha = false) {
  const d = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (d.getUint32(0, true) !== 0x20534444) throw new Error("not a DDS texture");
  const h = d.getUint32(12, true), w = d.getUint32(16, true);
  const fourcc = d.getUint32(84, true), dx10 = fourcc === 0x30315844;
  let dxgi = dx10 ? d.getUint32(128, true) : 0;
  if (!dx10 && d.getUint32(88, true) === 32) dxgi = d.getUint32(92, true) === 0xff ? 28 : d.getUint32(92, true) === 0xff0000 ? 87 : 0;
  const data = bytes.subarray(dx10 ? 148 : 128);
  if (!w || !h || w > 8192 || h > 8192) throw new Error("unexpected texture size");
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(w, h), px = img.data;
  if (dxgi === 98 || dxgi === 99) {
    const bw = Math.ceil(w / 4), bh = Math.ceil(h / 4), block = new Uint8Array(64);
    if (data.length < bw * bh * 16) throw new Error("texture is truncated");
    let last = performance.now();
    for (let by = 0; by < bh; by++) {
      for (let bx = 0; bx < bw; bx++) {
        if (!bc7DecodeMode6(data, (by * bw + bx) * 16, block)) throw new Error("texture uses BC7 modes this preview can't read");
        for (let y = 0; y < 4 && by * 4 + y < h; y++) {
          for (let x = 0; x < 4 && bx * 4 + x < w; x++) {
            const s = (y * 4 + x) * 4, t = ((by * 4 + y) * w + bx * 4 + x) * 4;
            px[t] = block[s]; px[t + 1] = block[s + 1]; px[t + 2] = block[s + 2]; px[t + 3] = keepAlpha ? block[s + 3] : 255;
          }
        }
      }
      if (performance.now() - last > 50) { await nextTask(); last = performance.now(); }
    }
  } else if (dxgi === 28 || dxgi === 29 || dxgi === 87 || dxgi === 91) {
    if (data.length < w * h * 4) throw new Error("texture is truncated");
    const bgra = dxgi === 87 || dxgi === 91;
    for (let i = 0; i < w * h * 4; i += 4) {
      px[i] = data[i + (bgra ? 2 : 0)]; px[i + 1] = data[i + 1]; px[i + 2] = data[i + (bgra ? 0 : 2)]; px[i + 3] = 255;
    }
  } else throw new Error("texture format not readable here");
  ctx.putImageData(img, 0, 0);
  return c;
}

/* The theme's home background, preferring the default home screen one. */
function backgroundFile(paths) {
  const bgs = paths.filter(p => BG_RE.test(p));
  const rank = p => areaOf(p) === "Home: default background" ? 0 : areaOf(p).startsWith("Home:") ? 1 : 2;
  return bgs.sort((a, b) => rank(a) - rank(b))[0] || null;
}

async function previewFromTheme(id) {
  const { files } = await api("GET", "/api/theme/files", { id });
  const path = backgroundFile(files.map(f => f.path));
  if (!path) return false;
  const url = `/api/theme/file?${q({ id, path })}`;
  let src, w, h;
  if (/\.dds(\.zst)?$/i.test(path)) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("could not read the background");
    let bytes = new Uint8Array(await res.arrayBuffer());
    if (/\.zst$/i.test(path)) bytes = unzstdStored(bytes);
    src = await ddsCanvas(bytes); w = src.width; h = src.height;
  } else {
    [src, w, h] = await previewSource(url, /\.(mp4|webm|m4v)$/i.test(path));
  }
  await savePreview(id, "background", await previewJpeg(src, w, h, "stretch"));
  return true;
}

/* Themes made before preview pictures: make one from the background, once
   per visit. Quietly does nothing when it can't. */
const previewTried = new Set();
let previewFilling = false;
async function fillMissingPreviews() {
  if (previewFilling) return;
  previewFilling = true;
  try {
    for (const t of state.status.themes) {
      if (t.cover || !t.files || previewTried.has(t.id)) continue;
      previewTried.add(t.id);
      try {
        const el = await previewFromTheme(t.id) && document.querySelector(`[data-cover="${CSS.escape(t.id)}"]`);
        if (el && themeById(t.id)) el.outerHTML = cardPreview(themeById(t.id));
      } catch (e) { console.warn(`preview picture for ${t.id}:`, e); }
    }
  } finally { previewFilling = false; }
}

function coverPanel(t) {
  const text = t.cover === "picture"

    : t.cover === "background"

      : "Shown on this theme's card in the library, so you can tell your themes apart. It's made from the background when you add one, or choose any picture.";
  return `
    <div class="cover">${t.cover ? `<img alt="Preview of ${esc(t.name)}" src="${coverUrl(t)}">` : "No picture yet"}</div>
    <div class="text"><h2>Preview picture</h2><div class="sub">${esc(text)}</div>
      <div class="acts"><button class="btn sm" data-act="choose-cover">Choose picture</button>
        ${t.cover === "picture" ? `<button class="btn sm ghost danger" data-act="remove-cover">Remove picture</button>` : ""}</div></div>`;
}

async function chooseCover() {
  const id = state.editId;
  const file = await pickFile("image/*");
  if (!file) return;

/* ================================================================ live preview

   A read-only mockup of the home screen and the Control Center with the
   theme's background, its colours (per Appearance theme, with your edits), the
   Appearance artwork, a changed font and the changed icons. It reads from the
   console with the same GETs the editor uses, builds nothing on the console,
   and uploads nothing. */

const pvHex = n => "#" + ((n >>> 0) & 0xffffff).toString(16).padStart(6, "0");
const pvInk = rgb => lum(rgb) > 150 ? "#08121f" : "#ffffff";
const pvRgba = (n, a) => { const v = n >>> 0; return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`; };
const PV_FALLBACK = { accent: 0x1f7cf0, text: 0xffffff, panel: 0x171a22, backdrop: 0x0d1018, card: 0x1b1e28 };
/* Each look's Appearance theme and its colour palette. */
const LOOK_NAMES = { default: "Default look", ps: "PlayStation", ps2: "PlayStation 2", ps3: "PlayStation 3", ps4: "PlayStation 4" };
const LOOK_PAL = { default: "color_default", ps: "color_ps1", ps2: "color_ps2", ps3: "color_ps3", ps4: "color_ps4" };

/* The colours one look paints with: accent (buttons), text, a panel fill, the
   Control Center backdrop and card. A look's own palette, with the theme's
   edits to it; falls back to the default look's palette, then to neutral. */
async function previewColorsForLook(look) {
  const path = rcoPaths()[0];
  if (!path) return PV_FALLBACK;
  try {
    const r = await rcoStock(path);
    if (!r) return PV_FALLBACK;
    const pals = rcoColors(r);
    let i = pals.findIndex(p => p.id === (LOOK_PAL[look] || "color_default"));
    if (i < 0) i = pals.findIndex(p => p.id === "color_default");
    if (i < 0) return PV_FALLBACK;
    const changes = state.files.has(path) ? await rcoChanges(path) : new Map();
    const mine = changes.get(`${pals[i].f.el}\t${pals[i].f.attr}`);
    const eff = new Map(mine ? [...new TextDecoder().decode(mine).matchAll(COLOR_PAIR)].map(m => [m[2], Number(m[3])]) : pals[i].values);
    const sets = colorEditSets(pals, i), stockOf = new Map(pals[i].values);
    const named = (n, fb) => eff.has(n) ? rgbOf(eff.get(n)) : fb;
    const picked = (set, fb) => {
      if (!set) return fb;
      const name = set.names.find(n => rgbOf(stockOf.get(n)) === set.base) || set.names[0];
      return eff.has(name) ? rgbOf(eff.get(name)) : fb;
    };
    return {
      accent: picked(sets.accent, named("focus.fill.enabled", PV_FALLBACK.accent)),
      text: named("text.primary.enabled", picked(sets.text, PV_FALLBACK.text)),
      panel: named("menu.fill.enabled", named("dialog.fill.enabled", PV_FALLBACK.panel)),
      backdrop: named("base-mat.overlay.enabled", PV_FALLBACK.backdrop),
      card: named("radio-button.overlay.fill.enabled", PV_FALLBACK.card),
    };
  } catch (e) { return PV_FALLBACK; }
}

/* The theme's home background as an object URL, fitted as the theme is, or null. */
async function previewBackground(id) {
  let files;
  try { ({ files } = await api("GET", "/api/theme/files", { id })); } catch (e) { return null; }
  const path = backgroundFile(files.map(f => f.path));
  if (!path) return null;
  try {
    const res = await fetch(`/api/theme/file?${q({ id, path })}&v=${stamp}`);
    if (!res.ok) return null;
    let src, w, h;
    if (/\.dds(\.zst)?$/i.test(path)) {
      let bytes = new Uint8Array(await res.arrayBuffer());
      if (/\.zst$/i.test(path)) bytes = unzstdStored(bytes);
      src = await ddsCanvas(bytes); w = src.width; h = src.height;
    } else {
      const url = URL.createObjectURL(await res.blob());
      try { [src, w, h] = await previewSource(url, /\.(mp4|webm|m4v)$/i.test(path)); }
      finally { URL.revokeObjectURL(url); }
    }
    return URL.createObjectURL(await previewJpeg(src, w, h, state.fit));
  } catch (e) { return null; }
}

/* A changed Appearance piece (its texture decoded, with transparency), or null. */
async function previewAppearancePiece(id, look, which) {
  if (look === "default") return null;
  const name = which === "homeui" ? `homeui_${look}.dds` : `control_center_${look}_${which}.dds`;
  const path = `/system/vsh_asset/${name}`;
  if (!state.files.has(path)) return null;
  try {
    const res = await fetch(`/api/theme/file?${q({ id, path })}&v=${stamp}`);
    if (!res.ok) return null;
    let bytes = new Uint8Array(await res.arrayBuffer());
    if (bytes[0] === 0x28 && bytes[1] === 0xb5 && bytes[2] === 0x2f && bytes[3] === 0xfd) bytes = unzstdStored(bytes);
    const c = await ddsCanvas(bytes, true);
    return await new Promise(r => c.toBlob(b => r(b ? URL.createObjectURL(b) : null), "image/png"));
  } catch (e) { return null; }
}

/* A changed file that shows as an icon on the home screen. */
const previewIconLike = path => isTitlePicture(path) || !!tileTitle(path) || (ICON_RE.test(path) && !BG_RE.test(path));

/* Up to `max` of the theme's changed icon files, as object URLs, app icons first. */
async function previewFileIcons(id, max) {
  const rank = p => isTitlePicture(p) ? 0 : tileTitle(p) ? 1 : 2;
  const paths = [...state.files].filter(previewIconLike).sort((a, b) => rank(a) - rank(b));
  const out = [];
  for (const path of paths) {
    if (out.length >= max) break;
    try {
      const res = await fetch(`/api/theme/file?${q({ id, path })}&v=${stamp}`);
      if (!res.ok) continue;
      if (/\.dds(\.zst)?$/i.test(path)) {
        let bytes = new Uint8Array(await res.arrayBuffer());
        if (/\.zst$/i.test(path)) bytes = unzstdStored(bytes);
        const c = await ddsCanvas(bytes, true);
        out.push(await new Promise(r => c.toBlob(b => r(b ? URL.createObjectURL(b) : null), "image/png")));
      } else {
        out.push(URL.createObjectURL(await res.blob()));
      }
    } catch (e) { /* skip one that can't be read */ }
  }
  return out.filter(Boolean);
}

/* Up to `max` of the theme's changed interface (.rco) pictures, as object URLs. */
async function previewRcoIcons(id, max) {
  const path = rcoPaths()[0];
  if (!path || !state.files.has(path)) return [];
  try {
    const changes = await rcoChanges(path);
    if (!changes.size) return [];
    const r = await rcoStock(path);
    if (!r) return [];
    const out = [];
    for (const pic of rcoPictures(r)) {
      if (out.length >= max) break;
      const v = pic.files.find(f => changes.has(`${f.el}\t${f.attr}`));
      if (!v) continue;
      const d = changes.get(`${v.el}\t${v.attr}`), kind = pictureKind(d);
      if (kind === "svg") out.push(URL.createObjectURL(new Blob([d], { type: "image/svg+xml" })));
      else if (kind === "png") out.push(URL.createObjectURL(new Blob([d], { type: "image/png" })));
    }
    return out;
  } catch (e) { return []; }
}

/* The theme's changed interface font, loaded as a FontFace; its family, or null. */
let pvFont = null;
async function previewFont(id) {
  const fonts = [...state.files].filter(p => /\.otf$/i.test(p) && (FONT_LATIN.test(baseName(p)) || FONT_HOME.test(baseName(p))));
  fonts.sort((a, b) => (FONT_LATIN.test(baseName(a)) ? 0 : 1) - (FONT_LATIN.test(baseName(b)) ? 0 : 1));
  if (!fonts.length) return null;
  try {
    const res = await fetch(`/api/theme/file?${q({ id, path: fonts[0] })}&v=${stamp}`);
    if (!res.ok) return null;
    const ff = new FontFace("pvtheme", await res.arrayBuffer());
    await ff.load();
    document.fonts.add(ff);
    pvFont = ff;
    return "pvtheme";
  } catch (e) { return null; }
}

let pvUrls = [], pvData = null, pvLooksArt = new Set();
let pvState = { look: "default", view: "home" };
function previewRevoke() { for (const u of pvUrls) URL.revokeObjectURL(u); pvUrls = []; }
function previewDropFont() { if (pvFont) { try { document.fonts.delete(pvFont); } catch (e) { /* gone */ } pvFont = null; } }
function previewClose() {
  const ov = $("#pv-overlay");
  if (ov) ov.remove();
  document.removeEventListener("keydown", previewKey);
  previewRevoke();
  previewDropFont();
  pvData = null;
}
function previewKey(e) { if (e.key === "Escape") previewClose(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#bge")) { bgeClose(); e.stopImmediatePropagation(); } }, true);

/* Fetch the shared pieces once (background, icons, font) into pvData. */
async function previewGather(id) {
  previewRevoke();
  previewDropFont();
  pvData = { id, bg: null, tiles: [], fontFam: null, art: {}, cc: {}, colors: {} };
  const [bg, fileIcons, rcoIcons, fontFam] = await Promise.all([
    previewBackground(id), previewFileIcons(id, 6), previewRcoIcons(id, 6), previewFont(id),
  ]);
  if (!$("#pv-overlay") || state.editId !== id) {
    [bg, ...fileIcons, ...rcoIcons].filter(Boolean).forEach(u => URL.revokeObjectURL(u));
    previewDropFont();
    return false;
  }
  pvData.bg = bg || await consoleBackground();   /* the console's own, decoded by the plugin; kept with the page */
  pvData.tiles = [...fileIcons, ...rcoIcons].slice(0, 6);
  pvData.tiles.push(...consoleTileIcons(6 - pvData.tiles.length));   /* the system tiles' own after yours */
  pvData.fontFam = fontFam || await consoleFont();
  pvUrls.push(...[bg, ...fileIcons, ...rcoIcons].filter(Boolean));
  return true;
}
async function pvArtFor(look) {
  if (look in pvData.art) return pvData.art[look];
  const u = await previewAppearancePiece(pvData.id, look, "homeui");
  pvData.art[look] = u || (look === "default" ? null : await consoleTexture(apPath(look, "homeui")));
  if (u) pvUrls.push(u);
  return pvData.art[look];
}
async function pvCcFor(look, which) {
  const k = look + "/" + which;
  if (k in pvData.cc) return pvData.cc[k];
  const u = await previewAppearancePiece(pvData.id, look, which);
  pvData.cc[k] = u || (look === "default" ? null : await consoleTexture(apPath(look, which)));
  if (u) pvUrls.push(u);
  return pvData.cc[k];
}
async function pvColorsFor(look) {
  if (pvData.colors[look]) return pvData.colors[look];
  const c = await previewColorsForLook(look);
  pvData.colors[look] = c;
  return c;
}

}

/* ---- The console's own pictures, for the previews ----

   Where a theme leaves something as it is, the previews draw the console's own: its default home background and the
   Appearance themes' artwork (textures the browser can't read, decoded by the plugin to a quarter-size picture,
   /api/asset/picture), the system tiles' icons, its interface icons (/api/ui-icon) and its SST font. All read from
   the console as the page runs; nothing of Sony's is in this page. */
const consolePics = new Map();   /* asset path -> a promise of an object URL, or null if it can't be drawn */
function consoleTexture(path) {
  if (!path) return Promise.resolve(null);
  if (!consolePics.has(path)) consolePics.set(path, (async () => {
    try {
      const res = await fetch(`/api/asset/picture?${q({ path })}`);
      if (!res.ok) return null;
      const b = new Uint8Array(await res.arrayBuffer()), dv = new DataView(b.buffer);
      const w = dv.getUint32(0, true), h = dv.getUint32(4, true);
      if (!w || !h || b.length !== 8 + w * h * 4) return null;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(b.buffer, 8, w * h * 4), w, h), 0, 0);
      return await new Promise(r => c.toBlob(x => r(x ? URL.createObjectURL(x) : null), "image/png"));
    } catch (e) { return null; }
  })());
  return consolePics.get(path);
}
const uiIconUrl = id => `/api/ui-icon?${q({ id })}`;
const consoleIcon = (id, cls) => `<img class="${cls}" alt="" src="${uiIconUrl(id)}" onerror="this.style.visibility='hidden'">`;
/* The console's default home background, as it shows with no theme. */
function consoleBackground() {
  const a = (state.assets || []).find(x => areaOf(x.path) === "Home: default background");
  return consoleTexture(a && a.path);
}
/* The system tiles' own icons (PNG, as the browser can show them), for the home row. */
function consoleTileIcons(max) {
  return max > 0 ? tileGroups().slice(0, max).map(g => `/api/asset?${q({ path: g.icons[0].path })}`) : [];
}
/* The console's interface font, loaded once under its own name. */
let consoleFontLoading = null;
function consoleFont() {
  if (consoleFontLoading) return consoleFontLoading;
  const a = (state.assets || []).find(x => /^SST-(Roman|Regular|Light)\.otf$/i.test(baseName(x.path)));
  if (!a || typeof FontFace !== "function") return (consoleFontLoading = Promise.resolve(null));
  return (consoleFontLoading = new FontFace("console-sst", `url("/api/asset?${q({ path: a.path })}")`).load()
    .then(f => { document.fonts.add(f); return "console-sst"; }).catch(() => null));
}
/* The Control Center's row of icons, and the home screen's top bar, as the console draws them. */
const CC_ICONS = ["iconid_game_base", "iconid_music", "iconid_notification", "iconid_friend", "iconid_mic", "iconid_accessibility", "iconid_wifi", "iconid_power"];
const topBarHtml = clock => `<div class="pv-top"><div class="pv-glyphs">${consoleIcon("iconid_search", "pv-ico")}${consoleIcon("iconid_settings", "pv-ico")}<span class="pv-glyph pv-avatar"></span></div>
  <span class="pv-clock">${esc(clock)}</span></div>`;
const ccIconsHtml = () => `<div class="pv-cc-icons">${CC_ICONS.map((id, i) => `<span class="pv-cc-ic has-ic${i === 0 ? " pv-ccf" : ""}">${consoleIcon(id, "pv-cc-img")}</span>`).join("")}</div>`;

/* ---- The Appearance part's preview: each look's pieces drawn from the very textures the console will use, on a
   sketch of the screen they belong to. A piece the theme doesn't replace shows as an outline where it sits. */
const AP_LOOKS = ["ps", "ps2", "ps3", "ps4"];
let apView = { look: "", view: "home" };
const apUrls = new Map();   /* "<theme>|<path>|<stamp>" -> object URL or null; the last few kept */
function apKeep(key, url) {
  apUrls.set(key, url);
  while (apUrls.size > 12) {
    const [k, u] = apUrls.entries().next().value;
    if (u) URL.revokeObjectURL(u);
    apUrls.delete(k);
  }
  return url;
}
const apPath = (look, which) => `/system/vsh_asset/${which === "homeui" ? `homeui_${look}` : `control_center_${look}_${which}`}.dds`;
/* A piece as the theme has it, decoded with its transparency: { has: the console has this piece, url: the theme's or null } */
async function apPiece(look, which) {
  const path = apPath(look, which);
  const has = (state.assets || []).some(a => a.path === path);
  if (!has || !state.files.has(path)) return { has, url: null };
  const key = `${state.editId}|${path}|${stamp}`;
  if (apUrls.has(key)) return { has, url: apUrls.get(key) };
  let url = null;
  try {
    const res = await fetch(`/api/theme/file?${q({ id: state.editId, path })}&v=${stamp}`);
    if (res.ok) {
      let bytes = new Uint8Array(await res.arrayBuffer());
      if (bytes[0] === 0x28 && bytes[1] === 0xb5 && bytes[2] === 0x2f && bytes[3] === 0xfd) bytes = unzstdStored(bytes);
      const c = await ddsCanvas(bytes, true);
      url = await new Promise(r => c.toBlob(b => r(b ? URL.createObjectURL(b) : null), "image/png"));
    }
  } catch (e) { /* a texture this page can't draw: its outline shows instead */ }
  return { has, url: apKeep(key, url) };
}
const apChanged = look => ["homeui", "top", "bottom"].some(w => state.files.has(apPath(look, w)));

function apPreviewBox() {
  if (!apView.look) apView.look = AP_LOOKS.find(apChanged) || "ps";
  const chip = (act, v, label, on, dot) => `<button type="button" class="btn sm chip" data-act="${act}" data-v="${v}" aria-pressed="${on}">${esc(label)}${dot ? `<span class="ap-dot" aria-label=", changed"></span>` : ""}</button>`;
  return `<div class="ap-preview">
      <div class="pv-toolbar">
        <div class="pv-tabs">${chip("ap-view", "home", "Home screen", apView.view === "home")}${chip("ap-view", "cc", "Control Center", apView.view === "cc")}</div>
        <div class="pv-tabs">${AP_LOOKS.map(l => chip("ap-look", l, LOOK_NAMES[l], apView.look === l, apChanged(l))).join("")}</div>
      </div>
      <div class="pv-stage" id="ap-stage"><div class="pv-busy">Drawing…</div></div>
      <p class="note"><span id="ap-whose"></span> Drawn from the theme's files and the console's own, as the console will show them; only the layout around them is approximate.</p>
    </div>`;
}

async function apPreviewShow() {
  const stage = $("#ap-stage");
  if (!stage) return;
  const id = state.editId, { look, view } = apView;
  const t = themeById(id);
  const slot = (cls, label) => `<div class="ap-slot ${cls}">${esc(`${label}: none on this firmware`)}</div>`;
  const own = t && aspectReplaced(aspectById("background"));
  const consoleBg = own ? null : await consoleBackground();
  const bg = own ? `<img class="pv-bg" alt="" src="/api/theme/preview?${q({ id, kind: "background" })}&v=${t.coverTime}-${stamp}" onerror="this.remove()">`
    : consoleBg ? `<img class="pv-bg" alt="" src="${consoleBg}">` : "";
  const fontFam = themeFontFamily() || await consoleFont();
  /* a piece as the theme has it, or the console's own; what is whose, said under the picture */
  const mine = [], theirs = [];
  const piece = async (which, label) => {
    const p = await apPiece(look, which);
    if (p.url) { mine.push(label); return p; }
    if (!p.has) return p;
    theirs.push(label);
    return { has: true, url: await consoleTexture(apPath(look, which)) };
  };
  const rco = rcoPaths()[0];
  const colors = rco && state.rco && state.rco.get(rco) ? await previewColorsForLook(look) : PV_FALLBACK;
  const clock = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  let html;
  if (view === "home") {
    const art = await piece("homeui", "Home screen artwork");
    const icons = consoleTileIcons(6);
    const tiles = Array.from({ length: 6 }, (_, i) => icons[i]
      ? `<div class="pv-tile${i === 0 ? " pv-focus" : ""}"><img alt="" src="${icons[i]}"></div>`
      : `<div class="pv-tile pv-ph${i === 0 ? " pv-focus" : ""}"></div>`).join("");
    html = `${bg}<div class="pv-scrim"></div>
      ${art.url ? `<img class="pv-art" alt="" src="${art.url}">` : art.has ? "" : slot("art", "Home screen artwork")}
      ${topBarHtml(clock)}
      <div class="pv-tiles">${tiles}</div>`;
  } else {
    const top = await piece("top", "Top-right corner"), bottom = await piece("bottom", "Bottom panel");
    html = `${bg}<div class="pv-ccbd" style="background:${pvRgba(colors.backdrop, .64)}"></div><div class="pv-cc-bar"></div>
      ${top.url ? `<img class="pv-cc-top" alt="" src="${top.url}">` : top.has ? "" : slot("top", "Top-right corner")}
      ${bottom.url ? `<img class="pv-cc-bottom" alt="" src="${bottom.url}">` : bottom.has ? "" : slot("bottom", "Bottom panel")}
      <div class="pv-cc-clock">${esc(clock)}</div>
      ${ccIconsHtml()}`;
  }
  const now = $("#ap-stage");
  if (!now || state.editId !== id || apView.look !== look || apView.view !== view) return;
  now.style.setProperty("--pv-accent", pvHex(colors.accent));
  now.style.setProperty("--pv-text", pvHex(colors.text));
  now.style.setProperty("--pv-panel", pvHex(colors.panel));
  now.style.fontFamily = fontFam ? `"${fontFam}", "SST", system-ui, sans-serif` : "";
  now.innerHTML = html;
  const whose = $("#ap-whose");
  if (whose) whose.textContent = [mine.length ? `Yours: ${mine.join(", ")}.` : "", theirs.length ? `The console's own: ${theirs.join(", ")}.` : "",
    own ? "" : "Background: the console's own."].filter(Boolean).join(" ");
}

/* The preview follows the piece being worked on. */
function apFollow(path) {
  const m = APPEARANCE_RE.exec(path || "");
  if (!m) return;
  apView = { look: m[2], view: m[1] === "homeui" ? "home" : "cc" };
}

async function previewRender(id) {
  let stage = $("#pv-stage");

/* ================================================================ editor (theme builder) */

const glyph = id => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${GLYPHS[id] || GLYPHS.images}</svg>`;

/* The console's own icon for each part, read from the console as the page runs (/api/ui-icon): nothing of Sony's

const PART_ICONS = {
  theme: "iconid_edit", background: "iconid_photo", tiles: "iconid_app_all_apps", titles: "iconid_games_and_apps",
  music: "iconid_music", sounds: "iconid_sound", fonts: "iconid_text_format_clear", appearance: "iconid_ps_shapes",

  : glyph(id);

function advancedShown() {
  return !!state.showAdvanced || ASPECT_GROUPS.find(g => g.advanced).ids.some(id => id === state.section || aspectOn(aspectById(id)));
}
/* The parts in the order the list shows them: Previous and Next follow it. */
function sectionOrder() {
  const adv = advancedShown();
  return ["theme", ...ASPECT_GROUPS.filter(g => !g.advanced || adv).flatMap(g => g.ids)];
}
const sectionName = id => SECTION_NAMES[id] || (aspectById(id) || {}).title || id;
const UNCHANGED = new Set(["Console's own", "None on this firmware"]);
const sectionHref = id => `#/edit/${encodeURIComponent(state.editId)}${id ? `/${id}` : ""}`;

/* What a part holds in this theme, in a few words. */
function sectionStatus(id) {
  const t = themeById(state.editId);
  if (id === "theme") return t.fw === "any" ? "Any firmware" : `Firmware ${t.fw}`;
  const asp = aspectById(id);
  if (asp.mode === "music") {
    if (!t.music && !state.files.has(HOME_MUSIC)) return "Console's own";
    return isPlaylist(t) ? `${plural(themeTracks(t).length, "song")}, ${fmtTime(playlistSeconds(t))}` : t.music ? fmtTime(t.music) : "Changed";
  }
  if (!aspectAssets(asp).length) return "None on this firmware";
  const n = aspectReplaced(asp);
  const ui = id === "sounds" && uiSoundsLast && uiSoundsLast.id === state.editId ? uiSoundsLast.replaced : 0;
  const total = n + ui;
  return total ? `${total} changed` : aspectOn(asp) ? "Changed" : "Console's own";

/* The part's picture in the list: the theme's own where it has one the browser can show, otherwise its drawing. */
function sectionThumb(id) {
  const t = themeById(state.editId);
  const img = (src, cls = "") => `<img alt="" loading="lazy" class="${cls}" src="${esc(src)}" onerror="this.remove()">`;
  if (id === "theme") return t.cover ? img(coverUrl(t), "cover") : "";
  if (id === "background") {
    return aspectReplaced(aspectById(id)) ? img(`/api/theme/preview?${q({ id: t.id, kind: "background" })}&v=${t.coverTime}-${stamp}`, "cover") : "";
  }
  if (id === "fonts") {
    const f = themeFontFamily();
    return f ? `<span class="aa" style="font-family:'${f}'">Aa</span>` : "";
  }
  const asp = aspectById(id);
  if (!asp || !asp.filter || asp.mode === "rco") return "";
  for (const a of aspectAssets(asp)) {
    if (!state.files.has(a.path)) continue;
    if (isImage(a)) return img(`/api/theme/file?${q({ id: t.id, path: a.path })}&v=${stamp}`);
    if (state.sources.has(a.path)) return img(`/api/theme/source?${q({ id: t.id, path: a.path })}&v=${stamp}`);
  }
  return "";
}

function secNavItem(id) {
  const sel = (state.section || (wideEditor() ? "theme" : "")) === id;
  const status = sectionStatus(id), changed = id !== "theme" && !UNCHANGED.has(status);
  return `<a class="nav-item${sel ? " sel" : ""}${changed ? " on" : ""}" href="${sectionHref(id)}" data-section="${id}"${sel ? ` aria-current="page"` : ""}>

      <span class="nav-text"><span class="nav-name">${esc(sectionName(id))}</span><span class="nav-status">${esc(status)}</span></span>
    </a>`;
}
function secNavHtml() {
  const adv = advancedShown();
  return `${secNavItem("theme")}${ASPECT_GROUPS.map(g => {
    const used = g.ids.some(id => aspectOn(aspectById(id)) || id === state.section);
    const head = `<div class="nav-group"><span>${esc(g.title)}</span>${g.advanced && !used
      ? `<button type="button" class="nav-more" data-act="advanced" aria-expanded="${adv}">${adv ? "Hide" : "Show"}</button>` : ""}</div>`;
    return g.advanced && !adv ? `${head}<p class="nav-hint">Textures, video, animations and other images.</p>` : head + g.ids.map(secNavItem).join("");
  }).join("")}`;
}
/* One part's line in the list follows what it holds. */
function syncNav(id) {
  const el = document.querySelector(`#secnav [data-section="${id}"]`);
  if (!el) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = secNavItem(id);
  const now = tmp.firstElementChild, had = document.activeElement === el;
  el.replaceWith(now);
  if (had) now.focus({ preventScroll: true });   /* a controller's place in the list stays where it was */
}
const wideEditor = () => matchMedia("(min-width: 900px)").matches;

/* The part shown beside the list: the theme's name and picture, or one section, with the way to the parts before and
   after it. `focus`: move to its title, after choosing it. */
function showPane(focus = true) {
  const pane = $("#pane"), ed = $("#editor");
  if (!pane || !ed) return;
  const id = state.section || "theme";
  ed.classList.toggle("picked", !!state.section);
  for (const a of document.querySelectorAll("#secnav .nav-item")) {
    const sel = a.dataset.section === (state.section || (wideEditor() ? "theme" : ""));
    a.classList.toggle("sel", sel);
    if (sel) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  const t = themeById(state.editId);
  pane.innerHTML = `
    <a class="back list-back" href="${sectionHref("")}">All parts</a>
    ${id === "theme" ? themePaneHtml(t) : `<section class="aspect" id="aspect-${id}"></section>`}
    <nav class="steps" id="steps" aria-label="Previous and next part">${stepsHtml(id)}</nav>`;
  if (id !== "theme") renderAspect(aspectById(id)); else setTimeout(optionsShow);
  if (focus) {
    const h = pane.querySelector("h2");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
    const top = ed.getBoundingClientRect().top;
    if (top < 0 || !wideEditor()) ed.scrollIntoView({ block: "start" });
  }
}

/* ---- Fitting options, each drawn on your own picture in the exact shape of what it replaces ----

   The same arithmetic as the encoder (imageForAsset, textureForAsset and textureDraw), at a small size, so a choice

const FITS_SHOWN = [["cover", "Fill", "Crops the edges"], ["contain", "Fit", "All of it, with bars"], ["stretch", "Stretch", "Squeezed to the shape"]];
const PLACES_SHOWN = [["fill", "Fill", "Cropped to the piece"], ["pad", "With padding", "Clear at the screen's edge"], ["fit", "Fit", "All of it"], ["stretch", "Stretch", "Squeezed to the piece"]];

function fitOptionsHtml() {
  return `<div class="field fit-field"><span>Pictures of another shape${help("How a picture that isn't the shape of what it replaces is fitted. Changing it remakes this theme's pictures from the ones you attached. Appearance pieces have their own placement.")}</span>
    <div class="opts" role="radiogroup" aria-label="Pictures of another shape">${FITS_SHOWN.map(([v, name, what]) =>
      `<button type="button" class="opt" role="radio" aria-checked="${state.fit === v}" data-act="fit-pick" data-v="${v}">
        <canvas data-opt="fit" data-v="${v}" width="176" height="99"></canvas><b>${esc(name)}</b><small>${esc(what)}</small></button>`).join("")}</div>
    <span class="note" id="fit-sample"></span></div>`;
}

function placeOptionsHtml(path) {
  const pl = placementFor(path);
  return `<div class="opts place" role="radiogroup" aria-label="Placement of ${esc(appearanceName(path))}">${PLACES_SHOWN
    .filter(([v]) => v !== "pad" || pl.hasEdge).map(([v, name, what]) =>
      `<button type="button" class="opt" role="radio" aria-checked="${pl.mode === v}" data-act="place-pick" data-path="${esc(path)}" data-v="${v}">
        <canvas data-opt="place" data-path="${esc(path)}" data-v="${v}" width="176" height="60"></canvas><b>${esc(name)}</b><small>${esc(what)}</small></button>`).join("")}</div>`;
}

const optPictures = new Map();   /* "<theme>|<path>|<stamp>" -> the kept picture, decoded; the last few */
async function keptPicture(path) {
  const key = `${state.editId}|${path}|${stamp}`;
  if (optPictures.has(key)) return optPictures.get(key);
  const res = await fetch(`/api/theme/source?${q({ id: state.editId, path })}&v=${stamp}`);
  if (!res.ok) throw new Error("no picture kept");
  const url = URL.createObjectURL(await res.blob());
  let img;
  try { img = await loadImage(url); } finally { URL.revokeObjectURL(url); }
  optPictures.set(key, img);
  while (optPictures.size > 6) optPictures.delete(optPictures.keys().next().value);
  return img;
}
const targetSizes = new Map();
/* The size of the file a picture replaces: a texture's from its header, an image's from the console's own. */
async function targetSize(path) {
  if (targetSizes.has(path)) return targetSizes.get(path);
  let size = null;
  const a = mixAsset(path);
  if (a && a.kind === "texture") {
    const info = await api("GET", "/api/asset/texture", { path });
    size = { w: info.width, h: info.height };
  } else {
    const img = await loadImage(`/api/asset?${q({ path })}`);
    size = { w: img.naturalWidth, h: img.naturalHeight };
  }
  targetSizes.set(path, size);
  return size;
}
/* A stand-in picture for a theme with none of yours kept: tall, so each option shows its difference. */
let samplePicture = null;
function sampleImage() {
  if (samplePicture) return samplePicture;
  const c = document.createElement("canvas");
  c.width = 600; c.height = 800;
  const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 800);
  g.addColorStop(0, "#2a5bd7"); g.addColorStop(1, "#c3426f");
  x.fillStyle = g; x.fillRect(0, 0, 600, 800);
  x.fillStyle = "rgba(255,255,255,.9)";
  x.beginPath(); x.arc(300, 330, 150, 0, Math.PI * 2); x.fill();
  x.fillStyle = "rgba(0,0,0,.35)"; x.fillRect(0, 640, 600, 160);
  return (samplePicture = c);
}
function checker(ctx, w, h) {
  ctx.fillStyle = "#1a2131"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#232c40";
  for (let y = 0; y < h; y += 8) for (let x = (y / 8) % 2 ? 8 : 0; x < w; x += 16) ctx.fillRect(x, y, 8, 8);
}

/* Draw every option shown on the page. */
async function optionsShow() {
  const id = state.editId;
  const fits = [...document.querySelectorAll('canvas[data-opt="fit"]')];
  if (fits.length) {
    /* your first kept picture that the theme-wide fit applies to, in the shape it replaces */
    const path = [...state.sources].find(p => state.files.has(p) && !APPEARANCE_RE.test(p) && mixAsset(p));
    let img = null, size = { w: 1920, h: 1080 };
    try { if (path) [img, size] = await Promise.all([keptPicture(path), targetSize(path)]); } catch (e) { img = null; }
    if (state.editId !== id) return;
    const note = $("#fit-sample");
    if (note) note.textContent = img ? `Shown on your picture for ${mixElementOf(MIX_PARTS.find(p => p.id === mixPartOf(path)) || {}, path)[1] || baseName(path)}.`
      : "Shown on a sample picture until you attach one of yours.";
    const pic = img || sampleImage(), iw = img ? img.naturalWidth : pic.width, ih = img ? img.naturalHeight : pic.height;
    for (const c of fits) {
      const cw = c.width, ch = Math.max(24, Math.round(cw * size.h / size.w));
      c.height = Math.min(ch, 132);
      const x = c.getContext("2d"), w = c.width, h = c.height, fit = c.dataset.v;
      x.fillStyle = "#000"; x.fillRect(0, 0, w, h);
      let dw = w, dh = h;
      if (fit !== "stretch") { const sc = (fit === "cover" ? Math.max : Math.min)(w / iw, h / ih); dw = iw * sc; dh = ih * sc; }
      x.imageSmoothingQuality = "high";
      x.drawImage(pic, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }
  }
  for (const c of document.querySelectorAll('canvas[data-opt="place"]')) {
    const path = c.dataset.path;
    let img, size;
    try { [img, size] = await Promise.all([keptPicture(path), targetSize(path)]); } catch (e) { continue; }
    if (state.editId !== id || !c.isConnected) return;
    const k = c.width / size.w;
    c.height = Math.max(24, Math.round(size.h * k));
    const x = c.getContext("2d"), pl = placementFor(path), place = placementParams(c.dataset.v, pl.pad), keep = keepClearFor(path);
    checker(x, c.width, c.height);   /* what the picture leaves bare is see-through on the console */
    const d = textureDraw(path, place.pad, place.fit, size.w, size.h, img.naturalWidth, img.naturalHeight, keep);
    x.save(); x.scale(k, k);
    x.beginPath(); x.rect(d.box.x, d.box.y, d.box.w, d.box.h); x.clip();
    x.imageSmoothingQuality = "high";
    x.drawImage(img, d.x, d.y, d.dw, d.dh);
    x.restore();
    const band = textureAnchor(path).band;
    if (band && keep) {   /* where the clock and icons are drawn: left clear */
      x.strokeStyle = "rgba(255,255,255,.55)"; x.setLineDash([3, 3]);
      x.beginPath(); x.moveTo(0, band * c.height + .5); x.lineTo(c.width, band * c.height + .5); x.stroke();
      x.setLineDash([]); x.fillStyle = "rgba(255,255,255,.85)"; x.font = `${Math.max(8, Math.round(band * c.height * .55))}px system-ui`;
      x.textAlign = "right"; x.textBaseline = "middle"; x.fillText("12:00", c.width - 6, band * c.height / 2);
    }
  }
}

/* Previous and Next: the parts either side of this one in the list. */
function stepsHtml(id) {
  const order = sectionOrder(), i = order.indexOf(id);
  const step = (to, dir) => to ? `<a class="step ${dir}" href="${sectionHref(to)}"><span class="note">${dir === "prev" ? "Previous" : "Next"}</span>${esc(sectionName(to))}</a>` : `<span></span>`;
  return step(order[i - 1], "prev") + step(order[i + 1], "next");
}

/* When a part's change shows on the console, where it isn't as soon as the theme is applied. */
const SHOWS_WHEN = {
  fonts: ["After rest mode", "The home screen reads its fonts as it starts: apply, then put the console in rest mode and wake it."],
  appearance: ["After rest mode", "Shows once that look is chosen in Settings > Appearance and Sound, after rest mode."],
  interface: ["After rest mode", "The interface reads these pictures as it starts: apply, then put the console in rest mode and wake it."],
  tiles: ["Home row after rest mode", "The Game Library shows a new icon at once; the home row after rest mode."],
  titles: ["Home row after rest mode", "The Game Library shows a new picture at once; the home row after rest mode."],
  music: ["After a game's music", "The home screen starts its music again only after another app's music has played: highlight a game with music, let it play, then go back."],

/* For a theme with nothing in it yet: the three steps from an empty theme to seeing it on the console. */

      </ol>

}

function themePaneHtml(t) {

          <option value="${esc(state.status.fw)}" ${!fwAny ? "selected" : ""}>This console (${esc(state.status.fw)})</option>

function renderAspect(asp) {
  const el = $(`#aspect-${asp.id}`);
  if (!el) { syncNav(asp.id); return; }
  const replaced = aspectReplaced(asp);
  const status = sectionStatus(asp.id);

  const canReset = asp.mode !== "music" && replaced > 0;
  el.innerHTML = `
    <div class="aspect-head">
      <div class="text"><h2>${esc(asp.title)}</h2><div class="sub">${esc(asp.sub)}</div></div>

      <span class="tag${UNCHANGED.has(status) ? "" : " on"}">${esc(status)}</span>
      ${confirming ? `<div class="confirm">Put back the console's own ${esc(asp.title.toLowerCase())}? ${plural(replaced, "file")} will be removed from this theme.
        <button class="btn sm danger armed" data-act="confirm-off" data-aspect="${asp.id}">Reset</button>
        <button class="btn sm ghost" data-act="cancel-off" data-aspect="${asp.id}">Keep</button></div>`
      : canReset ? `<button class="btn sm ghost danger" data-act="reset-all" data-aspect="${asp.id}">Reset all</button>` : ""}
    </div>
