/* What a picture file really holds, from its first bytes: the console keeps
   the pictures it downloads from PlayStation Network as WebP or JPEG under
   .png names. "" if none of these. */
function sniffImage(b) {
  if (b.length >= 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return "image/png";
  if (b.length >= 3 && b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return "image/jpeg";
  const tag = (o, t) => [...t].every((c, i) => b[o + i] === c.charCodeAt(0));
  if (b.length >= 16 && tag(0, "RIFF") && tag(8, "WEBP")) return "image/webp";

}
const MIME_NAME = { "image/png": "PNG", "image/jpeg": "JPEG", "image/webp": "WebP" };

/* A WebP file's chunks after its RIFF header: [{ type, data }], or null. */
function webpChunks(b) {
  if (b.length < 20 || sniffImage(b) !== "image/webp") return null;
  const dv = new DataView(b.buffer, b.byteOffset, b.length), out = [];
  for (let o = 12; o + 8 <= b.length;) {
    const n = dv.getUint32(o + 4, true);
    if (o + 8 + n > b.length) return null;
    out.push({ type: String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]), data: b.subarray(o + 8, o + 8 + n) });
    o += 8 + n + (n & 1);
  }
  return out.length ? out : null;
}

function webpFile(chunks) {
  const size = chunks.reduce((a, c) => a + 8 + c.data.length + (c.data.length & 1), 4);
  const out = new Uint8Array(8 + size), dv = new DataView(out.buffer);
  out.set([0x52, 0x49, 0x46, 0x46]); dv.setUint32(4, size, true); out.set([0x57, 0x45, 0x42, 0x50], 8);
  let o = 12;
  for (const c of chunks) {
    for (let i = 0; i < 4; i++) out[o + i] = c.type.charCodeAt(i);
    dv.setUint32(o + 4, c.data.length, true);
    out.set(c.data, o + 8);
    o += 8 + c.data.length + (c.data.length & 1);

/* The browser's WebP laid out as the console's: a plain one (a single "VP8 "
   chunk) when the console's is plain, and otherwise without the colour
   profile browsers add, unless the console's has one too. */
function webpLike(out, stock) {

  if (sc[0].type === "VP8X" && oc[0].type === "VP8X" && !sc.some(c => c.type === "ICCP")) {
    const x = oc[0].data.slice();
    x[0] &= ~0x20;   /* "has a colour profile" */
    return webpFile([{ type: "VP8X", data: x }, ...oc.slice(1).filter(c => c.type !== "ICCP")]);
  }

/* Re-encode an image to the asset's exact format (the one its file really
   holds) and pixel size, then decode the result again to prove it. */
async function imageForAsset(file, assetPath) {
  if (!IMAGE_MIME[ext(assetPath)]) {
    if (!/svg/.test(file.type) && !/\.svg$/i.test(file.name)) throw new Error("use an SVG file for this one");
    return file;
  }
  if (!file.type.startsWith("image/") && !/\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(file.name)) throw new Error(`${file.name} is not an image`);
  const res = await fetch(`/api/asset?${q({ path: assetPath })}`);
  if (!res.ok) throw new Error("could not read the system image");
  const stockBytes = new Uint8Array(await res.arrayBuffer());
  const mime = sniffImage(stockBytes) || IMAGE_MIME[ext(assetPath)];
  /* A WebP without an alpha channel (a plain "VP8 " one) stays opaque. */
  const opaque = mime === "image/jpeg" || (mime === "image/webp" && stockBytes[12] === 0x56 && stockBytes[15] === 0x20);
  const url = URL.createObjectURL(file), stockUrl = URL.createObjectURL(new Blob([stockBytes], { type: mime }));

  try {
    [stock, img] = await Promise.all([loadImage(stockUrl), loadImage(url)]);
  } finally { URL.revokeObjectURL(url); URL.revokeObjectURL(stockUrl); }
  const w = stock.naturalWidth, h = stock.naturalHeight;
  if (!w || !h) throw new Error("could not read the system image size");
  if (file.type === mime && img.naturalWidth === w && img.naturalHeight === h) return file;

  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d", { colorSpace: "srgb" });  /* sRGB: same look in SDR and HDR */
  ctx.imageSmoothingQuality = "high";
  if (opaque) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h); }
  let dw = w, dh = h;
  if (state.fit !== "stretch") {
    const s = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);
    dw = img.naturalWidth * s; dh = img.naturalHeight * s;

  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);

  if (!blob || blob.type !== mime) throw new Error(`this browser cannot make ${MIME_NAME[mime] || mime} pictures; use Chrome, Edge or Firefox for this one`);

  const check = URL.createObjectURL(blob);
  try {
    const out = await loadImage(check);
    if (out.naturalWidth !== w || out.naturalHeight !== h) throw new Error("converted image did not verify");
  } finally { URL.revokeObjectURL(check); }

}

function parseWav(buf) {
  const dv = new DataView(buf);
  const tag = o => String.fromCharCode(...new Uint8Array(buf, o, 4));
  if (buf.byteLength < 12 || tag(0) !== "RIFF" || tag(8) !== "WAVE") return null;
  const info = {};

    const id = tag(o), size = dv.getUint32(o + 4, true);
    if (id === "fmt ") {

      info.rate = dv.getUint32(o + 12, true); info.bits = dv.getUint16(o + 22, true);
    } else if (id === "data") {
      info.dataOffset = o + 8; info.dataSize = size;
      break;
    }
    o += 8 + size + (size & 1);

/* Decode any audio the browser supports to `channels` channels at `rate`. */
async function decodeAudio(file, rate, channels) {
  const data = await file.arrayBuffer();
  let decoded;
  try {
    decoded = await new OfflineAudioContext(1, 1, rate).decodeAudioData(data.slice(0));
  } catch (e) { throw new Error(`${file.name} is not audio this browser can read`); }
  return renderAudio(decoded, rate, channels);
}

/* Render an AudioBuffer (any rate and layout) with `channels` channels at `rate`. */
async function renderAudio(buffer, rate, channels) {
  const frames = Math.max(1, Math.ceil(buffer.duration * rate));
  const ctx = new OfflineAudioContext(channels, frames, rate);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  src.start();
  const out = await ctx.startRendering();
  return [...Array(channels)].map((_, c) => out.getChannelData(c));
}

async function resample(chans, from, to) {
  if (from === to) return chans;
  const ctx = new OfflineAudioContext(chans.length, 1, from);
  const buf = ctx.createBuffer(chans.length, chans[0].length, from);
  chans.forEach((c, i) => buf.copyToChannel(c, i));
  return renderAudio(buf, to, chans.length);
}

/* 16-bit PCM WAV from channel data, parsed again to prove its shape. */
function pcmWav(chans, rate) {
  const channels = chans.length, frames = chans[0].length;
  const bytes = 44 + frames * channels * 2;
  const buf = new ArrayBuffer(bytes);
  const dv = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); dv.setUint32(4, bytes - 8, true); str(8, "WAVE");
  str(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, channels, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * channels * 2, true); dv.setUint16(32, channels * 2, true);
  dv.setUint16(34, 16, true); str(36, "data"); dv.setUint32(40, frames * channels * 2, true);

  for (let i = 0; i < frames; i++) {

      const v = Math.max(-1, Math.min(1, chans[c][i]));
      dv.setInt16(o, v < 0 ? v * 32768 : v * 32767, true);

/* Channel data of a 16-bit PCM WAV. */
function wavChannels(buf) {

/* Any audio as a 16-bit PCM WAV of the given shape. */
async function audioToWav(file, rate, channels) {
  return pcmWav(await decodeAudio(file, rate, channels), rate);

/* ---- ATRAC9: the console's own sounds and home music (atrac9.js) ---- */

const at9Stock = new Map();   /* system .at9 path -> { bytes, file, rms } */

async function stockAt9(path) {
  if (!at9Stock.has(path)) {
    const res = await fetch(`/api/asset?${q({ path })}`);
    if (!res.ok) throw new Error("could not read the system sound");
    const bytes = new Uint8Array(await res.arrayBuffer());
    const file = ATRAC9.parseFile(bytes);
    at9Stock.set(path, { bytes, file, rms: ATRAC9.downmixRms(file) });
  }
  return at9Stock.get(path);
}

/* The longest audio a replacement may hold: the console accepts up to twice
   the system file's length, and looping music also repeats its opening
   seconds after the end (see encode in atrac9.js). */
function at9MaxSamples(stock) {
  const f = stock.file, cfg = f.config, delay = f.fact ? f.fact[2] : cfg.frameSamples;
  const tail = f.loop ? ATRAC9.LOOP_TAIL * cfg.rate : 0;
  return 2 * f.superframes * cfg.superframeSamples - Math.max(delay, cfg.frameSamples) - cfg.superframeSamples - tail;
}

function trimWithFade(chans, max, rate) {
  if (chans[0].length <= max) return chans;
  const fade = Math.min(max, 3 * rate);
  return chans.map(c => {
    const out = c.slice(0, max);
    for (let i = 0; i < fade; i++) out[max - fade + i] *= 1 - (i + 1) / fade;
    return out;
  });
}

/* Scale to the system sound's loudness (RMS of its stereo downmix), offset
   by gainDb, with a soft limit just below full scale. */
function matchLoudness(chans, target, gainDb) {
  let sum = 0, n = 0;
  for (const c of chans) for (let i = 0; i < c.length; i++) { sum += c[i] * c[i]; n++; }
  const rms = Math.sqrt(sum / Math.max(n, 1));
  if (!(rms > 1e-6)) return chans;
  const g = (target > 0 ? target : 0.1) / rms * 10 ** (gainDb / 20), knee = 0.89;
  return chans.map(c => c.map(v => {
    v *= g;
    const a = Math.abs(v);
    return a <= knee ? v : Math.sign(v) * (knee + (1 - knee) * Math.tanh((a - knee) / (1 - knee)));
  }));
}

/* Run the encoder in a Web Worker (atrac9.js doubles as one); on the page
   itself, with pauses to repaint, if a worker cannot start. */
function encodeAt9(stockBytes, left, right, onProgress, intro) {
  return new Promise((resolve, reject) => {
    const onPage = async () => {
      let last = performance.now();
      try {
        resolve(await ATRAC9.encode(stockBytes, left, right, async f => {
          if (onProgress) onProgress(f);
          if (performance.now() - last > 50) { await nextTask(); last = performance.now(); }
        }, intro));
      } catch (e) { reject(e); }
    };
    let worker;
    try { worker = new Worker("atrac9.js"); } catch (e) { onPage(); return; }
    let started = false;
    worker.onmessage = e => {
      const m = e.data;
      started = true;
      if (m.progress !== undefined) { if (onProgress) onProgress(m.progress); return; }
      worker.terminate();
      if (m.error) reject(new Error(m.error)); else resolve(m.result);
    };
    worker.onerror = e => {
      e.preventDefault();
      worker.terminate();
      if (started) reject(new Error("the encoder stopped unexpectedly")); else onPage();
    };
    worker.postMessage({ stock: stockBytes, left, right, intro });
  });
}

/* Encode audio as a replacement for the system ATRAC9 sound at `path`: same
   format, matched loudness, decoded again and compared before it is returned.
   `intro` (seconds) plays once before the part that loops. */
async function at9For(path, chans, rate, gainDb, onProgress, intro = 0) {
  const stock = await stockAt9(path);
  const cfg = stock.file.config;
  let st = await resample(chans.length === 1 ? [chans[0], chans[0]] : chans.slice(0, 2), rate, cfg.rate);
  const max = at9MaxSamples(stock), trimmed = st[0].length > max;
  st = matchLoudness(trimWithFade(st, max, cfg.rate), stock.rms, gainDb);
  const introSamples = Math.min(Math.round(intro * cfg.rate), Math.max(0, st[0].length - cfg.rate));
  const res = await encodeAt9(stock.bytes, st[0], st[1], onProgress, introSamples);
  return { blob: new Blob([res.bytes], { type: "audio/x-at9" }), seconds: res.samples / cfg.rate, trimmed };
}

async function soundForAsset(file, assetPath) {
  if (ext(assetPath) === "at9") {
    if (/\.at9$/i.test(file.name)) return file;  /* made elsewhere: the console checks the exact format */
    const stock = await stockAt9(assetPath);
    const chans = await decodeAudio(file, stock.file.config.rate, 2);
    return (await at9For(assetPath, chans, stock.file.config.rate, 0, attachProgress)).blob;
  }
  const stock = parseWav(await (await fetch(`/api/asset?${q({ path: assetPath })}`)).arrayBuffer());
  if (!stock) throw new Error("could not read the system sound");
  if (stock.format !== 1 || stock.bits !== 16) {
    if (!/\.wav$/i.test(file.name)) throw new Error(`attach a WAV in the same format (${stock.rate} Hz, ${stock.bits}-bit)`);
    return file;  /* the console checks the exact format */
  }
  return audioToWav(file, stock.rate, stock.channels);
}

/* ---- textures: DDS for ShellUI (.dds / .dds.zst) ---- */

/* bc7:begin */
const BC7_WEIGHTS = [0, 4, 9, 13, 17, 21, 26, 30, 34, 38, 43, 47, 51, 55, 60, 64];

/* A 4x4 block's colour line: the two ends of its pixels' range along their

function blockLine(px) {

  let rr = 0, rg = 0, rb = 0, gg = 0, gb = 0, bb = 0;
  for (let i = 0; i < 64; i += 4) {

    const ctx = canvas.getContext("2d", { colorSpace: "srgb", willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    if (!alpha) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h); }   /* with transparency, what the picture leaves bare stays clear */
    if (alpha) {
      /* against the screen's edge, with the padding left clear */
      const d = textureDraw(assetPath, place.pad, place.fit, w, h, img.naturalWidth, img.naturalHeight, keep);
      ctx.save();
      ctx.beginPath(); ctx.rect(d.box.x, d.box.y, d.box.w, d.box.h); ctx.clip();
      ctx.drawImage(img, d.x, d.y, d.dw, d.dh);
      ctx.restore();
    } else {
      let dw = w, dh = h;
      if (state.fit !== "stretch") {
        const sc = (state.fit === "cover" ? Math.max : Math.min)(w / img.naturalWidth, h / img.naturalHeight);
        dw = img.naturalWidth * sc; dh = img.naturalHeight * sc;
      }
      ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }
    const pix = ctx.getImageData(0, 0, w, h).data;
    if (alpha) bleedClear(pix, w, h);
    if (!bc7 && !bc1) {
      for (let i = 0; i < w * h; i++) {
        const s = i * 4;
        if (rgba) { data[o++] = pix[s]; data[o++] = pix[s + 1]; data[o++] = pix[s + 2]; data[o++] = 255; }
        else { data[o++] = pix[s + 2]; data[o++] = pix[s + 1]; data[o++] = pix[s]; data[o++] = 255; }
      }
      continue;
    }
    const block = new Uint8ClampedArray(64), check = new Uint8Array(64);
    const bw = Math.ceil(w / 4), bh = Math.ceil(h / 4);
    for (let by = 0; by < bh; by++) {
      for (let bx = 0; bx < bw; bx++) {
        for (let y = 0; y < 4; y++) {
          for (let x = 0; x < 4; x++) {
            const sx = Math.min(w - 1, bx * 4 + x), sy = Math.min(h - 1, by * 4 + y), s = (sy * w + sx) * 4, d = (y * 4 + x) * 4;
            block[d] = pix[s]; block[d + 1] = pix[s + 1]; block[d + 2] = pix[s + 2]; block[d + 3] = alpha ? pix[s + 3] : 255;
          }
        }
        encode(block, data, o);
        if ((bx * 7 + by * 13) % 97 === 0) {  /* re-decode a sample of blocks */
          if (!decode(data, o, check)) throw new Error("texture encoder self-check failed");
          for (let i = 0; i < 64; i++) {
            if ((i & 3) !== 3) {
              if (alpha && block[i | 3] < 16) continue;   /* the colour of a clear pixel doesn't show */
              const e = check[i] - block[i]; sampleErr += e * e; sampled++;
            } else if (alpha) { const e = check[i] - block[i]; alphaErr += e * e; alphaN++; }
            else if (check[i] !== 255) throw new Error("texture encoder self-check failed");
          }
        }
        o += blockBytes;
      }
      done += bw;
      if (performance.now() - lastYield > 50) {
        if (progress) progress(done / totalBlocks);
        await nextTask();
        lastYield = performance.now();
      }
    }
  }
  if (o !== data.length) throw new Error("texture size did not verify");
  if (sampled) {
    const psnr = 10 * Math.log10(255 * 255 / Math.max(1e-9, sampleErr / sampled));
    if (psnr < 24) throw new Error("the texture came out too unlike your picture to use (too much fine detail for its size); try a smoother picture");
  }
  if (alphaN && Math.sqrt(alphaErr / alphaN) > 24) throw new Error("the see-through parts did not encode well");
  const dds = new Uint8Array(header.length + data.length);
  dds.set(header); dds.set(data, header.length);
  const out = new Blob([info.zstd ? zstdStored(dds, info.frame ? b64bytes(info.frame) : null) : dds]);
  textureCache.set(key, out);
  /* the last few only: a 4K texture is 16 MB */
  while (textureCache.size > 4) textureCache.delete(textureCache.keys().next().value);
  return out;
}

async function fileForAsset(file, asset) {
  if (asset.kind === "texture") return textureForAsset(file, asset.path, attachProgress);
  if (isImage(asset)) return imageForAsset(file, asset.path);
  if (asset.kind === "audio") return soundForAsset(file, asset.path);
  return file;  /* fonts, JSON, video: the console validates against the stock file */
}

let attachProgress = null;

/* Put one file onto a set of system assets (for example all size variants).
   `copies`: the same picture already written to that many other files, for
   a message that counts files instead of sizes. */
async function attachTo(assets, file, label, copies = null, remake = false, shown = null) {
  const big = assets.length > 2 || assets.some(a => a.kind === "texture" || ext(a.path) === "at9");
  const p = shown || (big ? progressToast(`Adding ${label}…`) : null);
  const base = shown ? shown.frac : 0;   /* a task begun before (reading a kept picture) keeps its part of the bar */
  let ok = 0, keptFirst = null;
  const errors = [];
  for (let i = 0; i < assets.length; i++) {
    const a = assets[i], at = x => base + (1 - base) * (i + x) / assets.length;
    attachProgress = p ? f => p.set(`Encoding ${baseName(a.path)}… ${Math.round(f * 100)}%`, at(0.7 * f)) : null;
    /* each step says what it is as it starts */
    if (p) p.set(`${a.kind === "texture" || a.kind === "audio" || isImage(a) ? "Encoding" : "Preparing"} ${baseName(a.path)}…`, at(0));
    try {
      const blob = await fileForAsset(file, a);
      const keep = !remake && state.keepOriginals && keepsOriginal(a) && blob !== file;   /* so an option changed later needs no new upload */
      if (p) p.set(`Sending ${baseName(a.path)} to the console…`, at(0.7), at(keep ? 0.9 : 1));
      await uploadVerified("/api/theme/file", { id: state.editId, path: a.path }, blob);
      state.files.add(a.path);
      if (keep) {
        if (p) p.set(keptFirst ? `Keeping your original for ${baseName(a.path)}…` : "Keeping your original picture…", at(0.9), at(1));
        await keepSource(a.path, file, keptFirst);
        if (!keptFirst && state.sources.has(a.path)) keptFirst = a.path;
      }
      ok++;
    } catch (e) { errors.push(`${baseName(a.path)}: ${e.message}`); }
    if (p) p.set(`${remake ? "Making" : "Adding"} ${label}${remake ? " again" : ""}… ${i + 1}/${assets.length}`, at(1));
  }
  stamp = Date.now();
  if (!remake && state.keepOriginals) await loadOriginals();
  /* The interface reads the Appearance artwork as it starts: it shows after rest mode. */
  const use = assets.some(a => APPEARANCE_RE.test(a.path))
    ? "Apply the theme, then put the console in rest mode and wake it to see the change." : "Apply the theme to use it.";
  const msg = errors.length
    ? `${label}: ${ok} of ${assets.length} added and verified. ${errors.slice(0, 2).join("; ")}`
    : copies !== null ? `${label} replaced in ${plural(ok + copies, "file")} and verified. ${use}`
    : `${label} ${remake ? "made again" : "added"} and verified${assets.length > 1 ? ` at ${plural(ok, "size")}` : ""}. ${use}`;
  const kind = errors.length ? (ok ? "" : "err") : "ok";
  if (p) p.done(msg, kind); else toast(msg, kind, errors.length ? 9000 : 4500);
  await refreshStatus();
  return ok;
}

/* After the Appearance artwork goes back to the console's own in the theme. */
function restReminder() {
  toast("Back to the console's own artwork in this theme. Apply the theme, then put the console in rest mode and wake it to see the change.", "ok", 7000);
}

/* Every song of the theme goes (a playlist's too), and the home music is the console's again. */
async function removeMusic() {
  const id = state.editId, extra = themeTracks(themeById(id)).map(x => x.slot).filter(s => s !== 1);
  for (const slot of extra) await api("DELETE", "/api/theme/music", { id, slot }).catch(() => {});
  await api("DELETE", "/api/theme/music", { id }).catch(() => {});
  if (extra.length) await api("POST", "/api/theme/settings", { id, sequence: "1", tracks: 1, loop_start: -1, loop_end: -1, order: "music" }).catch(() => {});
  setSongNames(names => { for (const k of Object.keys(names)) delete names[k]; });
  songCacheDrop(id);
  await resetAssets([{ path: HOME_MUSIC }]);
}

async function resetAssets(assets) {
  const hadBackground = backgroundFile([...state.files]);
  for (const a of assets.filter(x => state.files.has(x.path))) {
    try { await api("DELETE", "/api/theme/file", { id: state.editId, path: a.path }); state.files.delete(a.path); state.sources.delete(a.path); }
    catch (e) { toast(e.message, "err"); }
  }
  await loadOriginals();
  stamp = Date.now();
  /* No background left: neither is the picture made from it. */
  if (hadBackground && !backgroundFile([...state.files])) await removePreview(state.editId, "background");
  else await refreshStatus();
}

/* ================================================================ preview pictures

   Each theme can have a picture for its library card: one made from its
   background when the background is added (kind "background"), and one the
   user chooses (kind "picture"), which is shown instead. */

const PREVIEW_W = 1280, PREVIEW_H = 720;

const PREVIEW_FILES = [["background", "preview.jpg"], ["picture", "picture.jpg"]];   /* in a theme .zip */
const coverUrl = t => `/api/theme/preview?${q({ id: t.id })}&v=${t.coverTime}-${stamp}`;

/* A 16:9 JPEG of an image, video frame or canvas, fitted as `fit`. */
async function previewJpeg(src, w, h, fit) {
  const c = document.createElement("canvas");
  c.width = PREVIEW_W; c.height = PREVIEW_H;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
  let dw = c.width, dh = c.height;
  if (fit !== "stretch") {
    const sc = (fit === "contain" ? Math.min : Math.max)(c.width / w, c.height / h);
    dw = w * sc; dh = h * sc;
  }
  ctx.drawImage(src, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
  const blob = await new Promise(resolve => c.toBlob(resolve, "image/jpeg", 0.85));
  if (!blob) throw new Error("this browser could not make the picture");
  await loadImage(URL.createObjectURL(blob)).then(img => URL.revokeObjectURL(img.src));  /* check it reads back */
  return blob;
}

/* A frame from a little way into a video (backgrounds often fade in). */
function videoFrame(url) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    const timer = setTimeout(() => reject(new Error("could not read the video")), 10000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 0) / 3); };
    v.onseeked = () => { clearTimeout(timer); resolve(v); };
    v.onerror = () => { clearTimeout(timer); reject(new Error("could not read the video")); };
    v.src = url;
  });
}

async function previewSource(url, isVideo) {
  if (isVideo) { const v = await videoFrame(url); return [v, v.videoWidth, v.videoHeight]; }
  const img = await loadImage(url);
  return [img, img.naturalWidth, img.naturalHeight];
}

async function savePreview(id, kind, blob) {
  await uploadVerified("/api/theme/preview", { id, kind }, blob);
  stamp = Date.now();
  await refreshStatus();
  if (state.route === "edit" && state.editId === id && $("#cover-panel")) $("#cover-panel").innerHTML = coverPanel(themeById(id));
}

async function removePreview(id, kind) {
  await api("DELETE", "/api/theme/preview", { id, kind }).catch(() => {});
  stamp = Date.now();
  await refreshStatus();
  if (state.route === "edit" && state.editId === id && $("#cover-panel")) $("#cover-panel").innerHTML = coverPanel(themeById(id));
}

/* After a background is added: the same picture, fitted as the background was. */
async function previewFromFile(id, file, isVideo) {
  const url = URL.createObjectURL(file);
  try {
    const [src, w, h] = await previewSource(url, isVideo);
    await savePreview(id, "background", await previewJpeg(src, w, h, state.fit));
  } catch (e) {
    console.warn("preview picture:", e);
  } finally { URL.revokeObjectURL(url); }
}

/* ---- reading a theme's own background back (themes made before previews) */

/* The content of a zstd frame made of raw and RLE blocks, which is how this
   builder stores textures. Compressed blocks are not read. */
function unzstdStored(b) {
  if (b[0] !== 0x28 || b[1] !== 0xb5 || b[2] !== 0x2f || b[3] !== 0xfd) throw new Error("not zstd");
  const fhd = b[4], single = (fhd >> 5) & 1, fcs = [single ? 1 : 0, 2, 4, 8][fhd >> 6];
  let o = 5 + (single ? 0 : 1) + [0, 1, 2, 4][fhd & 3] + fcs;
  const parts = [];
  for (;;) {
    if (o + 3 > b.length) throw new Error("truncated zstd");
    const h = b[o] | (b[o + 1] << 8) | (b[o + 2] << 16), type = (h >> 1) & 3, size = h >>> 3;
    o += 3;
    if (type === 0) { parts.push(b.subarray(o, o + size)); o += size; }
    else if (type === 1) { parts.push(new Uint8Array(size).fill(b[o])); o += 1; }
    else throw new Error("compressed zstd");
    if (h & 1) break;
  }
  const out = new Uint8Array(parts.reduce((n, x) => n + x.length, 0));
  let w = 0;
  for (const x of parts) { out.set(x, w); w += x.length; }
  return out;
}

/* The top level of a DDS texture as a canvas: BC7 (as this builder encodes
   it), RGBA8 or BGRA8. `keepAlpha`: BC7 with its see-through parts, for a picture taken back out of a texture. */
async function ddsCanvas(bytes, keepAlpha = false) {
  const d = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (d.getUint32(0, true) !== 0x20534444) throw new Error("not a DDS texture");
  const h = d.getUint32(12, true), w = d.getUint32(16, true);
  const fourcc = d.getUint32(84, true), dx10 = fourcc === 0x30315844;
  let dxgi = dx10 ? d.getUint32(128, true) : 0;
  if (!dx10 && d.getUint32(88, true) === 32) dxgi = d.getUint32(92, true) === 0xff ? 28 : d.getUint32(92, true) === 0xff0000 ? 87 : 0;
  const data = bytes.subarray(dx10 ? 148 : 128);
  if (!w || !h || w > 8192 || h > 8192) throw new Error("unexpected texture size");
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(w, h), px = img.data;
  if (dxgi === 98 || dxgi === 99) {
    const bw = Math.ceil(w / 4), bh = Math.ceil(h / 4), block = new Uint8Array(64);
    if (data.length < bw * bh * 16) throw new Error("texture is truncated");
    let last = performance.now();
    for (let by = 0; by < bh; by++) {
      for (let bx = 0; bx < bw; bx++) {
        if (!bc7DecodeMode6(data, (by * bw + bx) * 16, block)) throw new Error("texture uses BC7 modes this preview can't read");
        for (let y = 0; y < 4 && by * 4 + y < h; y++) {
          for (let x = 0; x < 4 && bx * 4 + x < w; x++) {
            const s = (y * 4 + x) * 4, t = ((by * 4 + y) * w + bx * 4 + x) * 4;
            px[t] = block[s]; px[t + 1] = block[s + 1]; px[t + 2] = block[s + 2]; px[t + 3] = keepAlpha ? block[s + 3] : 255;
          }
        }
      }
      if (performance.now() - last > 50) { await nextTask(); last = performance.now(); }
    }
  } else if (dxgi === 28 || dxgi === 29 || dxgi === 87 || dxgi === 91) {
    if (data.length < w * h * 4) throw new Error("texture is truncated");
    const bgra = dxgi === 87 || dxgi === 91;
    for (let i = 0; i < w * h * 4; i += 4) {
      px[i] = data[i + (bgra ? 2 : 0)]; px[i + 1] = data[i + 1]; px[i + 2] = data[i + (bgra ? 0 : 2)]; px[i + 3] = 255;
    }
  } else throw new Error("texture format not readable here");
  ctx.putImageData(img, 0, 0);
  return c;
}

/* The theme's home background, preferring the default home screen one. */
function backgroundFile(paths) {
  const bgs = paths.filter(p => BG_RE.test(p));
  const rank = p => areaOf(p) === "Home: default background" ? 0 : areaOf(p).startsWith("Home:") ? 1 : 2;
  return bgs.sort((a, b) => rank(a) - rank(b))[0] || null;
}

async function previewFromTheme(id) {
  const { files } = await api("GET", "/api/theme/files", { id });
  const path = backgroundFile(files.map(f => f.path));
  if (!path) return false;
  const url = `/api/theme/file?${q({ id, path })}`;
  let src, w, h;
  if (/\.dds(\.zst)?$/i.test(path)) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("could not read the background");
    let bytes = new Uint8Array(await res.arrayBuffer());
    if (/\.zst$/i.test(path)) bytes = unzstdStored(bytes);
    src = await ddsCanvas(bytes); w = src.width; h = src.height;
  } else {
    [src, w, h] = await previewSource(url, /\.(mp4|webm|m4v)$/i.test(path));
  }
  await savePreview(id, "background", await previewJpeg(src, w, h, "stretch"));
  return true;
}

/* Themes made before preview pictures: make one from the background, once
   per visit. Quietly does nothing when it can't. */
const previewTried = new Set();
let previewFilling = false;
async function fillMissingPreviews() {
  if (previewFilling) return;
  previewFilling = true;
  try {
    for (const t of state.status.themes) {
      if (t.cover || !t.files || previewTried.has(t.id)) continue;
      previewTried.add(t.id);
      try {
        const el = await previewFromTheme(t.id) && document.querySelector(`[data-cover="${CSS.escape(t.id)}"]`);
        if (el && themeById(t.id)) el.outerHTML = cardPreview(themeById(t.id));
      } catch (e) { console.warn(`preview picture for ${t.id}:`, e); }
    }
  } finally { previewFilling = false; }
}

function coverPanel(t) {
  const text = t.cover === "picture"
    ? "Your picture, shown on this theme's card in the library. Remove it to show the background instead."
    : t.cover === "background"
      ? "Made from the background and shown on this theme's card in the library. You can choose another picture, such as a photo of your home screen with the theme applied."
      : "Shown on this theme's card in the library, so you can tell your themes apart. It's made from the background when you add one, or choose any picture.";
  return `
    <div class="cover">${t.cover ? `<img alt="Preview of ${esc(t.name)}" src="${coverUrl(t)}">` : "No picture yet"}</div>
    <div class="text"><h2>Preview picture</h2><div class="sub">${esc(text)}</div>
      <div class="acts"><button class="btn sm" data-act="choose-cover">Choose picture</button>
        ${t.cover === "picture" ? `<button class="btn sm ghost danger" data-act="remove-cover">Remove picture</button>` : ""}</div></div>`;
}

async function chooseCover() {
  const id = state.editId;
  const file = await pickFile("image/*");
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const [img, w, h] = await previewSource(url, false);
    await savePreview(id, "picture", await previewJpeg(img, w, h, "cover"));
    toast("Preview picture set.", "ok");
  } catch (e) {
    toast(e.message, "err");
  } finally { URL.revokeObjectURL(url); }
}

/* ================================================================ live preview

   A read-only mockup of the home screen and the Control Center with the
   theme's background, its colours (per Appearance theme, with your edits), the
   Appearance artwork, a changed font and the changed icons. It reads from the
   console with the same GETs the editor uses, builds nothing on the console,
   and uploads nothing. */

const pvHex = n => "#" + ((n >>> 0) & 0xffffff).toString(16).padStart(6, "0");
const pvInk = rgb => lum(rgb) > 150 ? "#08121f" : "#ffffff";
const pvRgba = (n, a) => { const v = n >>> 0; return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`; };
const PV_FALLBACK = { accent: 0x1f7cf0, text: 0xffffff, panel: 0x171a22, backdrop: 0x0d1018, card: 0x1b1e28 };
/* Each look's Appearance theme and its colour palette. */
const LOOK_NAMES = { default: "Default look", ps: "PlayStation", ps2: "PlayStation 2", ps3: "PlayStation 3", ps4: "PlayStation 4" };
const LOOK_PAL = { default: "color_default", ps: "color_ps1", ps2: "color_ps2", ps3: "color_ps3", ps4: "color_ps4" };

/* The colours one look paints with: accent (buttons), text, a panel fill, the
   Control Center backdrop and card. A look's own palette, with the theme's
   edits to it; falls back to the default look's palette, then to neutral. */
async function previewColorsForLook(look) {
  const path = rcoPaths()[0];
  if (!path) return PV_FALLBACK;
  try {
    const r = await rcoStock(path);
    if (!r) return PV_FALLBACK;
    const pals = rcoColors(r);
    let i = pals.findIndex(p => p.id === (LOOK_PAL[look] || "color_default"));
    if (i < 0) i = pals.findIndex(p => p.id === "color_default");
    if (i < 0) return PV_FALLBACK;
    const changes = state.files.has(path) ? await rcoChanges(path) : new Map();
    const mine = changes.get(`${pals[i].f.el}\t${pals[i].f.attr}`);
    const eff = new Map(mine ? [...new TextDecoder().decode(mine).matchAll(COLOR_PAIR)].map(m => [m[2], Number(m[3])]) : pals[i].values);
    const sets = colorEditSets(pals, i), stockOf = new Map(pals[i].values);
    const named = (n, fb) => eff.has(n) ? rgbOf(eff.get(n)) : fb;
    const picked = (set, fb) => {
      if (!set) return fb;
      const name = set.names.find(n => rgbOf(stockOf.get(n)) === set.base) || set.names[0];
      return eff.has(name) ? rgbOf(eff.get(name)) : fb;
    };
    return {
      accent: picked(sets.accent, named("focus.fill.enabled", PV_FALLBACK.accent)),
      text: named("text.primary.enabled", picked(sets.text, PV_FALLBACK.text)),
      panel: named("menu.fill.enabled", named("dialog.fill.enabled", PV_FALLBACK.panel)),
      backdrop: named("base-mat.overlay.enabled", PV_FALLBACK.backdrop),
      card: named("radio-button.overlay.fill.enabled", PV_FALLBACK.card),
    };
  } catch (e) { return PV_FALLBACK; }
}

/* The theme's home background as an object URL, fitted as the theme is, or null. */
async function previewBackground(id) {
  let files;
  try { ({ files } = await api("GET", "/api/theme/files", { id })); } catch (e) { return null; }
  const path = backgroundFile(files.map(f => f.path));
  if (!path) return null;
  try {
    const res = await fetch(`/api/theme/file?${q({ id, path })}&v=${stamp}`);
    if (!res.ok) return null;
    let src, w, h;
    if (/\.dds(\.zst)?$/i.test(path)) {
      let bytes = new Uint8Array(await res.arrayBuffer());
      if (/\.zst$/i.test(path)) bytes = unzstdStored(bytes);
      src = await ddsCanvas(bytes); w = src.width; h = src.height;
    } else {
      const url = URL.createObjectURL(await res.blob());
      try { [src, w, h] = await previewSource(url, /\.(mp4|webm|m4v)$/i.test(path)); }
      finally { URL.revokeObjectURL(url); }
    }
    return URL.createObjectURL(await previewJpeg(src, w, h, state.fit));
  } catch (e) { return null; }
}

/* A changed Appearance piece (its texture decoded, with transparency), or null. */
async function previewAppearancePiece(id, look, which) {
  if (look === "default") return null;
  const name = which === "homeui" ? `homeui_${look}.dds` : `control_center_${look}_${which}.dds`;
  const path = `/system/vsh_asset/${name}`;
  if (!state.files.has(path)) return null;
  try {
    const res = await fetch(`/api/theme/file?${q({ id, path })}&v=${stamp}`);
    if (!res.ok) return null;
    let bytes = new Uint8Array(await res.arrayBuffer());
    if (bytes[0] === 0x28 && bytes[1] === 0xb5 && bytes[2] === 0x2f && bytes[3] === 0xfd) bytes = unzstdStored(bytes);
    const c = await ddsCanvas(bytes, true);
    return await new Promise(r => c.toBlob(b => r(b ? URL.createObjectURL(b) : null), "image/png"));
  } catch (e) { return null; }
}

/* A changed file that shows as an icon on the home screen. */
const previewIconLike = path => isTitlePicture(path) || !!tileTitle(path) || (ICON_RE.test(path) && !BG_RE.test(path));

/* Up to `max` of the theme's changed icon files, as object URLs, app icons first. */
async function previewFileIcons(id, max) {
  const rank = p => isTitlePicture(p) ? 0 : tileTitle(p) ? 1 : 2;
  const paths = [...state.files].filter(previewIconLike).sort((a, b) => rank(a) - rank(b));
  const out = [];
  for (const path of paths) {
    if (out.length >= max) break;
    try {
      const res = await fetch(`/api/theme/file?${q({ id, path })}&v=${stamp}`);
      if (!res.ok) continue;
      if (/\.dds(\.zst)?$/i.test(path)) {
        let bytes = new Uint8Array(await res.arrayBuffer());
        if (/\.zst$/i.test(path)) bytes = unzstdStored(bytes);
        const c = await ddsCanvas(bytes, true);
        out.push(await new Promise(r => c.toBlob(b => r(b ? URL.createObjectURL(b) : null), "image/png")));
      } else {
        out.push(URL.createObjectURL(await res.blob()));
      }
    } catch (e) { /* skip one that can't be read */ }
  }
  return out.filter(Boolean);
}

/* Up to `max` of the theme's changed interface (.rco) pictures, as object URLs. */
async function previewRcoIcons(id, max) {
  const path = rcoPaths()[0];
  if (!path || !state.files.has(path)) return [];
  try {
    const changes = await rcoChanges(path);
    if (!changes.size) return [];
    const r = await rcoStock(path);
    if (!r) return [];
    const out = [];
    for (const pic of rcoPictures(r)) {
      if (out.length >= max) break;
      const v = pic.files.find(f => changes.has(`${f.el}\t${f.attr}`));
      if (!v) continue;
      const d = changes.get(`${v.el}\t${v.attr}`), kind = pictureKind(d);
      if (kind === "svg") out.push(URL.createObjectURL(new Blob([d], { type: "image/svg+xml" })));
      else if (kind === "png") out.push(URL.createObjectURL(new Blob([d], { type: "image/png" })));
    }
    return out;
  } catch (e) { return []; }
}

/* The theme's changed interface font, loaded as a FontFace; its family, or null. */
let pvFont = null;
async function previewFont(id) {
  const fonts = [...state.files].filter(p => /\.otf$/i.test(p) && (FONT_LATIN.test(baseName(p)) || FONT_HOME.test(baseName(p))));
  fonts.sort((a, b) => (FONT_LATIN.test(baseName(a)) ? 0 : 1) - (FONT_LATIN.test(baseName(b)) ? 0 : 1));
  if (!fonts.length) return null;
  try {
    const res = await fetch(`/api/theme/file?${q({ id, path: fonts[0] })}&v=${stamp}`);
    if (!res.ok) return null;
    const ff = new FontFace("pvtheme", await res.arrayBuffer());
    await ff.load();
    document.fonts.add(ff);
    pvFont = ff;
    return "pvtheme";
  } catch (e) { return null; }
}

let pvUrls = [], pvData = null, pvLooksArt = new Set();
let pvState = { look: "default", view: "home" };
function previewRevoke() { for (const u of pvUrls) URL.revokeObjectURL(u); pvUrls = []; }
function previewDropFont() { if (pvFont) { try { document.fonts.delete(pvFont); } catch (e) { /* gone */ } pvFont = null; } }
function previewClose() {
  const ov = $("#pv-overlay");
  if (ov) ov.remove();
  document.removeEventListener("keydown", previewKey);
  previewRevoke();
  previewDropFont();
  pvData = null;
}
function previewKey(e) { if (e.key === "Escape") previewClose(); }

/* Fetch the shared pieces once (background, icons, font) into pvData. */
async function previewGather(id) {
  previewRevoke();
  previewDropFont();
  pvData = { id, bg: null, tiles: [], fontFam: null, art: {}, cc: {}, colors: {} };
  const [bg, fileIcons, rcoIcons, fontFam] = await Promise.all([
    previewBackground(id), previewFileIcons(id, 6), previewRcoIcons(id, 6), previewFont(id),
  ]);
  if (!$("#pv-overlay") || state.editId !== id) {
    [bg, ...fileIcons, ...rcoIcons].filter(Boolean).forEach(u => URL.revokeObjectURL(u));
    previewDropFont();
    return false;
  }
  pvData.bg = bg;
  pvData.tiles = [...fileIcons, ...rcoIcons].slice(0, 6);
  pvData.fontFam = fontFam;
  pvUrls.push(...[bg, ...fileIcons, ...rcoIcons].filter(Boolean));
  return true;
}
async function pvArtFor(look) {
  if (look in pvData.art) return pvData.art[look];
  const u = await previewAppearancePiece(pvData.id, look, "homeui");
  pvData.art[look] = u; if (u) pvUrls.push(u);
  return u;
}
async function pvCcFor(look, which) {
  const k = look + "/" + which;
  if (k in pvData.cc) return pvData.cc[k];
  const u = await previewAppearancePiece(pvData.id, look, which);
  pvData.cc[k] = u; if (u) pvUrls.push(u);
  return u;
}
async function pvColorsFor(look) {
  if (pvData.colors[look]) return pvData.colors[look];
  const c = await previewColorsForLook(look);
  pvData.colors[look] = c;
  return c;
}

function previewToolbar() {
  const opts = Object.keys(LOOK_NAMES).map(l =>
    `<option value="${l}" ${pvState.look === l ? "selected" : ""}>${esc(LOOK_NAMES[l])}${pvLooksArt.has(l) ? " ✦" : ""}</option>`).join("");
  return `<div class="pv-tabs">
      <button class="btn sm ${pvState.view === "home" ? "primary" : "ghost"}" data-act="pv-view" data-view="home">Home</button>
      <button class="btn sm ${pvState.view === "cc" ? "primary" : "ghost"}" data-act="pv-view" data-view="cc">Control Center</button></div>
    <label class="pv-looklbl">Appearance theme <select id="pv-look" style="width:auto">${opts}</select></label>`;
}

async function openPreview() {
  const t = themeById(state.editId);
  if (!t) return;
  previewClose();
  pvLooksArt = new Set([...state.files].map(p => (APPEARANCE_RE.exec(p) || [])[2]).filter(Boolean));
  const firstArt = ["ps", "ps2", "ps3", "ps4"].find(l => pvLooksArt.has(l));
  pvState = { look: firstArt || "default", view: "home" };
  const ov = document.createElement("div");
  ov.id = "pv-overlay";
  ov.className = "pv-overlay";
  ov.innerHTML = `<div class="pv-dialog" role="dialog" aria-modal="true" aria-label="Preview of ${esc(t.name)}">
      <div class="pv-bar"><h2>Preview — ${esc(t.name)}</h2><span class="spacer"></span>
        <button class="btn ghost sm" data-act="pv-refresh">Refresh</button>
        <button class="btn sm" data-act="pv-close">Close</button></div>
      <div class="pv-toolbar" id="pv-toolbar"></div>
      <div class="pv-stage" id="pv-stage"><div class="pv-busy">Building the preview…</div></div>
      <p class="pv-note">A stylized home screen and Control Center with this theme's background, colours, Appearance artwork, font and changed icons — not the console's exact layout. The real look shows on the console after you apply and use rest mode. Nothing here is sent to the console.</p>
    </div>`;
  document.body.append(ov);
  ov.addEventListener("click", e => { if (e.target === ov) previewClose(); });
  document.addEventListener("keydown", previewKey);
  await previewRender(state.editId);
}

async function previewHomeHtml(look, colors) {
  const art = await pvArtFor(look);
  const t = themeById(pvData.id) || { name: "" };
  const clock = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const items = (pvData.tiles.length ? pvData.tiles : [null, null, null, null, null]).slice(0, 6);
  const tileEls = items.map((u, i) => {
    const focus = i === 0 ? " pv-focus" : "";
    return u ? `<div class="pv-tile${focus}"><img alt="" src="${u}"></div>`
             : `<div class="pv-tile pv-ph${focus}"><span>▢</span></div>`;
  });
  return `
    ${pvData.bg ? `<img class="pv-bg" alt="" src="${pvData.bg}">` : ""}
    <div class="pv-scrim"></div>
    ${art ? `<img class="pv-art" alt="" src="${art}">` : ""}
    <div class="pv-top">
      <div class="pv-glyphs"><span class="pv-glyph"></span><span class="pv-glyph"></span><span class="pv-glyph"></span><span class="pv-glyph pv-avatar"></span></div>
      <span class="pv-clock">${esc(clock)}</span></div>
    <div class="pv-tiles">${tileEls.join("")}</div>
    <div class="pv-cap"><h3 class="pv-name">${esc(t.name)}</h3>
      <div class="pv-actions"><span class="pv-play">▶ Play</span><span class="pv-chip"></span><span class="pv-chip"></span></div></div>`;
}

async function previewCcHtml(look, colors) {
  const [bottom, top] = await Promise.all([pvCcFor(look, "bottom"), pvCcFor(look, "top")]);
  const clock = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const icons = Array.from({ length: 7 }, (_, i) => `<span class="pv-cc-ic${i === 2 ? " pv-ccf" : ""}"></span>`).join("");
  return `
    ${pvData.bg ? `<img class="pv-bg" alt="" src="${pvData.bg}">` : ""}
    <div class="pv-ccbd" style="background:${pvRgba(colors.backdrop, .64)}"></div>
    <div class="pv-cc-bar"></div>
    ${top ? `<img class="pv-cc-top" alt="" src="${top}">` : ""}
    ${bottom ? `<img class="pv-cc-bottom" alt="" src="${bottom}">` : ""}
    <div class="pv-cc-card" style="background:${pvRgba(colors.card, .9)}"></div>
    <div class="pv-cc-clock">${esc(clock)}</div>
    <div class="pv-cc-icons">${icons}</div>
    <div class="pv-cc-label">Control Center · ${esc(LOOK_NAMES[look])}</div>`;
}

async function previewRender(id) {
  let stage = $("#pv-stage");
  if (!stage) return;
  if (!pvData || pvData.id !== id) {
    stage.innerHTML = `<div class="pv-busy">Building the preview…</div>`;
    if (!await previewGather(id)) return;
  }
  const colors = await pvColorsFor(pvState.look);
  stage = $("#pv-stage");
  if (!stage || !$("#pv-overlay") || state.editId !== id) return;
  const tb = $("#pv-toolbar"); if (tb) tb.innerHTML = previewToolbar();
  stage.style.setProperty("--pv-accent", pvHex(colors.accent));
  stage.style.setProperty("--pv-accent-ink", pvInk(colors.accent));
  stage.style.setProperty("--pv-text", pvHex(colors.text));
  stage.style.setProperty("--pv-panel", pvHex(colors.panel));
  stage.style.fontFamily = pvData.fontFam ? `"${pvData.fontFam}", "SST", system-ui, sans-serif` : `"SST", system-ui, sans-serif`;
  const html = pvState.view === "cc" ? await previewCcHtml(pvState.look, colors) : await previewHomeHtml(pvState.look, colors);
  stage = $("#pv-stage");
  if (stage && $("#pv-overlay") && state.editId === id) stage.innerHTML = html;
}

/* ================================================================ editor (theme builder) */

async function renderEditor() {
  const themes = state.status.themes;
  if (!themes.length) {
    view.innerHTML = `<div class="empty"><h2>Nothing to edit yet</h2>
      <p class="muted" style="margin:0">Create a theme first, then choose what it changes.</p>
      <button class="btn primary" data-act="new-from-editor">New theme</button></div>`;
    return;
  }
  if (!themeById(state.editId)) state.editId = themes[0].id;
  const t = themeById(state.editId);
  loads.set("open", -1);
  view.innerHTML = loadingMarker("open", `Opening ${t.name}…`);
  paintLoads(view);
  await Promise.all([loadAssets(), loadThemeFiles(t.id), loadChoices(t.id)]);
  const on = state.status.applied === t.id;
  const fwAny = t.fw === "any";

  view.innerHTML = `
    <div class="head">
      <h1>Edit</h1>
      <select id="theme-select" aria-label="Theme" style="width:auto">${themes.map(x =>
        `<option value="${esc(x.id)}" ${x.id === t.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
      <span class="spacer"></span>
      <button class="btn ghost" data-act="preview" data-id="${esc(t.id)}">Preview</button>
      <button class="btn ghost" data-act="export" data-id="${esc(t.id)}" id="edit-export" ${t.files || t.music ? "" : "disabled"}>Export</button>
      <button class="btn primary" data-act="apply" data-id="${esc(t.id)}" id="edit-apply" ${t.compatible && (t.files || t.music) ? "" : "disabled"}>${on ? "Re-apply to console" : "Apply to console"}</button>
    </div>
    ${on ? resultBanner() : ""}
    ${isLocal() && /PlayStation/i.test(navigator.userAgent)
      ? `<div class="banner">Attaching files is easiest from a computer or phone: open <b>http://${esc(state.status.ip)}:8095</b>.</div>` : ""}
    <div class="panel builder-head">
      <label class="field"><span>Name${help("The theme's name, shown in the library and in the console's notifications.")}</span><input type="text" id="theme-name" maxlength="60" value="${esc(t.name)}"></label>
      <label class="field"><span>Firmware${help("The firmware the theme is for. It is applied only on a console with that firmware, unless you choose Any firmware; then each file is still checked against the console's own, and one that no longer matches is skipped.")}</span>
        <select id="theme-fw">
          <option value="${esc(state.status.fw)}" ${!fwAny ? "selected" : ""}>This console (${esc(state.status.fw)})</option>
          <option value="any" ${fwAny ? "selected" : ""}>Any firmware</option>
        </select></label>
      <label class="field"><span>How images are fitted${help("How a picture that isn't the shape of the file it replaces is fitted: Fill crops its edges, Fit keeps all of it with bars, Stretch squeezes it. Changing it makes the pictures and textures in this theme again from their kept originals. The Appearance pieces have their own placement.")}</span>
        <select id="fit">${[["cover", "Fill (crop edges)"], ["contain", "Fit (keep all)"], ["stretch", "Stretch"]]
          .map(([v, l]) => `<option value="${v}" ${state.fit === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="field" id="originals-field">${originalsField()}</div>
    </div>
    <section class="panel cover-panel" id="cover-panel">${coverPanel(t)}</section>
    ${state.assetsError ? `<div class="banner err">${esc(state.assetsError)}. Restart the plugin once with the stock theme to list the system assets.</div>` : ""}
    <div class="aspects">${ASPECTS.map(a => `<section class="aspect" id="aspect-${a.id}"></section>`).join("")}</div>
    <div class="savebar" id="savebar" role="region" aria-label="Unsaved changes" ${t.unsaved ? "" : "hidden"}>
      <div class="text"><b>Unsaved changes</b><span>Save to keep them, or discard them to go back to the last save.</span></div>
      <button class="btn ghost" data-act="discard" data-id="${esc(t.id)}" id="discard-btn">Discard</button>
      <button class="btn primary" data-act="save" data-id="${esc(t.id)}">Save</button>
    </div>
    <p class="note" style="margin-top:18px">Only media can be themed. ${state.protectedCount ? `${plural(state.protectedCount, "system file")} (code and libraries) are protected and never changed. ` : ""}Every file is checked against the system file it replaces, on upload and again when the theme is applied.</p>`;
  ASPECTS.forEach(renderAspect);
}

function renderAspect(asp) {
  const el = $(`#aspect-${asp.id}`);
  if (!el) return;
  const on = aspectOn(asp);
  const replaced = aspectReplaced(asp);
  let summary;
  if (asp.mode === "music") {
    const t = themeById(state.editId);
    const length = isPlaylist(t) ? `Playlist of ${plural(themeTracks(t).length, "song")}, ${fmtTime(playlistSeconds(t))}` : t.music ? fmtTime(t.music) : "";
    summary = state.files.has(HOME_MUSIC) ? `${length ? length + " · " : ""}${gainLabel(t.gain || 0)}`
      : t.music ? "Not converted to home music yet" : "No music yet";
  } else {
    const total = aspectAssets(asp).length;
    summary = total ? `${replaced} of ${plural(total, "file")} replaced` : "None on this firmware";
    const sounds = asp.id === "sounds" && uiSoundsLast && uiSoundsLast.id === state.editId ? uiSoundsLast.replaced : 0;
    if (sounds) summary += ` · ${plural(sounds, "interface sound")} replaced`;
  }
  const confirming = state.confirming === asp.id;
  el.innerHTML = `
    <div class="aspect-head">
      <button class="switch" role="switch" aria-checked="${on}" aria-label="${esc(asp.title)}" data-act="toggle" data-aspect="${asp.id}"></button>
      <div class="text"><h2>${esc(asp.title)}${help(asp.sub)}</h2><div class="sub">${esc(on ? summary : asp.sub)}</div></div>
      ${confirming ? `<div class="confirm">Remove ${asp.mode === "music" ? "the music" : plural(replaced, "replaced file")}?
        <button class="btn sm danger armed" data-act="confirm-off" data-aspect="${asp.id}">Remove</button>
        <button class="btn sm ghost" data-act="cancel-off" data-aspect="${asp.id}">Keep</button></div>` : ""}
    </div>
    <div class="aspect-body" ${on ? "" : "hidden"}>${on ? aspectBody(asp) : ""}</div>`;
  paintLoads(el);
  if (asp.mode === "music" && state.trim) setupTrim();
}

/* What a piece in a list is and what replacing it changes, for its help mark. */
function assetHelp(asp, a) {
  const m = APPEARANCE_RE.exec(a.path);
  if (m) {
    const theme = `the ${APPEARANCE_THEMES[m[2]] || m[2]} Appearance theme`;
    const what = m[1] === "homeui" ? "The artwork that hangs from the top of the home screen"
      : m[3] === "top" ? "The corner piece behind the clock and the search and settings icons"
      : "The panel behind the Control Center's row of icons (the menu the PS button opens)";
    return `${what}, for ${theme}. It shows only while that theme is selected in Settings > Appearance and Sound, after rest mode.`;
  }
  if (asp.id === "fonts") {
    return `${fontName(a.path)} (${baseName(a.path)}). ${FONT_HOME.test(baseName(a.path)) ? "The home screen and Settings draw their text in it." : "Web pages use it; the home screen doesn't."} Replace it with a TTF or OTF font: it goes only into the home screen, never into games, and shows after rest mode.`;
  }
  const kinds = {
    audio: "A system sound or music clip. Your audio is converted to its format (WAV or ATRAC9) and loudness.",
    texture: "A texture the interface draws. Your picture is encoded to its exact format and size.",
    image: "A picture the interface shows. Your image is fitted to its size and written in its exact format.",
    svg: "A vector picture the interface shows. Your image is drawn inside the console's own SVG.",
    video: "A video clip. Use a clip in the same container (MP4 or WebM).",
    json: "An animation or data file. It must keep the same structure and canvas size.",
  };
  return `${kinds[a.kind] || "A file the interface uses. It is checked against the console's own before it is accepted."} (${baseName(a.path)})`;
}

function dropZone(asp, title, detail) {
  return `<div class="drop-zone" data-drop="${asp.id}">
      <div class="text"><div class="title">${esc(title)}</div><div class="note">${esc(detail)}</div></div>
      <button class="btn" data-act="attach-aspect" data-aspect="${asp.id}">Choose file</button>
    </div>`;
}

function thumbFor(a) {
  const rep = state.files.has(a.path);
  if (!isImage(a)) return `<div class="thumb${rep ? " replaced" : ""}"><span>${esc(a.kind === "texture" ? "DDS" : ext(a.path) || "file")}</span></div>`;
  const src = rep ? `/api/theme/file?${q({ id: state.editId, path: a.path })}&v=${stamp}` : `/api/asset?${q({ path: a.path })}`;
  return `<div class="thumb${rep ? " replaced" : ""}"><img loading="lazy" alt="" src="${esc(src)}"></div>`;
}

function aspectBody(asp) {
  if (asp.mode === "music") return musicBody();
  if (!state.assets) return `<p class="note">The system asset list is not available yet.</p>`;
  if (asp.mode === "rco") { setTimeout(rcoLookup); return rcoBody(asp); }
  if (asp.mode === "systiles") return tilesBody(asp);
  if (asp.mode === "titles") return titlesBody(asp);
  /* Sounds: the interface's own sounds follow the sound files */
  const uiBox = asp.id === "sounds" ? `<div id="ui-sounds">${uiSoundsBox()}</div>` : "";
  if (uiBox) setTimeout(uiSoundsShow);
  const all = aspectAssets(asp);
  if (!all.length) return `<p class="note">This firmware has no ${esc(asp.title.toLowerCase())} that can be themed. Anything else replaceable is under Other images.</p>${uiBox}`;

  if (asp.mode === "single") {
    const off = bgOff();
    const areas = new Map();
    for (const a of all) {
      const k = areaOf(a.path);
      if (!areas.has(k)) areas.set(k, []);
      areas.get(k).push(a);
    }
    const chosen = all.filter(a => !off.has(areaOf(a.path)));
    const replaced = all.filter(a => state.files.has(a.path)).length;
    return `${dropZone(asp, "Drop an image or video here",
        chosen.length ? `Goes to ${plural(chosen.length, "file")} in the areas switched on below, each at its own size.` : "Switch on at least one area below.")}
      <p class="note">Choose where your background is used:${help("Each area is a place the home screen shows a background: the default background, the Game Library, a tile's background while that tile is selected, and others. Your picture goes to the areas switched on, made at each one's own size.")}</p>
      <div class="rows">${[...areas.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([name, list]) => {
        const on = !off.has(name), rep = list.filter(a => state.files.has(a.path)).length;
        return `<div class="row-item${rep ? " replaced" : ""}">
          <div class="info" style="display:flex;gap:14px;align-items:center;min-width:0">
            <button class="switch" role="switch" aria-checked="${on}" aria-label="${esc(name)}" data-act="toggle-area" data-area="${esc(name)}"></button>
            <div style="min-width:0"><div class="file">${esc(name)}${rep ? ` <span class="tag on">Replaced</span>` : ""}</div>
              <div class="dir">${plural(list.length, "file")}</div></div>
          </div>
          <div class="strip">${list.slice(0, 4).map(thumbFor).join("")}</div>
        </div>`;
      }).join("")}</div>
      ${replaced ? `<div><button class="btn sm ghost danger" data-act="reset-aspect" data-aspect="${asp.id}">Reset background</button></div>` : ""}`;
  }

  const groupsAll = groupAssets(all);
  const filter = (state.filters[asp.id] || "").toLowerCase();
  const groups = filter ? groupsAll.filter(g => g.key.toLowerCase().includes(filter)) : groupsAll;
  const page = state.pages[asp.id] || 48;
  const shown = groups.slice(0, page);
  const search = groupsAll.length > 12
    ? `<div class="toolbar"><input type="search" data-filter-aspect="${asp.id}" placeholder="Search ${esc(asp.title.toLowerCase())}" value="${esc(state.filters[asp.id] || "")}" aria-label="Search ${esc(asp.title)}"></div>` : "";
  const more = groups.length > page ? `<div><button class="btn sm" data-act="more" data-aspect="${asp.id}">Show more (${groups.length - page})</button></div>` : "";
  if (!groups.length) return `${search}<p class="note">Nothing matches.</p>`;

  if (asp.mode === "tiles") {
    return `${search}<p class="note">Click an item to attach a file, or drop one on it.</p>
      <div class="tiles">${shown.map(g => {
        const rep = g.assets.filter(a => state.files.has(a.path)).length;
        return `<button class="tile${rep ? " replaced" : ""}" data-group="${esc(g.key)}" data-aspect="${asp.id}" title="${esc(g.key)}">
          ${rep ? `<span class="tag on">Replaced</span>` : ""}
          ${thumbFor(g.assets.find(a => state.files.has(a.path)) || g.assets[0])}
          <div class="file">${esc(g.name)}</div>

      }).join("")}</div>${more}
      ${all.some(a => state.files.has(a.path)) ? `<div><button class="btn sm ghost danger" data-act="reset-aspect" data-aspect="${asp.id}">Reset all ${esc(asp.title.toLowerCase())}</button></div>` : ""}`;
  }

  const appearanceNote = asp.id === "appearance" ? `<p class="note">Shown only while that theme is selected in <b>Settings &gt; Appearance and Sound</b>, after rest mode. A PNG keeps its see-through parts.${help("Each picture is encoded to the texture's exact format and size (the panels are about 2560 pixels wide) and keeps its transparency. A change to Placement, padding or the clock band takes effect at once: the texture is made again from the original the theme keeps. If one doesn't, change the option and attach the picture again.")}</p>` : "";
  const fontNote = asp.id === "fonts" ? `<p class="note">A .ttf or .otf font, for the home screen only (never games). The home screen draws in the weights marked <b>Home screen</b>; it shows after rest mode.${help("The font needs the full Latin alphabet, digits and punctuation; fonts in other formats, damaged ones and ones without those characters are refused. On firmware 13.42 the home screen and Settings use the light and bold weights; the regular and medium Latin fonts are used by web pages only. If the home screen keeps restarting with a font, the plugin takes the theme down by itself.")}</p>
    <div class="toolbar"><button class="btn" data-act="fonts-latin" data-aspect="fonts">Use one font for all Latin interface text</button></div>` : "";
  const list = asp.id === "fonts"

      return `<div class="row-item${rep ? " replaced" : ""}" data-drop-group="${esc(g.key)}" data-aspect="${asp.id}">
        <div class="info"><div class="file">${esc(isFont ? fontName(a0.path) : isAppearance ? appearanceName(a0.path) : g.name)}${help(assetHelp(asp, a0))}${isFont && FONT_HOME.test(baseName(a0.path)) ? ` <span class="tag">Home screen</span>` : ""}${rep ? ` <span class="tag on">Replaced</span>` : ""}</div>
          <div class="dir">${isFont || isAppearance ? `${esc(baseName(a0.path))} · ${fmtSize(a0.size)}` : esc(g.dir)}${g.assets.length > 1 ? ` · ${plural(g.assets.length, "variant")}` : ""}</div>${

        <div class="acts">${play}${isAppearance ? (() => {

            </select></label>${pl.mode === "pad" ? `<label class="note">Padding${help("Space left clear where the picture meets the screen's edge, in percent of the piece (0 to 40).")}

              ? `<span class="note" title="This picture was attached before the original was kept in the theme. Changing an option makes the texture again from the picture inside it; attach the original once more to get back anything the earlier placement cropped away.">options use the texture's own picture</span>`
              : `<span class="note" title="This theme does not keep original pictures: options apply when you attach a picture.">options apply when you attach</span>`) : ""}${
""}`;
        })() : ""}
          <button class="btn sm" data-act="attach-group" data-group="${esc(g.key)}" data-aspect="${asp.id}">${rep ? "Replace" : "Attach"}</button>
